# DevolaFlow — Workflow Meta-Framework
# Design ref: design_dual_system.md §2.1
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devolaflow"
version = "14.4.0"
description = "Composable workflow meta-framework with 4-layer agent hierarchy, gate quality mechanisms, and multi-tool skill delivery."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
devola-init = "devolaflow.init_project:main"
devola-version = "devolaflow.cli:version_cmd"
validate-template = "devolaflow.cli:validate_template_cmd"
validate-gate = "devolaflow.cli:validate_gate_cmd"
build-skill = "devolaflow.cli:build_skill_cmd"
check-drift = "devolaflow.cli:check_drift_cmd"
detect-repo-mode = "devolaflow.cli:detect_repo_mode_cmd"
sync-rules = "devolaflow.cli:sync_rules_cmd"
check-rules-drift = "devolaflow.cli:check_rules_drift_cmd"
scaffold-local = "devolaflow.cli:scaffold_local_cmd"
devola-init-doctor = "devolaflow.cli:doctor_cmd"
# v9.4.0 PV-04 — `devolaflow plugins {list,status,refresh}` registry CLI.
# Closes D-P-4 + D-P-8 from `.local/research/v9.4.0_gap_analysis.md` §3.2.
devolaflow-plugins = "devolaflow.cli:plugins_cmd"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"devolaflow.local" = ["compile_config_template.yaml"]
"devolaflow.agent_workspace.templates" = ["*.md.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "persistence_probe: v7.0.3 cross-stage persistence probe (ADR-004)",
    # v8.5.0 PV-05 — second marker class per M-05 (T10). Use
    # `@pytest.mark.deferred(strict=True, reason="...")` on a test the
    # owner explicitly wants to defer to a future PV. `strict=True`
    # makes the marker assert that the test is currently skipped (so
    # it cannot silently be flipped back ON without ADR-005 sign-off).
    # Pairs with `tests/conftest.py::pytest_collection_modifyitems`
    # which honours the marker by skipping with a clear xfail-like
    # message that surfaces the deferral reason in the pytest summary.
    "deferred: opt-in skip with deferral reason (PV-05 W-rules surface)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_human_docs.py" = ["E501"]

[tool.coverage.run]
source = ["devolaflow"]
omit = ["tests/*"]
# v8.5.0 PV-05 (T8 NineS Hygiene A1 closure, path-a) — `parallel = false`
# explicitly disables coverage.py's parallel mode so a NineS-spawned
# `pytest --cov` invocation does NOT collect into a separate `.coverage.*`
# data file that the host run subsequently fails to combine. Path (b)
# (drop nested cov collection in `src/devolaflow/nines/scorer.py`) was
# rejected because that module is a thin CLI wrapper and the cov call is
# internal to the NineS binary — the host-side fix here is the safe one.
# See .local/research/v9.0.0_pv05_design.md §2 for the full rationale.
parallel = false

[tool.coverage.report]
fail_under = 80
show_missing = true
