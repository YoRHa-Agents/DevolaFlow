# Prepare a mechanical release PR from the current main branch.
#
# CHANGELOG content is an operator-owned input. This workflow only verifies
# that the requested entry already exists; it never generates release prose.
name: Prepare release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable release version in X.Y.Z form"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-prep-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (dev)
        run: pip install -e ".[dev]"

      - name: Validate release request and clean base
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$REQUESTED_VERSION' is not a stable X.Y.Z version"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::release preparation must be dispatched from main"
            exit 1
          fi
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo "::error::checked-out base is not clean"
            git status --short
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::checked-out main is not the current origin/main"
            exit 1
          fi
          current_version="$(
            git show "refs/remotes/origin/main:src/devolaflow/__init__.py" |
              python -c '
          import re
          import sys
          match = re.search(r'"'"'__version__\s*=\s*"([^"]+)"'"'"', sys.stdin.read())
          if match is None:
              raise SystemExit("cannot read current __version__")
          print(match.group(1))
          '
          )"
          if ! python - "$current_version" "$REQUESTED_VERSION" <<'PY'
          import re
          import sys

          stable = re.compile(r"^\d+\.\d+\.\d+$")
          current, requested = sys.argv[1:]
          if not stable.fullmatch(current):
              raise SystemExit(f"current version {current!r} is not stable X.Y.Z")
          if tuple(map(int, requested.split("."))) <= tuple(map(int, current.split("."))):
              raise SystemExit(f"requested version is not newer: {current} -> {requested}")
          PY
          then
            echo "::error::requested version must advance the current release"
            exit 1
          fi

          tag_name="v$REQUESTED_VERSION"
          set +e
          git ls-remote --exit-code --refs origin "refs/tags/$tag_name" >/dev/null
          remote_tag_status=$?
          set -e
          if [ "$remote_tag_status" -eq 0 ]; then
            echo "::error::$tag_name already exists; refusing to prepare a duplicate release"
            exit 1
          elif [ "$remote_tag_status" -ne 2 ]; then
            echo "::error::could not safely determine whether $tag_name exists"
            exit 1
          fi

      - name: Create isolated release branch
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch_name="release/v$REQUESTED_VERSION"
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$branch_name" >/dev/null
          remote_branch_status=$?
          set -e
          if [ "$remote_branch_status" -eq 0 ]; then
            echo "::error::$branch_name already exists; refusing to modify it"
            exit 1
          elif [ "$remote_branch_status" -ne 2 ]; then
            echo "::error::could not safely determine whether $branch_name exists"
            exit 1
          fi
          git switch --create "$branch_name" refs/remotes/origin/main

      - name: Synchronize canonical version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python scripts/bump_version.py "$REQUESTED_VERSION"

      - name: Synchronize human documentation
        run: make sync-human-docs

      - name: Promote prepared demo release window
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          REQUESTED_VERSION="$REQUESTED_VERSION" python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("workflow-system/human/demo/index.html")
          text = path.read_text(encoding="utf-8")
          version = os.environ["REQUESTED_VERSION"]
          updated = text

          release_start = updated.index('<section aria-labelledby="release-heading">')
          release_end = updated.index("</section>", release_start) + len("</section>")
          release_window = updated[release_start:release_end]
          current_heading = (
              r"data-i18n=['\"]home\.release\.v19\.heading['\"][^>]*>"
          )
          release_window, english_static_replacements = re.subn(
              rf"({current_heading})Upcoming release ·",
              rf"\g<1>New in v{version} ·",
              release_window,
          )
          release_window, zh_static_replacements = re.subn(
              rf"({current_heading})即将发布 ·",
              rf"\g<1>v{version} 新变化 ·",
              release_window,
          )
          release_replacements = english_static_replacements + zh_static_replacements
          updated = updated[:release_start] + release_window + updated[release_end:]

          # The English dictionary entry is outside the HTML release section;
          # target its stable translation key rather than historical cards.
          english_heading_pattern = re.compile(
              r"(['\"]home\.release\.v19\.heading['\"]\s*:\s*['\"])(Upcoming release ·)"
          )
          updated, english_dictionary_replacements = english_heading_pattern.subn(
              rf"\g<1>New in v{version} ·", updated
          )
          zh_heading_pattern = re.compile(
              r"(['\"]home\.release\.v19\.heading['\"]\s*:\s*['\"])(即将发布 ·)"
          )
          updated, zh_dictionary_replacements = zh_heading_pattern.subn(
              rf"\g<1>v{version} 新变化 ·", updated
          )
          if updated == text:
              print(
                  "::warning::demo/index.html has no release-window placeholder; "
                  "it may already be promoted. Continuing."
              )
          else:
              path.write_text(updated, encoding="utf-8")
              print(
                  "Promoted "
                  f"{release_replacements} release-window heading occurrence(s) and "
                  f"{english_dictionary_replacements + zh_dictionary_replacements} "
                  "dictionary occurrence(s)."
              )
          PY

      - name: Run release preflight
        run: make release-preflight

      - name: Validate existing CHANGELOG entry
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$REQUESTED_VERSION" python -c '
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\](?:\s+[-—]\s+|,\s+)\d{{4}}-\d{{2}}-\d{{2}}(?:\s|$)",
              re.MULTILINE,
          )
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if pattern.search(changelog) is None:
              raise SystemExit(
                  f"CHANGELOG.md has no dated entry for [{version}]; "
                  "add the release notes before dispatching release preparation"
              )
          '
          if ! git diff --quiet -- CHANGELOG.md; then
            echo "::error::release preparation modified CHANGELOG.md; refusing to author release prose"
            exit 1
          fi

      - name: Reject unexpected generated state
        run: |
          set -euo pipefail
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::release preflight produced untracked files"
            git status --short
            exit 1
          fi
          while IFS= read -r changed_path; do
            case "$changed_path" in
              src/devolaflow/__init__.py|pyproject.toml|\
              workflow-system/agent/SKILL.md|workflow-system/agent/workflow-skill.yaml|\
              scripts/generate_human_docs.py|tests/test_smoke.py|README.md|\
              packages/npm/package.json|workflow-system/human/en/*|workflow-system/human/zh/*|\
              workflow-system/human/demo/index.html)
                ;;
              *)
                echo "::error::unexpected changed path: $changed_path"
                exit 1
                ;;
            esac
          done < <(git diff --name-only)
          if [ -z "$(git diff --name-only)" ]; then
            echo "::error::release preparation produced no version/documentation changes"
            exit 1
          fi
          git diff --check

      - name: Commit verified release preparation
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "chore: prepare release v$REQUESTED_VERSION"
          git push --set-upstream origin "release/v$REQUESTED_VERSION"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch_name="release/v$REQUESTED_VERSION"
          existing_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch_name" --state all --json number --jq 'length')"
          if [ "$existing_prs" != "0" ]; then
            echo "::error::a pull request already exists for $branch_name"
            exit 1
          fi
          if gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch_name" \
            --title "chore: prepare release v$REQUESTED_VERSION" \
            --body "Automated mechanical release preparation for v$REQUESTED_VERSION. The existing CHANGELOG entry was verified; this workflow does not author release notes."
          then
            echo "Release PR created successfully."
          else
            echo "::warning::GitHub Actions could not create the release PR; the release branch was pushed successfully."
            echo "Branch URL: https://github.com/$GITHUB_REPOSITORY/tree/$branch_name"
            printf 'Manual command: gh pr create --repo %q --base main --head %q --title %q --body %q\n' \
              "$GITHUB_REPOSITORY" \
              "main" \
              "$branch_name" \
              "chore: prepare release v$REQUESTED_VERSION" \
              "Automated mechanical release preparation for v$REQUESTED_VERSION. The existing CHANGELOG entry was verified; this workflow does not author release notes."
          fi
