# v17.0.0 R6 — publish @yorha-agents/devola-flow (packages/npm) to the npm
# registry on version-tag push. The package is a thin installer over the
# install-manifest SSOT (workflow-system/agent/manifest.yaml); it ships no
# skill files, so publishing is safe on every release tag.
#
# Fail-fast contract: the tag MUST equal packages/npm/package.json version
# (both are managed by scripts/bump_version.py per Rule C-6) — a mismatch
# aborts before any registry interaction.
name: npm publish

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      release_tag:
        description: "Exact annotated release tag to publish"
        required: true
        type: string
      release_sha:
        description: "Exact commit SHA targeted by release_tag"
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-publish-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-checks.yml
    with:
      checkout_ref: ${{ inputs.release_sha || github.sha }}
      expected_sha: ${{ inputs.release_sha || github.sha }}

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required for `npm publish --provenance` (Sigstore attestation via the
      # GitHub OIDC token).
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Verify release tag and SHA
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '$RELEASE_TAG' is not an exact vX.Y.Z tag"
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release SHA '$RELEASE_SHA' is not a full lowercase commit SHA"
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$RELEASE_SHA" ]; then
            echo "::error::checkout resolved $checked_out_sha, expected $RELEASE_SHA"
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo "::error::${RELEASE_TAG} resolves to $tag_sha, expected $RELEASE_SHA"
            exit 1
          fi
      - name: Verify tag commit is reachable from main
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::tag ${RELEASE_TAG} targets ${RELEASE_SHA}, which is not reachable from origin/main"
            exit 1
          fi
      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PKG_VERSION="$(node -p "require('./packages/npm/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${RELEASE_TAG} does not match packages/npm/package.json version ${PKG_VERSION} — run scripts/bump_version.py before tagging"
            exit 1
          fi
          echo "tag ${RELEASE_TAG} matches package version ${PKG_VERSION}"
      - name: Publish to npm
        working-directory: packages/npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
