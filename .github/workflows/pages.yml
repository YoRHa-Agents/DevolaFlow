# Deploy demo + docs to GitHub Pages when site-relevant paths change on main.
# OPT-4 (clean_repo PR-11): the paths list mirrors the cp inventory in
# scripts/build-site.sh — keep the two in sync when the builder changes.
# workflow_dispatch stays as the manual fallback if the filter misjudges.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "workflow-system/human/demo/**"
      - "workflow-system/human/en/**"
      - "workflow-system/human/zh/**"
      - "workflow-system/agent/SKILL.md"
      - "workflow-system/agent/templates/builtin/**"
      - "workflow-system/agent/templates/registry.yaml"
      - "workflow-system/agent/templates/seeds/**"
      - "docs/designs/**"
      - "scripts/build-site.sh"
      - "scripts/generate_human_docs.py"
      - "scripts/generate_demo_seed_catalog.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build site
        run: bash scripts/build-site.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
