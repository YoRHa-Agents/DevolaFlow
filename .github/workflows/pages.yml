# Deploy demo + docs to GitHub Pages when site-relevant paths change on main.
# OPT-4 (clean_repo PR-11): the paths list mirrors the cp inventory in
# scripts/build-site.sh — keep the two in sync when the builder changes.
# workflow_dispatch stays as the manual fallback if the filter misjudges.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "workflow-system/human/**"
      - "workflow-system/agent/SKILL.md"
      - "workflow-system/agent/templates/builtin/**"
      - "docs/designs/**"
      - "scripts/build-site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: bash scripts/build-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
