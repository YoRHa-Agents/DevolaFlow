# DevolaFlow shared CI checks — reusable workflow (OPT-1 / D7, clean_repo PR-12).
# Consumed by ci.yml (push/PR -> main) and release.yml (tag push). Each caller
# checks out ITS OWN ref — on a tag push these jobs run ON the tagged SHA, so
# the release gate is a real re-test, not a reuse of historical CI status.
# Unification also fixes the proven drift: release.yml previously lacked the
# CHANGELOG lint; it now inherits every shared check defined here.
#
# D11 (weak-adopt): check / test / validate carry no needs: edges — all three
# run in parallel. The callers' aggregation jobs (ci.yml ci-status, release.yml
# release needs:) remain the only merge/publish gates.
name: CI Checks

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project (dev)
        run: pip install -e ".[dev]"
      - name: Ruff format
        run: ruff format --check src/ tests/
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Source import graph
        run: python scripts/check_import_graph.py
      - name: Agent-facing language lint
        run: python scripts/check_agent_language.py
      - name: Module size budget
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          python scripts/check_module_size.py --baseline-ref origin/main
      # v14.5.0 G-036 — D-5 CHANGELOG single-application lint (stdlib-only).
      # PR events: diff against the PR base sha (fetched explicitly — the
      # depth-1 checkout does not contain it). Push events (branch or tag,
      # incl. the release.yml caller): HEAD~1 with --allow-missing-base so
      # shallow clones degrade to a structure-only run instead of flaking.
      # The github.* context inside a reusable workflow is the CALLER's event.
      - name: CHANGELOG lint (D-5 single-application)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
            python scripts/lint_changelog.py --base-ref "$PR_BASE_SHA"
          else
            python scripts/lint_changelog.py --base-ref HEAD~1 --allow-missing-base
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project (dev)
        run: pip install -e ".[dev]"
      # The coverage run includes tests/harness because the global 90% floor
      # depends on that domain's coverage. Keeping this as one invocation
      # avoids running the same tests twice in the shared CI job.
      - name: Pytest with coverage
        run: |
          GHOST_FULL=1 pytest tests/ -v --tb=short \
            --cov=devolaflow --cov-report=term-missing --cov-report=json
          python scripts/check_module_coverage.py coverage.json --minimum 70

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project (dev)
        run: pip install -e ".[dev]"
      - name: Regenerate human docs
        run: make sync-human-docs
      - name: Verify generated human docs are committed
        run: git diff --exit-code -- workflow-system/human/en workflow-system/human/zh
      - name: Check generated demo seed catalog
        run: make check-demo-seed-catalog
      - name: Build Pages site
        run: make build-site
      - name: Validate workflow templates
        run: validate-template --all
      - name: Build skill adapters
        run: build-skill
      - name: Check drift
        run: make check-drift
      - name: Check cursor-skill mirror (W-9 gate 6)
        run: make check-cursor-skill

  # v17.0.0 R6 — npm installation surface (packages/npm). Offline-only checks:
  # syntax, --help/--version smoke, and a pack dry-run (tarball allowlist).
  # Publishing lives in npm-publish.yml (tag-triggered). Like check/test/
  # validate, this job carries no needs: edges (D11 — parallel by default).
  npm-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Syntax-check installer bin
        run: node --check packages/npm/bin/devola-flow.js
      - name: Bin smoke test (offline)
        run: |
          node packages/npm/bin/devola-flow.js --help
          node packages/npm/bin/devola-flow.js --version
      - name: npm pack (dry run)
        working-directory: packages/npm
        run: npm pack --dry-run
