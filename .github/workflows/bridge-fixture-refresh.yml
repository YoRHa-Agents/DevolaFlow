# Weekly refresh of bridge shape-contract fixtures.
#
# v10.8.0 D-C-2 closure — re-captures ui-pro
# stdout/YAML/JSON output from LIVE plugin binaries into
# `tests/integration/fixtures/<plugin>/`. Opens a draft PR if the
# fixture diff shows upstream schema drift.
#
# Per-PR CI uses the CHECKED-IN fixtures only — this workflow does
# NOT affect per-PR pytest wall clock.
#
# Source: `docs/cycle-archive/v11.0.0/v11.0.0_patches/D-C-2.md` §2 step 6.
name: bridge-fixture-refresh

on:
  schedule:
    # Every Sunday 00:00 UTC — mirror the bridge-plugin release cadence
    # signal so upstream schema drift surfaces within 7 days.
    - cron: "0 0 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # OPT-6 (clean_repo PR-11): needed by the failure-issue step below.
  issues: write

concurrency:
  group: bridge-fixture-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install DevolaFlow
        run: |
          pip install -e .
      - name: Install ui-pro (best-effort)
        run: |
          # Canonical install URLs per runtime-plugins.yaml. Each install
          # may fail independently — the refresh script gracefully skips
          # missing plugins per D-C-2 §9 R2.
          npm install -g uipro-cli || echo "ui-pro install failed (skip)"
      - name: Refresh bridge fixtures
        run: |
          make refresh-bridge-fixtures
      - name: Run integration tests against refreshed fixtures
        run: |
          python -m pytest tests/integration/ -v
      - name: Create draft PR if fixtures drifted
        # OPT-8 (clean_repo PR-11): SHA-pinned — third-party action with
        # contents:write + pull-requests:write; tag pins can be moved
        # upstream. Dependabot bumps it.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(bridge-fixtures): weekly refresh"
          title: "chore(bridge-fixtures): weekly refresh (auto)"
          body: |
            Weekly bridge fixture refresh per v10.8.0 D-C-2 §2 step 6.

            If this PR has a non-trivial diff, upstream schema drift is
            likely. Review the fixture changes + confirm the production
            bridge code still parses correctly.

            Source: `docs/cycle-archive/v11.0.0/v11.0.0_patches/D-C-2.md` §2 step 6.
          branch: chore/bridge-fixture-refresh-${{ github.run_id }}
          delete-branch: true
          draft: true
      # OPT-6 (clean_repo PR-11): cron failures were invisible (email-only to
      # the workflow file's last committer). Open a labelled issue instead.
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "bridge-fixture-refresh failed (run ${{ github.run_id }})" \
            --body "Weekly fixture refresh failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label ci
