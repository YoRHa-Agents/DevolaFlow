# Design ref: design_repo_modes.md section 4.2 Release workflow
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Regenerate human docs
        run: make sync-human-docs
      - name: Check drift
        run: make check-drift
      - name: Run EvoBench benchmarks
        run: python -m pytest tests/test_benchmarks.py -v
      - name: Lint check
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/
      - run: pytest tests/ -v --cov=devolaflow
      - run: validate-template --all
      - run: build-skill

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  deploy-pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: bash scripts/build-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
