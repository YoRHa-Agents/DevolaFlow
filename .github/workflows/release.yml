# Design ref: design_repo_modes.md section 4.2 Release workflow
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      release_tag:
        description: "Exact annotated release tag to publish"
        required: true
        type: string
      release_sha:
        description: "Exact commit SHA targeted by release_tag"
        required: true
        type: string

permissions: {}

# OPT-3 (clean_repo PR-11): never cancel an in-flight release run.
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-release-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Verify release tag and SHA
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '$RELEASE_TAG' is not an exact vX.Y.Z tag"
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release SHA '$RELEASE_SHA' is not a full lowercase commit SHA"
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$RELEASE_SHA" ]; then
            echo "::error::checkout resolved $checked_out_sha, expected $RELEASE_SHA"
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo "::error::${RELEASE_TAG} resolves to $tag_sha, expected $RELEASE_SHA"
            exit 1
          fi
      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Verify tag commit is reachable from main
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::tag ${RELEASE_TAG} targets ${RELEASE_SHA}, which is not reachable from origin/main"
            exit 1
          fi

  # OPT-1 / D7 (clean_repo PR-12): the release gate runs the SAME reusable
  # check suite as ci.yml — checkout inside ci-checks.yml resolves to this
  # tag ref, so the tagged SHA is actually re-tested (no status-reuse).
  # Release hereby also inherits the CHANGELOG lint its old inline test job
  # had drifted to omit.
  checks:
    needs: verify-release-ref
    permissions:
      contents: read
    uses: ./.github/workflows/ci-checks.yml
    with:
      checkout_ref: ${{ inputs.release_sha || github.sha }}
      expected_sha: ${{ inputs.release_sha || github.sha }}

  # Release-only gate (not part of the shared per-PR suite): regenerate and
  # verify committed outputs on the tagged SHA, then exercise the site build.
  release-extras:
    needs: verify-release-ref
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 1
      - name: Verify release SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || {
            echo "::error::release extras checked out an unexpected SHA"
            exit 1
          }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Regenerate human docs
        run: make sync-human-docs
      - name: Verify generated human docs are committed
        run: git diff --exit-code -- workflow-system/human/en workflow-system/human/zh
      - name: Check generated demo seed catalog
        run: make check-demo-seed-catalog
      - name: Build Pages site
        run: make build-site
      - name: Check drift
        run: make check-drift

  release:
    needs: [checks, release-extras]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha || github.sha }}
      # OPT-8 (clean_repo PR-11): SHA-pinned — third-party action with
      # contents:write; tag pins can be moved upstream. Dependabot bumps it.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true

  deploy-pages:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 1
      - name: Verify release SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || {
            echo "::error::Pages deployment checked out an unexpected SHA"
            exit 1
          }
      - name: Build site from tagged SHA
        run: bash scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - uses: actions/deploy-pages@v5
        id: deployment
