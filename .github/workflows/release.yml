# Design ref: design_repo_modes.md section 4.2 Release workflow
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# OPT-3 (clean_repo PR-11): never cancel an in-flight release run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # OPT-1 / D7 (clean_repo PR-12): the release gate runs the SAME reusable
  # check suite as ci.yml — checkout inside ci-checks.yml resolves to this
  # tag ref, so the tagged SHA is actually re-tested (no status-reuse).
  # Release hereby also inherits the CHANGELOG lint its old inline test job
  # had drifted to omit.
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-checks.yml

  # Release-only gate (not part of the shared per-PR suite): regenerate the
  # human docs on the tagged SHA, then re-run the drift scan against the
  # regenerated tree — preserves the old release test job's sync -> check
  # ordering. The pristine-checkout drift scan runs in checks/validate.
  release-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Regenerate human docs
        run: make sync-human-docs
      - name: Check drift
        run: make check-drift

  release:
    needs: [checks, release-extras]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # OPT-8 (clean_repo PR-11): SHA-pinned — third-party action with
      # contents:write; tag pins can be moved upstream. Dependabot bumps it.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
