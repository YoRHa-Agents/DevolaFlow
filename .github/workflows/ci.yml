# DevolaFlow CI — pattern from doc/designs/design_repo_modes.md §4.2 (Python adaptation)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project (dev)
        run: pip install -e ".[dev]"
      - name: Ruff format
        run: ruff format --check src/ tests/
      - name: Ruff check
        run: ruff check src/ tests/

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project (dev)
        run: pip install -e ".[dev]"
      - name: Pytest with coverage
        run: pytest tests/ -v --tb=short --cov=devolaflow --cov-report=term-missing
      - name: Run EvoBench benchmarks
        run: python -m pytest tests/test_benchmarks.py -v

  validate:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project (dev)
        run: pip install -e ".[dev]"
      - name: Validate workflow templates
        run: validate-template --all
      - name: Build skill adapters
        run: build-skill
      - name: Check drift
        run: make check-drift

  # Single gate for branch protection: require this check; fails if any needed job fails or is cancelled.
  ci-status:
    name: CI status
    if: always()
    needs: [check, test, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ needs.check.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.validate.result }}" != "success" ]; then
            echo "check: ${{ needs.check.result }}, test: ${{ needs.test.result }}, validate: ${{ needs.validate.result }}"
            exit 1
          fi
          echo "All CI jobs passed."
