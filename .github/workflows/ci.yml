# DevolaFlow CI — pattern from doc/designs/design_repo_modes.md §4.2 (Python adaptation)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project (dev)
        run: pip install -e ".[dev]"
      - name: Ruff format
        run: ruff format --check src/ tests/
      - name: Ruff check
        run: ruff check src/ tests/

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project (dev)
        run: pip install -e ".[dev]"
      - name: Pytest with coverage
        run: pytest tests/ -v --tb=short --cov=devolaflow --cov-report=term-missing

  validate:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project (dev)
        run: pip install -e ".[dev]"
      - name: Validate workflow templates
        run: validate-template --all
      - name: Build skill adapters
        run: build-skill
