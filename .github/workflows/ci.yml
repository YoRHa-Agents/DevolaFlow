# DevolaFlow CI — pattern from docs/designs/design_repo_modes.md §4.2 (Python adaptation)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# OPT-3 (clean_repo PR-11): cancel superseded runs only for PR events —
# every main-branch push keeps a completed CI record even under rapid merges.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # OPT-1 (clean_repo PR-12): the check/test/validate job definitions live in
  # the reusable ci-checks.yml, shared with release.yml (single definition —
  # no ci<->release drift). Individual check runs surface to branch
  # protection as "checks / check", "checks / test", "checks / validate".
  checks:
    uses: ./.github/workflows/ci-checks.yml

  # Single gate for branch protection: require this check; fails if any called
  # job fails or is cancelled (a reusable-workflow job only reports success
  # when every job inside it succeeded).
  ci-status:
    name: CI status
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "checks: ${{ needs.checks.result }}"
            exit 1
          fi
          echo "All CI jobs passed."
