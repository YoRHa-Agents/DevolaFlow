# Dependabot — keeps GitHub Actions pins fresh (clean_repo OPT-8).
# Official actions/* stay tag-pinned; third-party write-permission actions
# are SHA-pinned in the workflows (dependabot updates both forms via the
# trailing `# vX.Y.Z` comment convention).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
