# Roo Code adapter — per-mode rule files
name: roo
display_name: Roo Code
version_added: "6.1.3"
tier: tier_1
output:
  base_dir: ".roo/rules"
  files:
    - source: "SKILL.md"
      target: "devola-flow.md"
      transform: strip_frontmatter
    - source: "references"
      target: "references"
      transform: copy_tree
budget:
  type: lines
  max: 800
  target_file: "devola-flow.md"
