name: openclaw
display_name: OpenClaw
version_added: "6.1.0"
tier: tier_2
output:
  base_dir: "openclaw"
  files:
    - source: "SKILL.md"
      target: "SKILL.md"
      transform: copy
    - source: "references"
      target: "references"
      transform: copy_tree
budget:
  type: lines
  max: 500
  target_file: "SKILL.md"
