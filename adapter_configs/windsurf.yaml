# Windsurf adapter — Codeium single-file rules, 9000-char budget
# (v11.4.0 cycle bumped 8000 → 9000 to absorb Wave 1+2 SKILL.md +3 lines:
# the new "Subagent pattern selection" pointer at SKILL.md:218 lives inside
# §"4-Layer Agent Hierarchy" which is one of the four `keep_sections` —
# pre-bump windsurf output was 8089/8000 chars, post-bump 8089/9000 with
# ~10% headroom. Mirrors the cursor + agents_md 12000 → 14000 parity bump
# in `.rules/compile-config.yaml` per `.local/research/v11.4.0_subagent_pattern_analysis.md`.)
name: windsurf
display_name: Windsurf
version_added: "6.0.4"
tier: tier_1
output:
  base_dir: "."
  files:
    - source: "SKILL.md"
      target: ".windsurfrules"
      transform: keep_sections
      keep_sections:
        - "Quick Action Decision"
        - "4-Layer Agent Hierarchy"
        - "Gate Mechanism"
        - "Dispatch & Report Protocol"
      header_prefix: |
        # DevolaFlow Rules (condensed for Windsurf)
        Full skill: https://github.com/YoRHa-Agents/DevolaFlow
      include_frontmatter: false
budget:
  type: chars
  max: 9000
  target_file: ".windsurfrules"
