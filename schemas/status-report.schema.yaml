# -----------------------------------------------------------------------------
# Design reference: docs/designs/design_agent_hierarchy.md §3.2
# StatusReport — child→parent completion or progress update.
# -----------------------------------------------------------------------------

design_reference: docs/designs/design_agent_hierarchy.md §3.2
schema_name: status-report
instance_top_level_required:
  - header
  - status
  - result
  - issues

# gate_decision is optional (typically Stage-level); omit on Task/Wave if N/A.
instance_top_level_optional:
  - gate_decision

fields:
  header:
    required: true
    children:
      report_id: { type: string, description: UUID for this report. }
      dispatch_id: { type: string, description: Original TaskDispatch id. }
      task_id: { type: string }
      layer: { type: string, description: stage | wave | task (reporting layer). }
      timestamp: { type: string, description: ISO8601. }

  status:
    required: true
    children:
      state: { type: string, description: pending | in_progress | completed | failed | escalated. }
      progress_pct: { type: int, description: 0–100. }
      started_at: { type: string, description: ISO8601. }
      completed_at: { type: string, optional: true, description: ISO8601 when terminal. }
      elapsed_seconds: { type: int, description: Wall time so far. }

  result:
    required: true
    children:
      artifacts:
        type: list
        item_fields:
          artifact_id: { type: string }
          path: { type: string }
          type: { type: string, description: source | test | document | report | config. }
          summary: { type: string }
      metrics:
        description: Quantitative summary.
        children:
          tests_passed: { type: int, optional: true }
          tests_failed: { type: int, optional: true }
          coverage_pct: { type: number, optional: true }
          quality_score: { type: number, optional: true }
          findings_by_severity:
            type: map
            children:
              blocker: { type: int }
              critical: { type: int }
              major: { type: int }
              minor: { type: int }
              info: { type: int }
          context_tokens:
            type: object
            optional: true
            description: "Independent ceremony token counts; null is unavailable and zero is measured empty input."
            children:
              skill_tokens: { type: int, nullable: true, minimum: 0 }
              rule_tokens: { type: int, nullable: true, minimum: 0 }
              report_tokens: { type: int, nullable: true, minimum: 0 }
          metadata:
            type: object
            optional: true
            description: "Reproducible run metadata; missing evidence is null plus INSUFFICIENT status."
            children:
              run_id: { type: string }
              sampled_at: { type: string }
              generated_at: { type: string }
              salt: { type: string|number, nullable: true }
              salt_status: { type: string, description: AVAILABLE | INSUFFICIENT }
              ledger_path: { type: string, nullable: true, description: Repository-relative path. }
              ledger_status: { type: string, description: AVAILABLE | INSUFFICIENT }
              repo_ref: { type: string, nullable: true }
              repo_sha: { type: string, nullable: true }
              base_ref: { type: string, nullable: true }
              base_ref_status: { type: string, description: AVAILABLE | INSUFFICIENT }
              repo_status: { type: string, description: AVAILABLE | INSUFFICIENT }
              status: { type: string, description: AVAILABLE | INSUFFICIENT }
      self_check:
        type: object
        optional: true
        description: "Behavioral-guidelines evidence; inline fields or evidence_ref, never both."
        inline_fields:
          plan_artifact: { type: string, optional: true }
          goal_anchor: { type: string, optional: true }
          simplicity: { type: int|string, optional: true }
          conflicts: { type: list, optional: true }
          conventions: { type: list, optional: true }
        evidence_ref:
          type: object
          optional: true
          children:
            path: { type: string, description: "Repository-relative path under .local/.agent/active/<change-id>/evidence/." }
            artifact_id: { type: string, description: "Stable content-addressed artifact identifier." }
            type: { type: string, description: "status-report-evidence." }
            digest: { type: string, description: "sha256:<64 lowercase hex characters>." }
            size_bytes: { type: int, minimum: 0 }
      ac_results:
        type: list|object
        optional: true
        description: "Legacy inline AC entries or an object containing only evidence_ref."
        inline_item_fields:
          id: { type: string }
          verdict: { type: string, description: pass | fail | skip }
          cmd_digest: { type: string }
        evidence_ref:
          type: object
          optional: true
          description: "Mutually exclusive with the inline list; references are not copied into the report."
          children:
            path: { type: string, description: "Repository-relative path under .local/.agent/active/<change-id>/evidence/." }
            artifact_id: { type: string }
            type: { type: string, description: "status-report-evidence." }
            digest: { type: string, description: "sha256:<64 lowercase hex characters>." }
            size_bytes: { type: int, minimum: 0 }
      diff_stats:
        type: object
        optional: true
        description: "Legacy inline aggregate or an object containing only evidence_ref."
        inline_fields:
          files: { type: int, minimum: 0 }
          insertions: { type: int, minimum: 0 }
          deletions: { type: int, minimum: 0 }
        evidence_ref:
          type: object
          optional: true
          description: "Mutually exclusive with inline fields; oversized evidence is never truncated."
          children:
            path: { type: string, description: "Repository-relative path under .local/.agent/active/<change-id>/evidence/." }
            artifact_id: { type: string }
            type: { type: string, description: "status-report-evidence." }
            digest: { type: string, description: "sha256:<64 lowercase hex characters>." }
            size_bytes: { type: int, minimum: 0 }

  issues:
    required: true
    children:
      blockers: { type: list, description: Strings blocking completion. }
      warnings: { type: list, description: Non-fatal concerns. }
      deferred: { type: list, description: Explicitly postponed items. }

  gate_decision:
    optional: true
    children:
      verdict: { type: string, description: PASS | FAIL | ESCALATE | null. }
      rationale: { type: string }
      loop_back_target: { type: string, optional: true, description: On FAIL, where to resume. }
