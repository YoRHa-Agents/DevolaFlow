schema_name: feedback-report
description: >
  Schema for post-workflow feedback reports produced by the self-improving
  feedback loop (Integration Point 5). Contains execution metrics, pattern
  analysis, and structured improvement proposals.

fields:
  header:
    description: "Workflow identification and metadata"
    children:
      workflow_id:
        type: string
        description: "Unique workflow execution identifier"
      timestamp:
        type: string
        description: "ISO8601 timestamp of feedback report generation"
      stages_analyzed:
        type: int
        description: "Number of stages included in analysis"

  metrics:
    description: "Aggregated execution metrics"
    children:
      convergence:
        description: "Convergence loop statistics"
        children:
          total_rounds:
            type: int
            description: "Sum of convergence rounds across all stages"
          avg_rounds_per_stage:
            type: float
            description: "Average rounds per stage"
          stagnation_count:
            type: int
            description: "Number of stages that experienced stagnation"
          max_score_achieved:
            type: float
            description: "Highest composite score across all stages"
      violations:
        description: "Rule violation statistics"
        children:
          total_count:
            type: int
            description: "Total number of rule violations"
          recurring:
            type: list
            description: "rule_ids that appeared 2+ times"
          by_severity:
            type: object
            description: "Violation counts keyed by severity level"
      timing:
        description: "Execution timing metrics"
        children:
          total_duration_seconds:
            type: int
            description: "Total workflow duration in seconds"
          avg_time_to_gate_seconds:
            type: float
            description: "Average time from stage start to gate evaluation"
      quality:
        description: "Quality trajectory"
        children:
          final_scores:
            type: list
            description: "Composite scores from each stage's final gate"
          improvement_trajectory:
            type: string
            description: "improving | stable | degrading"
          avg_composite:
            type: float
            description: "Average composite score across stages"
          bottleneck_stage:
            type: string
            description: "Stage with the most convergence rounds"

  analysis:
    description: "Pattern detection results"
    children:
      recurring_violations:
        type: list
        description: "Rules violated >= min_occurrences times"
        item_fields:
          rule_id:
            type: string
          count:
            type: int
          examples:
            type: list
            description: "Up to 3 sample insights"
      stagnation_detected:
        type: bool
        description: "Whether convergence stagnation was detected"
      profile_mismatches:
        type: list
        description: "Metrics that fell below expected thresholds"

  proposals:
    type: list
    description: "Structured improvement proposals (max 3 per workflow)"
    item_fields:
      id:
        type: string
        description: "Proposal identifier (prop-{date}-{seq})"
      type:
        type: string
        description: "rule_update | profile_tune | skill_edit"
      description:
        type: string
        description: "Human-readable proposal summary (<=50 words)"
      confidence:
        type: float
        description: "Confidence in the proposal (>= 0.7 to be emitted)"
      target_file:
        type: string
        description: "Relative path to the file to modify"
      suggested_change:
        type: string
        description: "Concise description of the proposed change"
