$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://devolaflow.dev/schemas/host-contract.yaml"
title: DevolaFlow Host Support Contract
description: >
  Declarative host identity, support tier, delivery floor, and explicitly
  evidenced optional capabilities.
type: object
additionalProperties: false
required: [schema_version, contract_version, hosts]
properties:
  schema_version:
    type: integer
    const: 1
  contract_version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
  hosts:
    type: object
    minProperties: 1
    additionalProperties:
      $ref: "#/$defs/host"
$defs:
  status:
    type: string
    enum: [implemented, designed, broken, undeclared, native]
  provenance:
    type: string
    enum: [captured, vendor-doc, synthetic, TBD-audit]
  tier:
    type: string
    enum: [guaranteed, community-installable, community-build-only]
  path:
    type: string
    minLength: 1
  pathMap:
    type: object
    minProperties: 1
    additionalProperties:
      $ref: "#/$defs/path"
  stringList:
    type: array
    items: {type: string, minLength: 1}
    uniqueItems: true
  floor:
    type: object
    additionalProperties: false
    required: [skill_delivery, instruction_format, install_channels, doctor, tests]
    properties:
      skill_delivery:
        type: object
        additionalProperties: false
        required: [kind, sets, paths]
        properties:
          kind: {type: string, enum: [skill-dir, rule-file, rule-tree]}
          sets:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: string, enum: [core, references, examples]}
          paths:
            $ref: "#/$defs/pathMap"
      instruction_format:
        type: object
        additionalProperties: false
        required: [artifact, frontmatter, budget]
        properties:
          artifact: {$ref: "#/$defs/path"}
          frontmatter: {$ref: "#/$defs/path"}
          budget:
            type: object
            additionalProperties: false
            required: [type, max]
            properties:
              type: {type: string, enum: [lines, chars]}
              max: {type: integer, minimum: 1}
      install_channels:
        type: array
        uniqueItems: true
        items: {type: string, enum: [install.sh, devola-init, npm]}
      doctor:
        type: object
        additionalProperties: false
        required: [status, kind]
        properties:
          status: {$ref: "#/$defs/status"}
          kind: {type: string, enum: [stamp]}
      tests:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: "#/$defs/path"}
  boundaryBridge:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status: {$ref: "#/$defs/status"}
      scope:
        oneOf:
          - {$ref: "#/$defs/path"}
          - {$ref: "#/$defs/stringList"}
      config: {$ref: "#/$defs/stringList"}
      events: {type: object}
      response: {type: object}
      host_fail_mode: {type: string, enum: [open, closed]}
      automation:
        type: string
        enum: [automated, snippet, plugin-channel, manual]
      fixtures: {$ref: "#/$defs/stringList"}
      fixture_provenance: {$ref: "#/$defs/provenance"}
      provenance_ref:
        type: [string, "null"]
        format: uri
  statusAxis:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status: {$ref: "#/$defs/status"}
      event: {type: string}
      primitive: {type: [string, "null"]}
      config: {type: [string, "null"]}
      reason: {type: string}
  vocabulary:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status: {$ref: "#/$defs/status"}
      write: {$ref: "#/$defs/stringList"}
      shell: {$ref: "#/$defs/stringList"}
  extras:
    type: object
    additionalProperties: false
    required: [boundary_bridge, session_resume, subagent_dispatch, mcp, tool_vocabulary]
    properties:
      boundary_bridge: {$ref: "#/$defs/boundaryBridge"}
      session_resume: {$ref: "#/$defs/statusAxis"}
      subagent_dispatch: {$ref: "#/$defs/statusAxis"}
      mcp: {$ref: "#/$defs/statusAxis"}
      tool_vocabulary: {$ref: "#/$defs/vocabulary"}
  host:
    type: object
    additionalProperties: false
    required: [tier, version_added, floor, extras]
    properties:
      display_name: {type: string, minLength: 1}
      aliases: {$ref: "#/$defs/stringList"}
      tier: {$ref: "#/$defs/tier"}
      version_added:
        type: string
        pattern: "^\\d+\\.\\d+\\.\\d+$"
      floor: {$ref: "#/$defs/floor"}
      extras: {$ref: "#/$defs/extras"}

example:
  schema_version: 1
  contract_version: "17.4.0"
  hosts:
    example-host:
      display_name: Example Host
      aliases: []
      tier: guaranteed
      version_added: "17.4.0"
      floor:
        skill_delivery:
          kind: skill-dir
          sets: [core]
          paths: {project: .example/skills/devola-flow}
        instruction_format:
          artifact: SKILL.md
          frontmatter: c5-full
          budget: {type: lines, max: 500}
        install_channels: [install.sh]
        doctor: {status: designed, kind: stamp}
        tests: [tests/test_install_manifest.py]
      extras:
        boundary_bridge: {status: undeclared}
        session_resume: {status: undeclared}
        subagent_dispatch: {status: undeclared}
        mcp: {status: undeclared}
        tool_vocabulary: {status: undeclared}
