# -----------------------------------------------------------------------------
# Design reference: doc/designs/design_decomposition_gate.md §5.5
# GateReport — structured output of a gate evaluation (build/test/lint/review/acceptance).
# -----------------------------------------------------------------------------

design_reference: doc/designs/design_decomposition_gate.md §5.5
schema_name: gate-report
instance_top_level_required:
  - header
  - verdict
  - check_results
  - next_action

instance_top_level_optional:
  - convergence_history

fields:
  header:
    children:
      gate_id: { type: string, description: e.g. G_S04. }
      stage_id: { type: string }
      stage_name: { type: string }
      gate_type: { type: string, description: preflight | revision | escalation | abort | passthrough | acceptance_readiness. }
      gate_profile: { type: string, description: strict | standard | relaxed | audit. }
      timestamp: { type: string, description: ISO8601. }
      round: { type: int, description: Current convergence round (1 for standard). }
      max_rounds: { type: int }

  verdict:
    children:
      decision: { type: string, description: PASS | FAIL | ESCALATE. }
      rationale: { type: string }
      composite_score: { type: number, optional: true }
      meets_threshold: { type: bool }
      escalation_context:
        type: string
        optional: true
        description: Present when a preflight or escalation gate fails. Contains context for the escalation handler.
      advisor_recommended:
        type: bool
        optional: true
        description: True when the composite score is within ±advisor_margin of the threshold (borderline). Informational flag for the orchestrating agent.
      advisor_context:
        type: string
        optional: true
        description: Present when advisor_recommended is true. Contains score context for the advisor tool.
      abort_context:
        optional: true
        description: Present when an abort gate triggers. Contains post-mortem details.
        children:
          abort_categories_found: { type: list, item_type: string }
          finding_count: { type: int }
          findings: { type: list, item_type: string, description: IDs of abort-triggering findings. }

  check_results:
    description: Per-dimension check outcomes.
    children:
      build:
        children:
          status: { type: string, description: pass | fail | skip. }
          command: { type: string }
          exit_code: { type: int }
          output_summary: { type: string, optional: true, description: Truncated log on failure. }
          duration_seconds: { type: number }
      test:
        children:
          status: { type: string }
          tests_total: { type: int }
          tests_passed: { type: int }
          tests_failed: { type: int }
          tests_skipped: { type: int }
          coverage_pct: { type: number }
          coverage_threshold: { type: number }
          coverage_met: { type: bool }
      lint:
        children:
          status: { type: string }
          errors: { type: int }
          warnings: { type: int }
          policy: { type: string }
          policy_met: { type: bool }
      code_review:
        optional: true
        description: Present when automated or assisted code review ran.
        children:
          status: { type: string }
          quality_score: { type: number }
          pass_threshold: { type: number }
          findings_summary:
            children:
              blocker: { type: int }
              critical: { type: int }
              major: { type: int }
              minor: { type: int }
              info: { type: int }
      acceptance_criteria:
        children:
          status: { type: string, description: pass | fail. }
          results:
            type: list
            item_fields:
              criterion: { type: string }
              met: { type: bool }
              evidence: { type: string }

  convergence_history:
    optional: true
    description: Populated for convergence gates to show score trajectory.
    children:
      rounds:
        type: list
        item_fields:
          round: { type: int }
          composite_score: { type: number }
          blocker_count: { type: int }
          critical_count: { type: int }
          timestamp: { type: string }
      trend: { type: string, description: improving | stagnant | degrading. }

  next_action:
    children:
      action: { type: string, description: advance | retry | escalate | loop_back. }
      target: { type: string, optional: true }
      details: { type: string }
