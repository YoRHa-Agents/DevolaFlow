# -----------------------------------------------------------------------------
# Stub authored under v7.5.0 P-07 Option α (per .local/research/v7.5.0_ghost_audit.md §5)
# Design reference: docs/designs/design_decomposition_gate.md §6.2
# DependencyMatrix — the L2 Wave Agent's planning artifact: an adjacency list
# over task_ids plus a file-ownership map (P5 disjoint-scope verification) and
# a critical-path projection used to order intra-wave dispatches.
# -----------------------------------------------------------------------------
# TODO(v7.6.x P-07 Option β): add `cycle_detection` block emitted by the L2
# planner so cyclic dependencies surface as gate findings before dispatch.
# TODO(v7.6.x P-07 Option β): formalise `critical_path` as a list of task_ids
# (currently free-form) and connect it to the gate composite-score
# `time_pressure` dimension.

design_reference: docs/designs/design_decomposition_gate.md §6.2
schema_name: dependency-matrix
instance_top_level_required:
  - id
  - wave_id
  - adjacency
  - file_ownership

fields:
  id: { type: string, description: Matrix id; unique per wave. }
  wave_id: { type: string, description: Parent wave id. }
  generated_at: { type: string, optional: true, description: ISO8601 timestamp. }

  adjacency:
    type: list
    description: Edges in the dependency DAG.
    item_fields:
      from: { type: string, description: Upstream task_id (must produce before `to` starts). }
      to: { type: string, description: Downstream task_id. }
      reason: { type: string, optional: true, description: Why this edge exists (artifact / file / API). }

  file_ownership:
    type: list
    description: P5 disjoint-scope verification — each entry asserts a single owner.
    item_fields:
      path: { type: string, description: Repo-relative file path. }
      owner_task_id: { type: string, description: The single task_id allowed to write. }

  critical_path:
    type: list
    optional: true
    description: Ordered task_ids on the longest dependency chain.

  parallel_safe_groups:
    type: list
    optional: true
    description: Sets of task_ids with no inter-dependencies — safe to dispatch concurrently.
