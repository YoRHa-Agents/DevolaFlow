# -----------------------------------------------------------------------------
# Stub authored under v7.5.0 P-07 Option α (per .local/research/v7.5.0_ghost_audit.md §5)
# Design reference: doc/designs/design_decomposition_gate.md §4.3
# TaskDefinition — the L3 Task Agent's contract: spec, owned-file scope,
# dependencies, and per-task acceptance. Distinct from task-dispatch.schema.yaml
# which is the runtime *message envelope* — this schema documents the
# *static plan* that the L2 Wave Agent assembles before dispatch.
# -----------------------------------------------------------------------------
# TODO(v7.6.x P-07 Option β): add `model_hint` and `compression_intensity`
# planner-side defaults so the L2 Wave Agent can budget per-task before the
# task-dispatch.schema.yaml envelope is constructed.
# TODO(v7.6.x P-07 Option β): formalise the `parameters` block (currently
# free-form) once G-G1 (parameters.mode runtime wiring) is closed in P-04.

design_reference: doc/designs/design_decomposition_gate.md §4.3
schema_name: task-definition
instance_top_level_required:
  - id
  - title
  - team
  - scope
  - acceptance

fields:
  id: { type: string, description: Task id (e.g. W01-T01) unique within parent wave. }
  title: { type: string, description: Short title for the task. }
  description: { type: string, optional: true, description: What to achieve (not implementation steps). }
  team: { type: string, description: research | design | implement | test | review. }
  task_type: { type: string, optional: true, description: code | test | review | research | design | benchmark. }

  scope:
    children:
      owned_files: { type: list, description: Repo-relative paths the L3 agent may read/modify. }
      read_only_files: { type: list, optional: true, description: Read-only context files. }

  depends_on:
    type: list
    optional: true
    description: Other task_ids whose outputs must exist before this task starts.

  parameters:
    type: map
    optional: true
    description: Task-type-specific key/value overrides (consumer wiring pending P-04).

  acceptance:
    children:
      criteria: { type: list, description: Testable completion conditions. }
      max_retry_rounds: { type: int, optional: true, description: P4 bounded retry; defaults to 3. }
