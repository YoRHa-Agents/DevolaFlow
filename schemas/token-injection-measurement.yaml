$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/YoRHa-Agents/DevolaFlow/blob/main/schemas/token-injection-measurement.yaml
title: DevolaFlow Token Injection Measurement
type: object
additionalProperties: false
required:
  - schema_version
  - event
  - event_id
  - ts
  - host
  - channel
  - layer
  - profile
  - run_id
  - run_id_status
  - salt
  - salt_status
  - repo_ref
  - repo_ref_status
  - repo_sha
  - repo_sha_status
  - source
  - provenance
  - skill_tokens
  - skill_status
  - rule_tokens
  - rule_status
  - report_tokens
  - report_status
  - context_tokens
  - context_status
  - uncertainty
  - status
properties:
  schema_version:
    const: 1
  event:
    const: token_injection_measurement
  event_id:
    type: string
    minLength: 1
  ts:
    type: string
    format: date-time
  host:
    type: string
    minLength: 1
  channel:
    type: string
    minLength: 1
  layer:
    enum: [L0, L1, L2]
  profile:
    type: string
    minLength: 1
  run_id:
    type: [string, "null"]
    minLength: 1
  run_id_status:
    $ref: "#/$defs/status"
  salt:
    type: [string, number, "null"]
  salt_status:
    $ref: "#/$defs/status"
  repo_ref:
    type: [string, "null"]
    minLength: 1
  repo_ref_status:
    $ref: "#/$defs/status"
  repo_sha:
    type: [string, "null"]
    pattern: "^[0-9a-f]{7,64}$"
  repo_sha_status:
    $ref: "#/$defs/status"
  source:
    enum: [cli_probe, captured, replay]
  provenance:
    type: object
    additionalProperties: false
    required: [kind, artifact_path, artifact_sha256]
    properties:
      kind:
        type: string
        minLength: 1
      artifact_path:
        type: [string, "null"]
      artifact_sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
  skill_tokens:
    $ref: "#/$defs/tokens"
  skill_status:
    $ref: "#/$defs/status"
  rule_tokens:
    $ref: "#/$defs/tokens"
  rule_status:
    $ref: "#/$defs/status"
  report_tokens:
    $ref: "#/$defs/tokens"
  report_status:
    $ref: "#/$defs/status"
  context_tokens:
    $ref: "#/$defs/tokens"
  context_status:
    $ref: "#/$defs/status"
  uncertainty:
    type: object
    additionalProperties: false
    required: [sample_count, variance, interval, status]
    properties:
      sample_count:
        type: [integer, "null"]
        minimum: 0
      variance:
        type: [number, "null"]
        minimum: 0
      interval:
        type: [object, "null"]
        additionalProperties: false
        required: [low, high]
        properties:
          low: {type: number}
          high: {type: number}
      status:
        $ref: "#/$defs/status"
  status:
    $ref: "#/$defs/status"
$defs:
  status:
    enum: [AVAILABLE, INSUFFICIENT]
  tokens:
    type: [integer, "null"]
    minimum: 0
