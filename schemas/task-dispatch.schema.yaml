# -----------------------------------------------------------------------------
# Design reference: docs/designs/design_agent_hierarchy.md §3.1
# TaskDispatch — parent→child dispatch message shape (all layers use same schema).
# -----------------------------------------------------------------------------

design_reference: docs/designs/design_agent_hierarchy.md §3.1
schema_name: task-dispatch
instance_top_level_required:
  - header
  - task
  - context
  - acceptance

fields:
  header:
    required: true
    description: Dispatch envelope and timing.
    children:
      dispatch_id: { type: string, description: UUID for this dispatch. }
      parent_id: { type: string, description: Parent dispatch_id or logical root id. }
      layer: { type: string, description: project | stage | wave (dispatching layer). }
      timestamp: { type: string, description: ISO8601 dispatch time. }
      timeout_seconds: { type: int, description: Child must finish or fail within this window. }
      model_hint:
        type: string
        enum: [quality, balanced, budget, inherit]
        default: inherit
        description: "Host IDE interprets this hint to select appropriate model tier"
      decomposition_mode:
        type: string
        enum: [single, sub_agents]
        default: single
        description: "L2 task execution mode. single = v3.x leaf behavior. sub_agents = coordinator dispatches budget-tier micro-tasks."
      compression_intensity:
        type: string
        enum: [minimal, standard, aggressive]
        default: standard
        description: "Lean format compression intensity for this dispatch message."

  task:
    required: true
    description: Work unit identity and specification.
    children:
      task_id: { type: string, description: Human-readable id (e.g. S03, W02, T04). }
      type: { type: string, description: stage | wave | code | test | review | research | design | benchmark, etc. }
      title: { type: string, description: Short title. }
      description: { type: string, description: What to achieve (not implementation steps). }
      explicit_assumptions:
        type: string
        optional: true
        description: "Assumptions the agent states before starting work. Forces think-before-code: state what you believe about interfaces, data formats, constraints, and environment before writing any code."

  context:
    required: true
    description: Scoped inputs, artifacts, and rule loading hints.
    children:
      predecessor_artifacts:
        type: list
        description: Summaries of upstream artifacts (not full content).
        item_fields:
          artifact_id: { type: string }
          path: { type: string, description: Filesystem path to artifact. }
          summary: { type: string, description: One–two sentence summary. }
      owned_files:
        type: list
        description: Paths the child may read/modify (Task layer enforces strictly).
      applicable_rules:
        description: Code-rules loading protocol (see guide).
        children:
          loading_strategy: { type: string, description: minimal | standard | full. }
          language: { type: string, optional: true, description: Primary language hint. }
          task_type: { type: string, optional: true, description: Task category for rule selection. }
          quality_focus: { type: list, description: e.g. security, maintainability. }
          constraint_tiers:
            type: mapping
            optional: true
            value_enum: [invariant, guard, advisory]
            description: "Optional field-name→constraint-tier metadata. quality_focus and unknown unannotated entries default advisory and remain fully injected."
          reinforcement:
            type: object
            optional: true
            description: "Round-specific rule injection from previous convergence failures."
            children:
              round: { type: int, description: "Current convergence round number." }
              severity_floor: { type: string, description: "Minimum severity included (blocker|critical|major)." }
              prior_score: { type: number, description: "Previous round composite score." }
              target_score: { type: number, description: "Gate threshold to achieve." }
              rules:
                type: list
                description: "Specific findings that MUST be addressed this round."
                item_fields:
                  id: { type: string }
                  severity: { type: string }
                  mandate: { type: string, description: "Imperative instruction (MUST/SHALL)." }
                  file: { type: string, optional: true }
                  tier:
                    type: string
                    enum: [invariant, guard, advisory]
                    optional: true
                    description: "Constraint tier; new tier-aware emitters annotate reinforcement mandates as guard."
              escalation_note: { type: string, optional: true, description: "Context about prior round failure." }
      shared_context:
        type: string
        optional: true
        description: Small cross-cutting context (token-budgeted).

  verification_config:
    optional: true
    description: "Configuration for user-facing verification tasks (v5.4.0)."
    children:
      visual_testing:
        optional: true
        children:
          enabled: { type: bool, default: false }
          tool: { type: string, description: "playwright | backstopjs | percy" }
          threshold: { type: number, description: "Pixel diff threshold 0-1." }
          mask_dynamic: { type: bool, default: true }
      acceptance_testing:
        optional: true
        children:
          enabled: { type: bool, default: false }
          framework: { type: string, description: "gherkin | robot | custom" }
          criteria_source: { type: string, description: "Path to acceptance criteria file." }
      interaction_testing:
        optional: true
        children:
          enabled: { type: bool, default: false }
          tool: { type: string, description: "playwright | cypress" }
          flows: { type: list, description: "List of user flow identifiers to test." }
      accessibility:
        optional: true
        children:
          enabled: { type: bool, default: false }
          tool: { type: string, description: "axe-core | pa11y | lighthouse" }
          standard: { type: string, default: "WCAG2.1-AA" }
          threshold: { type: number, description: "Minimum accessibility score." }

  acceptance:
    required: true
    description: Done-when conditions and quality bar.
    children:
      criteria: { type: list, description: Testable completion conditions. }
      quality_thresholds:
        description: Numeric gates (null = not applicable).
        children:
          coverage_pct: { type: number, optional: true }
          quality_score: { type: number, optional: true }
          max_blocker_findings: { type: int, description: Usually 0 for merge-ready work. }
      max_retry_rounds: { type: int, description: Retries on failure before escalation. }
