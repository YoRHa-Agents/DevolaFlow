# -----------------------------------------------------------------------------
# Schema: memory-case
# Targets:
#   - .local/memory/cases/index.yaml             (multi-level routing index)
#   - .local/memory/cases/<case-id>.md           (per-case recipe markdown)
# Design refs:
#   - .local/research/v8.4.0_gap_analysis.md §2.1 M-001
#   - .local/research/v8.4.0_rtk_nines_analysis.md §4.1 (single-source-of-truth)
#   - cycle plan §3 PV-03 row + §6 R3 (cache-poisoning mitigation)
# Patch slot: v8.3.3 (PV-03 — fast-path memory router)
# Token budget (per recipe file): soft 800 / hard 1500 (per Rule C-9 spec slot)
# -----------------------------------------------------------------------------
# A "memory case" is a planning recipe consulted at L0/L1 dispatch BEFORE
# re-deriving workflow + stage decomposition from SKILL.md. The router
# (`src/devolaflow/memory_router/`) reads `.local/memory/cases/index.yaml`
# at first lookup, picks the matching `(workflow_type, task_type)` entry,
# and returns a :class:`MemoryCase` pointing at the recipe markdown body.
#
# Layout (multi-level routing keys per A2 verbatim):
#
#   workflow_type → task_type → case_id → recipe_path
#
# The `index.yaml` file is the only place the router reads at lookup time;
# the recipe markdown is loaded lazily by the *caller* once the router
# returns a hit. This keeps the hot path to a single dict probe.
#
# Activation (default OFF — R5 strict):
#   * Set `DEVOLAFLOW_MEMORY_ROUTER=1` to enable the fast-path lookup.
#   * Without the env-flag, `MemoryRouter.lookup_case()` returns `None`
#     immediately — no file IO, no parsing — so all v8.3.2 baseline tests
#     pass byte-identical.
#
# Cache invalidation (per cycle plan §6 R3 — cache-poisoning mitigation):
#   * Per-route TTL via `ttl_days` field (default 30; max 365)
#   * Per-route version stamp via `version_stamp` field — when the entry's
#     stamp differs from `devolaflow.__version__`, the router treats the
#     route as a miss (caller falls through to the existing planner).
#   * Both checks happen in `MemoryRouter.lookup_case()` BEFORE the recipe
#     payload is materialized, so stale routes never leak into dispatch.
# -----------------------------------------------------------------------------

design_reference: .local/research/v8.4.0_gap_analysis.md §2.1 M-001
schema_name: memory-case
schema_version: 1
last_updated: "2026-04-23"
patch_slot: v8.3.3
gap_ids: [M-001]
governing_rules: [S-2, S-5, S-7, P5, C-9, R5]

# Two on-disk artifacts — both gitignored under `.local/*` (operator-local).
# The schema is the canonical source-of-truth for the format; recipes are
# seeded from completed sessions but never committed.
artifacts:
  index:
    target_path: ".local/memory/cases/index.yaml"
    format: yaml
    role: "Multi-level routing keys → case_id pointer. Loaded lazily by the router on first lookup."
    token_budget: { soft: 400, hard: 800, units: tokens }
    on_soft_breach: warn
    on_hard_breach: warn  # never fail; router falls back to planner

  recipe:
    target_path_template: ".local/memory/cases/<case-id>.md"
    format: markdown_with_frontmatter
    role: "Recipe body for a single case_id — workflow trace, dispatch templates, expected savings notes."
    token_budget: { soft: 800, hard: 1500, units: tokens }
    on_soft_breach: warn
    on_hard_breach: warn

# -----------------------------------------------------------------------------
# Index file format (.local/memory/cases/index.yaml)
# -----------------------------------------------------------------------------
index_top_level_required:
  - schema_version
  - last_updated
  - cases  # list of case entries

index_fields:
  schema_version:
    type: int
    enum: [1]
    description: "Schema version pin — bump on incompatible changes only."

  last_updated:
    type: string
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    description: "ISO-8601 date (YYYY-MM-DD) the index was last touched."

  cases:
    type: list
    description: "Each entry is a routable case; the router scans this list at lookup time."
    item_required_fields:
      - case_id
      - workflow_type
      - task_type
      - summary
      - recipe_path
      - version_stamp
    item_optional_fields:
      - repo_signal     # optional secondary key (e.g. "DevolaFlow", "rtk-ai/rtk")
      - ttl_days        # default 30
      - last_accessed   # ISO date — bumped on every cache hit
      - tags            # free-form list of strings for human filtering
    item_fields:
      case_id:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
        max_chars: 64
        description: "Stable identifier — MUST equal the recipe-file basename without `.md`."
      workflow_type:
        type: string
        description: "Primary routing key — MUST match a known workflow template id (e.g. `feature-implementation`, `change-driven`, `version-bump`)."
        max_chars: 64
      task_type:
        type: string
        description: "Secondary routing key — MUST match a context-profile task type (e.g. `implement`, `review`, `test`, `version-bump`, `gate-evaluation`)."
        max_chars: 64
      summary:
        type: string
        description: "One-sentence verbatim summary (<=160 chars) of what the recipe captures. Lifted from the recipe frontmatter at seed time."
        max_chars: 160
      recipe_path:
        type: string
        pattern: "^\\.local/memory/cases/[a-z0-9][a-z0-9-]*[a-z0-9]\\.md$"
        description: "Repo-relative path to the recipe markdown (S-2 — never absolute)."
      version_stamp:
        type: string
        pattern: "^\\d+\\.\\d+\\.\\d+(?:[-+][a-z0-9.-]+)?$"
        description: "Semver stamp recorded at recipe-write time. The router invalidates the route when this differs from `devolaflow.__version__` (per cycle plan §6 R3)."
      repo_signal:
        type: string
        max_chars: 64
        description: "Optional tertiary key — repo or project hint to disambiguate identical (workflow, task) pairs across multiple repos."
      ttl_days:
        type: int
        minimum: 1
        maximum: 365
        default: 30
        description: "Days the route is considered fresh after `last_accessed` (or `last_updated` when never accessed). Past TTL → router treats as miss."
      last_accessed:
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        description: "ISO date of the most recent cache hit. Optional; absent on freshly seeded entries."
      tags:
        type: list
        item_type: string
        max_items: 8
        description: "Free-form labels (e.g. `[r5-strict, default-off]`) for human-faceted browsing of the recipe library."

# -----------------------------------------------------------------------------
# Recipe file format (.local/memory/cases/<case-id>.md)
# -----------------------------------------------------------------------------
# Markdown with YAML frontmatter. The frontmatter MUST repeat the routing
# keys and version stamp so the recipe is self-describing if pulled out of
# context (e.g. shared via gist). The body is freeform but should follow
# the structure described below for operator readability.
recipe_frontmatter_required:
  - case_id
  - workflow_type
  - task_type
  - summary
  - version_stamp
  - last_updated

recipe_body_recommended_sections:
  - "## Trigger"          # When this recipe applies (verbatim conditions)
  - "## Dispatch shape"   # Skeletal lean-dispatch.yaml the L0 layer should emit
  - "## Predecessor refs" # Predecessor artifact pointers / key_facts to lift verbatim
  - "## Owned files"      # Typical owned_files.txt prefix for L3 task agents
  - "## Gate hints"       # SI-3 / SI-10 expectations specific to this recipe
  - "## Notes"            # Free-form caveats, anti-patterns, escalation triggers

# -----------------------------------------------------------------------------
# Lifecycle invariants
# -----------------------------------------------------------------------------
invariants:
  - "MUST NOT contain absolute filesystem paths (S-2 / SF-5)."
  - "External references MUST use canonical GitHub URLs (S-7 / SF-6)."
  - "MUST be operator-local (gitignored under `.local/*`); the canonical schema lives in this file (committed)."
  - "Cache misses are the SAFE path — when the index is missing, malformed, or all entries TTL-expired, the router returns None and the caller falls through to the existing SKILL.md-derived planner (R5 strict)."
  - "Errors MUST be loud per S-5 — malformed YAML logs a WARNING with the file path; never silent."
  - "The router MUST treat the env-flag `DEVOLAFLOW_MEMORY_ROUTER` as the single activation point (default `0`); when unset, NO file IO is performed."
  - "Adding a new case is a 2-file change: append a row to `index.yaml` AND author the recipe markdown. Both files share the same `version_stamp`."

# -----------------------------------------------------------------------------
# Worked example
# -----------------------------------------------------------------------------
examples:
  index_yaml: |
    schema_version: 1
    last_updated: "2026-04-23"
    cases:
      - case_id: rtk-plugin-entry
        workflow_type: feature-implementation
        task_type: implement
        summary: "RTK plugin entry pattern — runtime-plugins.yaml row + curl_install_script backend (v8.3.1 PV-01)."
        recipe_path: ".local/memory/cases/rtk-plugin-entry.md"
        version_stamp: "8.3.3"
        repo_signal: "DevolaFlow"
        ttl_days: 60
        tags: [plugin, rtk, schema-v2]

      - case_id: shell-proxy-registry
        workflow_type: feature-implementation
        task_type: implement
        summary: "shell_proxy registry pattern — Tier 1/Tier 2 whitelist + thin lifecycle delegator (v8.3.2 PV-02)."
        recipe_path: ".local/memory/cases/shell-proxy-registry.md"
        version_stamp: "8.3.3"
        repo_signal: "DevolaFlow"
        ttl_days: 60
        tags: [shell-proxy, rtk, lifecycle-hook, r5-strict]

      - case_id: evobench-doc-coupling
        workflow_type: version-bump
        task_type: doc-consistency
        summary: "EvoBench scenario coupling fix — README + demo HTML scenario count + baselines."
        recipe_path: ".local/memory/cases/evobench-doc-coupling.md"
        version_stamp: "8.3.3"
        repo_signal: "DevolaFlow"
        ttl_days: 30
        tags: [evobench, doc-consistency, baselines]

  recipe_markdown: |
    ---
    case_id: rtk-plugin-entry
    workflow_type: feature-implementation
    task_type: implement
    summary: "RTK plugin entry pattern — runtime-plugins.yaml row + curl_install_script backend."
    version_stamp: "8.3.3"
    last_updated: "2026-04-23"
    ---

    ## Trigger

    L0/L1 dispatch sees `(workflow_type=feature-implementation, task_type=implement)`
    AND the predecessor artifact references `workflow-system/agent/knowledge/runtime-plugins.yaml`.

    ## Dispatch shape

    Skeleton `lean-dispatch.yaml` block (positions 1-12 byte-stable per A-2):

    ```yaml
    workflow_type: feature-implementation
    stage: implement
    owned_files:
      - workflow-system/agent/knowledge/runtime-plugins.yaml
      - src/devolaflow/plugins/installer.py
      - tests/test_plugins.py
    ```

    ## Predecessor refs

    - `.local/research/v8.4.0_gap_analysis.md` §2.1 R-001 row
    - `.local/research/v8.4.0_rtk_nines_analysis.md` §5 plugin recommendation

    ## Gate hints

    - SI-10 `pytest tests/test_plugins.py -v` MUST pass before commit
    - SI-3 minor threshold 8.5; +9-test cap per cycle plan §4.1
