# -----------------------------------------------------------------------------
# Schema: compression-pipeline
# Targets:
#   - dispatch.compression_pipeline (NESTED inside compression_rules — A-2.3 NEST)
#   - profile-level pipeline declarations in workflow-system/agent/context_profiles.yaml
# Design refs:
#   - .local/research/v9.0.0_implementation_plan.md §6.6.2 T03/T04
#   - .local/research/adr/v9-ADR-006-compression-pipeline-and-b3-flip.md
#   - src/devolaflow/compression_pipeline.py (the canonical implementation)
# Patch slot: v8.5.1 (PV-06 — CompressionPipeline unification)
# Token budget (per pipeline declaration block): soft 400 / hard 800 tokens
# -----------------------------------------------------------------------------
# A "compression pipeline" is an ordered list of named stages, each of which
# implements ``CompressionStage.should_bypass(payload, context) -> bool`` and
# ``CompressionStage.transform(payload, context) -> payload``.
# Stages are composed sequentially: the output of stage N is the input of
# stage N+1. Empty stages list (or every stage's should_bypass predicate firing)
# yields a byte-identical pass-through (R5 strict invariant — pinned by
# tests/test_compression_pipeline.py::test_*_byte_identical).
#
# Five canonical transforms ship in v8.5.1 PV-06 wrapped behind this schema:
#
#   1. truncate_tool_output     — head+tail keep, middle elided (v7.0.1 ADR-002)
#   2. summarise_predecessor_extractive — schema-hint section ranker (v7.0.2 ADR-003)
#   3. summarise_predecessor_abstractive_a — density-routed (v8.0.0 P-12 Stage A)
#   4. summarise_predecessor_abstractive_b — LLM-assisted (v8.2.0 PV-01 Stage B)
#   5. directed_compact         — focus-keyword paragraph filter (v8.0.0 P-02)
#
# Per A-2.3 NEST decision rule, this schema NESTS under existing dispatch
# blocks rather than appending a new top-level key:
#
#   * pred[i].compression_pipeline: { stages: [...], context: {...} }
#     — overrides the default per-predecessor compression chain
#   * compression_rules.pipeline: { stages: [...], context: {...} }
#     — overrides the default global compression chain
#
# This preserves the FROZEN_PREFIX_V7 (positions 1-12) AND the v7.x-v8.x
# append-only tail (positions 13-17) byte-identically. The
# layout_invariant.canonical_order length stays 17, version stays 6.
#
# P6-safe: schema additions to existing blocks (NEST) preserve the LLM
# cache prefix; this is the canonical example of A-2.3 D3 nest-vs-append.
# -----------------------------------------------------------------------------

design_reference: .local/research/adr/v9-ADR-006-compression-pipeline-and-b3-flip.md
schema_name: compression-pipeline
schema_version: 1
last_updated: "2026-04-24"
patch_slot: v8.5.1
gap_ids: [T3, T5]
governing_rules: [S-2, S-5, S-7, A-2, C-2, C-3, P5, R5]

# Pipeline declaration shape — a top-level dict with two required keys.
pipeline_top_level_required:
  - stages
  - name

pipeline_top_level_optional:
  - context
  - strict

pipeline_fields:
  name:
    type: string
    pattern: "^[a-z][a-z0-9_-]*$"
    max_chars: 64
    description: >
      Pipeline id surfaced in error messages, telemetry, and status reports.
      Conventional names: ``predecessor_default``, ``tool_output_default``,
      ``directed_compact_focused``.

  stages:
    type: list
    description: >
      Ordered list of stage declarations. Each stage runs in sequence on the
      output of the previous stage. Empty list yields a byte-identical
      pass-through (R5 strict — pinned by tests).
    item_fields:
      name:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
        max_chars: 64
        description: "Stage canonical id (e.g. ``truncate_tool_output``)."
      transform_ref:
        type: string
        pattern: "^[a-zA-Z_][a-zA-Z0-9_.]*$"
        max_chars: 200
        description: >
          Dotted import path resolved at orchestrator-load time
          (e.g. ``devolaflow.compressor:truncate_tool_output``). The
          orchestrator imports the symbol and wraps it via ``make_stage``.
      bypass_ref:
        type: string
        max_chars: 200
        optional: true
        description: >
          Optional dotted path to a bypass predicate
          ``Callable[[payload, context], bool]``. Defaults to ``BYPASS_NEVER``
          (always run) when omitted.
      bypass_conditions:
        type: list
        item_type: string
        max_items: 8
        optional: true
        description: >
          Free-form bypass-condition labels (e.g. ``["env_flag_unset",
          "fresh_checkout"]``) for status-report attribution. Pure
          documentation — has NO runtime effect.
      params:
        type: dict
        optional: true
        description: >
          Stage-defined kwargs merged into the run-time ``context`` dict
          before the stage's ``transform`` is invoked. Use this to pin
          per-stage configuration (e.g. ``{head_chars: 500, tail_chars: 500}``
          for the truncate stage).
      telemetry_key:
        type: string
        optional: true
        default: "<stage.name>"
        description: >
          Optional telemetry-attribution key surfaced in StageResult.
          Defaults to the stage's ``name`` when omitted.

  context:
    type: dict
    optional: true
    description: >
      Pipeline-level context dict. Merged with each stage's per-stage
      ``params`` (per-stage wins on conflict). Used to pass per-call
      arguments that all stages share (e.g. ``max_tokens=1200`` consumed
      by both extractive AND abstractive Stage A).

  strict:
    type: bool
    optional: true
    default: true
    description: >
      When true (default), the FIRST stage that raises propagates a
      :class:``devolaflow.compression_pipeline.CompressionStageError``.
      When false, per-stage failures are logged as WARNING (S-5 — never
      silently swallow), the failing stage's input is forwarded to the
      next stage unchanged, and the failed stage's name is recorded in
      ``PipelineRunResult.failed_stages``.

# -----------------------------------------------------------------------------
# Lifecycle invariants (verified by tests/test_compression_pipeline.py)
# -----------------------------------------------------------------------------
invariants:
  - "MUST NOT contain absolute filesystem paths (S-2 / SF-5)."
  - "External references MUST use canonical GitHub URLs (S-7 / SF-6)."
  - "Empty `stages` list MUST yield a byte-identical pass-through (R5 strict)."
  - "Every stage's `bypass` predicate MUST return True OR False (non-bool returns are treated as True with a WARNING per S-5)."
  - "Stage names within a pipeline MUST be unique (telemetry attribution requirement)."
  - "Stages run in declaration order (sequential reducer — NOT a DAG)."
  - "Pipeline construction MUST NOT touch module-level state, MUST NOT load files, MUST NOT spawn subprocesses (R5 zero-overhead at construction)."
  - "A stage that returns its input verbatim MUST NOT be reported as `applied=True` (telemetry hygiene)."
  - "When `strict=true`, the first failing stage MUST raise CompressionStageError with the stage's name in the message AND the original exception in __cause__ (debug-friendly)."
  - "When `strict=false`, per-stage failures MUST log a WARNING and forward the input unchanged (S-5 best-effort discipline)."

# -----------------------------------------------------------------------------
# Worked examples — three canonical compositions used in v8.5.1
# -----------------------------------------------------------------------------
examples:
  predecessor_default_extractive:
    name: "predecessor_default_extractive"
    strict: true
    context:
      max_tokens: 1200
      schema_hint: "design"
    stages:
      - name: "summarise_predecessor_extractive"
        transform_ref: "devolaflow.compressor:summarise_predecessor"
        params:
          mode: "extractive"

  predecessor_abstractive_with_stage_b:
    name: "predecessor_abstractive_with_stage_b"
    strict: true
    context:
      max_tokens: 1200
    stages:
      - name: "summarise_predecessor_abstractive_a"
        transform_ref: "devolaflow.compressor:summarise_predecessor"
        params:
          mode: "abstractive"
          llm_assist: false
      - name: "summarise_predecessor_abstractive_b"
        transform_ref: "devolaflow.compressor:summarise_predecessor"
        bypass_conditions: ["llm_client_unset", "stage_b_disabled"]
        params:
          mode: "abstractive"
          llm_assist: true
