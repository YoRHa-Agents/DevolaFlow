# -----------------------------------------------------------------------------
# Schema: command-mapping
# Targets:
#   - .local/memory/commands/<repo-or-tool>/<cmd>.yaml   (per-command recipe)
# Design refs:
#   - .local/research/v8.4.0_gap_analysis.md §2.1 M-002
#   - .local/research/v8.4.0_rtk_nines_analysis.md §4.3 (RTK [filters.<name>] schema)
#   - cycle plan §3 PV-04 row + §6 R3 (cache-poisoning mitigation analog)
# Patch slot: v8.3.4 (PV-04 — RTK-pattern command-output mapping layer)
# Token budget (per recipe file): soft 800 / hard 1500 (mirrors memory-case.yaml)
# -----------------------------------------------------------------------------
# A "command mapping" is a repo-specific compression recipe for one shell
# command, modeled on RTK's `[filters.<name>]` TOML schema (per the SI-2 NineS
# analysis §4.3 reuse). The recipe is consumed by
# `src/devolaflow/shell_proxy/commands.py::apply_local_recipe()` AFTER the
# shell-proxy wrapper has decided whether to rewrite the command via
# `rtk <cmd>` (PV-02). The local recipe layers ON TOP of RTK's built-in 100+
# command rewrites — local wins, falls back to RTK, falls back to passthrough.
#
# Layout (per gap analysis §2.1 M-002 verbatim — A2 user ask):
#
#   .local/memory/commands/
#   ├── README.md                       # operator doc (gitignored seed)
#   ├── <repo-or-tool>/
#   │   ├── pytest.yaml                 # one recipe per command (basename)
#   │   ├── ruff.yaml
#   │   └── git-diff.yaml
#   └── <other-repo>/<cmd>.yaml         # cluster-by-repo per NineS §3 finding
#
# The directory level (`<repo-or-tool>`) lets operators namespace recipes —
# e.g. `devolaflow/pytest.yaml` (recipe for THIS repo's `pytest`) coexists with
# `nines/pytest.yaml` (different filter for NineS' `pytest` output shape).
# The `commands.py::load_command_mappings(repo_signal=...)` loader narrows to
# a single namespace when `repo_signal` is supplied.
#
# Activation (default OFF — R5 strict; SAME env-flag as PV-02):
#   * Set `DEVOLAFLOW_RTK_PROXY=1` (the existing PV-02 env-flag).
#   * NO new env-flag is introduced — the local-recipe layer extends the PV-02
#     shell_proxy surface, it does not stand on its own. When the env-flag is
#     unset, `apply_local_recipe()` returns the input unchanged with no IO.
#   * Even when the env-flag IS set, the recipe layer is a no-op when the
#     `.local/memory/commands/` directory is absent (R5 strict — fresh
#     checkouts and CI see byte-identical PV-02 behavior).
#
# Precedence (verbatim from gap analysis §2.1 M-002):
#   1. local recipe (this schema) wins
#   2. falls back to RTK's `rtk rewrite` (PV-02 default)
#   3. falls back to passthrough (no rewrite — original command stands)
#
# Cache invalidation (analog to memory-case.yaml §cache invalidation):
#   * Per-recipe `version_stamp` — when the recipe's stamp differs from
#     `devolaflow.__version__`, the loader treats the recipe as stale (mirrors
#     memory-case.yaml `is_version_stale` semantics).
#   * Per-recipe `ttl_days` (default 30) — when `today - last_updated >
#     ttl_days`, the loader skips the recipe.
#   * Both checks happen in `commands.py::load_command_mappings()` BEFORE the
#     recipe is returned to `apply_local_recipe()`, so stale recipes never
#     leak into the rewrite path.
# -----------------------------------------------------------------------------

design_reference: .local/research/v8.4.0_gap_analysis.md §2.1 M-002
schema_name: command-mapping
schema_version: 2
last_updated: "2026-04-24"
patch_slot: v8.5.1
gap_ids: [M-002, T3]
governing_rules: [S-2, S-5, S-7, P5, C-9, R5, A-2]

# Reference RTK's filter-format documentation by canonical URL only (per S-7).
# The local clone path /home/agent/reference/rtk/.rtk/filters.toml was used
# for SI-2 NineS analysis (see .local/research/v8.4.0_rtk_nines_analysis.md
# §4.3) but MUST NOT be hardcoded in agent-facing files.
external_reference:
  rtk_filter_format_url: "https://github.com/rtk-ai/rtk#custom-filters"
  rtk_canonical_url: "https://github.com/rtk-ai/rtk"
  note: >
    The schema mirrors RTK's `[filters.<name>]` TOML format but uses YAML for
    consistency with the rest of the .local/memory/ tree (see PV-03
    memory-case.yaml). Field names are identical to RTK's where they overlap
    (description, strip_lines_matching, max_lines, on_empty); DevolaFlow-only
    fields are clearly marked below.

# Recipe file per-recipe artifact spec (single artifact — one file per cmd).
artifacts:
  recipe:
    target_path_template: ".local/memory/commands/<repo-or-tool>/<cmd>.yaml"
    format: yaml
    role: >
      Per-command compression recipe. Basename is the canonical command id
      (e.g. `pytest.yaml`, `ruff.yaml`, `git-diff.yaml`). The basename
      `git-diff.yaml` represents the command `git diff` (RTK's own
      `tofu-clean.toml` etc. follow the same hyphenation convention).
    token_budget: { soft: 800, hard: 1500, units: tokens }
    on_soft_breach: warn
    on_hard_breach: warn  # never fail; recipe layer falls back to RTK passthrough

# -----------------------------------------------------------------------------
# Recipe file format (per <cmd>.yaml)
# -----------------------------------------------------------------------------
recipe_top_level_required:
  - schema_version
  - command
  - version_stamp

recipe_top_level_optional:
  - description
  - repo_signal
  - last_updated
  - ttl_days
  - pre_filters
  - post_filters
  - truncate_lines
  - max_lines
  - strip_ansi
  - on_empty
  - tags
  - tests

recipe_fields:
  schema_version:
    type: int
    enum: [1, 2]
    description: >
      Schema version pin — bump on incompatible changes only (mirrors RTK's
      `schema_version` field in filters.toml). v8.5.1 PV-06 adds version 2,
      which introduces the optional `compose: list[str]` field on filter
      rules (T3 #5 multi-pass filter chain). Version 1 recipes remain
      accepted: a v1 recipe is byte-identical to a v2 recipe whose filters
      all omit `compose`. The loader normalises both shapes into the same
      `FilterRule` tuple.

  command:
    type: string
    pattern: "^[a-z][a-z0-9. -]*[a-z0-9]$"
    max_chars: 64
    description: >
      Canonical command id this recipe targets. MUST match the shell-proxy
      registry key when the command is whitelisted (e.g. `pytest`,
      `ruff check`, `git diff`). For commands not in the registry, the
      recipe is loaded but never applied (apply_local_recipe is a no-op for
      non-whitelisted commands).

  version_stamp:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+(?:[-+][a-z0-9.-]+)?$"
    description: >
      Semver stamp recorded at recipe-write time. The loader invalidates the
      recipe when this differs from `devolaflow.__version__` (per cycle plan
      §6 R3 cache-poisoning mitigation; mirror of memory-case.yaml).

  description:
    type: string
    max_chars: 200
    description: "One-sentence verbatim description (≤200 chars) of what the recipe compresses (mirrors RTK's `description` field)."

  repo_signal:
    type: string
    max_chars: 64
    description: >
      Optional namespace hint disambiguating identical commands across repos
      (e.g. `DevolaFlow` vs `rtk-ai/rtk`). When supplied to
      `load_command_mappings(repo_signal=...)`, narrows the loader to recipes
      whose `repo_signal` matches.

  last_updated:
    type: string
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    description: "ISO-8601 date the recipe was authored or refreshed. TTL anchor."

  ttl_days:
    type: int
    minimum: 1
    maximum: 365
    default: 30
    description: "Days the recipe is considered fresh after `last_updated`. Past TTL → loader skips."

  pre_filters:
    type: list
    description: >
      Substitutions applied to the command output BEFORE the post_filters
      pass. Each entry is a mapping with `pattern` (regex), `replacement`
      (verbatim string, may use re.sub backreferences), and (schema_version
      ≥ 2) optional `compose: list[str]` listing additional rule
      `pattern` ids that MUST run AFTER this rule on its intermediate
      output. Mirrors RTK's `strip_lines_matching` with replacement
      support (RTK's filter schema only supports drop-by-regex; DevolaFlow
      extends this with regex-substitution per the M-002 ask + the v8.5.1
      PV-06 T3 #5 multi-pass chain).
    item_fields:
      pattern:
        type: string
        description: "Python regex (re.compile syntax). Anchored only if the pattern says so."
      replacement:
        type: string
        description: "Replacement string passed to re.sub. Empty string drops the match."
      compose:
        type: list
        item_type: string
        max_items: 8
        optional: true
        description: >
          v8.5.1 PV-06 (T3 #5): ordered list of sibling rule `pattern` ids
          that MUST run AFTER this rule on its intermediate output. Empty
          (the default) preserves the v1 single-pass semantic byte-
          identically. Cross-rule references are validated at recipe-load
          time per S-5; an unknown reference raises a CommandMappingError
          loudly.

  post_filters:
    type: list
    description: >
      Same shape as `pre_filters`, applied AFTER pre_filters. Use this to
      apply a final cleanup pass (e.g. collapse-multiple-blank-lines) after
      the substantive substitutions in `pre_filters` have run. Supports
      the same v8.5.1 PV-06 `compose` field as pre_filters.
    item_fields:
      pattern:
        type: string
      replacement:
        type: string
      compose:
        type: list
        item_type: string
        max_items: 8
        optional: true

  truncate_lines:
    type: int
    minimum: 1
    maximum: 100000
    description: >
      Hard cap on total output lines AFTER pre_filters + post_filters have
      applied. When exceeded, output is truncated to the first
      `truncate_lines` lines and a `... (truncated <N> lines per <recipe-id>)`
      footer is appended (mirrors RTK's `truncate_lines_at` field).

  max_lines:
    type: int
    minimum: 1
    maximum: 100000
    description: >
      Alias for `truncate_lines` for direct RTK schema parity. When BOTH
      are set, `truncate_lines` wins (DevolaFlow-canonical name).

  strip_ansi:
    type: bool
    default: true
    description: >
      Strip ANSI color/escape codes before applying filters (mirrors RTK's
      `strip_ansi` field). Default true since most modern tools emit ANSI
      and the regex patterns are easier to write against stripped text.

  on_empty:
    type: string
    max_chars: 200
    description: >
      String to emit when the post-filter output is empty (mirrors RTK's
      `on_empty` field). E.g. `"pytest: ok"` for a passing test run.

  tags:
    type: list
    item_type: string
    max_items: 8
    description: "Free-form labels (e.g. `[pytest, deprecation-filter]`) for human-faceted browsing."

  tests:
    type: list
    description: >
      Inline regression cases for the recipe. Each entry has `name`,
      `input` (sample command output), and `expected` (post-filter output).
      Mirrors RTK's `[[tests.<name>]]` schema. Optional but strongly
      recommended for non-trivial recipes — `tests/test_shell_proxy_commands.py`
      auto-runs every recipe's inline tests when present.
    item_fields:
      name:
        type: string
        max_chars: 64
        description: "Test case id (e.g. `single-deprecation-warning`)."
      input:
        type: string
        description: "Sample command output to feed through the recipe."
      expected:
        type: string
        description: "Verbatim expected post-filter output."

# -----------------------------------------------------------------------------
# Lifecycle invariants
# -----------------------------------------------------------------------------
invariants:
  - "MUST NOT contain absolute filesystem paths (S-2 / SF-5)."
  - "External references MUST use canonical GitHub URLs (S-7 / SF-6); RTK is `https://github.com/rtk-ai/rtk`."
  - "MUST be operator-local (gitignored under `.local/*`); the canonical schema lives in this file (committed)."
  - "Apply-failures are the SAFE path — when a regex is malformed or a substitution raises, the loader logs a WARNING and the recipe is skipped (apply_local_recipe falls back to RTK's `rtk rewrite`, then to passthrough). R5 strict."
  - "Errors MUST be loud per S-5 — malformed YAML logs a WARNING with the file path; malformed regex logs a WARNING with the pattern + recipe id; never silent."
  - "The recipe layer activates ONLY when the existing PV-02 env-flag `DEVOLAFLOW_RTK_PROXY=1` is set; NO new env-flag is introduced."
  - "Adding a new recipe is a 1-file change: author `<repo>/<cmd>.yaml` under `.local/memory/commands/`. The loader picks it up on the next `load_command_mappings()` call (no index file required — basename glob, mirroring RTK's `src/filters/*.toml` discovery pattern)."
  - "Per the M-002 ask, local recipes extend RTK's built-in 100+ command rewrites (precedence: local > RTK > passthrough). They do NOT replace `rtk rewrite` — they layer ON TOP of it."

# -----------------------------------------------------------------------------
# Worked example — drop verbose pytest DeprecationWarning blocks
# -----------------------------------------------------------------------------
examples:
  recipe_yaml: |
    schema_version: 1
    command: "pytest"
    description: "Drop verbose DeprecationWarning blocks visible in v8.3.3 PV-03 test output."
    repo_signal: "DevolaFlow"
    version_stamp: "8.3.4"
    last_updated: "2026-04-23"
    ttl_days: 30
    strip_ansi: true
    pre_filters:
      - pattern: "^\\s*DeprecationWarning:.*$"
        replacement: ""
      - pattern: "^={3,} warnings summary ={3,}.*?(?=^={3,}|\\Z)"
        replacement: ""
    post_filters:
      - pattern: "\\n{3,}"
        replacement: "\n\n"
    truncate_lines: 200
    on_empty: "pytest: ok (DevolaFlow recipe)"
    tags: [pytest, deprecation-filter, devolaflow]
    tests:
      - name: drops-single-deprecation
        input: |
          test_foo PASSED
          DeprecationWarning: this is noisy
          test_bar PASSED
        expected: |
          test_foo PASSED

          test_bar PASSED
