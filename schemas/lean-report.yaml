# Lean StatusReport Template
# Based on: GCC ~50-token-per-entry format, LLM Scaling Paradox (compaction > summarization),
#           Morph Methods (prevention > compression), WP-4 Rank 5 candidate
#
# Design principles:
# 1. Compaction over summarization — verbatim paths, errors, metrics
# 2. Findings as structured entries, not prose paragraphs
# 3. Decisions captured as key:value, never as narrative
# 4. File changes as (path, action, summary) tuples

# --- ORIGINAL FORMAT (verbose) ---
# Typical real instance: ~400-600 tokens
original_example:
  header:
    report_id: "r-20260409-001"
    dispatch_id: "d-20260409-001"
    task_id: "T04"
    layer: "task"
    timestamp: "2026-04-09T11:15:00Z"
  status:
    state: "completed"
    progress_pct: 100
    started_at: "2026-04-09T10:30:00Z"
    completed_at: "2026-04-09T11:15:00Z"
    elapsed_seconds: 2700
  result:
    artifacts:
      - artifact_id: "a-impl-t04-001"
        path: "src/middleware/auth.ts"
        type: "source"
        summary: >
          JWT authentication middleware for Express.js. Validates tokens from
          Authorization header using jsonwebtoken library. Extracts and verifies
          JWT against JWT_SECRET env var, attaches decoded user object to req.user.
          Handles three error cases: expired tokens (401), malformed tokens (400),
          and missing Authorization header (401). Exports authenticateToken function.
      - artifact_id: "a-impl-t04-002"
        path: "src/middleware/index.ts"
        type: "source"
        summary: >
          Updated middleware barrel file to export the new authenticateToken
          middleware alongside existing requestLogger and errorHandler exports.
      - artifact_id: "a-test-t04-001"
        path: "tests/middleware/auth.test.ts"
        type: "test"
        summary: >
          Comprehensive test suite for auth middleware with 12 test cases covering:
          valid token extraction, expired token rejection, malformed token handling,
          missing header handling, invalid JWT_SECRET, and edge cases for
          Bearer prefix parsing. Uses jest.mock for jsonwebtoken.
    metrics:
      tests_passed: 12
      tests_failed: 0
      coverage_pct: 94.2
      quality_score: 92
      findings_by_severity:
        blocker: 0
        critical: 0
        major: 0
        minor: 2
        info: 1
  issues:
    blockers: []
    warnings:
      - "JWT_SECRET fallback to empty string if env var not set — should throw on startup"
      - "No rate limiting on auth failures — potential brute force vector"
    deferred:
      - "Refresh token rotation endpoint — not in scope for this task"

# --- LEAN FORMAT ---
# Same information, ~45-55% fewer tokens
lean_example:
  hdr: { id: "r-20260409-001", dispatch: "d-20260409-001", task: T04, layer: task }
  state: { s: completed, pct: 100, elapsed: 2700 }
  artifacts:
    - { path: "src/middleware/auth.ts", type: source, delta: "JWT auth middleware — validates token, attaches req.user, handles 401/400" }
    - { path: "src/middleware/index.ts", type: source, delta: "added authenticateToken export" }
    - { path: "tests/middleware/auth.test.ts", type: test, delta: "12 tests: valid/expired/malformed/missing/edge cases" }
  metrics: { pass: 12, fail: 0, cov: 94.2, quality: 92, findings: {B:0,C:0,M:0,m:2,i:1} }
  issues:
    blockers: []
    warnings:
      - "JWT_SECRET fallback to empty string — should throw on startup"
      - "no rate limit on auth failures"
    deferred: ["refresh token rotation — out of scope"]
  decisions: []

# --- FORMAT SPECIFICATION ---
lean_format_spec:
  hdr:
    description: "Report envelope — fixed keys"
    fields: { id: "report UUID", dispatch: "original dispatch id", task: "task id", layer: "task|wave|stage" }
  state:
    description: "Execution state — abbreviated keys"
    fields: { s: "completed|failed|escalated", pct: "0-100", elapsed: "seconds" }
  artifacts:
    description: "Produced files. delta = what changed (verbatim, ≤15 words). NEVER paraphrase file paths."
    per_entry:
      path: "verbatim filesystem path"
      type: "source|test|document|report|config"
      delta: "≤15 words describing what was created/changed"
    max_entries: 10
  metrics:
    description: "Numeric-only. Findings abbreviated: B=blocker, C=critical, M=major, m=minor, i=info"
    fields: { pass: int, fail: int, cov: float, quality: float, findings: "severity:count map" }
  issues:
    description: "Structured issue lists. Each entry ≤15 words."
    fields:
      blockers: "items preventing completion"
      warnings: "non-fatal concerns for upstream awareness"
      deferred: "explicitly postponed items with reason"
  decisions:
    description: "Key decisions made during execution. Each as {what, why, alternative_considered}."
    per_entry:
      what: "the decision (≤10 words)"
      why: "rationale (≤10 words)"
      alt: "rejected alternative (≤8 words, optional)"
    max_entries: 5

# --- COMPACTION RULES ---
compaction_rules:
  - rule: "NEVER paraphrase file paths, error messages, metric values, or commit hashes"
    source: "LLM Scaling Paradox — Knowledge Overwriting risk"
  - rule: "Use → for cause/effect in delta and decision fields"
    example: "expired token → 401"
  - rule: "Abbreviate severity keys: B/C/M/m/i"
    source: "GCC compact notation"
  - rule: "Omit zero-value optional fields (don't write 'fail: 0' unless relevant)"
  - rule: "Findings as structured entries, never prose paragraphs"
    source: "Morph — compaction 98% accuracy vs. summarization 37% retention"
  - rule: "Each artifact delta must name the concrete change, not describe the file's purpose"
    good: "added authenticateToken export"
    bad: "Updated middleware barrel file to export the new authenticateToken middleware"

# --- COMPRESSION RULES ---
# Deterministic drop/preserve lists for StatusReport compaction.
# Mirrors lean-dispatch.yaml compression_rules for consistency.
compression_rules:
  preserve_list:
    - file_paths
    - error_messages_verbatim
    - metric_values
    - commit_hashes
    - finding_ids
    - task_ids
    - artifact_references
    - version_strings
    - delta_descriptions
  drop_list:
    - filler_phrases         # "I think", "it seems", "basically"
    - hedging_language        # "might", "could possibly", "it appears"
    - pleasantries            # "Great question", "Happy to help"
    - redundant_narration     # "Let me explain", "As you can see"
    - meta_commentary         # "I'm now going to", "The next step is"
    - apologies               # "Sorry for the confusion"
    - progress_narration      # "making good progress", "working on"
    - obvious_acknowledgments # "understood", "got it", "will do"
    - tool_call_echoing       # "I just ran the grep tool"
  intensity_tiers:
    minimal:
      description: "Drop only filler and pleasantries"
      active_drops: [filler_phrases, pleasantries, apologies]
    standard:
      description: "Drop filler, hedging, narration"
      active_drops: [filler_phrases, hedging_language, pleasantries, redundant_narration, apologies, progress_narration, obvious_acknowledgments]
    aggressive:
      description: "Drop all non-essential text"
      active_drops: [filler_phrases, hedging_language, pleasantries, redundant_narration, meta_commentary, apologies, progress_narration, obvious_acknowledgments, tool_call_echoing]
  default_intensity: standard
  # v7.2.0 (C-002 mirror, source: caveman/SKILL.md "## Auto-Clarity") — bypass list.
  # Mirrors lean-dispatch.yaml#compression_rules.bypass_conditions verbatim so
  # the L3→L2 (status report) and L2→L3 (dispatch) sides of the channel agree
  # on which content classes are NEVER compressed. P6-safe (nested, not new
  # top-level key in the rendered report payload).
  bypass_conditions:
    - security_warning
    - destructive_operation
    - multi_step_sequence_with_order_dependency
    - repeated_user_question
  bypass_default_active: true

# --- RESULT STATUS PROTOCOL ---
# Typed status enum for deterministic routing. Replaces free-form state interpretation.
result_status_spec:
  enum: [DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT, BLOCKED]
  field_name: "rs"
  routing_table:
    DONE:
      meaning: "Task completed, all AC met, no issues"
      routing_action: "proceed"
      p4_mapping: "N/A"
    DONE_WITH_CONCERNS:
      meaning: "Task completed, AC met, but non-blocking issues noted in warnings"
      routing_action: "proceed, log warnings for upstream gate"
      p4_mapping: "N/A"
    NEEDS_CONTEXT:
      meaning: "Task blocked on missing information from predecessor or environment"
      routing_action: "provide context + retry (count against max_iterations)"
      p4_mapping: "retry"
    BLOCKED:
      meaning: "Task cannot proceed — requires escalation"
      routing_action: "escalate to L2 Wave → L1 Stage"
      p4_mapping: "escalate"

# --- Aggregation Compression Formats ---
# Used when combining multiple reports into a higher-level summary.

aggregation_formats:

  wave_summary:
    description: "Compress N task reports into a single wave-level summary"
    format: |
      wave: {wave_id}
      tasks: {completed}/{total}
      state: {DONE|DONE_WITH_CONCERNS|BLOCKED}
      artifacts:
        - {path} → {delta}  # one line per artifact, merged from tasks
      metrics:
        tests: {total_passed}/{total_run}
        coverage: {min_coverage}%
        findings: B:{sum_blockers} C:{sum_critical} M:{sum_major}
      issues:  # only if state != DONE
        - {task_id}: {one-line issue summary}
    rules:
      - Merge artifact lists, deduplicate paths
      - Sum numeric metrics across tasks
      - Use minimum coverage as wave coverage
      - Findings sum by severity across all tasks
      - Only surface issues for non-DONE tasks
      - "Max tokens: 200 per wave summary"
    intensity: aggressive  # wave summaries always use aggressive compression

  stage_summary:
    description: "Compress N wave summaries into a single stage-level summary"
    format: |
      stage: {stage_id}
      waves: {completed}/{total}
      state: {PASS|FAIL|CONVERGING}
      gate:
        composite: {score}
        threshold: {threshold}
        round: {current}/{max}
      key_artifacts:  # top 5 most significant
        - {path} → {delta}
      metrics:
        tests: {total_passed}/{total_run}
        coverage: {pct}%
        findings: B:{n} C:{n} M:{n}
      blockers:  # only if state == FAIL
        - {wave_id}: {one-line blocker}
    rules:
      - Aggregate wave metrics into stage totals
      - Include gate verdict with composite score
      - Only list top 5 artifacts by significance (most changed / new files)
      - Blockers listed only for FAIL state
      - "Max tokens: 150 per stage summary"
    intensity: aggressive

# Tool-output truncation manifest (v7.0.1+, per .local/research/adr/v7-ADR-002-tool-output-truncation.md)
# Reports how many tool_use outputs were preserved verbatim vs. truncated, and
# the head/tail/placeholder policy applied. Producing layer is the L3 task agent;
# consuming layer is the L2 wave agent (which uses it to decide whether to refresh
# tool definitions). Block is APPENDED at the end of the file per the additive rule
# in v7-ADR-001 §2 (cache layout invariant) — new top-level keys MUST follow the
# previous last key (`aggregation_formats`), never be inserted between existing keys.
tool_results:
  policy:
    keep: 3                          # most-recent-N preserved verbatim
    exclude_tool_names: [Read]       # tools whose output is always preserved
    head_chars: 500
    tail_chars: 500
    placeholder_template: "[truncated {removed} chars]"
  summary:
    kept_count: 0                    # int — recorded by the runtime
    cleared_count: 0                 # int — recorded by the runtime
    cleared_at_round: null           # int | null

# Optional session reflections — v7.2.3 (P-03 reflective reflex writer; activates
# dormant substrate from v7.2.0 PR-C / C-007). The L3 task agent emits an
# ``learnings.entries`` list inside its status report; the L0 dispatcher's
# status-report consumer persists each entry via
# ``devolaflow.learnings.capture_session_reflection`` (auto-derives ``key`` when
# unset; runs ``dedup_learnings`` against existing entries for last-write-wins).
# Read-side already wired via v7.0.3 ADR-005 (``load_relevant_learnings`` accepts
# ``session_id``).
#
# Block is APPENDED at the end of the file per the additive rule — lean-report.yaml
# has NO ``layout_invariant:`` (only lean-dispatch.yaml carries the P6 invariant
# per `.cursor/rules/devola-flow-rules.mdc` Rule 6 and ADR-001).
learnings:
  description: "Optional list of session reflections to persist via capture_session_reflection."
  entries:
    - insight: "<short text — verbatim, ≤25 words>"
      files: ["<file1>", "<file2>"]    # optional; key auto-derives from files[0] when key omitted
      source: "observed | reasoning | external"
      confidence: 0.0                  # 0.0..1.0; default 0.7 when unset
      key: "<optional override>"       # default: f"{task_type}:{files[0] if files else 'session'}"
  rules:
    - rule: "Each entry must include `insight` and `source`; everything else has safe defaults"
    - rule: "Auto-derived key collisions are resolved last-write-wins via `dedup_learnings`"
      source: "C-007 / gstack /learn {type, key} contract"
    - rule: "Persisted via `devolaflow.learnings.capture_session_reflection` (no caller-side write needed)"
    - rule: "Block APPENDED at end of file — lean-report.yaml has no P6 cache-layout invariant"

# v8.0.0 (P-06) — Cycle Detection Middleware optional surface.
#
# When the L3 task agent uses `devolaflow.gate.cycle_detector.CycleDetector`
# inside its convergence loop, the resulting `CycleReport` MAY be surfaced
# in the StatusReport so upstream gates (L2 Wave / L1 Stage) can decide
# whether to inject a `MUST NOT repeat` reinforcement rule into the next
# round's dispatch via `devolaflow.gate.reinforcement.cycle_to_instruction`.
#
# Both fields are OPTIONAL — omitting them is the byte-identical pre-P-06
# behaviour. Block is APPENDED at end of file per the additive rule —
# lean-report.yaml has NO `layout_invariant:` (only lean-dispatch.yaml
# carries the P6 invariant per `.cursor/rules/devola-flow-rules.mdc`
# Rule 6 and ADR-001).
cycle_detected:
  description: "Optional bool — true iff a convergence-loop cycle was detected this round."
  type: bool
  default: false
  rules:
    - rule: "When true, `cycle_details` MUST be populated; consumers MUST NOT silently drop the signal (S-5)."
    - rule: "Producer: L3 task agent's `evaluate_gate(..., cycle_detector=...)` call."
    - rule: "Consumer: L2 Wave agent — converts the report into a ReinforcementRule via `cycle_to_instruction`."

cycle_details:
  description: "Optional structured payload carrying the verbatim CycleReport when cycle_detected=true."
  fields:
    cycle_type: "exact_match | fuzzy_match | edit_oscillation"
    severity: "blocker | critical | major | minor | info"
    similarity: 0.0                  # 0.0..1.0; 1.0 for exact_match, average Jaccard for fuzzy_match
    rationale: "<single-line summary suitable for GateVerdict.rationale>"
    evidence: ["<round N: signature=…>", "<round N+1: signature=…>"]
    repeated_signatures: ["<verbatim signature>"]   # length >= 1 when detected
    rounds: [N, N+1, ...]            # round_num list of the offending snapshots
    files: ["<path1>", "<path2>"]    # files touched by the cycle, sorted
    window_size: 3                   # echo of CycleDetector.window_size
    threshold: 0.8                   # echo of CycleDetector.similarity_threshold
  rules:
    - rule: "Field set mirrors `devolaflow.gate.models.CycleReport` verbatim per CO-2 (no paraphrasing)."
    - rule: "When omitted, consumers MUST treat as `cycle_detected=false` (S-5 — no silent fallback)."
    - rule: "Block APPENDED at end of file — lean-report.yaml has no P6 cache-layout invariant."
