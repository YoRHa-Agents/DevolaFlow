# -----------------------------------------------------------------------------
# Schema: harness-preflight
# Target: .local/.agent/active/<change-id>/harness_preflight.md   (OPTIONAL)
# Design ref: .local/tasks/add_harness_design/design.md §3.3
# Token budget: soft 800 / hard 1600 (Rule C-9)
# -----------------------------------------------------------------------------
# `harness_preflight.md` is the OPTIONAL harness pre-analysis artifact. Its
# PRESENCE in the change folder flags the change as harness-flagged
# (artifact-as-contract per A-1 P5 — NO dispatch schema field is added).
# Absence simply means the change is not harness-flagged: the linter emits
# zero findings and zero budget violations for a missing file.
# -----------------------------------------------------------------------------

design_reference: ".local/tasks/add_harness_design/design.md §3.3"
schema_name: harness-preflight
schema_version: 1
last_updated: "2026-08-27"
governing_rules: [S-2, S-5, C-3, C-9]

optional: true
presence_semantics: >
  Artifact-as-contract flag: the change is harness-flagged if and only if
  this file exists in the active change folder. No dispatch schema field
  mirrors the flag; downstream gates (capability review, archive existence
  check) key on file presence alone.

instance_path_template: ".local/.agent/active/<change-id>/harness_preflight.md"
archive_path_template: ".local/.agent/archive/<YYYY-MM-DD>-<change-id>/harness_preflight.md"
format: markdown_with_frontmatter

token_budget:
  soft: 800
  hard: 1600
  units: tokens
  enforcement:
    - lint: "python -m devolaflow.agent_workspace.lint <change-id>"
  on_soft_breach: warn
  on_hard_breach: fail_commit

frontmatter:
  required:
    - parent
    - schema_version
    - gap_report
    - axes_config
  fields:
    parent:
      type: string
      pattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
      description: "Parent change-id; MUST equal the active change folder name."
    schema_version:
      type: int
      enum: [1]
    gap_report:
      type: string
      description: >
        Repo- or change-relative path to the frozen before-snapshot JSON
        emitted by `python -m devolaflow.harness gap`
        (e.g. `evidence/harness_gap_before.json`). The lint resolves the
        path relative to the change folder first, then the repo root; the
        referenced file MUST exist. Absolute paths are forbidden (S-2).
    axes_config:
      type: string
      nullable: true
      description: >
        Path to the change-level custom-axes YAML (e.g. `harness_axes.yaml`),
        or null when only the six built-in coverage axes apply. When
        non-null the referenced file MUST exist (same change-folder-first,
        then repo-root resolution as gap_report).

body:
  required_sections:
    - heading: "# Harness Preflight"
      pattern: "^# Harness Preflight\\s*$"
    - heading: "## 1. Target Observation Surface"
      pattern: "^## 1\\. Target Observation Surface\\s*$"
    - heading: "## 2. Capability Mapping"
      pattern: "^## 2\\. Capability Mapping\\s*$"
    - heading: "## 3. Gap Inventory"
      pattern: "^## 3\\. Gap Inventory\\s*$"
    - heading: "## 4. Coverage Commitments"
      pattern: "^## 4\\. Coverage Commitments\\s*$"
    - heading: "## 5. Build Order"
      pattern: "^## 5\\. Build Order\\s*$"
  canonical_order:
    - "# Harness Preflight"
    - "## 1. Target Observation Surface"
    - "## 2. Capability Mapping"
    - "## 3. Gap Inventory"
    - "## 4. Coverage Commitments"
    - "## 5. Build Order"

section_2_capability_mapping:
  description: >
    Section 2 maps the change's target observation surface onto the six
    harness capability surfaces. Every surface gets one row/entry, even
    when the verdict is "not touched by this change".
  capability_surfaces:
    - telemetry
    - aggregator
    - evaluator
    - probe
    - proposal
    - capacity

section_3_gap_inventory:
  verbatim_source: gap_report
  rule: C-3
  description: >
    Section 3 MUST cite gap-report entries verbatim (C-3 verbatim
    extraction): axis ids, gap item strings, reasons, and metric values
    are copied byte-for-byte from the frozen gap_report JSON — never
    paraphrased or summarized.

section_4_coverage_axes:
  description: >
    Section 4 commits the change to advancing specific coverage axes.
    Axes default to the six built-ins; optional custom axes come from the
    change-level `axes_config` file (each custom axis MUST declare a
    falsifiable probe per design.md §3.2).
  builtin_axes:
    - observation
    - evaluation
    - probe
    - baseline
    - signal
    - loop-closure
  extension_source: axes_config

invariants:
  - "The artifact is OPTIONAL: a change folder without it is NOT harness-flagged and lints clean (zero findings, zero budget violations)."
  - "Presence of the file flags the change as harness-flagged — artifact-as-contract; no dispatch schema field carries the flag."
  - "Section 3 Gap Inventory MUST cite gap_report entries verbatim per C-3 (no paraphrase of paths, gap items, reasons, or metric values)."
  - "The five numbered body headings occur in exact canonical order with no extra numbered '## N.' sections."
  - "gap_report MUST reference an existing file, resolved change-folder-first then repo-root; a dangling reference is a hard lint finding (S-5)."
  - "A non-null axes_config MUST reference an existing file under the same resolution order."
  - "MUST NOT contain absolute filesystem paths."

example: |
  ---
  parent: harness-construction
  schema_version: 1
  gap_report: evidence/harness_gap_before.json
  axes_config: null
  ---

  # Harness Preflight

  ## 1. Target Observation Surface
  - L0/L1/L2 dispatch telemetry completeness for the change-driven loop.

  ## 2. Capability Mapping
  | Surface | Status |
  |---|---|
  | telemetry | PARTIAL |
  | aggregator | COVERED |
  | evaluator | COVERED |
  | probe | GAP |
  | proposal | COVERED |
  | capacity | PARTIAL |

  ## 3. Gap Inventory
  - axes[probe].gaps[0].item: "probe fixtures x model table combinations uncovered"
    reason: "no fixture exercises the frontier model tier"

  ## 4. Coverage Commitments
  - probe: GAP → COVERED (add frontier-tier fixture set)
  - observation: PARTIAL → COVERED (L1 wave telemetry events)

  ## 5. Build Order
  1. Observation points (infra)
  2. Probe fixtures (nodes)
  3. propose→apply audit trail (loop closure)
