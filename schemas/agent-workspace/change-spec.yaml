# -----------------------------------------------------------------------------
# Schema: change-spec
# Target: .local/.agent/active/<change-id>/spec.md
# Design ref: .local/research/v8.3.0_design.md §2.3
# Patch slot: v8.2.4 (PV04 — agent workspace schemas)
# Token budget: soft 1500 / hard 3000 (per Rule C-9)
# -----------------------------------------------------------------------------
# A `spec.md` is the operation spec for an in-flight change in OpenSpec delta
# format. Per Rule A-4 (M-004 ADR), the per-change spec is a DELTA relative to
# `.local/memory/specs/<delta_target>/spec.md` (the source-of-truth). The
# delta lists ADDED / MODIFIED / REMOVED Requirements; at archive time the
# delta is PROPOSED for merge into source-of-truth (NOT auto-applied — the
# archive_gate per W-3 / SI-3 must PASS first).
#
# Format: Markdown with YAML frontmatter. Heading enforcement happens here
# (declared contract) and in `src/devolaflow/agent_workspace/delta_parser.py`
# (runtime parser shipping in v8.2.5).
# -----------------------------------------------------------------------------

design_reference: .local/research/v8.3.0_design.md §2.3
schema_name: change-spec
schema_version: 1
last_updated: "2026-04-22"
governing_rules: [C-9, A-4]
adopted_from: openspec
external_reference: "https://github.com/Fission-AI/OpenSpec"

instance_path_template: ".local/.agent/active/<change-id>/spec.md"
archive_path_template: ".local/.agent/archive/<YYYY-MM-DD>-<change-id>/spec.md"
format: markdown_with_frontmatter
delta_format: openspec

token_budget:
  soft: 1500
  hard: 3000
  units: tokens
  enforcement:
    - lint:        "python -m devolaflow.agent_workspace.lint <change-id>  # ships v8.2.5"
    - line_count:  "wc -w <file>  # rough proxy: 1 token ≈ 0.75 words"
  on_soft_breach: warn
  on_hard_breach: fail_commit

frontmatter:
  required: [parent, delta_target, delta_kind]
  fields:
    parent:
      type: string
      description: "Parent change-id — MUST match the active change folder name."
      pattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    delta_target:
      type: string
      description: "Source-of-truth domain. MUST match a directory under .local/memory/specs/<domain>/ (or be a NEW domain, in which case the merger creates it)."
      pattern: "^[a-z0-9][a-z0-9_-]*$"
      examples: [agent_workspace, plugins, rules, learnings, gate, compressor]
    delta_kind:
      type: string
      enum: [lite, full]
      description: "Risk class — `lite` = single-author, low-risk (gate threshold 8.5); `full` = multi-author or high-risk (gate threshold 9.0). See design.md §1.3 archive gate."

# Markdown body contract — REQUIRED `## Purpose`, then 1+ delta sections.
# Per OpenSpec convention adopted in v8.3.0, the delta sections use these
# verbatim H2 headings. Heading enforcement is declared here; runtime
# verification ships with `delta_parser.parse_spec()` in v8.2.5.
body:
  required_sections:
    - heading: "# Operation Spec for <change-id>"
      pattern: "^# Operation Spec for [a-z0-9][a-z0-9.-]*[a-z0-9]\\s*$"
      description: "H1 — verbatim 'Operation Spec for ' prefix followed by the change-id."
    - heading: "## Purpose"
      pattern: "^## Purpose\\s*$"
      max_chars: 800
      description: "2–4 sentences naming what this change does to the existing system. Verbatim source for the change-report 'How' section (design.md §5.1)."

  delta_sections:
    description: |
      OpenSpec delta sections — at least ONE of the three (## ADDED Requirements,
      ## MODIFIED Requirements, ## REMOVED Requirements) MUST be present.
      Heading enforcement uses these EXACT verbatim strings (no embellishment;
      no trailing punctuation; capitalization MUST match for delta_parser.parse).
    at_least_one_required: true
    canonical_order: [ADDED, MODIFIED, REMOVED]
    variants:
      - id: ADDED
        heading: "## ADDED Requirements"
        pattern: "^## ADDED Requirements\\s*$"
        requirement_pattern: "^### Requirement: .+$"
        body_template: |
          ### Requirement: <Stable heading>
          The system MUST <RFC 2119 verb> <observable behavior>.

          #### Scenario: <when this applies>
          - GIVEN <precondition>
          - WHEN <trigger>
          - THEN <observable outcome>
        rfc_2119_verbs_required: true
        scenario_required: true
        description: "New requirements introduced by this change."

      - id: MODIFIED
        heading: "## MODIFIED Requirements"
        pattern: "^## MODIFIED Requirements\\s*$"
        requirement_pattern: "^### Requirement: .+$"
        body_template: |
          ### Requirement: <Existing heading from source-of-truth>
          The system <new behavior>.
          (Previously: <old behavior>)
        previously_marker_required: true
        description: "Existing requirements whose behavior is changed by this change. The `### Requirement:` heading MUST match a heading in `.local/memory/specs/<delta_target>/spec.md`."

      - id: REMOVED
        heading: "## REMOVED Requirements"
        pattern: "^## REMOVED Requirements\\s*$"
        requirement_pattern: "^### Requirement: .+$"
        body_template: |
          ### Requirement: <Existing heading>
          (Reason for removal.)
        reason_required: true
        description: "Requirements deprecated/removed by this change. The `### Requirement:` heading MUST match a heading in `.local/memory/specs/<delta_target>/spec.md`."

  rfc_2119:
    description: "Requirement bodies inside ADDED / MODIFIED sections SHOULD use RFC 2119 keywords."
    keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL]
    enforcement: lint_warn

  scenario_format:
    description: "Each Requirement under ADDED/MODIFIED MAY include one or more `#### Scenario:` blocks. Bullet body uses GIVEN/WHEN/THEN markers."
    pattern: "^#### Scenario: .+$"
    bullet_markers: [GIVEN, WHEN, THEN]
    bullet_pattern: "^- (GIVEN|WHEN|THEN) .+$"

# Lifecycle invariants
invariants:
  - "MUST be written at propose time and MAY be refined during IN_PROGRESS."
  - "MUST be copied byte-identical when archived (frozen state lives in `.local/.agent/archive/<date>-<id>/spec.md`)."
  - "Source-of-truth at `.local/memory/specs/<delta_target>/spec.md` is updated ONLY at archive time AFTER the gate has PASSED (per A-4 / W-3 SI-3)."
  - "Mergeability check (v8.2.5 reporter module) MUST pass before delta merge into source-of-truth."
  - "MUST NOT contain absolute filesystem paths (S-2 / SF-5)."
  - "External references (e.g. OpenSpec, NineS, ui-pro) MUST use canonical GitHub URLs (S-7 / SF-6)."

# Worked example — illustrative only.
example: |
  ---
  parent: v8.3.0-pv04-agent-workspace-schemas
  delta_target: agent_workspace
  delta_kind: lite
  ---

  # Operation Spec for v8.3.0-pv04-agent-workspace-schemas

  ## Purpose
  Introduce 9 YAML schemas under schemas/agent-workspace/ that declare the
  artifact contracts for `.local/.agent/active/`, `.local/.agent/handoff/`,
  `.local/.agent/archive/`, and `.local/memory/specs/`. No Python code
  consumes these schemas yet — that lands in v8.2.5.

  ## ADDED Requirements

  ### Requirement: Per-artifact token budgets are declared in schema
  The system MUST declare soft and hard token budgets in every per-artifact
  schema (change-goal, change-acceptance, change-spec, change-tasks,
  change-status, owned-files, handoff-envelope) per Rule C-9.

  #### Scenario: Loading a schema for budget enforcement
  - GIVEN an active change at `.local/.agent/active/<id>/`
  - WHEN `python -m devolaflow.agent_workspace.lint <id>` runs
  - THEN each artifact's actual token count is compared against the schema's
    `token_budget.soft` (warn) and `token_budget.hard` (fail) values.

  ### Requirement: Handoff envelopes carry a monotonic seq counter
  The system MUST embed a `seq: <int>` field starting at 1 in every handoff
  envelope. Once an envelope file exists at sequence N, the next message MUST
  be authored at sequence N+1 — never overwrite (S-9).

  ## MODIFIED Requirements

  (None — this PV is purely additive.)

  ## REMOVED Requirements

  (None — this PV is purely additive.)
