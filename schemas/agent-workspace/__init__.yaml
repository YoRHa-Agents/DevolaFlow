# -----------------------------------------------------------------------------
# Agent Workspace Schemas — Index
# -----------------------------------------------------------------------------
# Index of the 13 schema files that govern the agent workspace artifacts under
# `.local/.agent/` and `.local/memory/specs/`. Source of truth: every schema
# listed here MUST exist as a file in this directory.
#
# Design references:
#   - .local/research/v8.3.0_design.md §2 (schema designs)
#   - .local/research/v8.3.0_patch_plan.md §v8.2.4 (patch scope)
#   - .local/research/v8.3.0_gap_analysis.md §2.1 C-002 (gap)
#   - .local/tasks/plan_mode_full_update/design/checklist_iteration_design.md
#     §§4-9 (v16 checklist iteration artifact contracts)
#   - .local/research/v17.2.0_change_entrance_design.md (entrance.md artifact)
#
# Patch slot: v17.0.0 R1 — legacy dual-track removal (G17-A2)
# History: v8.2.4 introduced the registry; v16.0.0 M1 extended it additively;
# v17.0.0 removed the deprecated legacy acceptance/tasks schemas at their
# declared removal_target (replacement: change-checklist); v17.2.0 added
# change-entrance (agent onboarding entry point); v17.3.0 added
# pathfinder-report (look-ahead reconnaissance evidence).
# -----------------------------------------------------------------------------

design_reference: .local/research/v8.3.0_design.md §2
iteration_design_reference: .local/tasks/plan_mode_full_update/design/checklist_iteration_design.md §§4-9
schema_name: agent-workspace-index
schema_version: 1
last_updated: "2026-08-26"
release: "17.0.0"
milestone: R1
patch_slot: "v17.0.0 R1"
gap_ids: [C-002, M-003, M-005, G17-A2]
governing_rules: [S-8, S-9, C-9, A-4]

# 13 schema files declaring the artifact contracts. Registry entries MUST be
# unique and resolve every non-index YAML file in this directory.
schemas:
  - id: change-goal
    file: change-goal.yaml
    target_path_template: ".local/.agent/active/<change-id>/goal.md"
    archive_path_template: ".local/.agent/archive/<YYYY-MM-DD>-<change-id>/goal.md"
    format: markdown_with_frontmatter
    summary: "Numbered goal contract for an in-flight change — each G<n> goal links to the same-numbered checklist.md partition."
    token_budget: { soft: 200, hard: 400, units: tokens }

  - id: change-spec
    file: change-spec.yaml
    target_path_template: ".local/.agent/active/<change-id>/spec.md"
    archive_path_template: ".local/.agent/archive/<YYYY-MM-DD>-<change-id>/spec.md"
    format: markdown_with_frontmatter
    delta_format: openspec
    summary: "Operation spec in OpenSpec delta format — ADDED/MODIFIED/REMOVED Requirements relative to source-of-truth."
    token_budget: { soft: 1500, hard: 3000, units: tokens }

  - id: change-checklist
    file: change-checklist.yaml
    target_path_template: ".local/.agent/active/<change-id>/checklist.md"
    archive_path_template: ".local/.agent/archive/<YYYY-MM-DD>-<change-id>/checklist.md"
    format: markdown_with_frontmatter
    summary: "Evidence-backed user-and-agent acceptance contract partitioned by numbered goals, with priorities and user-controlled reversion."
    token_budget: { soft: 1200, hard: 2400, units: tokens }

  - id: change-stage
    file: change-stage.yaml
    target_path_template: ".local/.agent/active/<change-id>/stage.md"
    archive_path_template: ".local/.agent/archive/<YYYY-MM-DD>-<change-id>/stage.md"
    format: markdown_with_frontmatter
    summary: "Bounded checklist-round controller recording priority settings, round history, gate trends, and the next-round plan."
    token_budget: { soft: 400, hard: 800, units: tokens }

  - id: change-preflight
    file: change-preflight.yaml
    target_path_template: ".local/.agent/active/<change-id>/preflight.md"
    archive_path_template: ".local/.agent/archive/<YYYY-MM-DD>-<change-id>/preflight.md"
    format: markdown_with_frontmatter
    summary: "User-signed pre-execution contract for project configuration, stop cards, permitted stops, and the latest progress snapshot."
    token_budget: { soft: 600, hard: 1200, units: tokens }

  - id: change-status
    file: change-status.yaml
    target_path_template: ".local/.agent/active/<change-id>/STATUS.yaml"
    archive_path_template: ".local/.agent/archive/<YYYY-MM-DD>-<change-id>/STATUS.yaml"
    format: yaml
    summary: "Machine-readable FSM and checklist-round progress block — state, checklist counts, current round, and next blockers."
    token_budget: { soft: 150, hard: 300, units: tokens }

  - id: owned-files
    file: owned-files.yaml
    target_path_template: ".local/.agent/active/<change-id>/owned_files.txt"
    archive_path_template: ".local/.agent/archive/<YYYY-MM-DD>-<change-id>/owned_files.txt"
    format: plaintext_lines
    summary: "File ownership manifest — one repo-relative path per line; max 6 paths per task per Wave constraint."
    token_budget: { soft: 50, hard: 100, units: tokens }

  - id: handoff-envelope
    file: handoff-envelope.yaml
    target_path_template: ".local/.agent/handoff/<from>__<to>__<change-id>__<seq>.yaml"
    archive_path_template: ".local/.agent/archive/<YYYY-MM-DD>-<change-id>/handoff_chain.yaml"
    format: yaml
    discriminated_union: true
    append_only: true
    summary: "Cross-agent handoff envelope with discriminated envelope_kind union (TaskDispatch/StatusReport/EscalationEvent)."
    token_budget: { soft: 600, hard: 1200, units: tokens }

  - id: agent-config
    file: agent-config.yaml
    target_path_template: ".local/.agent/config.yaml"
    archive_path_template: null
    format: yaml
    summary: "Per-project DevolaFlow config — schema + context + per-artifact rules + mode (lite|full) + plugin_runtime."
    token_budget: { soft: 400, hard: 800, units: tokens }

  - id: source-of-truth-spec
    file: source-of-truth-spec.yaml
    target_path_template: ".local/memory/specs/<domain>/spec.md"
    archive_path_template: null
    format: markdown_with_frontmatter
    summary: "Source-of-truth spec for current system behavior in a domain — mutated only at archive time after gate PASS (A-4)."
    token_budget: { soft: 2000, hard: 4000, units: tokens }

  - id: harness-preflight
    file: harness-preflight.yaml
    target_path_template: ".local/.agent/active/<change-id>/harness_preflight.md"
    archive_path_template: ".local/.agent/archive/<YYYY-MM-DD>-<change-id>/harness_preflight.md"
    format: markdown_with_frontmatter
    optional: true
    summary: "OPTIONAL harness pre-analysis artifact — presence flags the change as harness-flagged (artifact-as-contract; no dispatch schema field)."
    token_budget: { soft: 800, hard: 1600, units: tokens }

  - id: change-entrance
    file: change-entrance.yaml
    target_path_template: ".local/.agent/active/<change-id>/entrance.md"
    archive_path_template: ".local/.agent/archive/<YYYY-MM-DD>-<change-id>/entrance.md"
    format: markdown_with_frontmatter
    summary: "Agent onboarding entry point — static scenario router to the other artifacts; never mirrors dynamic state (missing pre-v17.2 folders lint as WARN until backfilled)."
    token_budget: { soft: 400, hard: 800, units: tokens }

  - id: pathfinder-report
    file: pathfinder-report.yaml
    target_path_template: ".local/.agent/active/<change-id>/pathfinder_report.md"
    archive_path_template: ".local/.agent/archive/<YYYY-MM-DD>-<change-id>/pathfinder_report.md"
    format: markdown_with_frontmatter
    optional: true
    summary: "OPTIONAL read-only Pathfinder look-ahead report — records infrastructure gaps and bounded remediation handoffs."
    token_budget: { soft: 800, hard: 1600, units: tokens }

# Cross-references — each rule below cites the section of design.md that
# motivates it. The verbatim rule text lives in `.rules/` and the compiled
# adapter copies (`.cursor/rules/repo-governance.mdc`, `AGENTS.md`).
cross_references:
  rules_layer:
    - id: S-8
      description: "No writes outside owned_files (active change folder)"
      design_ref: ".local/research/v8.3.0_design.md §3.1"
    - id: S-9
      description: "Handoff envelopes are append-only"
      design_ref: ".local/research/v8.3.0_design.md §3.2"
    - id: C-9
      description: "Lightweight agent workspace artifacts (token budgets)"
      design_ref: ".local/research/v8.3.0_design.md §3.3"
    - id: A-4
      description: "Source-of-truth spec location (M-004 ADR)"
      design_ref: ".local/research/v8.3.0_design.md §3.4"
  cache_layout:
    note: >
      v8.2.4 (this patch) does NOT modify schemas/lean-dispatch.yaml. The cache
      layout v4 → v5 transition (appending `change_context` at position 16)
      lands in v8.2.5 alongside the Python API that consumes it.
  external:
    - source: openspec
      url: "https://github.com/Fission-AI/OpenSpec"
      adopted_pattern: "Delta spec format (## ADDED / ## MODIFIED / ## REMOVED Requirements)"
      adapted_in: change-spec
