# -----------------------------------------------------------------------------
# Schema: change-tasks
# Target: .local/.agent/active/<change-id>/tasks.md
# Design ref: .local/research/v8.3.0_design.md §2.4
# Patch slot: v8.2.4 (PV04 — agent workspace schemas)
# Token budget: soft 800 / hard 1500 (per Rule C-9)
# -----------------------------------------------------------------------------
# A `tasks.md` is the implementation checklist for an in-flight change. It is
# the L0/L2 dispatch loop's source-of-truth for "what's left to do". Each task
# is a `- [ ]` checkbox that flips to `- [x]` when the L3 agent reports DONE.
# Tasks are organized into hierarchical groups (`## 1. Group`, `## 2. Group`,
# ...) with numbered task ids (1.1, 1.2, 2.1, ...).
#
# Format: Markdown with YAML frontmatter.
# -----------------------------------------------------------------------------

design_reference: .local/research/v8.3.0_design.md §2.4
schema_name: change-tasks
schema_version: 1
last_updated: "2026-04-22"
governing_rules: [C-9]

instance_path_template: ".local/.agent/active/<change-id>/tasks.md"
archive_path_template: ".local/.agent/archive/<YYYY-MM-DD>-<change-id>/tasks.md"
format: markdown_with_frontmatter

token_budget:
  soft: 800
  hard: 1500
  units: tokens
  enforcement:
    - lint:        "python -m devolaflow.agent_workspace.lint <change-id>  # ships v8.2.5"
    - line_count:  "wc -w <file>"
  on_soft_breach: warn
  on_hard_breach: fail_commit

frontmatter:
  required: [parent, total_tasks, checked]
  fields:
    parent:
      type: string
      description: "Parent change-id — MUST match the active change folder name."
      pattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    total_tasks:
      type: int
      minimum: 1
      maximum: 50
      description: "Total count of `- [ ]` or `- [x]` lines anywhere in the body."
    checked:
      type: int
      minimum: 0
      description: "Count of `- [x]` lines. MUST be ≤ total_tasks. Re-derived on every save."

body:
  required_sections:
    - heading: "# Tasks"
      pattern: "^# Tasks\\s*$"
      description: "H1 — verbatim 'Tasks' (no embellishment)."

  group_section:
    description: "Logical groups — one or more H2 sections with format `## <N>. <Group title>` (numeric prefix is REQUIRED for stable task-id derivation)."
    pattern: "^## \\d+\\. .+$"
    min_groups: 1
    max_groups: 9
    body_template: |
      ## 1. <Logical group>
      - [ ] 1.1 <task — < 30 min, owned files <= 6>
      - [ ] 1.2 <task>

  task_bullet:
    description: "Each task line MUST be `- [ ] N.M ...` or `- [x] N.M ...` where N matches the parent group's numeric prefix and M is a 1-indexed sequence within that group."
    pattern: "^- \\[[ x]\\] \\d+\\.\\d+ .+$"

  per_task_constraints:
    description: "Per-task constraints aligned with Wave decomposition limits."
    max_owned_files_per_task: 6      # see schemas/agent-workspace/owned-files.yaml
    max_minutes_per_task: 30
    enforcement: human_authoring     # not lint-enforced — author asserts

# Lifecycle invariants
invariants:
  - "MUST be written at propose time (initial empty checklist OK; refined during dispatch)."
  - "Task checkbox state MAY transition `[ ]` → `[x]` after L3 reports DONE for that task."
  - "Task checkbox state MUST NOT transition `[x]` → `[ ]` (regression marker — author a follow-up task or change instead)."
  - "checked frontmatter field MUST equal the count of `- [x] ` lines after every edit (re-derive on save)."
  - "When ALL tasks are `[x]` (checked == total_tasks), the change MAY transition IN_PROGRESS → VERIFYING."
  - "MUST be copied byte-identical when archived (with all checkboxes ticked)."
  - "MUST NOT contain absolute filesystem paths (S-2 / SF-5)."

example: |
  ---
  parent: add-dark-mode
  total_tasks: 5
  checked: 0
  ---

  # Tasks

  ## 1. Theme infrastructure
  - [ ] 1.1 Define `--devola-bg-dark` / `--devola-fg-dark` CSS custom properties
  - [ ] 1.2 Wire CSS palette switch behind `[data-theme="dark"]` selector

  ## 2. Toggle UI
  - [ ] 2.1 Add toggle button to shared/nav.js with bilingual label
  - [ ] 2.2 Persist choice via localStorage key `devola.theme`

  ## 3. Tests + docs
  - [ ] 3.1 Add visual diff test in tests/test_dark_mode.py + bilingual i18n entries
