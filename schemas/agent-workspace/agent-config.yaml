# -----------------------------------------------------------------------------
# Schema: agent-config
# Target: .local/.agent/config.yaml
# Design ref: .local/research/v8.3.0_design.md §2.8
# Patch slot: v8.2.4 (PV04 — agent workspace schemas)
# Token budget: soft 400 / hard 800 (per Rule C-9)
# -----------------------------------------------------------------------------
# `.local/.agent/config.yaml` is the per-project DevolaFlow agent config. It
# is read at L0/L1/L2/L3 boot and used to decide:
#
#   - which workflow `schema` to invoke when /devola:propose runs
#   - what project-specific `context` to inject into all artifacts
#   - what per-artifact `rules` (token budget, format hints) to apply
#   - what `mode` (lite | full) controls pre-commit gate strictness
#   - whether current plugins (codegraph, si-chip, ui-pro) are only suggested
#     or explicitly auto-installed on demand (`plugin_runtime`)
#
# Format: pure YAML. No frontmatter. No prose body.
# -----------------------------------------------------------------------------

design_reference: .local/research/v8.3.0_design.md §2.8
schema_name: agent-config
schema_version: 1
last_updated: "2026-08-25"
governing_rules: [C-9]

instance_path_template: ".local/.agent/config.yaml"
archive_path_template: null   # config is per-project, not per-change — never archived
format: yaml

token_budget:
  soft: 400
  hard: 800
  units: tokens
  enforcement:
    - lint:        "python -m devolaflow.agent_workspace.lint --config  # ships v8.2.5"
    - line_count:  "wc -w <file>"
  on_soft_breach: warn
  on_hard_breach: fail_commit

instance_top_level_required:
  - schema_version
  - schema
  - context
  - rules
  - mode
  - plugin_runtime

fields:
  schema_version:
    type: int
    enum: [1]
    description: "Schema version pin — bump on incompatible changes only."

  schema:
    type: string
    enum: [change-driven]
    default: change-driven
    description: "Default workflow template invoked by /devola:propose. v8.3.0 supports `change-driven` only; future versions may add more."

  context:
    type: string
    description: |
      Project-specific context injected into all artifacts (goal/spec/tasks).
      Free-form prose, ≤ 800 chars. Typical content: tech stack, conventions,
      house rules. Example: "Tech stack: Python 3.11+, pytest, ruff. House
      rules: 80% coverage floor, no absolute paths, branches required for PRs."
    max_chars: 800

  rules:
    type: object
    description: "Per-artifact-kind rule lists. Each key is one of the agent-workspace artifact ids; each value is a list of free-form ≤ 80-char rule strings."
    children:
      goal:
        type: list
        item_type: string
        max_items: 10
        description: "Per-instance authoring rules for goal.md (in addition to schema/change-goal.yaml constraints)."
      acceptance:
        type: list
        item_type: string
        max_items: 10
        description: "Per-instance authoring rules for acceptance.md."
      spec:
        type: list
        item_type: string
        max_items: 10
        description: "Per-instance authoring rules for spec.md."
      tasks:
        type: list
        item_type: string
        max_items: 10
        description: "Per-instance authoring rules for tasks.md."

  mode:
    type: string
    enum: [lite, full]
    default: lite
    description: |
      Pre-commit gate strictness selector.
      lite — single-author, low-risk. Pre-commit runs steps 1–3 only (tests / lint / format).
      full — multi-author or high-risk. Pre-commit runs all 7 steps per W-9 SI-10
      (core tests / lint / format / version / harness / cursor-skill /
      iteration-delta gate).

  plugin_runtime:
    type: object
    description: "Per-project overrides for the current probe-and-suggest plugin runtime."
    children:
      auto_install:
        type: bool
        default: false
        description: "When false, missing plugins are probed and suggested without network mutation. When explicitly true, eligible missing plugins auto-install on demand."
      prefer_local_fallback:
        type: bool
        default: true
        description: "When true and the plugin's local_fallback_path exists (filled in via env var or prefs.md), use editable install at that path before going over the network."

# Lifecycle invariants
invariants:
  - "MUST be authored at repo-init time (created by `python scripts/install.sh` and updated as the project evolves)."
  - "MUST be re-read at every L0 boot — agents MUST NOT cache config across sessions."
  - "Editing this file MUST be done as an explicit change (i.e. through /devola:propose) to keep the rules-coverage report accurate."
  - "MUST NOT contain absolute filesystem paths (S-2 / SF-5)."
  - "External plugin URLs (e.g. Codegraph, Si-Chip, ui-pro) MUST be canonical GitHub URLs (S-7 / SF-6)."

example: |
  schema_version: 1
  schema: change-driven
  context: |
    Tech stack: Python 3.11+, pytest, ruff format, ruff lint.
    Conventions: relative paths only; canonical URLs for external tools;
    80% coverage floor; SI-10 7/7 PASS before every commit.
  rules:
    goal:
      - "Stay under 200 tokens"
      - "Single intent per change"
    acceptance:
      - "Each AC must be a verifiable command or metric"
    spec:
      - "Use OpenSpec delta sections — ADDED/MODIFIED/REMOVED"
      - "RFC 2119 keywords for requirement strength"
    tasks:
      - "Each task must be < 30 min and own ≤ 6 files"
  mode: lite
  plugin_runtime:
    auto_install: false
    prefer_local_fallback: true
