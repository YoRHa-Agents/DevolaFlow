#      `change_context` (v8.3.0 PV-05 -> pos 16).
#
# D3 — NEST-vs-APPEND DECISION RULE. When introducing a new dispatch
#      behaviour, authors choose between NEST under an existing canonical
#      key and APPEND a new canonical key. Bias toward NEST whenever the
#      data shape allows; APPEND is reserved for orthogonal payload that
#      does not nest naturally. Historical NEST decisions: `gate.token_budget`
#      (v8.0.0 P-03), `pred[*].compact_directive` (v8.0.0 P-02),
#      `pred[*].summary_mode` / `summary_max_tokens` (v7.0.2+ ADR-003 §2.5),
#      `compression_rules.bypass_conditions` (v7.2.0 C-002),
#      `compression_rules.data_envelope_required` (v7.2.4 P-02).
#
# D4 — MULTI-BASELINE BYTE TEST. CI enforcement via
#      `tests/test_layout_invariant_multi_baseline.py` pins all 10 currently
#      committed Tier-A baselines (v7.0.0 / v7.3.0 / v8.3.0 / v8.4.0 /
#      v9.2.0 / v9.3.0 / v9.7.0 / v10.2.0 / v12.0.0, with the v8.0.0 P-10
#      generation covered by the v8.3.0 prefix test). Any drift fails CI.
#
# D6 — This block (the YAML data structure below) is byte-identical to its
#      v8.3.0 PV-05 / v8.4.0 / v8.4.1 form. ONLY doc comments were added
#      in v9.0.0 PV-02 — `version` STAYS AT 5 and `canonical_order`
#      STAYS AT LENGTH 16 with the same 16 keys in the same order
#      (I-8 invariant per .cursor/rules/repo-governance.mdc A-2).
#
# v9.1.4 PV-04 — NEST extension inside change_context (A-2.3 nest-vs-append).
# Three new OPTIONAL sub-fields added to change_context: prior_feedback_themes /
# memory_case_hits / source_of_truth_excerpt. canonical_order length STAYS AT 16
# and version STAYS AT 5 — this is a NEST, not an APPEND (D3 decision matrix:
# new fields are independently optional and modify how an existing block is
# interpreted — NEST). The v8.3.0 PV-05 + v8.4.0 multi-baseline byte tests in
# tests/test_layout_invariant_multi_baseline.py CONTINUE TO PASS without
# modification (the new sub-fields are absent from the historical baselines —
# their absence is canonical per the OPTIONAL contract). PV-04 also pins a
# v9.2.0 baseline byte-identical to v8.4.0 (mid-cycle witness that NEST
# preserved the layout — the witness fixture lives at
# benchmarks/devolaflow_context/baselines/layout_invariant_v9.2.0.yaml).
#
# v9.7.0 (PV-02 — Performance Overhaul #2; sources: .local/research/v9.7.0_
# gap_analysis.md §3 + .local/research/v9.7.0_perf_research.md §2 +
# .local/research/v10.0.0_cycle_plan.md §3 v9.7.0 PV-02): canonical_order
# grew 16 → 17 by APPENDING `predecessor_dedup_ledger` AT THE END (after
# `change_context`) per A-2.2 append-only rule. Version bumped 5 → 6 to
# mark the schema generation. ZERO existing keys reordered; the v7.0.0
# golden baseline byte-comparison AND the v7.3.0 / v8.0.0-P-08 /
# v8.0.0-P-10 / v8.3.0-PV-05 / v8.4.0 / v9.2.0 / v9.3.0 multi-baseline
# byte-tests ALL CONTINUE TO PASS after this bump, proving additivity
# holds across SIX schema generations (v7.2.6 → v8.0.0-P-08 → v8.0.0-P-10
# → v8.3.0-PV-05 → [stable through v9.6] → v9.7.0-PV-02). The new
# `predecessor_dedup_ledger` field carries hash-based dedup state for
# round-N>1 convergence dispatches per A-2.3 (APPEND, not NEST: the
# data shape is orthogonal — it cross-references multiple `pred[*]`
# entries and a previous round's ledger, which is not naturally a
# sub-field of any single existing canonical key). The 9th baseline
# (`benchmarks/devolaflow_context/baselines/layout_invariant_v9.7.0.yaml`)
# pins the schema-v6 17-element canonical_order with the ledger
# populated (round 2 dedup demo). Field is OPTIONAL — round 1
