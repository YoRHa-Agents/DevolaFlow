#
# v8.3.0 (PV-05 / v8.2.5, sources: .local/research/v8.3.0_design.md §9 +
# .local/research/v8.3.0_patch_plan.md §v8.2.5 + .local/research/v8.3.0_
# gap_analysis.md §2.3 M-006): canonical_order grew 15 → 16 by APPENDING
# `change_context` AT THE END (after `acceptance_criteria_v2`) per
# ADR-001 §2 additive rule. Version bumped 4 → 5 to mark the schema
# generation. ZERO existing keys reordered; the v7.0.0 golden baseline
# byte-comparison AND the v7.3.0 baseline AND the v8.0.0 P-08 / P-10
# baselines ALL CONTINUE TO PASS after this bump, proving additivity
# holds across FOUR schema generations (v7.2.6 → v8.0.0-P-08 → v8.0.0-P-10
# → v8.3.0-PV05). The new `change_context` field binds a dispatch payload
