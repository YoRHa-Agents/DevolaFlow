# Lean TaskDispatch Template
# Based on: GCC ~50-token-per-entry format, LLM Scaling Paradox (compaction > summarization),
#           Morph Methods (prevention > compression), WP-4 Rank 5 candidate
#
# Design principles:
# 1. Compaction over summarization — verbatim paths, IDs, criteria (zero hallucination risk)
# 2. ~50 tokens per entry target for structured fields
# 3. Key-value pairs, no prose descriptions where enumeration suffices
# 4. Factual fields never paraphrased — copied verbatim from source

# --- ORIGINAL FORMAT (verbose) ---
# Typical real instance: ~350-500 tokens
original_example:
  header:
    dispatch_id: "d-20260409-001"
    parent_id: "stage-impl-001"
    layer: "wave"
    timestamp: "2026-04-09T10:30:00Z"
    timeout_seconds: 7200
  task:
    task_id: "T04"
    type: "code"
    title: "Implement user authentication middleware"
    description: >
      Create an Express.js middleware that validates JWT tokens from the
      Authorization header. The middleware should extract the token, verify
      it against the JWT_SECRET environment variable, and attach the decoded
      user object to req.user. Handle expired tokens with a 401 response
      and malformed tokens with a 400 response. Follow the interface defined
      in the design document at .local/artifacts/design/auth-api.md.
  context:
    predecessor_artifacts:
      - artifact_id: "a-design-001"
        path: ".local/artifacts/design/auth-api.md"
        summary: >
          The authentication API design document specifies a JWT-based
          authentication flow with access tokens (15min TTL) and refresh
          tokens (7day TTL). The middleware should validate access tokens
          on protected routes. Token payload includes user_id, email, and
          role fields. The design recommends using the jsonwebtoken library
          for token verification.
      - artifact_id: "a-impl-002"
        path: "src/middleware/index.ts"
        summary: >
          The existing middleware index file exports a requestLogger
          middleware and an errorHandler middleware. The new auth middleware
          should be added to the exports and follow the same pattern of
          (req, res, next) => {} with proper error propagation via next().
    owned_files:
      - "src/middleware/auth.ts"
      - "src/middleware/index.ts"
      - "tests/middleware/auth.test.ts"
    applicable_rules:
      loading_strategy: "standard"
      language: "typescript"
      task_type: "code"
      quality_focus:
        - "security"
        - "error-handling"
    shared_context: "Project uses Express 4.x, TypeScript 5.x, Jest for testing."
  acceptance:
    criteria:
      - "JWT validation middleware exported from src/middleware/auth.ts"
      - "Handles valid tokens: attaches decoded payload to req.user"
      - "Handles expired tokens: returns 401 with error message"
      - "Handles malformed tokens: returns 400 with error message"
      - "Handles missing Authorization header: returns 401"
      - "Unit tests cover all 4 scenarios above"
      - "Tests pass with >90% coverage on auth.ts"
    quality_thresholds:
      coverage_pct: 90
      quality_score: 85
      max_blocker_findings: 0
    max_retry_rounds: 2

# --- LEAN FORMAT ---
# Same information, ~45-55% fewer tokens
# Rules: verbatim paths/IDs, key:value for facts, terse criteria, no prose rewording
lean_example:
  hdr: { id: "d-20260409-001", parent: "stage-impl-001", layer: wave, timeout: 7200 }
  task: { id: T04, type: code, title: "Implement user auth middleware" }
  goal: "JWT validation middleware for Express.js — validate access tokens, attach decoded user to req.user, reject expired/malformed/missing"
  pred:
    - { ref: ".local/artifacts/design/auth-api.md", key_facts: ["JWT auth: access 15min, refresh 7day", "payload: user_id, email, role", "lib: jsonwebtoken"] }
    - { ref: "src/middleware/index.ts", key_facts: ["exports: requestLogger, errorHandler", "pattern: (req,res,next)=>{}"] }
  files: ["src/middleware/auth.ts", "src/middleware/index.ts", "tests/middleware/auth.test.ts"]
  rules: { strategy: standard, lang: typescript, focus: [security, error-handling] }
  shared: "Express 4.x, TS 5.x, Jest"
  accept:
    - "export JWT middleware from src/middleware/auth.ts"
    - "valid token → req.user = decoded payload"
    - "expired → 401"
    - "malformed → 400"
    - "missing header → 401"
    - "unit tests cover all 5 cases, >90% coverage on auth.ts"
  reinforce: { round: 2, prior: 72.3, target: 85, rules: [{ id: "F-001", sev: blocker, mandate: "MUST add error handling to auth middleware", file: "src/middleware/auth.ts" }] }
  gate: { coverage: 90, quality: 85, blockers: 0, retries: 2 }

# --- FORMAT SPECIFICATION ---
lean_format_spec:
  hdr:
    description: "Dispatch envelope — fixed key names. v16 emitters use project|wave; legacy schema-v1 stage is read-compatible as project with a deprecation warning."
    fields: { id: "dispatch UUID", parent: "parent dispatch id", layer: "project|wave (v16 emission); legacy v1 stage→project on read", timeout: "seconds" }
  task:
    description: "Work unit identity"
    fields: { id: "human-readable task id", type: "code|test|review|research|design|benchmark", title: "≤10 words" }
  goal:
    description: "Single sentence — WHAT to achieve + key constraints. Replaces verbose 'description' field."
    max_tokens: 40
  assumptions:
    description: "Optional. Agent's stated assumptions before coding — interfaces, data formats, constraints. ≤5 items, each ≤10 words. Forces think-before-code."
    optional: true
    max_entries: 5
  pred:
    description: "Predecessor artifacts as ref+key_facts pairs. Facts are verbatim extractions, NEVER paraphrased."
    per_entry:
      ref: "verbatim filesystem path"
      key_facts: "list of ≤8-word factual statements extracted verbatim from source"
      # v7.0.2+: optional per-pred summariser knobs (ADR-003 §2.5). Nested
      # under each pred entry; not new top-level keys (honours v7-ADR-001
      # cache-layout invariant). Missing → extractive / 500 tokens.
      summary_mode: "extractive | abstractive (default: extractive)"
      summary_max_tokens: "int (default: 500); hard cap on summarise_predecessor output"
      # v8.0.0 (P-02) — directed-compaction directive. NESTED under pred[*],
      # NOT a new top-level dispatch key — layout_invariant.canonical_order
      # length and version were unchanged by this NEST (13/2 at the v8.0.0
      # P-02 landing; 17/6 since v9.7.0 PV-02 — the `layout_invariant` block
      # below is authoritative). P6 cache-layout invariant preserved per
      # ADR-001 §2 additive rule. Consumed by
      # `devolaflow.compressor.directed_compact()` (Layer-3 of the layered
      # compression pipeline). Field shape:
      #   compact_directive:
      #     focus_keywords: [str, ...]   # required when directive is set
      #     max_drop_pct: 0.20           # optional, default 0.20 (≤ 1.0)
      # Semantics: paragraphs whose body OR heading matches ANY keyword
      # (case-insensitive substring) are NEVER dropped (≥ 80 % focus
      # retention guarantee — in fact 100 %); cumulative non-focus drop
      # is bounded by max_drop_pct of the input length. Missing →
      # directive=None → byte-stable v7.x summarise_predecessor output.
      compact_directive: "optional dict {focus_keywords: list[str], max_drop_pct: float (0..1, default 0.20)}"
    max_entries: 5
    max_facts_per_entry: 5
  files:
    description: "Verbatim file paths. No descriptions — the task spec provides context."
  rules:
    description: "Collapsed rule hints — strategy/lang/focus only."
    fields:
      strategy: "str — minimal | standard | full"
      lang: "str — optional primary language hint"
      focus: "list[str] — advisory quality-focus constraints"
      constraint_tiers:
        description: "Optional field-name→constraint-tier metadata. Unknown or unannotated rule entries remain advisory and fully injected."
        optional: true
        type: mapping
        value_enum: [invariant, guard, advisory]
  shared:
    description: "≤15 words of cross-cutting tech context."
  accept:
    description: "Testable criteria. Each ≤15 words. Use → for cause/effect."
    max_entries: 8
  reinforce:
    description: "Optional top-level round-specific mandates from prior gate failure. ≤5 rules. This is canonical position 10, not a child of `rules`."
    optional: true
    fields:
      round: "int"
      prior: "number"
      target: "number"
      rules:
        type: list
        max_entries: 5
        per_entry:
          id: "str — finding identifier"
          sev: "str — blocker | critical | major"
          mandate: "str — imperative MUST/SHALL instruction"
          file: "str — optional repo-relative path"
          tier:
            description: "Optional constraint tier. New tier-aware emitters annotate reinforcement mandates as guard."
            optional: true
            type: string
            enum: [invariant, guard, advisory]
  verify_cfg:
    description: "Compact verification config (v5.4.0)."
    optional: true
    fields: { visual: "bool", accept: "bool", interact: "bool", a11y: "bool", threshold: "number" }
  gate:
    description: "Numeric thresholds only. No prose."
    # v8.0.0 (P-03) — token-budget circuit breaker. NESTED under the
    # existing `gate` block (position 12 of canonical_order); NOT a new
    # top-level dispatch key — layout_invariant.canonical_order length
    # and version were unchanged by this NEST (13/2 at the v8.0.0 P-03
    # landing; 17/6 since v9.7.0 PV-02 — the `layout_invariant` block
    # below is authoritative). P6 cache-layout invariant preserved
    # per ADR-001 §2 additive rule. Consumed by
    # `devolaflow.gate.budget.TokenBudgetBreaker.check()` and surfaced
    # via `evaluate_gate(..., breaker=...)`. Field shape:
    #   token_budget:
    #     max_tokens: int       # 0 = unlimited (breaker disabled)
    #     warn_at: float        # optional, default 0.75 (utilization)
    #     break_at: float       # optional, default 1.00 (utilization)
    # Semantics: cumulative token usage < warn_at*max → CONTINUE;
    # warn_at*max ≤ usage < break_at*max → WARN (non-fatal, attached to
    # verdict.details); usage ≥ break_at*max → BREAK (FAIL on
    # standard/relaxed; ESCALATE on strict/audit). Missing → breaker=None
    # → byte-stable v7.x evaluate_gate output.
    token_budget: "optional dict {max_tokens: int (0=unlimited), warn_at: float (default 0.75), break_at: float (default 1.00)}"
    # HISTORICAL v11.1.0 wording (retained for schema provenance only):
    # older documentation described a default of 4 and an L0 → L1 → L2 → L3
    # chain. The active contract is A-7 and its runtime/tests: default 3 and
    # L0 → L1 → L2. The schema fields remain unchanged for compatibility.
    # v11.1.0 (PV-04, sources: .local/research/v11.1.0_gap_analysis.md §5 +
    # .local/research/v11.1.0_cycle_plan.md §2 PV-04 row + §7 R-3) —
    # cascade-required signal. NESTED under the existing `gate` block
    # (position 12 of canonical_order); NOT a new top-level dispatch
    # key — layout_invariant.canonical_order length stays 17 and
    # version stays 6 (P6 cache-layout invariant preserved per A-2.3
    # NEST decision rule, parallel to the v8.0.0 P-03 `gate.token_budget`
    # NEST precedent above). The semantic source-of-truth is the
    # `cascade_requirement(complexity)` pure function in
    # `src/devolaflow/skills/change_activation.py` (added in v11.1.0
    # PV-02); the dispatch payload populates these two sub-fields via
    # `src/devolaflow/feedback.py` when `cascade_requirement()` returns
    # `"CASCADE_REQUIRED"` for STANDARD/COMPLEX plans (PV-04 ships the
    # generator wiring; PV-05 ships A-7 codification). Field shape:
    #   cascade_required: bool       # default false (backward-compat);
    #                                # true ONLY when complexity is
    #                                # STANDARD/COMPLEX per
    #                                # cascade_requirement()
    #   cascade_min_layers: int      # default 1 (backward-compat);
    #                                # default 4 when cascade_required
    #                                # is true; semantics = "minimum
    #                                # layer depth in the dispatch
    #                                # chain L0 → L1 → L2 → L3"
    # Historical schema semantics (pre-A-7; retained for compatibility):
    # when `cascade_required is True`, the L3 receiver knows
    # the dispatch was authored under STANDARD/COMPLEX complexity and
    # MUST honour the cascade chain (L0 → L1 → L2 → L3). When absent
    # → byte-stable v9.7.0 dispatch shape (the 10 historical multi-
    # baseline byte-tests in
    # `tests/test_layout_invariant_multi_baseline.py` continue to PASS
    # because the new sub-fields are absent from the historical
    # baselines — their absence is canonical per the OPTIONAL
    # contract). Both fields are independently OPTIONAL.
    # The schema description strings below retain historical pre-A-7 wording
    # for compatibility; active semantics are defined by A-7 and runtime/tests.
    cascade_required: "optional bool — default false (backward-compat); true only when complexity is STANDARD/COMPLEX per cascade_requirement() (devolaflow.skills.change_activation, added v11.1.0 PV-02). When true, the L3 receiver MUST honour the cascade chain L0 → L1 → L2 → L3."
    cascade_min_layers: "optional int — default 1 (backward-compat); default 4 when cascade_required is true; semantics = minimum layer depth in the dispatch chain L0 → L1 → L2 → L3."
    # HISTORICAL Pattern-3 wording (retained for schema compatibility only):
    # `AGENT_POOL_FORWARD` was previously described as a forward-compatible
    # runtime shape. Pattern 3 is removed from active selection; W-24 and
    # `src/devolaflow/skills/subagent_pattern.py` are authoritative. The
    # compatibility literal below is not authorization to revive Pattern 3.
    # v12.0.0 (PV-04, sources: .local/research/v12.0.0_gap_analysis.md §5 +
    # docs/cycle-archive/v11.4.0/v11.4.0_retrospective.md §3 + §5 +
    # docs/cycle-archive/v11.4.0/other/v11.4.0_subagent_pattern_analysis.md
    # §7.1) — subagent-pattern selection sub-field. NESTED under the
    # existing `gate` block (position 12 of canonical_order); NOT a new
    # top-level dispatch key — layout_invariant.canonical_order length
    # STAYS AT 17 and version STAYS AT 6 (P6 cache-layout invariant
    # preserved per A-2.3 NEST decision rule, parallel to the v11.1.0
    # PV-04 `gate.cascade_required` + `gate.cascade_min_layers` NEST
    # precedent above and the v8.0.0 P-03 `gate.token_budget` NEST
    # precedent at line 176). The semantic source-of-truth is the
    # `select_pattern(complexity, model_tier, task_count,
    # parallel_independence, persistent_state_needed)` pure function in
    # `src/devolaflow/skills/subagent_pattern.py` (added in v11.4.0
    # PV-01 SI-1); the dispatch payload populates this sub-field via
    # `src/devolaflow/feedback.py::populate_cascade_gate_fields` when
    # the L0/L1/L2 dispatcher passes the four input axes. The NEST
    # decision was pre-staged in v11.4.0 SI-1 §7.1 (NEST verdict
    # rationale: pattern selection MODIFIES the cascade interpretation
    # by specifying which of the 4 patterns the cascade should adopt,
    # REUSES the existing `gate` block's Literal-as-sub-field shape,
    # and is COUPLED to cascade_required — a CASCADE_REQUIRED dispatch
    # with subagent_pattern=AGENT_POOL_FORWARD is internally consistent
    # because Pattern 3 is forward-compat-only at v12.0.0). Field
    # shape:
    #   subagent_pattern: Literal["INLINE", "FAN_OUT",
    #                             "AGENT_POOL_FORWARD"]
    # ``"TEAMS_FORBIDDEN"`` is REJECTED at validate time per W-24.3
    # (Pattern 4 PERMANENTLY NOT_SUPPORTED — Soul-level P5 invariant
    # forbids cross-agent shared state; reversal requires SI-1 + ADR
    # + W-21 cadence + SI-3 §3.2 ≥ 9.5/10). Semantics: when present,
    # the L3 receiver knows which philschmid 4-pattern dispatch shape
    # the wave was authored under (Pattern 1 INLINE = single L3 via
    # `Task` tool; Pattern 2 FAN_OUT = L2 wave with parallel L3 max 5
    # per references/agent-hierarchy.md §5; Pattern 3
    # AGENT_POOL_FORWARD = forward-compat-only at v12.0.0 — no API
    # path activates Pattern 3 yet). When absent → byte-stable v11.4.0
    # dispatch shape (the 9 prior Tier-A multi-baseline byte-tests in
    # `tests/test_layout_invariant_multi_baseline.py` continue to PASS
    # because the new sub-field is absent from the historical
    # baselines — their absence is canonical per the OPTIONAL
    # contract). The field is independently OPTIONAL.
    subagent_pattern: "optional Literal['INLINE', 'FAN_OUT', 'AGENT_POOL_FORWARD'] — TEAMS_FORBIDDEN rejected at validate time per W-24.3 (Pattern 4 PERMANENTLY NOT_SUPPORTED). When present, identifies the philschmid 4-pattern dispatch shape per references/subagent-patterns.md (Pattern 1 INLINE / Pattern 2 FAN_OUT / Pattern 3 AGENT_POOL_FORWARD forward-compat). Populated by devolaflow.feedback.populate_cascade_gate_fields when the L0/L1/L2 dispatcher passes the four input axes (model_tier, task_count, parallel_independence, persistent_state_needed). Absence-canonical (legacy v11.x dispatches without this sub-field render byte-identically)."
    # v14.4.0 (G-005 NEST slice, sources: .local/research/v14.2.0_gap_analysis.md
    # §2.1 G-005 + §4.1 v14.4.0 row + §6 R-1) — intra-task convergence
    # sub-fields. NESTED under the existing `gate` block (position 12 of
    # canonical_order); NOT a new top-level dispatch key —
    # layout_invariant.canonical_order length STAYS AT 17 and version
    # STAYS AT 6 (P6 cache-layout invariant preserved per A-2.3 NEST
    # decision rule, parallel to the v11.1.0 PV-04
    # `gate.cascade_required` + `gate.cascade_min_layers` NEST precedent
    # and the v12.0.0 PV-04 `gate.subagent_pattern` NEST precedent
    # above). The semantic source-of-truth is the L3 Self-Verify
    # protocol in `references/execution-protocol.md` §15 (shipped
    # v14.3.0) — these sub-fields make the §15 obligation an explicit
    # dispatch-payload signal. Populated OPT-IN by
    # `src/devolaflow/feedback.py::populate_intra_task_convergence`
    # (warrant rule: implementation-class task types with a non-empty
    # `acceptance_criteria_v2` block present). Validated by
    # `src/devolaflow/gate/scorer.py::validate_intra_task_convergence_fields`
    # (permissive warnings by default; strict raises — DEFAULTS-
    # PERMISSIVE-IN-MINOR per the v11.1.0 cascade SOFT-mode precedent).
    # Field shape:
    #   intra_task_convergence: bool   # default absent/false; when true the
    #                                  # L3 receiver MUST run the §15
    #                                  # gen→verify→refine loop on its OWN
    #                                  # artifact BEFORE its first StatusReport
    #   intra_task_max_rounds: int     # default 2 (mirrors §15.4's max-2
    #                                  # bounded self-fix ceiling; P4 Bounded
    #                                  # Retry — every loop has a ceiling)
    # Semantics: when absent → byte-stable v14.3.0 dispatch shape (ALL
    # historical multi-baseline byte-tests in
    # tests/test_layout_invariant_multi_baseline.py continue to PASS
    # because the new sub-fields are absent from the historical
    # baselines — their absence is canonical per the OPTIONAL
    # contract). Both fields are independently OPTIONAL.
    intra_task_convergence: "optional bool — default false (absence-canonical, backward-compat); when true, the L3 receiver MUST run the execution-protocol §15 self-verify gen→verify→refine loop on its own artifact before emitting its first StatusReport. Populated by devolaflow.feedback.populate_intra_task_convergence for implementation-class tasks carrying acceptance_criteria_v2 (v14.4.0 G-005 NEST slice)."
    intra_task_max_rounds: "optional int — default 2 (mirrors execution-protocol §15.4 max-2 bounded self-fix ceiling); semantics = maximum gen→verify→refine iterations the L3 may run before reporting honestly per P4 Bounded Retry. Independently optional; absence-canonical."
  # v8.0.0 (P-08) — L3 behavioral guidelines injection. NEW top-level
  # dispatch key APPENDED to ``canonical_order`` AT THE END (position
  # 14, after ``repos``) per ADR-001 §2 additive rule. Schema version
  # bumped 2 → 3 to mark the schema generation. ZERO existing keys
  # reordered; the v7.0.0 golden baseline byte-comparison
  # (tests/test_benchmarks.py::TestLayoutInvariantBaseline::
  # test_layout_invariant_baseline) AND the v7.3.0 byte-comparison
  # STILL PASS after this bump, proving additivity (verified by
  # tests/test_behavioral_guidelines.py::TestSchemaAdditivity).
  #
  # Field shape:
  #   behavioral_guidelines:
  #     think_first: bool              # plan-before-code discipline (BG-001)
  #     simplicity_check: bool         # over-engineering audit (BG-002)
  #     surgical_scope: str            # 'line' | 'function' | 'module' (BG-003)
  #     goal_loop: bool                # round-N goal re-anchor (BG-004)
  #     no_llm_for_deterministic: bool # deterministic decisions in code (BG-005)
  #     surface_conflicts: bool        # surface, don't average disagreement (BG-006)
  #     convention_first: bool         # match existing pattern (BG-007)
  #
  # v12.2.0 PV-03 — NEST extension (A-2.3): adds 3 new sub-fields under the
  # existing ``behavioral_guidelines`` block per the Mnimiy May-2026 X
  # article cross-walk (`.local/research/v12.2.0_gap_analysis.md` §2 D-2).
  # The 3 NEW fields close gaps the v8.0.0 P-08 Karpathy 4-rule baseline
  # did NOT cover (Rules 5, 7, 11 from the article). canonical_order
  # length stays at 17 and schema version stays at 6 — NEST sub-field
  # additions per A-2.3 do NOT bump either invariant.
  #
  # Semantics: when present, ``select_context()`` injects the matching
  # rule sections from ``workflow-system/agent/references/behavioral-guidelines.md``
  # into the L3 dispatch context (each rule ≤ 30 lines / ~120 tokens;
  # 7 rules total ≤ 5 % of L3 8K budget). When absent, behaviour is
  # byte-identical to v7.x (preserves the v7.0.0 layout golden
  # baseline). Per-profile defaults live in
  # ``workflow-system/agent/context_profiles.yaml#profiles.<name>.behavioral_guidelines``.
  # See ``references/behavioral-guidelines.md`` for full rule specs,
  # severity classification, and self-check questions.
  behavioral_guidelines:
    description: "L3 behavioral primitives — 4 Karpathy + 3 Mnimiy (BG-001..BG-007)."
    optional: true
    fields:
      think_first: "bool — plan-before-code discipline (BG-001, severity warn)"
      simplicity_check: "bool — over-engineering audit (BG-002, severity warn)"
      surgical_scope: "str — one of 'line' | 'function' | 'module' (BG-003, severity blocker)"
      goal_loop: "bool — round-N goal re-anchor (BG-004, severity warn)"
      no_llm_for_deterministic: "bool — deterministic decisions in code (BG-005, severity warn; v12.2.0)"
      surface_conflicts: "bool — surface conflicting patterns (BG-006, severity major; v12.2.0)"
      convention_first: "bool — match existing codebase pattern (BG-007, severity major; v12.2.0)"
      constraint_tiers:
        description: "Optional field-name→constraint-tier metadata. M5-a defaults surgical_scope and line_level_criteria to guard; other known behavioral fields and unknown fields default advisory. Absence preserves full legacy injection."
        optional: true
        type: mapping
        value_enum: [invariant, guard, advisory]
  # v8.0.0 (P-10) — Automatic Acceptance Criteria generator (Karpathy
  # Goal-Driven Execution per upstream tweet analysis ``v7.8`` §4.14).
  # NEW top-level dispatch key APPENDED to ``canonical_order`` AT THE END
  # (position 15, after ``behavioral_guidelines``) per ADR-001 §2 additive
  # rule. Schema version bumped 3 → 4 to mark the schema generation. ZERO
  # existing keys reordered; the v7.0.0 golden baseline byte-comparison
  # AND the v7.3.0 byte-baseline STILL PASS after this bump (verified by
  # tests/test_benchmarks.py::TestLayoutInvariantBaseline AND
  # tests/test_ac_generator.py::TestSchemaAdditivity), proving additivity
  # holds across THREE schema generations (v7.2.6 → v8.0.0-P-08 →
  # v8.0.0-P-10).
  #
  # IMPORTANT — ``acceptance_criteria`` (the legacy ``list[str]`` alias
  # recognised by ``src/devolaflow/lifecycle/validate_dispatch.py``) is
  # PRESERVED unchanged for backward compatibility (R5 mitigation per
  # ``.local/research/v8.0.0_patch_plan.md`` §9). Existing dispatch
  # payloads that supply ``accept: list[str]`` OR ``acceptance_criteria:
  # list[str]`` continue to validate exactly as in v7.x — no breaking
  # change. The new ``acceptance_criteria_v2`` field is OPT-IN; agents
  # MAY ignore it if they do not yet support structured criteria.
  #
  # Field shape:
  #   acceptance_criteria_v2:
  #     - id: str                 # short stable identifier (e.g. "AC-001")
  #       description: str        # human-readable criterion text
  #       verification_type: str  # 'test' | 'metric' | 'manual'
  #       verification_cmd: str   # optional shell command (verification_type='test')
  #       metric: str             # optional metric name (verification_type='metric')
  #       threshold: str          # optional threshold expression (verification_type='metric')
  #
  # Semantics: when present, ``ACGenerator.generate(...)`` (see
  # ``src/devolaflow/ac_generator.py``) populates the list from the task
  # description. The companion ``evaluate_acceptance_criteria_v2(...)``
  # in ``src/devolaflow/gate/scorer.py`` runs each ``verification_cmd``
  # via subprocess and emits per-criterion :class:`AcceptanceCriterionVerdict`
  # outcomes. When absent, the gate falls back to legacy
  # ``acceptance_criteria: list[str]`` behaviour — byte-identical to v7.x
  # (preserves the v7.0.0 layout golden baseline).
  acceptance_criteria_v2:
    description: "Structured acceptance criteria — ACGenerator-friendly successor to the legacy `accept` list[str]. Opt-in; does NOT replace the legacy alias."
    optional: true
    per_entry:
      id: "str — short stable identifier (e.g. 'AC-001')"
      description: "str — human-readable criterion text"
      verification_type: "str — one of 'test' | 'metric' | 'manual'"
      verification_cmd: "str — optional shell command (verification_type='test'; since v14.4.0 also runnable 'metric' criteria — a metric entry WITH a verification_cmd is executed by the gate's metric runner, a metric entry WITHOUT one keeps the legacy skip-with-reason verdict)"
      metric: "str — optional metric name (verification_type='metric'). Since v14.4.0 the name doubles as the metric-kind selector when metric_kind is omitted: 'coverage' → coverage kind, 'lint' → lint kind, any other name → number kind."
      threshold: "str — optional threshold expression (verification_type='metric'), e.g. '>= 80'. The comparison operator is embedded in the expression (one of >=, <=, >, <, ==); a bare number defaults to '>=' (v14.4.0 metric runners)."
      # ---- v14.4.0 metric-runner extension (additive field docs ONLY —
      # no canonical_order change; per-entry fields are NESTed payload,
      # not top-level keys). Source: .local/research/v14.2.0_gap_analysis.md
      # §4.1 v14.4.0 row ("AC-v2 metric runners" L0 skeleton item).
      # Runner semantics live in
      # src/devolaflow/gate/scorer.py::evaluate_acceptance_criteria_v2:
      #   coverage — run verification_cmd, parse the LAST percentage
      #              (e.g. the `pytest --cov` / `coverage report` TOTAL
      #              line) from the output, compare against threshold.
      #   lint     — run verification_cmd (e.g. `ruff check path`),
      #              pass on exit 0.
      #   number   — run verification_cmd, parse the LAST number from
      #              the output, compare against threshold.
      # Runner errors produce explicit fail verdicts — NEVER a silent
      # skip (S-5). 'manual' entries stay skip-with-reason.
      metric_kind: "str — optional, one of 'coverage' | 'lint' | 'number' (v14.4.0). When omitted, the kind is derived from `metric` (metric='coverage' → coverage, metric='lint' → lint, anything else → number)."
      comparison: "str — optional explicit comparison operator ('>=', '<=', '>', '<', '=='). When omitted, the operator is parsed from the `threshold` expression (bare number → '>=')."
  # v8.3.0 (PV-05 / v8.2.5, sources: .local/research/v8.3.0_design.md §9 +
  # .local/research/v8.3.0_patch_plan.md §v8.2.5) — agent workspace
  # integration. NEW top-level dispatch key APPENDED to ``canonical_order``
  # AT THE END (position 16, after ``acceptance_criteria_v2``) per
  # ADR-001 §2 additive rule. Schema version bumped 4 → 5 to mark the
  # generation. ZERO existing keys reordered; v7.0.0 + v7.3.0 + v8.0.0
  # P-08 / P-10 byte-baselines ALL CONTINUE TO PASS (verified by
  # tests/test_dispatch_layout_v5.py and the regression sweep in
  # tests/test_compressor.py).
  #
  # Field shape:
  #   change_context:
  #     change_id: str                    # lowercase-kebab-case folder name
  #     active_folder: str                # ".local/.agent/active/<change-id>"
  #     state: str                        # PROPOSED | IN_PROGRESS | VERIFYING
  #     spec_delta_target: str            # source-of-truth domain (e.g. "agent_workspace")
  #     owned_files_ref: str              # ".local/.agent/active/<id>/owned_files.txt"
  #     acceptance_ref: str               # ".local/.agent/active/<id>/checklist.md"
  #
  # Semantics: when present, the dispatch payload is bound to a specific
  # in-flight change folder under ``.local/.agent/active/<change-id>/``;
  # the receiving L3 task agent MUST honour the owned_files manifest at
  # ``owned_files_ref`` per Rule S-8 ("No Writes Outside Active Change
  # Owned Files") and MUST NOT modify the immutable handoff envelopes in
  # ``.local/.agent/handoff/`` per Rule S-9 (append-only ledger). When
  # absent, the dispatch is a "free-floating" workflow (current v4
  # behaviour preserved exactly — R5 backward-compat invariant I-PV05-C
  # / I-PV05-F). The six core binding sub-fields are required when
  # ``change_context`` is present; additive NEST sub-fields are optional.
  # Discriminated state transitions are enforced by
  # ``src/devolaflow/agent_workspace/change.py::ChangeStore``.
  change_context:
    description: "Bind a dispatch payload to an in-flight `.local/.agent/active/<change-id>/` workspace folder. Optional — absence == free-floating workflow (v4 behaviour). Additive sub-fields are NESTED here per A-2.3; canonical_order and schema version remain unchanged."
    optional: true
    fields:
      change_id: "str — lowercase-kebab-case change identifier (e.g. 'add-dark-mode', 'v8.3.0-pv05')"
      active_folder: "str — repo-relative path '.local/.agent/active/<change_id>'"
      state: "str — one of 'PROPOSED' | 'IN_PROGRESS' | 'VERIFYING' (terminal ARCHIVED / ESCALATED states never appear in a live dispatch)"
      spec_delta_target: "str — source-of-truth spec domain under .local/memory/specs/<domain>/spec.md"
      owned_files_ref: "str — repo-relative path '.local/.agent/active/<change_id>/owned_files.txt' — MUST be honoured per Rule S-8"
      acceptance_ref: "str — repo-relative path '.local/.agent/active/<change_id>/checklist.md' (frozen field name; pre-v17 payloads referenced acceptance.md) — MAY include #ac-<n> fragment"
      # ---- v9.1.4 PV-04 NEST extension (A-2.3 nest-vs-append decision rule) ----
      # All 3 sub-fields are OPTIONAL; absence preserves byte-identical
      # rendering vs the v8.3.0 PV-05 / v8.4.0 baselines (the v8.3.0 +
      # v8.4.0 multi-baseline byte tests in
      # tests/test_layout_invariant_multi_baseline.py continue to PASS
      # without modification — this is the headline I-8 invariant proof
      # for PV-04). Caps documented here are SCHEMA-DOCUMENTED only;
      # PV-04 does NOT add runtime validation (a future PV may).
      prior_feedback_themes: "optional list[str] — ≤ 5 items, each ≤ 30 chars; extracted themes from .local/feedbacks/ latest 3 files (per scan_workspace.recent_feedbacks); populated by L0 plan-mode entry per references/plan-mode-enforcement.md §5.5"
      memory_case_hits: "optional list[str] — ≤ 3 items, MemoryCase.case_id values surfaced by devolaflow.memory_router.cache.consult_for_dispatch() when DEVOLAFLOW_MEMORY_ROUTER=1 AND .local/memory/cases/index.yaml carries fresh matches"
      source_of_truth_excerpt: "optional str — ≤ 200 tokens; excerpt from .local/memory/specs/<domain>/spec.md (the source-of-truth domain named by spec_delta_target) relevant to the dispatch task description"
      # ---- v16.0.0 M2 round-dispatch NEST extension (A-2.3) ----
      # The pair is emitted atomically by
      # devolaflow.agent_workspace.populate_round_change_context. When the
      # caller supplies no round inputs, BOTH fields stay absent so legacy
      # dispatches render byte-identically. This NEST does not change
      # layout_invariant.version (6), canonical_order length (17), top-level
      # key order, compressor behavior, or any Tier-A byte witness.
      checklist_items:
        description: "Optional selected checklist slice for this dispatch. Emitted together with round_context; source order equals RoundSelection.selected order."
        optional: true
        type: list
        min_items: 1
        max_items: 5
        required_with: round_context
        per_entry:
          id: {type: string, verbatim: true}
          assert: {type: string, min_length: 1, verbatim: true}
          verify: {type: string, min_length: 1, verbatim: true}
          priority:
            type: string
            enum: [P0, P1, P2]
            semantics: "effective priority at selection time"
      round_context:
        description: "Optional round coordinate for checklist_items. Emitted together with checklist_items."
        optional: true
        type: mapping
        required_with: checklist_items
        fields:
          round_n: {type: int, minimum: 1}
          reverted_ids:
            type: list
            item_type: string
            unique_items: true
            subset_of: "checklist_items[*].id"
            order: "selected order"

  # v9.7.0 (PV-02 / Performance Overhaul #2) — append-only D2 addition.
  # NEW top-level dispatch key APPENDED to ``canonical_order`` AT THE END
  # (position 17, after ``change_context``). Schema version bumped 5 → 6
  # in this PV. Source: ``.local/research/v9.7.0_perf_research.md`` §2 +
  # ``.local/research/v10.0.0_cycle_plan.md`` §3 (v9.7.0 PV-02).
  #
  # Carries hash-based dedup state for the per-task ``pred[*].summary``
  # field across convergence rounds. When a round N>1 dispatches, the
  # :func:`devolaflow.compressor.transforms.dedup_predecessor_summaries`
  # helper compares each ``pred[i].summary`` against the previous
  # round's ledger; matching summaries are replaced by an
  # ``"@round-N-1:pred-K"`` reference and the ledger records the dedup
  # hit. Round 1 dispatches OMIT the field entirely (canonical
  # absence-as-default — preserves byte-stable v9.6.0 / v9.3.0 /
  # v8.4.0 / v8.3.0-PV05 baselines).
  #
  # v15.0.0 SELF-CONTAINMENT contract (G-007 design fix; sources:
  # ``.local/research/v14.2.0_gap_analysis.md`` §2.1 G-007 + finding
  # F-P4-4 in ``.local/research/v15-cycle_design_review_product.md``
  # §4). The original v9.7.0 wording ("…so the receiver can
  # decompress") was incoherent with Context Isolation
  # (``workflow-system/agent/references/context-isolation.md`` §2
  # Mechanism 1 / §4 row 1): every L3 spawns with a FRESH context, so
  # a round-N receiver has no round-N-1 dispatch to resolve
  # ``@round-N-1:pred-K`` into — the token savings were purchased with
  # input-quality loss, directly against the single-task-excellence
  # north star. Ratified disposition: design fix, NOT an ADR (the
  # field is absence-canonical; the persistent-generator dispatch
  # shape was evaluated and explicitly NOT chosen — it would alter the
  # isolation contract and re-enter the ADR gate). The fix:
  #
  #   1. Every ledger entry the emitter produces carries a
  #      self-contained ``digest`` — the verbatim key_facts digest of
  #      the replaced summary (bounded by
  #      ``devolaflow.compressor.DEDUP_DIGEST_MAX_CHARS`` = 320 chars;
  #      summaries at or under the bound travel verbatim). References
  #      therefore resolve INTRA-PAYLOAD: ``pred[i].summary == ref``
  #      → ``entries[j].ref == ref`` → ``entries[j].digest``. No
  #      conversation history is ever required.
  #   2. Ref-shaped summaries are excluded from both the dedup index
  #      and re-deduplication, so a ``digest`` can never itself be a
  #      reference (no chained ``ref → ref`` emission path exists).
  #   3. The replacement and the digest emission happen in the same
  #      loop iteration of ``dedup_predecessor_summaries`` — emitting
  #      an L3-unresolvable reference is impossible by construction
  #      (pinned by ``tests/test_predecessor_dedup.py``).
  #
  # A-2 governance: ``digest`` is a NEST-in-place inside existing
  # ledger entries per A-2.3 — canonical_order length STAYS at 17,
  # version STAYS at 6, position 17 itself is untouched (removing a
  # canonical key from the append-only tail is forbidden). ``digest``
  # is REQUIRED on every entry the v15.0.0+ emitter produces; it is
  # OPTIONAL in the schema only so the digest-less entry shape in the
  # historical Tier-A goldens (v9.7.0 / v10.2.0 / v12.0.0) stays
  # valid — goldens are frozen renderings, not emitter contracts, and
  # ALL multi-baseline byte-tests in
  # ``tests/test_layout_invariant_multi_baseline.py`` CONTINUE TO PASS
  # byte-identically.
  predecessor_dedup_ledger:
    description: "Hash-based dedup state for round-N>1 predecessor summaries. Optional — absence == round 1 OR no dedup hits. Populated by devolaflow.compressor.transforms.dedup_predecessor_summaries(payload, round_num, prior_rounds). v15.0.0 G-007: entries are SELF-CONTAINED — refs resolve intra-payload via entries[*].digest, never via conversation history."
    optional: true
    fields:
      round_num: "int — current round number (>= 2 when present); MUST equal payload.reinforce.round when both are set"
      entries: "list[{pred_index: int (0-based), hash: str (12-char sha256 prefix), ref: str ('@round-N-1:pred-K' reference), digest: str (v15.0.0 G-007 — self-contained verbatim key_facts digest of the replaced summary, <= DEDUP_DIGEST_MAX_CHARS chars; REQUIRED on emission, optional only in historical schema-v6 witnesses)}] — one entry per dedup hit; empty list when round N>1 had no hits"

# --- COMPRESSION RULES ---
# Deterministic drop/preserve lists for inter-layer message compaction.
# Based on CO-1 (lean format) and CO-2 (verbatim extraction) rules.
compression_rules:
  preserve_list:
    - file_paths
    - error_messages_verbatim
    - metric_values
    - commit_hashes
    - acceptance_criteria
    - task_ids
    - artifact_references
    - version_strings
  drop_list:
    - filler_phrases         # "I think", "it seems", "basically"
    - hedging_language        # "might", "could possibly", "it appears"
    - pleasantries            # "Great question", "Happy to help"
    - redundant_narration     # "Let me explain", "As you can see"
    - meta_commentary         # "I'm now going to", "The next step is"
    - apologies               # "Sorry for the confusion"
    - progress_narration      # "making good progress", "working on"
    - obvious_acknowledgments # "understood", "got it", "will do"
    - tool_call_echoing       # "I just ran the grep tool"
  intensity_tiers:
    minimal:
      description: "Drop only filler and pleasantries"
      active_drops: [filler_phrases, pleasantries, apologies]
    standard:
      description: "Drop filler, hedging, narration"
      active_drops: [filler_phrases, hedging_language, pleasantries, redundant_narration, apologies, progress_narration, obvious_acknowledgments]
    aggressive:
      description: "Drop all non-essential text"
      active_drops: [filler_phrases, hedging_language, pleasantries, redundant_narration, meta_commentary, apologies, progress_narration, obvious_acknowledgments, tool_call_echoing]
  default_intensity: standard
  # v7.2.0 (C-002, source: caveman/SKILL.md "## Auto-Clarity") — bypass list.
  # When *any* of these conditions match the input text, compress_message()
  # MUST return the source verbatim (compression_ratio=0.0) and emit one
  # one-line warning to the wave agent. Default = full list (opt-out by
  # passing bypass_conditions=[] explicitly). P6-safe: nested under the
  # existing compression_rules block — NOT a new top-level key in the
  # dispatch payload, so v7-ADR-001 §2 cache layout invariant is untouched.
  bypass_conditions:
    - security_warning
    - destructive_operation
    - multi_step_sequence_with_order_dependency
    - repeated_user_question
  bypass_default_active: true
  # v7.2.4 (P-02, source: arXiv:2604.02837v1 "agent-skills-threat-taxonomy",
  # registered in v7.2.0 PR-0 H-06) — data-instruction envelope policy.
  # When true (default), dispatchers MUST wrap predecessor key_facts and
  # tool-output blocks in <data channel="..."> ... </data> envelopes per
  # references/execution-protocol.md §8 before rendering the dispatch.
  # Nested SUB-KEY of compression_rules — NOT a new top-level key in the
  # dispatch payload, so v7-ADR-001 §2 cache-layout invariant is untouched.
  data_envelope_required: true

# Layout invariant (v7.0.0+, per .local/research/adr/v7-ADR-001-cache-layout-invariant.md)
