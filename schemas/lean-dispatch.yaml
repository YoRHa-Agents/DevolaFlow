layout_invariant:
  version: 6
  canonical_order:
    # --- FROZEN PREFIX (positions 1-12, v7.0.0 baseline, FROZEN per D1) ---
    - hdr
    - task
    - goal
    - assumptions
    - pred
    - files
    - rules
    - shared
    - accept
    - reinforce
    - verify_cfg
    - gate
    # --- APPEND-ONLY TAIL (positions 13+, append-only per D2) ---
    - repos                    # pos 13 — v7.2.6 P-06 (multi-repo coord)
    - behavioral_guidelines    # pos 14 — v8.0.0 P-08 (Karpathy primitives)
    - acceptance_criteria_v2   # pos 15 — v8.0.0 P-10 (structured AC)
    - change_context           # pos 16 — v8.3.0 PV-05 (agent workspace bind)
    - predecessor_dedup_ledger # pos 17 — v9.7.0 PV-02 (round-N dedup state)
  enforcement:
    validator: "devolaflow.compressor.assert_dispatch_layout"
    spec_invariant: "devolaflow.compressor.assert_layout_spec_invariant"  # v9-ADR-002 D5
    frozen_prefix: "devolaflow.compressor.FROZEN_PREFIX_V7"               # v9-ADR-002 D1
    stability_test: "tests/test_compressor.py::test_dispatch_prefix_is_stable_across_rounds"
    multi_baseline_test: "tests/test_layout_invariant_multi_baseline.py"  # v9-ADR-002 D4
    lcp_threshold_round_1_to_2: 0.80
    lcp_threshold_round_1_to_3: 0.70
    # v14.5.0 G-014 (v15-ADR-005 same-PR coupling): the former
    # `backward_compat` block of hand-mirrored `v*_baseline_passes: true`
    # booleans is GONE — the booleans could never legitimately be false
    # (CI would fail first), so the block was a write-only sync point.
    # The canonical, executable witness of every historical baseline
    # passing is `tests/test_layout_invariant_multi_baseline.py` (the
    # Tier-A golden set per v15-ADR-005). The schema-version transition
    # contracts formerly recorded as sibling strings remain normative:
    # v4 → v5: positions 1..15 byte-identical; new key appended at
    #   position 16; version field bumped 4 → 5 (v4 payloads still valid).
    # v5 → v6: positions 1..16 byte-identical; new key appended at
    #   position 17; version field bumped 5 → 6.

# Compression-rule ownership contract (PV-4 schema redundancy item).
#
# This is schema metadata, not a dispatch-payload key. The dispatch schema owns
# the common compression policy; lean-report.yaml carries a standalone derived
# view for consumers that do not load this file. The common values remain
# duplicated intentionally: external distribution evidence is INSUFFICIENT to
# safely introduce a cross-file include or generated rewrite without changing
# standalone-consumer behavior. tests/test_schema_parity.py enforces the
# normalized common subtree and the explicitly message-specific exceptions.
compression_rules_contract:
  version: 1
  role: owner
  owner: "schemas/lean-dispatch.yaml#compression_rules"
  derived_views:
    - "schemas/lean-report.yaml#compression_rules"
  common_keys:
    - drop_list
    - intensity_tiers
    - default_intensity
    - bypass_conditions
    - bypass_default_active
  message_specific_keys:
    - preserve_list
    - data_envelope_required
  preserve_list_differences:
    dispatch_only:
      - acceptance_criteria
    report_only:
      - finding_ids
      - delta_descriptions
  derivation:
    mode: parity_check
    external_distribution_evidence: INSUFFICIENT
    rationale: "Standalone schema consumers prevent a cross-file include or generated rewrite."
