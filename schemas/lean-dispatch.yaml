# v9.0.0 PV-02 (v8.4.2) — Cache-Layout Governance v2 (nest-vs-append rule).
# Per .local/research/adr/v9-ADR-002-cache-layout-governance-v2.md:
#
# D1 — FROZEN PREFIX (positions 1-12). The first 12 positions of
#      canonical_order are FROZEN at the v7.0.0 baseline. Reordering /
#      renaming / removing ANY of these 12 keys invalidates the LLM cache
