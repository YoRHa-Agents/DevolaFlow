# -----------------------------------------------------------------------------
# Design reference: docs/designs/design_execution_protocol.md §4.3
# Checkpoint — durable workflow state for resume after interrupt.
# -----------------------------------------------------------------------------

design_reference: docs/designs/design_execution_protocol.md §4.3
schema_name: checkpoint
instance_top_level_required:
  - metadata
  - project_state
  - stage_progress
  - wave_state
  - quality_snapshot
  - deferred_items
  - active_escalations

instance_top_level_optional:
  - convergence_state

fields:
  metadata:
    children:
      checkpoint_id: { type: string, description: Unique id (often time + stage). }
      timestamp: { type: string, description: ISO8601 write time. }
      trigger: { type: string, description: stage_gate_pass | wave_complete | manual | error_recovery, etc. }
      workflow_run_id: { type: string }
      schema_version: { type: string, description: Checkpoint file format version. }

  project_state:
    children:
      workflow_type: { type: string, description: Template / pipeline key. }
      project_name: { type: string }
      config_hash: { type: string, description: Hash of frozen project_config for drift detection. }

  stage_progress:
    children:
      completed_stages:
        type: list
        item_fields:
          stage_id: { type: string }
          gate_verdict: { type: string, description: PASS | FAIL | … }
          completed_at: { type: string }
          gate_report_path: { type: string }
          artifacts:
            type: list
            description: Produced artifact references (paths and optional hashes).
      current_stage:
        children:
          stage_id: { type: string }
          status: { type: string }
          started_at: { type: string }
          current_wave: { type: string }
          waves_completed: { type: list }
          waves_remaining: { type: list }
      pending_stages: { type: list, description: Stage ids not yet started. }

  wave_state:
    children:
      current_wave_id: { type: string }
      tasks:
        type: list
        item_fields:
          task_id: { type: string }
          status: { type: string }
          assigned_agent_type: { type: string }
          started_at: { type: string, optional: true }

  convergence_state:
    optional: true
    children:
      current_round: { type: int }
      max_rounds: { type: int }
      round_history: { type: list, description: Past round summaries. }

  quality_snapshot:
    children:
      last_composite_score: { type: number, optional: true }
      last_coverage_pct: { type: number, optional: true }
      total_findings:
        children:
          blocker: { type: int }
          critical: { type: int }
          major: { type: int }
          minor: { type: int }
          info: { type: int }

  deferred_items: { type: list, description: Work intentionally deferred to later stages. }
  active_escalations: { type: list, description: Unresolved ExceptionEscalation ids or blobs. }
