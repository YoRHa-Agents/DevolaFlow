# -----------------------------------------------------------------------------
# Design reference: docs/designs/design_execution_protocol.md §2.3
# Pre-Decision Checklist — eight substantive sections plus version/status envelope.
# -----------------------------------------------------------------------------

design_reference: docs/designs/design_execution_protocol.md §2.3
schema_name: pre-decision-checklist
instance_top_level_required:
  - version
  - created_at
  - status
  - project
  - tech_stack
  - repository
  - localization
  - platforms
  - quality
  - release
  - workflow

fields:
  version: { type: string, description: Checklist format version (e.g. 1.0). }
  created_at: { type: string, description: ISO8601 when checklist was started. }
  status: { type: string, description: draft | collecting | validated | frozen. }

  project:
    children:
      name: { type: string, description: MANDATORY project name. }
      purpose: { type: string, description: Short description of goals. }
      scope_keywords: { type: list, description: Tags derived from purpose. }
      existing_codebase: { type: bool, description: Whether repo already has code. }

  tech_stack:
    children:
      primary_language: { type: string }
      secondary_languages: { type: list }
      framework: { type: string }
      build_system: { type: string }
      dependency_manifest: { type: string, description: Path to manifest file. }
      runtime_version: { type: string }
      dependencies:
        children:
          pinned: { type: list, description: Explicitly pinned deps. }
          banned: { type: list, description: Deps that must not be introduced. }

  repository:
    children:
      mode: { type: string, description: local | github | gitlab | other_git. }
      remote_url: { type: string }
      default_branch: { type: string }
      branching_strategy: { type: string, description: e.g. feature branches. }
      features:
        description: Capability flags depending on repo mode.
        children:
          ci_cd: { type: bool }
          cross_platform_builds: { type: bool }
          github_actions: { type: bool }
          github_pages: { type: bool }
          online_demo: { type: bool }
          release_publishing: { type: bool }
          merge_requests: { type: bool }
          readme: { type: bool }
          user_guide: { type: bool }
          changelog: { type: bool }

  localization:
    children:
      primary_language: { type: string, description: Natural language for UX/docs. }
      secondary_language: { type: string, optional: true }
      bilingual_output: { type: bool }
      doc_language: { type: string }
      code_comments_language: { type: string }

  platforms:
    children:
      os: { type: list, description: Target OS names. }
      architectures: { type: list }
      additional_targets: { type: list, description: Extra triples or platforms. }
      min_os_versions: { type: map, description: OS -> minimum version string. }

  quality:
    children:
      coverage_target_pct: { type: int }
      quality_score_threshold: { type: int }
      lint_strictness: { type: string }
      gate_profile: { type: string, description: minimal | standard | strict. }
      max_convergence_rounds: { type: int }
      min_convergence_rounds: { type: int }
      security_review_required: { type: bool }
      benchmark_required: { type: bool }

  release:
    children:
      versioning: { type: string, description: e.g. semver. }
      initial_version: { type: string }
      channels: { type: list, description: dev | beta | release. }
      publishing_targets: { type: list, description: registries or release surfaces. }
      signing: { type: bool }
      changelog_format: { type: string }

  workflow:
    children:
      type: { type: string, description: Workflow type key (full_pipeline, hotfix, …). }
      custom_stages: { type: list, description: Extra stages beyond template default. }
      skip_stages: { type: list, description: Template stages to omit. }
      stage_overrides: { type: map, description: Per-stage config patches. }
