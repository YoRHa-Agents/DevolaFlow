[task]
id = "devolaflow-compress-014"
name = "compression-tool-output"
description = "clear_old_tool_uses truncation policy produces the expected ToolUseTruncation summary (kept_count / cleared_count) given 3 deterministic tool_use fixtures exercising keep-N retention, Read-tool exclusion, and under-budget no-op per ADR-002 §6 #10"
dimension = "analysis"
difficulty = 3
schema_version = "1.0"

[task.input]
type = "code"
language = "python"
source = "clear_old_tool_uses(tool_uses, keep=3, exclude_tool_names=('Read',))"

[task.expected]
type = "text"
value = "clear_old_tool_uses(tool_uses, keep=3, exclude_tool_names=('Read',))[1]  # ToolUseTruncation summary"

[task.golden]
expected_score = 1.0
scorer = "exact"

[task.metadata]
adr = "ADR-002"
probe_item = "§6 #10"
api_symbol = "devolaflow.compressor.clear_old_tool_uses"
summary_dataclass = "devolaflow.compressor.ToolUseTruncation"
long_output_chars = 2000
default_head_chars = 500
default_tail_chars = 500

# -- Case 1: basic keep=N retention, all non-Read records, all old tails truncated.
[[task.cases]]
id = "c1-keep3-all-shell"
description = "10 Shell tool_uses with long output, keep=3; the 3 most recent kept verbatim, 7 older tails truncated."
tool_uses = 10
tool_names = ["Shell", "Shell", "Shell", "Shell", "Shell", "Shell", "Shell", "Shell", "Shell", "Shell"]
keep = 3
exclude_tool_names = ["Read"]
output_char_length = 2000
expected_kept_count = 3
expected_cleared_count = 7
expected_kept_recent = 3
expected_retained_read = 0
expected_kept_count_equals_keep = true

# -- Case 2: Read-exclusion retention on mixed Read/Shell fixture (oldest→newest order).
# tool_names ordering is oldest-first → newest-last. With keep=1, idx 4 is always kept;
# older Reads at idx 0,1 are excluded-retained; older Shells at idx 2,3 are truncated.
[[task.cases]]
id = "c2-keep1-exclude-read"
description = "5 tool_uses (2 Read + 3 Shell, Reads oldest), keep=1 with exclude_tool_names=('Read',); recent Shell kept, 2 Reads retained verbatim, 2 older Shells truncated."
tool_uses = 5
tool_names = ["Read", "Read", "Shell", "Shell", "Shell"]
keep = 1
exclude_tool_names = ["Read"]
output_char_length = 2000
expected_kept_count = 3
expected_cleared_count = 2
expected_kept_recent = 1
expected_retained_read = 2
expected_kept_count_equals_keep = false

# -- Case 3: under-budget no-op — len(tool_uses) < keep, so nothing is truncated.
[[task.cases]]
id = "c3-under-budget-noop"
description = "4 Shell tool_uses, keep=10; all records are 'recent' (threshold_index = max(4-10, 0) = 0); no output is truncated."
tool_uses = 4
tool_names = ["Shell", "Shell", "Shell", "Shell"]
keep = 10
exclude_tool_names = ["Read"]
output_char_length = 2000
expected_kept_count = 4
expected_cleared_count = 0
expected_kept_recent = 4
expected_retained_read = 0
expected_kept_count_equals_keep = false

[task.expectations]
invariant_kept_plus_cleared = "kept_count + cleared_count == len(tool_uses)"
invariant_recency_order = "the last `keep` records are always preserved verbatim in insertion order"
invariant_exclusion = "records whose name is in exclude_tool_names are preserved verbatim regardless of age"
summary_fields = ["kept_count", "cleared_count", "head_chars", "tail_chars", "placeholder", "excluded_tool_names"]
