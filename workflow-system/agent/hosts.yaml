# DevolaFlow Host Support Contract (HSC) — the single source of truth for
# host identity, support tier, delivery floor, and declared extras.
schema_version: 1
contract_version: "17.4.0"
hosts:
  cursor:
    display_name: Cursor
    aliases: []
    tier: guaranteed
    version_added: "0.1.0"
    floor:
      skill_delivery:
        kind: skill-dir
        sets: [core, references, examples]
        paths:
          project: .cursor/skills/devola-flow
          global: $HOME/.cursor/skills/devola-flow
      instruction_format:
        artifact: SKILL.md
        frontmatter: c5-full
        budget: {type: lines, max: 500}
      install_channels: [install.sh, devola-init, npm]
      doctor: {status: implemented, kind: stamp}
      tests: [tests/test_install_manifest.py, tests/test_build_skill.py]
    extras:
      boundary_bridge:
        status: designed
        scope: project
        config: [.cursor/hooks.json, .cursor/hooks/devola-boundary.sh]
        events: {file_write: [preToolUse], shell: [beforeShellExecution]}
        response: {family: stdout-json, always_exit: 0, deny_key: permission}
        host_fail_mode: open
        automation: automated
        fixtures: [tests/fixtures/hostbridge/cursor.json]
        fixture_provenance: TBD-audit
        provenance_ref: null
      session_resume: {status: implemented, event: sessionStart}
      subagent_dispatch: {status: native, primitive: Task}
      mcp: {status: undeclared}
      tool_vocabulary:
        status: implemented
        write: [Write, StrReplace]
        shell: [Bash]
      skill_residency:
        status: undeclared
        scope: none
        observation_method: No stable Cursor runtime observation channel is declared.
        fixtures: []
        fixture_provenance: TBD-audit
        provenance_ref: null
        reason: Cursor skill delivery is declared separately; runtime residency evidence is not captured.

