schema_version: "1.0"
kind: checklist-seed
metadata:
  name: web-design
  version: "1.0.0"
  description: "Seed for polished frontend design and deterministic refinement."
  category: composite
  intent_keywords: [web-design, frontend, landing-page, ui, design, polish, impeccable, ui-pro]
  source:
    kind: template
    name: web-design
    path: workflow-system/agent/templates/builtin/web-design.yaml
    schema_version: "1.0"
placeholders: {}
partitions:
  - key: visual-system
    title_template: "Visual system and implementation"
    source_stages:
      - {id: design, primitive: design}
      - {id: implement, primitive: implement}
    assertions:
      - key: design-realized
        statement_template: "The implemented interface follows the approved ui-pro visual system across responsive breakpoints"
        suggested_priority: P0
        verify: {mode: manual}
  - key: deterministic-refinement
    title_template: "Impeccable refinement and verification"
    source_stages:
      - {id: refine, primitive: refine}
      - {id: verify, primitive: verify}
    assertions:
      - key: antipatterns-clear
        statement_template: "Impeccable refinement is applied when available and deterministic anti-pattern count is zero"
        suggested_priority: P0
        verify: {mode: metric, template: "antipattern_count == 0"}
