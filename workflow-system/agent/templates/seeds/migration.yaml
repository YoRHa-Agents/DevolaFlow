schema_version: "1.0"
kind: checklist-seed
metadata:
  name: migration
  version: "1.0.0"
  description: "Seed for migration assessment, implementation, validation, and cutover."
  category: build
  intent_keywords: [migrate, upgrade, transition, port]
  source:
    kind: template
    name: migration
    path: workflow-system/agent/templates/builtin/migration.yaml
    schema_version: "1.0"
placeholders: {}
partitions:
  - key: assessment
    title_template: "Migration assessment and plan"
    source_stages:
      - {id: assessment, primitive: analyze}
      - {id: plan, primitive: plan}
    assertions:
      - key: risks-planned
        statement_template: "Dependencies, migration risks, cutover criteria, and rollback strategy are documented"
        suggested_priority: P0
        verify: {mode: manual}
  - key: implementation
    title_template: "Migration implementation"
    source_stages:
      - {id: implement, primitive: implement}
    assertions:
      - key: scope-migrated
        statement_template: "Every in-scope component is migrated without unapproved compatibility loss"
        suggested_priority: P0
        verify: {mode: metric, template: "unmigrated_in_scope_components == 0"}
  - key: cutover
    title_template: "Validation and cutover"
    source_stages:
      - {id: validate, primitive: validate}
      - {id: cutover, primitive: deploy}
    assertions:
      - key: rollback-ready
        statement_template: "Integrity and functionality pass before cutover, with rollback readiness confirmed"
        suggested_priority: P0
        verify: {mode: manual}
