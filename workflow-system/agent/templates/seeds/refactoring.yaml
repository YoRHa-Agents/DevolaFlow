schema_version: "1.0"
kind: checklist-seed
metadata:
  name: refactoring
  version: "1.0.0"
  description: "Seed for behavior-preserving technical-debt reduction."
  category: build
  intent_keywords: [refactor, tech-debt, improve, restructure]
  source:
    kind: composition
    name: refactoring
    path: workflow-system/agent/templates/registry.yaml
    schema_version: "2.0"
placeholders: {}
partitions:
  - key: scope-plan
    title_template: "Refactoring scope and plan"
    source_stages:
      - {id: scope_analysis, primitive: analyze}
      - {id: plan, primitive: plan}
    assertions:
      - key: boundaries-fixed
        statement_template: "Behavioral invariants, ownership boundaries, and rollback points are documented before edits"
        suggested_priority: P0
        verify: {mode: manual}
  - key: implementation-quality
    title_template: "Implementation quality"
    source_stages:
      - {id: implement, primitive: implement}
      - {id: test, primitive: test}
      - {id: review, primitive: review}
    assertions:
      - key: behavior-preserved
        statement_template: "Tests and review confirm preserved behavior with reduced structural debt"
        suggested_priority: P0
        verify: {mode: metric, template: "test_failures == 0 and review_blockers == 0"}
