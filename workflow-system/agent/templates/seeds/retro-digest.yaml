schema_version: "1.0"
kind: checklist-seed
metadata:
  name: retro-digest
  version: "1.0.0"
  description: "Seed for deterministic retrospective extraction, optional curation, and report-only cycle learning."
  category: composite
  intent_keywords: [retro-digest, retrospective, digest, learnings, lessons, cycle-close, report-only]
  applicable_scenarios: [cycle-close, retrospective-review, historical-learning]
  source:
    kind: composition
    name: retro-digest
    path: workflow-system/agent/templates/registry.yaml
    schema_version: "3.0"
placeholders: {}
partitions:
  - key: grilling-decision-contract
    title_template: "Grilling decision contract"
    source_stages:
      - {id: grill-decision, primitive: review}
    assertions:
      - key: decision-contract-anchored
        statement_template: "The digest scope, persistence boundary, and operator decision are clarified before extraction or storage"
        suggested_priority: P0
        verify: {mode: manual}
      - key: no-new-activation-surface
        statement_template: "The method adds no new environment flag or CLI surface"
        suggested_priority: P0
        verify: {mode: manual}
  - key: phase-0-read-only-audits
    title_template: "Phase 0 read-only audits"
    source_stages:
      - {id: phase-0-audits, primitive: analyze}
    assertions:
      - key: deterministic-verbatim-extraction
        statement_template: "Base extraction is deterministic and preserves verbatim source text with repository-relative provenance"
        suggested_priority: P0
        verify: {mode: manual}
      - key: report-only-default
        statement_template: "Phase 0 audits are read-only and report-only by default"
        suggested_priority: P0
        verify: {mode: manual}
  - key: bounded-pv-implementation
    title_template: "Bounded PV implementation"
    source_stages:
      - {id: bounded-pv, primitive: implement}
    assertions:
      - key: curation-optional
        statement_template: "L0 curation is optional metadata over immutable source records and cannot rewrite extracted text"
        suggested_priority: P0
        verify: {mode: manual}
  - key: cycle-close-and-digest
    title_template: "Cycle close and digest"
    source_stages:
      - {id: cycle-close, primitive: release}
    assertions:
      - key: persistence-consent
        statement_template: "Persistence of selected digest entries occurs only after explicit operator consent"
        suggested_priority: P0
        verify: {mode: manual}
      - key: digest-close-evidence
        statement_template: "Cycle-close output separates lessons from report-only benefits and records complete source evidence"
        suggested_priority: P1
        verify: {mode: manual}
