schema_version: "1.0"
kind: checklist-seed
metadata:
  name: demo-showcase
  version: "1.0.0"
  description: "Seed for a polished demonstration or presentation."
  category: composite
  intent_keywords: [demo, showcase, presentation, prototype, ui, visual, pitch]
  source:
    kind: composition
    name: demo-showcase
    path: workflow-system/agent/templates/registry.yaml
    schema_version: "2.0"
placeholders: {}
partitions:
  - key: narrative
    title_template: "Demo research and design"
    source_stages:
      - {id: research, primitive: research}
      - {id: design, primitive: design}
    assertions:
      - key: story-audience-fit
        statement_template: "The demo narrative and visual direction match the target audience and evidence"
        suggested_priority: P1
        verify: {mode: manual}
  - key: showcase
    title_template: "Build, review, refinement, and package"
    source_stages:
      - {id: build, primitive: implement}
      - {id: review, primitive: review}
      - {id: refine, primitive: refine}
      - {id: package, primitive: release}
    assertions:
      - key: showcase-ready
        statement_template: "Critical presentation flows pass review and the distributable package reproduces them"
        suggested_priority: P0
        verify: {mode: manual}
