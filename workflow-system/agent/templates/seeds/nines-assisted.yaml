schema_version: "1.0"
kind: checklist-seed
metadata:
  name: nines-assisted
  version: "1.0.0"
  description: "Opaque historical compatibility seed ID; assertions use built-in harness evidence."
  category: composite
  intent_keywords: [nines-assisted, historical, compatibility]
  source:
    kind: composition
    name: nines-assisted
    path: workflow-system/agent/templates/registry.yaml
    schema_version: "3.0"
placeholders: {}
partitions:
  - key: assisted-discovery
    title_template: "Assisted discovery and design"
    source_stages:
      - {id: precondition, primitive: implement}
      - {id: research, primitive: research}
      - {id: design, primitive: design}
      - {id: plan, primitive: plan}
    assertions:
      - key: assistance-accounted
        statement_template: "Built-in harness evidence, findings, architecture, and implementation plan are explicitly recorded"
        suggested_priority: P1
        verify: {mode: manual}
  - key: delivery
    title_template: "Implementation convergence"
    source_stages:
      - {id: impl, primitive: implement}
      - {id: review, primitive: review}
      - {id: test, primitive: test}
      - {id: refine, primitive: refine}
    assertions:
      - key: quality-converged
        statement_template: "Implementation passes review and tests with at least eighty percent coverage"
        suggested_priority: P0
        verify: {mode: metric, template: "review_blockers == 0 and coverage_pct >= 80"}
  - key: release-readiness
    title_template: "Validation and release"
    source_stages:
      - {id: validate, primitive: validate}
      - {id: release, primitive: release}
    assertions:
      - key: release-approved
        statement_template: "Validation passes all criteria and release has explicit human approval"
        suggested_priority: P0
        verify: {mode: manual}
