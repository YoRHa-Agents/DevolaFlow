schema_version: "1.0"
kind: checklist-seed
metadata:
  name: design-only
  version: "1.0.0"
  description: "Seed for research-backed architecture design."
  category: shape
  intent_keywords: [design, research, review, architecture]
  source:
    kind: composition
    name: design-only
    path: workflow-system/agent/templates/registry.yaml
    schema_version: "2.0"
placeholders: {}
partitions:
  - key: context
    title_template: "Design context"
    source_stages:
      - {id: research, primitive: research}
    assertions:
      - key: constraints-known
        statement_template: "Design constraints, existing interfaces, and prior decisions are evidenced"
        suggested_priority: P1
        verify: {mode: manual}
  - key: architecture
    title_template: "Architecture and review"
    source_stages:
      - {id: design, primitive: design}
      - {id: review, primitive: review}
    assertions:
      - key: design-reviewed
        statement_template: "Architecture, interfaces, trade-offs, and failure modes pass independent review"
        suggested_priority: P0
        verify: {mode: metric, template: "unresolved_design_blockers == 0"}
