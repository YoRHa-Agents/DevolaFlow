schema_version: "1.0"
kind: checklist-seed
metadata:
  name: full-pipeline
  version: "1.0.0"
  description: "Seed for an end-to-end greenfield delivery."
  category: composite
  intent_keywords: [full, pipeline, feature, implementation, release]
  source:
    kind: composition
    name: full-pipeline
    path: workflow-system/agent/templates/registry.yaml
    schema_version: "2.0"
placeholders: {}
partitions:
  - key: solution-shape
    title_template: "Solution design and plan"
    source_stages:
      - {id: design, primitive: design}
      - {id: plan, primitive: plan}
    assertions:
      - key: solution-approved
        statement_template: "Architecture, interfaces, task ownership, and acceptance assertions are approved"
        suggested_priority: P0
        verify: {mode: manual}
  - key: build-convergence
    title_template: "Build and convergence"
    source_stages:
      - {id: impl, primitive: implement}
      - {id: review, primitive: review}
      - {id: test, primitive: test}
      - {id: verify, primitive: verify}
      - {id: refine, primitive: refine}
      - {id: testgate, primitive: validate}
    assertions:
      - key: quality-green
        statement_template: "Implementation, review, tests, verification, and refinement converge with zero blockers"
        suggested_priority: P0
        verify: {mode: metric, template: "quality_blockers == 0 and acceptance_pass_rate == 1.0"}
  - key: release
    title_template: "Release readiness"
    source_stages:
      - {id: release, primitive: release}
    assertions:
      - key: release-approved
        statement_template: "Release artifacts and rollback instructions receive explicit approval"
        suggested_priority: P1
        verify: {mode: manual}
