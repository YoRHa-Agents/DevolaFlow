schema_version: "1.0"
kind: checklist-seed
metadata:
  name: documentation-only
  version: "1.0.0"
  description: "Seed for accurate documentation authoring."
  category: deliver
  intent_keywords: [documentation, docs, write, review]
  source:
    kind: composition
    name: documentation-only
    path: workflow-system/agent/templates/registry.yaml
    schema_version: "2.0"
placeholders: {}
partitions:
  - key: source-survey
    title_template: "Documentation source survey"
    source_stages:
      - {id: survey, primitive: research}
    assertions:
      - key: truth-sources-known
        statement_template: "Behavioral claims are mapped to current source-of-truth code or specifications"
        suggested_priority: P1
        verify: {mode: manual}
  - key: author-review
    title_template: "Authoring and review"
    source_stages:
      - {id: author, primitive: implement}
      - {id: review, primitive: review}
    assertions:
      - key: docs-accurate
        statement_template: "Documentation is complete, link-valid, audience-appropriate, and free of ghost features"
        suggested_priority: P0
        verify: {mode: manual}
