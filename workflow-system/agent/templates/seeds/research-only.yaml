schema_version: "1.0"
kind: checklist-seed
metadata:
  name: research-only
  version: "1.0.0"
  description: "Seed for evidence-backed research and comparison."
  category: discover
  intent_keywords: [research, compare, evaluate]
  source:
    kind: composition
    name: research-only
    path: workflow-system/agent/templates/registry.yaml
    schema_version: "2.0"
placeholders: {}
partitions:
  - key: investigation
    title_template: "Research and comparison"
    source_stages:
      - {id: research, primitive: research}
      - {id: compare, primitive: analyze}
    assertions:
      - key: alternatives-evidenced
        statement_template: "Relevant alternatives are compared against explicit criteria with cited evidence"
        suggested_priority: P1
        verify: {mode: manual}
  - key: report
    title_template: "Validated report"
    source_stages:
      - {id: report, primitive: validate}
    assertions:
      - key: recommendation-traceable
        statement_template: "Every recommendation is traceable to findings, constraints, and unresolved uncertainty"
        suggested_priority: P1
        verify: {mode: manual}
