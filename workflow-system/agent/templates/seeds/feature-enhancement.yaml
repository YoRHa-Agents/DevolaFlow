schema_version: "1.0"
kind: checklist-seed
metadata:
  name: feature-enhancement
  version: "1.0.0"
  description: "Seed for extending an existing feature."
  category: composite
  intent_keywords: [feature, enhance, extend, modify]
  source:
    kind: composition
    name: feature-enhancement
    path: workflow-system/agent/templates/registry.yaml
    schema_version: "2.0"
placeholders: {}
partitions:
  - key: feature-contract
    title_template: "Feature scope, design, and plan"
    source_stages:
      - {id: scope, primitive: analyze}
      - {id: design, primitive: design}
      - {id: plan, primitive: plan}
    assertions:
      - key: contract-reviewed
        statement_template: "Scope, interfaces, compatibility constraints, and acceptance assertions are reviewed"
        suggested_priority: P0
        verify: {mode: manual}
  - key: delivery
    title_template: "Feature delivery"
    source_stages:
      - {id: implement, primitive: implement}
      - {id: review, primitive: review}
      - {id: test, primitive: test}
      - {id: release, primitive: release}
    assertions:
      - key: feature-ready
        statement_template: "Implementation passes review and tests before release evidence is approved"
        suggested_priority: P0
        verify: {mode: metric, template: "review_blockers == 0 and test_failures == 0"}
