schema_version: "1.0"
kind: checklist-seed
metadata:
  name: harness-construction
  version: "1.0.0"
  description: "Seed for building harness infrastructure with machine-grounded gap analysis at preflight and a capability review at archive."
  category: composite
  intent_keywords: [harness, evaluation-infrastructure, observability, telemetry, coverage, gap-analysis, baseline]
  source:
    kind: composition
    name: harness-construction
    path: workflow-system/agent/templates/registry.yaml
    schema_version: "3.0"
placeholders: {}
partitions:
  - key: inventory
    title_template: "Harness capability inventory"
    source_stages:
      - {id: survey, primitive: research}
      - {id: capability_map, primitive: analyze}
    assertions:
      - key: surfaces-inventoried
        statement_template: "Every existing harness capability surface is inventoried with its machine evidence source"
        suggested_priority: P1
        verify: {mode: manual}
  - key: gap-analysis
    title_template: "Machine-grounded gap analysis"
    source_stages:
      - {id: gap_analysis, primitive: analyze}
    assertions:
      - key: gap-report-frozen
        statement_template: "The machine gap report JSON exists and is frozen as preflight evidence"
        suggested_priority: P0
        verify: {mode: command, template: "python -m devolaflow.harness gap --ledger .local/telemetry/harness.jsonl --repo . --output evidence/harness_gap_before.json"}
      - key: gaps-cited-verbatim
        statement_template: "Every committed coverage gap is cited verbatim from the gap report JSON"
        suggested_priority: P0
        verify: {mode: manual}
  - key: infra-build
    title_template: "Harness infrastructure build"
    source_stages:
      - {id: build_infra, primitive: implement}
      - {id: refine_infra, primitive: refine}
    assertions:
      - key: committed-axes-built
        statement_template: "Every committed observation point, probe, baseline, and loop closure is implemented with tests"
        suggested_priority: P0
        verify: {mode: manual}
  - key: capability-review
    title_template: "Capability delta review"
    source_stages:
      - {id: capability_review, primitive: validate}
      - {id: verify_delta, primitive: verify}
    assertions:
      - key: capability-delta-recorded
        statement_template: "The archive review records the before and after gap reports and the capability delta"
        suggested_priority: P1
        verify: {mode: manual}
