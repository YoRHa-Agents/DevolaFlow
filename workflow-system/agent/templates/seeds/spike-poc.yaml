schema_version: "1.0"
kind: checklist-seed
metadata:
  name: spike-poc
  version: "1.0.0"
  description: "Seed for a bounded proof of concept."
  category: discover
  intent_keywords: [spike, poc, prototype, experiment]
  source:
    kind: composition
    name: spike-poc
    path: workflow-system/agent/templates/registry.yaml
    schema_version: "2.0"
placeholders: {}
partitions:
  - key: hypothesis
    title_template: "Research hypothesis"
    source_stages:
      - {id: research, primitive: research}
    assertions:
      - key: question-bounded
        statement_template: "The prototype question, time box, and success threshold are explicit"
        suggested_priority: P1
        verify: {mode: manual}
  - key: prototype-verdict
    title_template: "Prototype and evaluation"
    source_stages:
      - {id: prototype, primitive: implement}
      - {id: evaluate, primitive: validate}
    assertions:
      - key: disposition-decided
        statement_template: "Prototype evidence supports an explicit adopt, revise, or discard verdict"
        suggested_priority: P0
        verify: {mode: manual}
