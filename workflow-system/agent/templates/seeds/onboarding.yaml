schema_version: "1.0"
kind: checklist-seed
metadata:
  name: onboarding
  version: "1.0.0"
  description: "Seed for contributor onboarding."
  category: discover
  intent_keywords: [onboarding, setup, getting-started, contributor, codebase]
  source:
    kind: composition
    name: onboarding
    path: workflow-system/agent/templates/registry.yaml
    schema_version: "2.0"
placeholders: {}
partitions:
  - key: codebase-orientation
    title_template: "Codebase orientation"
    source_stages:
      - {id: analyze, primitive: analyze}
      - {id: document, primitive: implement}
    assertions:
      - key: entry-points-documented
        statement_template: "Key entry points, architecture, and contributor paths are documented using codegraph when available"
        suggested_priority: P1
        verify: {mode: manual}
  - key: contributor-setup
    title_template: "Contributor setup and verification"
    source_stages:
      - {id: setup, primitive: implement}
      - {id: verify, primitive: test}
    assertions:
      - key: first-run-green
        statement_template: "A new contributor can reproduce setup and pass the documented first-run checks"
        suggested_priority: P0
        verify: {mode: metric, template: "onboarding_smoke_failures == 0"}
