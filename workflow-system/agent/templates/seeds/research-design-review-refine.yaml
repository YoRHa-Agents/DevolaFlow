schema_version: "1.0"
kind: checklist-seed
metadata:
  name: research-design-review-refine
  version: "1.0.0"
  description: "Seed for iterative research and design refinement."
  category: composite
  intent_keywords: [research, design, review, refine, iterate]
  source:
    kind: composition
    name: research-design-review-refine
    path: workflow-system/agent/templates/registry.yaml
    schema_version: "2.0"
placeholders: {}
partitions:
  - key: initial-design
    title_template: "Research and design"
    source_stages:
      - {id: research, primitive: research}
      - {id: design, primitive: design}
    assertions:
      - key: design-evidenced
        statement_template: "The design traces decisions and trade-offs to research evidence"
        suggested_priority: P1
        verify: {mode: manual}
  - key: refinement
    title_template: "Review and refinement"
    source_stages:
      - {id: review, primitive: review}
      - {id: refine, primitive: refine}
      - {id: knowledge_gap_research, primitive: research}
    assertions:
      - key: gaps-closed
        statement_template: "Review blockers and discovered knowledge gaps are resolved or explicitly deferred"
        suggested_priority: P0
        verify: {mode: metric, template: "unresolved_review_blockers == 0"}
