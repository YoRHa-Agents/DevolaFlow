# Depth modes: core|standard|full — see parameters.mode (Option α per .local/research/v7.4.2_gap_analysis.md §E.5)
schema_version: "1.0"

metadata:
  name: repo-init
  version: "1.0.0"
  display_name: "Repo Workspace & Governance Init"
  description: >
    Initialize repo workspace (.local/) and governance rules (.rules/),
    detect AI tools present, and (optionally) compile rules to all
    detected tool-native formats. Default depth (mode=core) runs
    analyze + scaffold only; mode=standard adds rule compilation;
    mode=full adds compilation, an interactive interview stage, and
    verification smoke tests.
  category: discover
  applicable_scenarios:
    - "Bootstrapping DevolaFlow into a fresh repo"
    - "Adding .local/ + .rules/ to an existing project"
    - "Migrating from .cursor/rules/ to the 5-layer model"
    - "Mirroring Claude Code /init parity in a DevolaFlow workflow"
  tags: [init, scaffold, bootstrap, repo, workspace, rules]

stages:
  - id: analyze
    primitive: analyze
    alias: repo-survey
    description: "Survey repo — detect existing AI tool dirs, read pyproject/package.json, infer language and build commands"
    team: research
    duration_class: quick
    config:
      analysis_type: structure
      severity_threshold: low
      # v12.5.0 PV-04 D-1.2: codegraph CLI surfaces (informational hint —
      # the L3 agent invokes these on demand; the workflow runner does
      # NOT auto-execute). When .codegraph/ exists from the scaffold
      # step's codegraph_init sub-step, these commands return rich
      # repo-shape data without bespoke fs scanning. When absent /
      # codegraph CLI unavailable, the agent falls back to Read/Glob/Grep
      # per references/degraded-mode.md.
      codegraph_commands:
        status: "codegraph status"
        files: "codegraph files --format tree"

  - id: scaffold
    primitive: implement
    alias: workspace-scaffold
    description: "Create .local/{feedbacks,tasks,memory,.agent/{active,handoff,archive}}/ + index.md + .rules/ with 8-path canonical manifest in config; write CLAUDE.md / AGENTS.md if missing"
    team: implement
    duration_class: quick
    config:
      test_strategy: no_test
      canonical_manifest:
        - ".local/feedbacks/"
        - ".local/tasks/"
        - ".local/memory/"
        - ".local/index.md"
        - ".rules/compile-config.yaml"
        - ".local/.agent/active/"
        - ".local/.agent/handoff/"
        - ".local/.agent/archive/"
      # Track C-3 D-11 (full_review_and_improve): OVERTURNS the locked
      # operator decision 2026-05-23 ("codegraph_init runs synchronously
      # in ALL modes"). The R5 F2 clean-venv reproduction showed the npm
      # cold install is minutes + tens of MB (not the documented ~28KB)
      # and large-repo indexing blocks the foreground. codegraph is now
      # SUGGEST-tier + backgrounded:
      #
      #   1. PROBE (tier: suggest) — `command -v codegraph` (code surface:
      #      devolaflow.codegraph.is_codegraph_available). CLI
      #      absent → SKIP: do not install, do not run; emit ONE hint
      #      suggesting `npm i -g @colbymchenry/codegraph`. Runtime install
      #      happens ONLY under the existing
      #      DEVOLAFLOW_AUTO_INSTALL_PLUGINS=1 opt-in (W-20 reuse — no new
      #      flag). Downstream analyze falls back to Read/Glob/Grep per
      #      references/degraded-mode.md.
      #   2. BACKGROUND (execution: background) — CLI present → launch the
      #      init as a background task (tool-native background shell),
      #      write `.codegraph/.indexing` (pid + started_at) and continue
      #      the scaffold IMMEDIATELY. On completion the task swaps the
      #      marker to `.codegraph/.ready` (duration verbatim) or
      #      `.codegraph/.failed` (error summary; S-5 not silent). Marker
      #      helpers: devolaflow.codegraph.markers.{mark_indexing,
      #      mark_ready, mark_failed, read_marker_state}.
      #   3. DOWNSTREAM — analyze consumers (onboarding / security-audit /
      #      product-verification) check the marker FIRST: ready → use the
      #      index; indexing → bounded wait or degrade; failed / absent →
      #      degrade immediately (one WARN).
      #
      # The `.codegraph/` gitignore entry is OWNED by the deterministic
      # scaffold code path since Track C-1
      # (devolaflow.local.workspace.SCAFFOLD_GITIGNORE_ENTRIES — written
      # BEFORE any codegraph run, decoupled from its outcome). The
      # add_to_gitignore hint below is retained as documentation for
      # pre-C-1 consumers; it is NOT the mechanism.
      #
      # on_failure: "warn" — degraded-mode contract unchanged (PV-05
      # codegraph row): codegraph failures NEVER block the workflow.
      codegraph_init:
        cmd: "codegraph init {project_root}"
        on_failure: "warn"
        tier: suggest
        execution: background
        probe: "command -v codegraph"
        markers:
          indexing: ".codegraph/.indexing"
          ready: ".codegraph/.ready"
          failed: ".codegraph/.failed"
        add_to_gitignore:
          - ".codegraph/"
    input_mapping:
      tasks: "analyze.findings"

  - id: compile
    primitive: implement
    alias: rule-compile
    description: "Compile .rules/*.mdc to detected adapter targets (Cursor MDC, AGENTS.md, Codex, Copilot); SKIPPED under mode=core (analyze+scaffold only)"
    team: implement
    duration_class: quick
    config:
      test_strategy: no_test
    input_mapping:
      detected_tools: "analyze.findings.tools"
    skip_condition: "mode == 'core'"

  - id: interview
    primitive: analyze
    alias: interactive-interview
    description: >
      8-phase interactive interview (mode=full only): P1 ask intent
      (mode + skills/hooks toggle), P2 explore codebase (reuse analyze
      findings), P3 fill gaps (team conventions, branch strategy, prefs),
      P4 generate .rules/ source rules, P5 write .local/memory/prefs.md,
      P6 suggest and create skills (.claude/skills/ .cursor/skills/),
      P7 detect formatters and configure hooks, P8 summary + next steps.
      Uses init_interview.py for detection and generation logic.
    team: research
    duration_class: medium
    config:
      phases: [ask_intent, explore, fill_gaps, gen_rules, gen_prefs, gen_skills, gen_hooks, summary]
    skip_condition: "mode != 'full'"

  - id: verify
    primitive: verify
    alias: init-smoke
    description: "(opt-in: mode=full) Smoke-verify scaffold — assert .local/ exists, .rules/ compiles cleanly, no drift; SKIPPED unless mode=full"
    team: test
    duration_class: quick
    config:
      suites: [smoke]
      fail_fast: true
      coverage_threshold: 0.0
      # v12.5.0 PV-04 D-1.2: codegraph index presence check runs ONLY at
      # mode=full as a verification gate. When .codegraph/codegraph.db is
      # missing under mode=full, this is a degraded-mode signal worth
      # surfacing — but per S-5 the smoke test treats absence as a WARN
      # (not a hard failure) so codegraph install / network failures do
      # not break repo-init verification altogether.
      #
      # Track C-3: with the scaffold init now BACKGROUNDED, absence at
      # verify time may simply mean "still indexing" — check
      # `.codegraph/.indexing` / `.ready` / `.failed` (marker protocol,
      # devolaflow.codegraph.markers) before wording the WARN.
      codegraph_smoke:
        path: ".codegraph/codegraph.db"
        on_missing: "warn"
    skip_condition: "mode != 'full'"

composition:
  compose: sequence
  stages:
    - stage: analyze
    - stage: scaffold
    - stage: compile
    - stage: interview
    - stage: verify

loops: []

gates: []

environment_modes:
  local:
    skip_stages: []
  github:
    extra_stages: []

# Depth-mode parameter (Option α — .local/research/v7.4.2_gap_analysis.md §E.5).
# Surfaced in SKILL.md Workflow Selection row for repo-init.
parameters:
  mode:
    type: enum
    default: core
    choices: [core, standard, full]
    description: >
      Mode selects STAGES, not files — canonical_manifest (8 paths, since
      v8.2.3) is ALWAYS required regardless of mode. The 8 paths are the
      original 5 (.local/{feedbacks,tasks,memory}/, .local/index.md,
      .rules/compile-config.yaml) plus the v8.2.3 .agent/{active,handoff,
      archive}/ substrate. See SKILL.md §Repo-Init Pre-Dispatch Contract.
      core     — analyze + scaffold only (DEFAULT — canonical layout still required, skips compile/interview/verify)
      standard — analyze + scaffold + compile (adds rule compilation across detected adapters)
      full     — all five stages including interview and verify smoke tests
