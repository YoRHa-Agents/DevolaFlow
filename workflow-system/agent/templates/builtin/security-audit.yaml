# DEPRECATED in v11.0.0; will be removed in v12.0.0
# This template was REGISTERED but never invoked in v9.x-v10.x cycles per
# .local/research/v11.0.0_patches/D-A-2.md §1 audit. Phase B compose-not-define
# collapse deferred to v12.0+.
schema_version: "1.0"

metadata:
  name: security-audit
  version: "1.0.0"
  display_name: "Security Audit"
  description: >
    Security-focused workflow: model threats, scan for vulnerabilities,
    analyze findings, remediate, and verify fixes.
  category: composite
  applicable_scenarios:
    - "Pre-release security review"
    - "CVE response and remediation"
    - "Compliance audit (SOC2, HIPAA)"
    - "Dependency vulnerability scanning"
  tags: [security, audit, vulnerability, CVE, scan, compliance, threat]

stages:
  - id: threat_model
    primitive: research
    alias: threat-model
    description: "Identify and model potential threats against the system"
    team: research
    duration_class: medium
    config:
      depth: comprehensive
      source_types: [docs, repo]

  - id: scan
    primitive: analyze
    alias: scan
    description: "Run automated security scans — SAST, DAST, dependency audit"
    team: test
    duration_class: medium
    config:
      analysis_type: security
      severity_threshold: low
      include_metrics: true
    input_mapping:
      targets: "threat_model.findings"

  - id: analyze
    primitive: analyze
    description: "Deep analysis of scan results — prioritize findings, assess exploitability"
    team: research
    duration_class: medium
    config:
      analysis_type: security
      severity_threshold: medium
      include_metrics: true
      # v12.5.0 PV-04 D-1.2: codegraph CLI surfaces for security analyze.
      # The agent invokes these on demand to map attack surface around
      # auth/session/jwt/csrf identifiers — `codegraph callers` traces
      # reverse-call edges from sensitive entry points; `codegraph
      # impact` returns blast-radius for proposed remediation patches.
      # Replaces the typical Grep+Read pattern (-65% est. token spend
      # per .local/research/v12.5.0_codegraph_benefit_analysis.md §2.3).
      # Degraded fallback per references/degraded-mode.md (PV-05).
      codegraph_commands:
        callers: "codegraph callers {auth_handler} --limit 20 --json"
        impact: "codegraph impact {auth_module} --depth 3 --json"
    input_mapping:
      targets: "scan.findings"

  - id: remediate
    primitive: implement
    alias: remediate
    description: "Implement security fixes for identified vulnerabilities"
    team: implement
    duration_class: long
    config:
      test_strategy: test_after
      target_coverage: 0.80
    input_mapping:
      tasks: "analyze.priority_ranking"

  - id: verify
    primitive: validate
    alias: verify
    description: "Verify that remediations are effective and no new vulnerabilities introduced"
    team: test
    duration_class: medium
    config:
      require_all_criteria: true

composition:
  compose: sequence
  stages:
    - stage: threat_model
    - stage: scan
    - stage: analyze
    - compose: loop
      ref: remediate_verify_loop

loops:
  - name: remediate_verify_loop
    body_stages: [remediate, verify]
    until: "verify.ready == true"
    max_iterations: 3
    on_exhaustion: escalate
    escalation_target: analyze

gates: []

environment_modes:
  local:
    skip_stages: []
  github:
    extra_stages: []
