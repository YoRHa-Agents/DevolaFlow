schema_version: "1.0"

metadata:
  name: product-verification
  version: "1.0.0"
  display_name: "Product Verification Pipeline"
  description: >
    End-to-end product quality verification workflow. Designs test strategies from
    acceptance criteria, executes multi-level verification (unit → integration → E2E →
    visual → accessibility → acceptance), and produces structured feedback for iterative
    improvement. Use when comprehensive user-facing quality validation is required.
  category: composite
  applicable_scenarios:
    - "User-facing feature verification"
    - "Visual regression testing for web applications"
    - "Acceptance criteria validation"
    - "Accessibility compliance verification"
    - "Product release readiness assessment"
  tags: [verify, visual, acceptance, interaction, accessibility, uat, e2e, product, quality]

stages:
  - id: analyze
    primitive: analyze
    description: >
      Analyze the target product/feature: identify testable surfaces, extract acceptance
      criteria, catalog user flows, determine visual baseline requirements, assess
      accessibility scope.
    team: research
    duration_class: medium
    config:
      analysis_type: test_surface
      output_format: test_strategy

  - id: design_tests
    primitive: design
    description: >
      Design comprehensive test strategy covering all verification levels:
      developer-side (unit, integration), user-facing (visual, acceptance, interaction,
      accessibility). Map acceptance criteria to test cases. Define visual baselines
      and user flow scenarios.
    team: design
    duration_class: medium
    config:
      design_type: test_strategy
      formality: standard
    input_mapping:
      analysis: "analyze"

  - id: implement_tests
    primitive: implement
    description: >
      Implement the designed test cases: unit tests, integration tests, visual test
      configurations, acceptance test specs (Gherkin/BDD), E2E user flow scripts,
      accessibility test setup.
    team: implement
    duration_class: long
    config:
      test_strategy: tdd
      target_coverage: 0.80
    input_mapping:
      test_strategy: "design_tests"

  - id: execute_dev_tests
    primitive: test
    description: >
      Execute developer-side test suites: unit tests, integration tests.
      Measure code coverage and identify gaps.
    team: test
    duration_class: medium
    config:
      suites: [unit, integration]
      coverage_threshold: 0.80
      fail_fast: false
    input_mapping:
      test_code: "implement_tests.test_files"

  - id: execute_verification
    primitive: verify
    description: >
      Execute user-facing verification: visual regression tests (screenshot comparison),
      acceptance criteria tests, E2E interaction flow tests, accessibility compliance
      checks. Produces verification scores across all dimensions.
    team: test
    duration_class: medium
    config:
      visual_testing:
        enabled: true
        threshold: 0.90
        mask_dynamic: true
      acceptance_testing:
        enabled: true
        criteria_source: "design_tests.acceptance_criteria"
      interaction_testing:
        enabled: true
      accessibility:
        enabled: true
        standard: "WCAG2.1-AA"
        threshold: 90
    input_mapping:
      dev_test_results: "execute_dev_tests"
      acceptance_criteria: "design_tests.acceptance_criteria"

  - id: review_results
    primitive: review
    description: >
      Review all verification results. Classify findings by severity. Evaluate
      visual diffs, accessibility violations, acceptance gaps. Produce actionable
      feedback for improvement.
    team: review
    duration_class: medium
    config:
      review_type: verification
      pass_threshold: 0.85
      require_zero_blocking: true
    input_mapping:
      dev_results: "execute_dev_tests"
      verification_results: "execute_verification"

  - id: refine
    primitive: refine
    description: >
      Address findings from verification and review: fix visual regressions,
      resolve accessibility violations, close acceptance gaps, fix failing
      user flows.
    team: implement
    duration_class: medium
    config:
      scope: targeted
      allow_new_features: false
    input_mapping:
      findings: "review_results.findings"
      verification_gaps: "execute_verification.findings"

  - id: validate
    primitive: validate
    alias: verification_gate
    description: >
      Final verification readiness assessment. Aggregate all verification scores
      (developer-side + user-facing) into composite quality verdict. Gate blocks
      release if any dimension below threshold.
    team: review
    duration_class: quick
    config:
      require_all_criteria: true
      allow_waivers: false
    input_mapping:
      dev_test_results: "execute_dev_tests"
      verification_results: "execute_verification"
      review_verdict: "review_results"

composition:
  compose: sequence
  stages:
    - stage: analyze
    - stage: design_tests
    - compose: gate
      ref: test_design_gate
    - stage: implement_tests
    - compose: loop
      ref: verification_cycle
    - compose: gate
      ref: verification_gate
    - stage: validate

loops:
  - name: verification_cycle
    body_stages: [execute_dev_tests, execute_verification, review_results, refine]
    until: "review_results.verdict == 'PASS'"
    max_iterations: 3
    on_exhaustion: escalate
    escalation_target: design_tests
    escalation_max: 1

gates:
  - name: test_design_gate
    position: "after:design_tests"
    criteria:
      - field: design_tests.acceptance_criteria
        operator: "!="
        value: []
      - field: design_tests.test_strategy
        operator: "exists"
        value: true
    on_pass: "next"
    on_fail:
      action: loop_back
      target: design_tests
    require_human_override: false
    auto_insert: true

  - name: verification_gate
    position: "before:validate"
    criteria:
      - field: execute_dev_tests.pass_rate
        operator: ">="
        value: 1.0
      - field: execute_dev_tests.coverage
        operator: ">="
        value: 0.80
      - field: execute_verification.visual_fidelity
        operator: ">="
        value: 0.90
      - field: execute_verification.interaction_quality
        operator: ">="
        value: 0.90
      - field: execute_verification.acceptance_score
        operator: ">="
        value: 0.90
      - field: review_results.blocking_count
        operator: "=="
        value: 0
    on_pass: "next"
    on_fail:
      action: loop_back
      target: refine
    require_human_override: false
    auto_insert: true

team_overrides: {}

environment_modes:
  local:
    skip_stages: []
    gate_overrides:
      verification_gate:
        criteria:
          - field: execute_dev_tests.pass_rate
            operator: ">="
            value: 0.95
          - field: execute_dev_tests.coverage
            operator: ">="
            value: 0.70
          - field: execute_verification.visual_fidelity
            operator: ">="
            value: 0.80
  github:
    extra_stages: []
