# DEPRECATED in v11.0.0; retained for backward compat — Phase B collapse decision lands v15.0.0 per v15-ADR-002
# This template was REGISTERED but never invoked in v9.x-v10.x cycles per
# .local/research/v11.0.0_patches/D-A-2.md §1 audit. Phase B compose-not-define
# collapse decision lands v15.0.0 per v15-ADR-002.
schema_version: "1.0"

metadata:
  name: research-only
  version: "1.0.0"
  display_name: "Research Only"
  description: "Gather information, compare alternatives, produce a structured report."
  category: discover
  applicable_scenarios:
    - "Technology evaluation and comparison"
    - "Literature survey for a design decision"
    - "Competitive analysis"
    - "Feasibility assessment"
  tags: [research, compare, evaluate, survey, analysis]

stages:
  - id: research
    primitive: research
    description: "Gather information from multiple sources"
    team: research
    duration_class: long
    config:
      depth: comprehensive
      source_types: [web, repo, paper, docs]

  - id: compare
    primitive: analyze
    alias: compare
    description: "Analyze and compare findings against evaluation criteria"
    team: research
    duration_class: medium
    config:
      analysis_type: dependency
      include_metrics: true
    input_mapping:
      targets: "research.findings"

  - id: report
    primitive: validate
    alias: report
    description: "Synthesize comparison into a structured report with recommendations"
    team: research
    duration_class: medium
    input_mapping:
      test_result: null
      review_verdict: null
      acceptance_criteria: "_template.acceptance_criteria"

composition:
  compose: sequence
  stages:
    - compose: loop
      ref: knowledge_loop
    - stage: report

loops:
  - name: knowledge_loop
    body_stages: [research, compare]
    until: "compare.findings | length > 0 and compare.priority_ranking | has_no_gaps"
    max_iterations: 3
    on_exhaustion: continue
    quality_threshold: null

gates: []

environment_modes:
  local:
    skip_stages: []
  github:
    extra_stages: []
