schema_version: "1.0"

metadata:
  name: onboarding
  version: "1.0.0"
  display_name: "Project Onboarding"
  description: >
    Onboard a new contributor or team member to a project. Analyze the codebase
    structure, document architecture and conventions, set up the development
    environment, and verify the contributor can build, test, and contribute.
  category: discover
  applicable_scenarios:
    - "New team member joining a project"
    - "Open-source contributor getting started"
    - "Transferring project ownership"
    - "Resuming work on a dormant project"
    - "Understanding an unfamiliar codebase"
  tags: [onboarding, setup, getting-started, contributor, codebase, understand, explore]

stages:
  - id: analyze
    primitive: analyze
    alias: codebase-survey
    description: "Survey the codebase — structure, conventions, key modules, dependency graph"
    team: research
    duration_class: medium
    config:
      analysis_type: code
      severity_threshold: low

  - id: document
    primitive: implement
    alias: onboarding-docs
    description: "Generate or update onboarding documentation — architecture map, setup guide, conventions"
    team: implement
    duration_class: medium
    config:
      test_strategy: no_test
    input_mapping:
      tasks: "analyze.findings"

  - id: setup
    primitive: implement
    alias: env-setup
    description: "Set up the development environment — install deps, configure tools, verify build"
    team: implement
    duration_class: medium
    config:
      test_strategy: test_after

  - id: verify
    primitive: test
    alias: onboarding-check
    description: "Verify onboarding — can build, can test, can lint, understands contribution flow"
    team: test
    duration_class: quick
    config:
      suites: [smoke]
      fail_fast: true
      coverage_threshold: 0.0

composition:
  compose: sequence
  stages:
    - stage: analyze
    - stage: document
    - stage: setup
    - stage: verify

loops: []

gates: []

environment_modes:
  local:
    skip_stages: []
  github:
    extra_stages: []
