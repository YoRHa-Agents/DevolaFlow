# This template was REGISTERED but never invoked in v9.x-v10.x cycles per
# .local/research/v11.0.0_patches/D-A-2.md §1 audit. Phase B compose-not-define
# collapse deferred to v12.0+.
schema_version: "1.0"

metadata:
  name: dependency-setup
  version: "1.0.0"
  display_name: "Dependency & Environment Setup"
  description: >
    Install, configure, and validate project dependencies and development
    environment. Research compatible versions, plan the dependency graph,
    implement configuration, and verify the environment works end-to-end.
  category: build
  applicable_scenarios:
    - "Setting up a new development environment from scratch"
    - "Adding a major new dependency or framework"
    - "Upgrading runtime or language version"
    - "Configuring CI/CD tooling and build pipeline"
    - "Installing and configuring dev tools (linters, formatters, test runners)"
    - "Docker/container environment setup"
  tags: [setup, install, dependency, environment, tooling, configuration, devops, docker]

stages:
  - id: research
    primitive: research
    description: "Research dependency versions, compatibility matrix, and known issues"
    team: research
    duration_class: medium
    config:
      depth: standard
      source_types: [web, docs]

  - id: plan
    primitive: plan
    alias: dependency-plan
    description: "Plan the dependency graph — version constraints, install order, conflict resolution"
    team: design
    duration_class: quick
    config:
      granularity: standard
    input_mapping:
      design: "research.findings"

  - id: configure
    primitive: implement
    alias: configure
    description: "Implement configuration — install deps, write config files, set up environment"
    team: implement
    duration_class: medium
    config:
      test_strategy: test_after
    input_mapping:
      tasks: "plan.waves"

  - id: verify
    primitive: test
    alias: verify-env
    description: "Verify environment — run smoke tests, check tool versions, validate build pipeline"
    team: test
    duration_class: medium
    config:
      suites: [smoke, integration]
      fail_fast: true
      coverage_threshold: 0.0
    input_mapping:
      code_refs: "configure.files_changed"

composition:
  compose: sequence
  stages:
    - stage: research
    - stage: plan
    - compose: loop
      ref: configure_verify_loop
    - compose: gate
      ref: env_gate

loops:
  - name: configure_verify_loop
    body_stages: [configure, verify]
    until: "verify.pass_rate == 1.0"
    max_iterations: 3
    on_exhaustion: escalate
    escalation_target: null

gates:
  - name: env_gate
    position: "after:verify"
    criteria:
      - field: verify.pass_rate
        operator: "=="
        value: 1.0
    on_pass: "next"
    on_fail:
      action: escalate
    require_human_override: true
    auto_insert: false

environment_modes:
  local:
    skip_stages: []
  github:
    extra_stages: []
