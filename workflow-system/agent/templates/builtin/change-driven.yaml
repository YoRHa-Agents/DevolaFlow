schema_version: "1.0"

metadata:
  name: change-driven
  version: "2.0.0"
  display_name: "Checklist-Round Change Lifecycle"
  description: >
    Sole executable runtime for signed-preflight, evidence-backed checklist
    rounds and guarded archive.
  category: composite
  applicable_scenarios:
    - "Run an in-flight change from proposal through evidence-backed archive"
    - "Execute any historical workflow mode through its checklist seed"
  tags: [change, propose, preflight, round, archive, lifecycle, agent-workspace, harness-build]

stages:
  - id: propose
    primitive: design
    description: "Anchor goal and checklist contracts with the user"
    team: design
    duration_class: quick
  - id: preflight
    primitive: validate
    description: "Draft project configuration and evidence; L0 and human retain authorization"
    team: preflight
    duration_class: quick
    config:
      task_type: preflight
      scope: drafting_only
      gate_owner: l0_and_human
      sign_off_owner: human
      stop_card_owner: l0_and_human
  - id: round
    primitive: implement
    description: "Run one bounded checklist evidence round"
    team: implement
    duration_class: medium
    config:
      runtime_limit_source: "stage.md.max_rounds"
      absolute_max_iterations: 62
      on_stagnation: escalate
      blocker_remediation_task_type: harness_build
      blocker_remediation_owner: l1_dispatches_separate_l2_task
  - id: archive
    primitive: deploy
    description: "Archive only after checklist, evidence, and quality gates pass"
    team: implement
    duration_class: quick

composition:
  compose: sequence
  stages:
    - stage: propose
    - stage: preflight
    - compose: loop
      ref: checklist_round_loop
    - stage: archive

loops:
  - name: checklist_round_loop
    body_stages: [round]
    until: "checklist.checked == checklist.total_items AND checklist.reverted_open == 0"
    max_iterations: 62
    on_exhaustion: escalate

gates:
  - name: preflight_gate
    position: "after:preflight"
    criteria:
      - field: preflight.authorized_at
        operator: "!="
        value: null
      - field: preflight.authorization_hash_valid
        operator: "=="
        value: true
      - field: preflight.project_config_hash_matches
        operator: "=="
        value: true
    on_pass: "next"
    on_fail:
      action: escalate
      target: preflight
    require_human_override: true
    auto_insert: true
  - name: archive_gate
    position: "before:archive"
    criteria:
      - field: checklist.checked
        operator: "=="
        value: checklist.total_items
      - field: checklist.reverted_open
        operator: "=="
        value: 0
      - field: archive.evidence_references_valid
        operator: "=="
        value: true
      - field: archive.composite_score
        operator: ">="
        value: "{{ .config.mode == 'full' ? 9.0 : 8.5 }}"
    on_pass: "next"
    on_fail:
      action: escalate
    require_human_override: true
    auto_insert: true

environment_modes:
  local:
    skip_stages: []
  github:
    extra_stages: []

parameters:
  mode:
    type: enum
    default: lite
    choices: [lite, full]
    description: "lite requires 8.5 archive quality; full requires 9.0"
