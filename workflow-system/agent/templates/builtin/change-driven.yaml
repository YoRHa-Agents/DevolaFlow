schema_version: "1.0"

metadata:
  name: change-driven
  version: "1.0.0"
  display_name: "Change-Driven Workflow (OpenSpec-inspired)"
  description: >
    Lifecycle workflow for in-flight changes managed via `.local/.agent/active/<id>/`
    and archived to `.local/.agent/archive/<date>-<id>/`. Maps to OpenSpec's
    OPSX flow (propose → apply → verify → archive). Adopted in DevolaFlow v8.3.0
    per `.local/research/v8.3.0_design.md` §1.3.
  category: composite
  applicable_scenarios:
    - "Author a single in-flight change with structured artifacts"
    - "Per-change, lightweight planning + impl + archive cycle"
    - "OpenSpec-style spec-driven work inside DevolaFlow"
  tags: [change, propose, apply, archive, lifecycle, agent-workspace]

stages:
  - id: propose
    primitive: design
    alias: change-propose
    description: "Scaffold .local/.agent/active/<id>/ with goal+acceptance+spec+tasks+STATUS+owned_files"
    team: design
    duration_class: quick
    config:
      mode: "{{ .config.mode | default('lite') }}"

  - id: apply
    primitive: implement
    alias: change-apply
    description: "Loop L3 dispatches until tasks.md all checkboxes ticked"
    team: implement
    duration_class: medium
    config:
      max_iterations: 5
      on_stagnation: escalate
    input_mapping:
      tasks: "propose.tasks_md"

  - id: verify
    primitive: verify
    alias: change-verify
    description: "Run AC checklist; gate composite must PASS per W-3"
    team: test
    duration_class: medium
    config:
      gate_profile: "{{ .config.mode == 'full' ? 'standard' : 'relaxed' }}"

  - id: archive
    primitive: deploy
    alias: change-archive
    description: "Move active → archive; auto-generate REPORT.md; consolidate per-change learnings to global memory; PROPOSE delta merge to source-of-truth (NOT auto-apply)"
    team: implement
    duration_class: quick

composition:
  compose: sequence
  stages:
    - stage: propose
    - compose: loop
      ref: apply_verify_loop
    - stage: archive

loops:
  - name: apply_verify_loop
    body_stages: [apply, verify]
    until: "verify.pass_rate == 1.0 AND verify.gate_score >= verify.threshold"
    max_iterations: 5
    on_exhaustion: escalate

gates:
  - name: archive_gate
    position: "before:archive"
    criteria:
      - field: verify.pass_rate
        operator: "=="
        value: 1.0
      - field: verify.gate_score
        operator: ">="
        value: 8.5
    on_pass: "next"
    on_fail:
      action: escalate
    require_human_override: true

environment_modes:
  local:
    skip_stages: []
  github:
    extra_stages: []

parameters:
  mode:
    type: enum
    default: lite
    choices: [lite, full]
    description: >
      lite — single-author, low-risk; pre-commit gate runs steps 1–3 (tests/lint/format)
      full — multi-author or high-risk; pre-commit gate runs all 6 steps per W-9 SI-10
