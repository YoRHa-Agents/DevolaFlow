schema_version: "1.0"

metadata:
  name: full-pipeline
  version: "1.0.0"
  display_name: "Full Development Pipeline"
  description: >
    Complete development lifecycle from design through release. The maximal workflow type —
    every other workflow is a subset of this pipeline. Includes two nested loops
    (review-refine and test-fix) and a mandatory release gate.
  category: composite
  applicable_scenarios:
    - "Greenfield feature development"
    - "Major system changes requiring full lifecycle"
    - "New project initialization"
    - "Any task where all stages are necessary"
  tags: [full, pipeline, feature, implementation, release, design, plan, test, review]

stages:
  - id: design
    primitive: design
    description: >
      Define architecture, interfaces, data models, and technical approach.
      Validates that requirements are clear before proceeding.
    team: design
    duration_class: long
    config:
      formality: standard
      diagram_types: [mermaid]
      design_type: architecture

  - id: plan
    primitive: plan
    description: >
      Decompose the design into implementable Waves and Tasks with dependencies,
      estimates, and acceptance criteria.
    team: design
    duration_class: medium
    config:
      granularity: standard
      max_parallel_waves: 3
      estimate_unit: minutes
    input_mapping:
      design: "design"

  - id: impl
    primitive: implement
    description: >
      Execute the plan — write code, create tests, build infrastructure as specified.
      Follows TDD with target 80% coverage.
    team: implement
    duration_class: long
    config:
      test_strategy: tdd
      target_coverage: 0.80
    input_mapping:
      tasks: "plan.waves"
      code_rules: "_context.code_rules"

  - id: review
    primitive: review
    description: >
      Code review — design compliance, security, style/convention adherence.
      Blocks progression if critical issues found.
    team: review
    duration_class: medium
    config:
      review_type: code
      pass_threshold: 0.80
      require_zero_blocking: true
      reviewer_count: 1
    input_mapping:
      artifacts: "impl.artifacts"
      acceptance_criteria: "plan.acceptance_criteria"

  - id: test
    primitive: test
    description: >
      Execute automated test suites — unit, integration, E2E.
      Measures coverage and performance.
    team: test
    duration_class: medium
    config:
      suites: [unit, integration, e2e]
      coverage_threshold: 0.80
      fail_fast: false
    input_mapping:
      code_refs: "impl.files_changed"

  - id: verify
    primitive: verify
    description: >
      User-facing verification — visual regression, acceptance criteria validation,
      interaction flow testing, accessibility checks. Runs after developer tests pass.
    team: test
    duration_class: medium
    config:
      visual_testing:
        enabled: true
        threshold: 0.90
      acceptance_testing:
        enabled: true
        criteria_source: "plan.acceptance_criteria"
      interaction_testing:
        enabled: true
      accessibility:
        enabled: true
        standard: "WCAG2.1-AA"
    input_mapping:
      test_results: "test"
      acceptance_criteria: "plan.acceptance_criteria"

  - id: refine
    primitive: refine
    description: >
      Address findings from review and/or test — fix bugs, resolve review comments.
      Targeted scope: only touch files cited in findings.
    team: implement
    duration_class: medium
    config:
      scope: targeted
      allow_new_features: false
    input_mapping:
      findings: "review.findings + test.failures"
      original_artifacts: "impl.artifacts"

  - id: testgate
    primitive: validate
    alias: testgate
    description: >
      Final quality checkpoint — aggregate all verification results.
      Must pass ALL criteria before release. Never bypassed.
    team: review
    duration_class: quick
    config:
      require_all_criteria: true
      allow_waivers: false
    input_mapping:
      review_verdict: "review"
      test_result: "test"
      acceptance_criteria: "plan.acceptance_criteria"
      quality_thresholds:
        test_pass_rate: 1.0
        code_coverage: 0.80
        blocking_issues: 0

  - id: release
    primitive: release
    description: >
      Package, tag, deploy, and announce. Create release artifacts,
      update changelogs, deploy to target environments.
    team: implement
    duration_class: medium
    config:
      version_strategy: semver
      require_human_approval: true
      draft_mode: false
    input_mapping:
      artifacts: "impl.artifacts"

composition:
  compose: sequence
  stages:
    - stage: design
    - compose: gate
      ref: design_gate
    - stage: plan
    - compose: gate
      ref: plan_gate
    - compose: loop
      ref: impl_review_test_cycle
    - compose: gate
      ref: release_gate
    - stage: release

loops:
  - name: impl_review_test_cycle
    body_stages: [impl, review, test, verify, refine, testgate]
    until: "testgate.ready == true"
    max_iterations: 3
    on_exhaustion: escalate
    escalation_target: plan
    escalation_max: 1

  - name: review_refine
    body_stages: [review, refine]
    until: "review.decision == 'pass'"
    max_iterations: 3
    quality_threshold: 0.80
    on_exhaustion: escalate
    escalation_target: plan

  - name: test_fix
    body_stages: [test, refine]
    until: "test.pass_rate == 1.0"
    max_iterations: 5
    on_exhaustion: escalate
    escalation_target: plan

gates:
  - name: design_gate
    position: "after:design"
    criteria:
      - field: design.specification
        operator: "exists"
        value: true
      - field: design.decisions
        operator: "!="
        value: []
    on_pass: "next"
    on_fail:
      action: loop_back
      target: design
    require_human_override: false
    auto_insert: true

  - name: plan_gate
    position: "after:plan"
    criteria:
      - field: plan.waves
        operator: "!="
        value: []
      - field: plan.acceptance_criteria
        operator: "!="
        value: []
    on_pass: "next"
    on_fail:
      action: loop_back
      target: plan
    require_human_override: false
    auto_insert: true

  - name: release_gate
    position: "before:release"
    criteria:
      - field: testgate.ready
        operator: "=="
        value: true
      - field: test.pass_rate
        operator: ">="
        value: 1.0
      - field: test.coverage
        operator: ">="
        value: 0.80
      - field: review.blocking_count
        operator: "=="
        value: 0
      - field: verify.visual_fidelity
        operator: ">="
        value: 0.90
      - field: verify.interaction_quality
        operator: ">="
        value: 0.90
    on_pass: "next"
    on_fail:
      action: loop_back
      target: refine
    require_human_override: true
    auto_insert: true

team_overrides: {}

environment_modes:
  local:
    skip_stages: [release]
    gate_overrides:
      release_gate:
        criteria:
          - field: test.pass_rate
            operator: ">="
            value: 0.95
          - field: test.coverage
            operator: ">="
            value: 0.70
  github:
    extra_stages: []
  gitlab:
    extra_stages: []
