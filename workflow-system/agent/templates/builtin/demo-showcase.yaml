# This template was REGISTERED but never invoked in v9.x-v10.x cycles per
# .local/research/v11.0.0_patches/D-A-2.md §1 audit. Phase B compose-not-define
# collapse deferred to v12.0+.
schema_version: "1.0"

metadata:
  name: demo-showcase
  version: "1.0.0"
  display_name: "Demo & Showcase"
  description: >
    Build a presentation-ready demo or showcase. Research the target audience
    and presentation medium, design the demo flow, build a working prototype
    with polished UI, review for demo readiness, and package for delivery.
    Optimized for visual impact and narrative clarity over production hardening.
  category: composite
  applicable_scenarios:
    - "Building a product demo for stakeholders"
    - "Creating an interactive web showcase or landing page"
    - "Preparing a conference talk with live code demos"
    - "Building a visual prototype to pitch a feature"
    - "Creating themed UI presentations (e.g., with ui-ux-pro-max)"
  tags: [demo, showcase, presentation, prototype, ui, visual, pitch, exhibit]

stages:
  - id: research
    primitive: research
    description: "Research target audience, presentation medium, and demo requirements"
    team: research
    duration_class: medium
    config:
      depth: standard
      source_types: [web, repo, docs]

  - id: design
    primitive: design
    alias: storyboard
    description: "Design the demo flow — narrative arc, key interaction points, visual theme"
    team: design
    duration_class: medium
    config:
      formality: light
      diagram_types: [mermaid]
      design_type: component
    input_mapping:
      inputs: "research.findings"

  - id: build
    primitive: implement
    alias: build-demo
    description: "Build the demo with polished UI and interaction — visual fidelity over test coverage"
    team: implement
    duration_class: long
    config:
      test_strategy: no_test
      code_style: demo_quality
    input_mapping:
      tasks: "design.specification"

  - id: review
    primitive: review
    alias: demo-review
    description: "Review demo for narrative flow, visual polish, and audience readiness"
    team: review
    duration_class: medium
    config:
      review_type: documentation
      pass_threshold: 0.70
      require_zero_blocking: true
    input_mapping:
      artifacts: "build.artifacts"

  - id: refine
    primitive: refine
    alias: polish
    description: "Polish based on review — fix visual issues, tighten narrative, improve transitions"
    team: implement
    duration_class: medium
    config:
      scope: targeted
      allow_new_features: false
    input_mapping:
      findings: "review.findings"
      original_artifacts: "build.artifacts"

  - id: package
    primitive: release
    alias: package-demo
    description: "Package demo for delivery — bundle assets, write run instructions, create shareable link"
    team: implement
    duration_class: quick
    config:
      version_strategy: manual
      require_human_approval: false
      draft_mode: true

composition:
  compose: sequence
  stages:
    - stage: research
    - stage: design
    - compose: loop
      ref: build_review_loop
    - stage: package

loops:
  - name: build_review_loop
    body_stages: [build, review, refine]
    until: "review.decision == 'pass'"
    max_iterations: 2
    on_exhaustion: continue
    escalation_target: null

gates: []

environment_modes:
  local:
    skip_stages: []
  github:
    extra_stages: []
