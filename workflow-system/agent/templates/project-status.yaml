template_kind: project-status
template_version: "1.0.0"

project:
  name: "<project-name>"
  change_id: "<change-id>"
  checklist_seed: "<registry-v3 seed name>"
  runtime: "change-driven"
  started_at: "<ISO8601>"
  current_round: 1
  max_rounds: "<int>"
  preflight:
    authorized: false
    authorized_at: null
    project_config_hash: "<sha256 | null>"

checklist:
  total: 0
  checked: 0
  reverted_open: 0
  by_priority:
    P0: {checked: 0, total: 0}
    P1: {checked: 0, total: 0}
    P2: {checked: 0, total: 0}

rounds:
  - round: 1
    selected_items: ["<C-G1.1>"]
    status: pending # pending | in_progress | passed | failed | escalated
    waves:
      - id: "R01-W01"
        status: pending # pending | dispatching | aggregating | passed | failed | escalated
        tasks_total: 0
        tasks_completed: 0
        conflict_status: pending # pending | clear | unresolved
    evidence:
      proposed_items: []
      verified_items: []
      rejected_items: []
      artifact_refs: []
    reinforcement:
      carried_ids: []
      closed_ids: []
      deferred_ids: []
    conflicts: []
    blockers: []
    gate:
      decision: null # PASS | FAIL | ESCALATE | null
      checked_selected: 0
      selected_total: 0
      blocker_count: 0
      unresolved_conflict_count: 0
      composite_trend: null

escalations: []
# - escalation_id: <uuid>
#   from_layer: task | wave | project
#   reason: <one-line>
#   resolved: false

next_round:
  candidate_items: []
  reverted_blockers: []
  estimated_rounds_remaining: null

last_updated: "<ISO8601>"
