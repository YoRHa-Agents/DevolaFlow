# -----------------------------------------------------------------------------
# Stub authored under v7.5.0 P-07 Option α (per .local/research/v7.5.0_ghost_audit.md §5)
# Project tracking dashboard — L0 Project Agent maintains this artifact across
# the workflow lifecycle. Read by L1 Stage Agents as part of the predecessor
# context bundle (P2 minimal context, ~3K-token slice).
# -----------------------------------------------------------------------------
# TODO(v7.6.x P-07 Option β): wire this template into a `devola-status` CLI
# command that auto-refreshes from gate-report.schema.yaml instances.
# TODO(v7.6.x P-07 Option β): add a `risks` section with severity/owner/eta
# tracking, mirroring the gate findings_summary structure.

template_kind: project-status
template_version: "0.1.0"

project:
  name: "<project-name>"
  workflow: "<workflow-template-id e.g. full-pipeline>"
  started_at: "<ISO8601>"
  current_stage: "<stage_id>"
  current_round: 1

stages:
  - id: "<stage_id>"
    name: "<stage_name>"
    status: pending     # pending | in_progress | gated | passed | failed | escalated
    gate:
      type: standard    # standard | convergence | passthrough
      decision: null    # PASS | FAIL | ESCALATE | null (not yet evaluated)
      composite_score: null

waves: []
# Each entry follows the wave-definition.schema.yaml shape:
#   - id: W01
#     stage_id: <stage_id>
#     status: pending
#     tasks_total: 0
#     tasks_passed: 0

escalations: []
# - escalation_id: <uuid>
#   from_layer: task | wave | stage
#   reason: <one-line>
#   resolved: false

last_updated: "<ISO8601>"
