# DevolaFlow Plugin Capability View — DERIVED SURFACE (v15.0.0 G-021)
#
# GENERATED-FROM TRUTH: the single A-5 SSOT owner of plugin REGISTRATION
# data (membership, canonical IDs, backends, install/upgrade commands,
# min_version / canonical_url truth, workflow wiring) is
#   workflow-system/agent/knowledge/runtime-plugins.yaml
# (loaded by devolaflow.plugins.installer.load_registry). This file is the
# DERIVED capability / role / stage_mapping presentation view of that
# owner, maintained by hand but PINNED to mirror it:
#   - plugin keys below MUST equal the owner's `plugins[*].id` set AND
#     order (tests/test_plugins.py::TestV15PluginRegistryUnification).
#   - `min_version` / `repo_url` MUST agree with the owner's
#     `min_version` / `canonical_url` for the same id.
#   - Add a plugin to the OWNER first; only then mirror it here.
# Unique-to-this-view fields (capabilities, role, stage_mapping,
# plugin_roles, platform_install, skill_install_command) are presentation
# data consumed by devolaflow.plugins.loader.load_plugin_specs() — they
# do NOT constitute a second registration surface.
#
# History: pre-v15.0.0 this file was the "legacy PluginRegistry catalog"
# and drifted from the owner (5 vs 6 plugins; `ui-ux-pro-max` vs `ui-pro`
# IDs) — closed by G-021 per .local/research/v14.2.0_gap_analysis.md §2.4
# (sources F-P5-1 / F-P5-6).

meta:
  version: "2.0.0"
  description: "Derived plugin capability/stage-mapping view of knowledge/runtime-plugins.yaml"

plugins:
  # v15.0.0 G-021 — canonical ID is `ui-pro` (mirrors the owner registry;
  # this view formerly used `ui-ux-pro-max`, the upstream skill-directory
  # name, which still appears in installed-payload paths below).
  ui-pro:
    description: "AI-powered design intelligence for professional UI/UX across 15 frameworks — 67 styles, 161 palettes, 161 reasoning rules"
    cli_binary: "uipro"
    version_command: "uipro versions"
    version_regex: 'v?(\d+\.\d+\.\d+)'
    install_methods:
      npm: "npm install -g uipro-cli"
    skill_install_command: "uipro init --ai cursor"
    capabilities:
      - design_system_generation    # AI-powered design system from project description
      - ui_style_recommendation     # 67 styles with BM25 ranking
      - color_palette_selection     # 161 industry-specific palettes
      - typography_pairing          # 57 curated font combinations
      - landing_page_patterns       # 24 landing page structure patterns
      - chart_recommendations       # 25 chart types for dashboards
      - ux_guidelines               # 99 best practices and anti-patterns
      - multi_stack_support         # React, Next.js, Vue, Svelte, SwiftUI, Flutter, etc.
    role: "ui_tooling"
    repo_url: "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill"
    min_version: "2.0.0"
    workflows:
      - demo-showcase
      - full-pipeline
      - feature-enhancement
      - web-design               # ui-pro DESIGNS, impeccable REFINES (v13.0.0 pairing)
    stage_mapping:
      design: "uipro init --ai cursor"
      implement: "python3 .cursor/skills/ui-ux-pro-max/scripts/search.py \"{query}\" --design-system"
    platform_install:
      cursor: "uipro init --ai cursor"
      cursor_global: "uipro init --ai cursor --global"
      claude: "uipro init --ai claude"
      claude_global: "uipro init --ai claude --global"
      copilot: "uipro init --ai copilot"
      codex: "uipro init --ai codex"
      all: "uipro init --ai all"
    update_command: "uipro update"
    uninstall_command: "uipro uninstall"

  # v15.0.0 G-021 — rtk mirrored from the owner registry (it was the one
  # plugin missing from this view before registry unification). rtk is a
  # shell-output compression proxy, not a stage-dispatched tool — it
  # activates via DEVOLAFLOW_RTK_PROXY (see references/shell-proxy.md).
  rtk:
    description: "RTK (Rust Token Killer) — shell-output compression proxy for agent shell calls; whitelisted commands route through rtk and report measured token gains via `rtk gain`"
    cli_binary: "rtk"
    version_command: "rtk --version"
    version_regex: '(\d+\.\d+\.\d+)'
    install_methods:
      script: "curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh"
    capabilities:
      - shell_output_compression   # rtk proxy — compresses whitelisted shell output
      - token_gain_reporting       # rtk gain — measured token-savings stats (also the name-collision distinguish probe)
    role: "token_economy"
    repo_url: "https://github.com/rtk-ai/rtk"
    min_version: "0.37.2"
    workflows:
      - shell-proxy

  si-chip:
    description: "Persistent BasicAbility optimisation factory — static profiling, iteration_delta evaluation, apply/defer threshold gate (+0.10) for skill self-improvement"
    cli_binary: "python"
    # v14.2.1 (G-021 probe slice) — copied verbatim from
    # knowledge/runtime-plugins.yaml `version_check_cmd` (fixed there at
    # v10.2.0 PV-01 D-P-3). The pre-v14.2.1 heuristic here
    # (`test -f ... || test -f ... && echo si-chip/0.4.0`) ALWAYS reported
    # 0.4.0 regardless of what was installed. v15.0.0 G-021 completed the
    # structural unification: the owner registry is the probe's
    # source-of-truth and this view mirrors it.
    version_command: "python -c 'import sys; sys.path.insert(0, \"src\"); from devolaflow.si_chip_bridge import find_si_chip_install; from devolaflow.si_chip_bridge.install_resolver import read_installed_si_chip_version; install=find_si_chip_install(); v=read_installed_si_chip_version(install) if install else None; print(f\"si-chip/{v}\") if v else sys.exit(1)'"
    version_regex: 'si-chip/(\d+\.\d+\.\d+)'
    install_methods:
      script: "curl -fsSL https://yorha-agents.github.io/Si-Chip/install.sh | bash -s -- --target cursor --scope global --yes --force"
    skill_install_command: "curl -fsSL https://yorha-agents.github.io/Si-Chip/install.sh | bash -s -- --target cursor --scope global --yes"
    capabilities:
      - skill_static_profiling      # profile_static.py — BasicAbilityProfile YAML
      - skill_metrics_aggregation   # aggregate_eval.py — metrics_report.yaml from with/no baseline runs
      - token_budget_audit          # count_tokens.py — metadata + body token counts vs 100/5000 budgets
      - iteration_delta_evaluation  # apply_or_defer threshold gate (+0.10 default)
      - self_dogfood_protocol       # references/self-dogfood-protocol.md — apply skill optimisations to itself
    role: "skill_self_improvement"
    repo_url: "https://github.com/YoRHa-Agents/Si-Chip"
    min_version: "0.4.0"
    workflows:
      - skill-optimization
      - self-update
      - nines-assisted
    stage_mapping:
      profile: "python ~/.cursor/skills/si-chip/si-chip/scripts/profile_static.py --ability {ability} --out {out_path}"
      evaluate: "python ~/.cursor/skills/si-chip/si-chip/scripts/aggregate_eval.py --runs-dir {runs_dir} --baseline-dir {baseline_dir} --skill-md {skill_md} --out {out_path}"
      audit: "python ~/.cursor/skills/si-chip/si-chip/scripts/count_tokens.py --file {skill_md} --both"

  codegraph:
    description: "Pre-indexed code knowledge graph (tree-sitter + SQLite FTS5) — 35% cheaper / 70% fewer tool calls / 59% fewer tokens vs raw Read+Grep+Glob across 7 codebases × 7 languages"
    cli_binary: "codegraph"
    version_command: "codegraph --version"
    version_regex: '(\d+\.\d+\.\d+)'
    install_methods:
      npm: "npm install -g @colbymchenry/codegraph"
      script: "curl -fsSL https://raw.githubusercontent.com/colbymchenry/codegraph/main/install.sh | sh"
    skill_install_command: "codegraph install --yes"
    capabilities:
      - smart_context_building     # codegraph context — entry points + related symbols + snippets in one call
      - full_text_search           # codegraph search — FTS5 over symbol names
      - impact_analysis            # codegraph impact — blast radius before edit
      - callers_callees_trace      # codegraph callers / callees
      - file_structure_lookup      # codegraph files — replaces fs scanning
      - test_impact_selection      # codegraph affected — CI hook for selective test runs
      - framework_route_awareness  # 14 frameworks: Django, Flask, FastAPI, Express, NestJS, Laravel, Rails, Spring, Gin, Axum, ASP.NET, Vapor, React Router, SvelteKit
      - multi_language_index       # 19+ languages incl. TS/JS/Python/Go/Rust/Java/C#/PHP/Ruby/C/C++/Swift/Kotlin/Scala/Dart/Lua/Luau/Svelte/Vue/Liquid/Pascal
    role: "code_intelligence"
    repo_url: "https://github.com/colbymchenry/codegraph"
    min_version: "0.9.3"
    workflows:
      - repo-init
      - onboarding
      - security-audit
      - product-verification
      - refactoring
      - performance-optimization
    stage_mapping:
      analyze: "codegraph status && codegraph files --format tree"
      scaffold: "codegraph init -i"
      research: "codegraph context \"{query}\" --format markdown --max-nodes 20"
      impact: "codegraph impact {symbol} --depth 3 --json"

  impeccable:
    description: "Design language system + anti-pattern detection for AI coding agents — 23 /impeccable steering commands (polish/critique/audit/typeset/arrange/animate/...) + a no-LLM deterministic anti-pattern detector (27 rules + 12-rule LLM critique pass)"
    cli_binary: "impeccable"
    version_command: "impeccable --version"
    version_regex: 'v?(\d+\.\d+\.\d+)'
    install_methods:
      npm: "npm install -g impeccable"
    skill_install_command: "npx impeccable skills install"
    capabilities:
      - design_refinement           # /impeccable polish — final pass before shipping
      - ux_design_critique          # /impeccable critique — hierarchy, clarity, emotional resonance, scoring
      - technical_quality_audit     # /impeccable audit — a11y, performance, responsive, theming, anti-patterns
      - typography_correction       # /impeccable typeset — font choices, hierarchy, sizing
      - layout_spatial_rhythm       # /impeccable arrange — layout, spacing, visual rhythm
      - purposeful_motion           # /impeccable animate — add purposeful motion
      - feature_craft_flow          # /impeccable craft / shape — full shape-then-build flow on new features
      - antipattern_detection       # impeccable detect — no-LLM scan (27 deterministic rules; exit 2 = found)
    role: "ui_refinement"
    repo_url: "https://github.com/pbakaus/impeccable"
    min_version: "2.0.0"
    workflows:
      - web-design
    stage_mapping:
      refine: "/impeccable polish {target}"
      critique: "/impeccable critique {target}"
      verify: "impeccable detect --json {path}"
    platform_install:
      # `skills install` auto-detects the harness (.cursor / .claude / .agents
      # codex / .gemini / ...); --providers= narrows it. There is NO per-AI
      # --ai flag — one auto-detecting command writes the build compiled for
      # each detected harness.
      auto: "npx impeccable skills install --yes"
      cursor: "npx impeccable skills install --providers=.cursor --yes"
      claude: "npx impeccable skills install --providers=.claude --yes"
      codex: "npx impeccable skills install --providers=.agents --yes"
    update_command: "npx impeccable skills update"

plugin_roles:
  skill_self_improvement:
    description: "Tools that profile, evaluate, and apply iteration-delta-gated skill optimisations to the agent's own SKILL.md + references"
    primary_workflows:
      - skill-optimization
      - self-update
      - nines-assisted
    stage_affinity:
      - profile
      - validate
      - audit
    invocation: "on_demand"  # PV-04 lifecycle hook auto-invokes when DEVOLAFLOW_SI_CHIP_DEEP=1
    provider: "si-chip"

  ui_tooling:
    description: "Design intelligence for UI/UX generation, style systems, and themed presentations"
    primary_workflows:
      - demo-showcase
      - full-pipeline
      - feature-enhancement
      - web-design
    stage_affinity:
      - implement
      - design
    invocation: "on_demand"
    provider: "ui-pro"

  ui_refinement:
    description: "Design refinement + deterministic anti-pattern detection — polishes / critiques / audits an already-built UI and gates it against a no-LLM anti-pattern scan (impeccable detect). Pairs with ui_tooling: ui-pro designs, impeccable refines + verifies."
    primary_workflows:
      - web-design
    stage_affinity:
      - refine
      - verify
      - review
    invocation: "on_demand"  # Surfaced by config.suggest_plugins at refine/verify stage entry; agent invokes /impeccable commands + `impeccable detect`
    provider: "impeccable"

  # v15.0.0 G-021 — rtk's role; not stage-dispatched (the shell proxy wraps
  # whitelisted shell calls transparently when DEVOLAFLOW_RTK_PROXY=1).
  token_economy:
    description: "Shell-output token compression — rtk proxies whitelisted shell commands and reports measured gains (`rtk gain`). Activation is env-flag driven per references/shell-proxy.md, not stage-dispatched."
    primary_workflows:
      - shell-proxy
    stage_affinity: []
    invocation: "automatic"  # via DEVOLAFLOW_RTK_PROXY shell-proxy layer, never dispatched as a stage tool
    provider: "rtk"

  gate_scoring:
    description: "Tools that provide automated quality scoring for gates"
    primary_workflows: []   # No plugins currently assigned to gate scoring
    stage_affinity:
      - gate
      - review
      - test
    invocation: "automatic"  # Invoked by gate mechanism when available

  code_intelligence:
    description: "Pre-indexed code knowledge graph providing search/context/impact/callers/callees/affected queries — replaces Read+Glob+Grep planning patterns with single-call symbol-aware lookups"
    primary_workflows:
      - repo-init
      - onboarding
      - security-audit
      - product-verification
    stage_affinity:
      - analyze
      - scaffold
      - research
      - profile
    invocation: "on_demand"  # Surfaced by config.codegraph_commands hint at workflow stage entry; agent invokes via CLI or MCP tools
    provider: "codegraph"
