# DevolaFlow Plugin Registry
# Canonical definitions for external tool plugins.
# Loaded by: devolaflow.plugins.loader.load_plugin_specs()

meta:
  version: "1.0.0"
  description: "Plugin specifications for DevolaFlow external tool integrations"

plugins:

  nines:
    description: "Multi-vertex evaluation, information collection, and knowledge analysis for agent research and skill iteration"
    cli_binary: "nines"
    version_command: "nines --version"
    version_regex: 'version\s+(\d+\.\d+\.\d+\S*)'
    install_methods:
      pip: "uv pip install git+https://github.com/YoRHa-Agents/NineS.git"
      script: "curl -fsSL https://raw.githubusercontent.com/YoRHa-Agents/NineS/main/scripts/install.sh | bash"
    skill_install_command: "nines install --target cursor"
    capabilities:
      - research_collection     # nines collect — GitHub/arXiv search
      - knowledge_analysis      # nines analyze — AST analysis, complexity metrics
      - agent_evaluation        # nines eval — task-based scoring
      - self_evaluation         # nines self-eval — 19-dimension self-assessment
      - skill_iteration         # nines iterate — MAPIM self-improvement cycle
    role: "research_and_iteration"
    repo_url: "https://github.com/YoRHa-Agents/NineS"
    min_version: "1.0.0"
    workflows:
      - research-only           # nines collect for research gathering
      - skill-optimization      # nines self-eval, nines iterate for skill improvement
      - self-update             # nines analyze for understanding upstream changes
    stage_mapping:
      research: "nines -f json collect --source github --query \"{query}\" --max-results {limit}"
      analyze: "nines -f json analyze --target-path {target} --depth deep --agent-impact --keypoints"
      validate: "nines -f json self-eval --project-root {root} --compare --report"
      monitor: "nines -f json iterate --max-rounds 1 --threshold {threshold} --project-root {root}"

  ui-ux-pro-max:
    description: "AI-powered design intelligence for professional UI/UX across 15 frameworks — 67 styles, 161 palettes, 161 reasoning rules"
    cli_binary: "uipro"
    version_command: "uipro versions"
    version_regex: 'v?(\d+\.\d+\.\d+)'
    install_methods:
      npm: "npm install -g uipro-cli"
    skill_install_command: "uipro init --ai cursor"
    capabilities:
      - design_system_generation    # AI-powered design system from project description
      - ui_style_recommendation     # 67 styles with BM25 ranking
      - color_palette_selection     # 161 industry-specific palettes
      - typography_pairing          # 57 curated font combinations
      - landing_page_patterns       # 24 landing page structure patterns
      - chart_recommendations       # 25 chart types for dashboards
      - ux_guidelines               # 99 best practices and anti-patterns
      - multi_stack_support         # React, Next.js, Vue, Svelte, SwiftUI, Flutter, etc.
    role: "ui_tooling"
    repo_url: "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill"
    min_version: "2.0.0"
    workflows:
      - demo-showcase
      - full-pipeline
      - feature-enhancement
    stage_mapping:
      design: "uipro init --ai cursor"
      implement: "python3 .cursor/skills/ui-ux-pro-max/scripts/search.py \"{query}\" --design-system"
    platform_install:
      cursor: "uipro init --ai cursor"
      cursor_global: "uipro init --ai cursor --global"
      claude: "uipro init --ai claude"
      claude_global: "uipro init --ai claude --global"
      copilot: "uipro init --ai copilot"
      codex: "uipro init --ai codex"
      all: "uipro init --ai all"
    update_command: "uipro update"
    uninstall_command: "uipro uninstall"

plugin_roles:
  research_and_iteration:
    description: "Tools for agent-facing research, analysis, and self-improvement"
    primary_workflows:
      - research-only
      - skill-optimization
      - self-update
    stage_affinity:
      - research
      - analyze
      - validate
    invocation: "on_demand"  # Only invoked when workflow needs it

  ui_tooling:
    description: "Design intelligence for UI/UX generation, style systems, and themed presentations"
    primary_workflows:
      - demo-showcase
      - full-pipeline
      - feature-enhancement
    stage_affinity:
      - implement
      - design
    invocation: "on_demand"
    provider: "ui-ux-pro-max"

  gate_scoring:
    description: "Tools that provide automated quality scoring for gates"
    primary_workflows: []   # No plugins currently assigned to gate scoring
    stage_affinity:
      - gate
      - review
      - test
    invocation: "automatic"  # Invoked by gate mechanism when available
