# workflow-skill.yaml — Canonical Source Schema
# Single source of truth from which all tool-specific outputs are generated.
# Design reference: design_delivery_architecture.md §4.2
#
# Every file in workflow-system/agent/ is referenced here.
# Adapters read this schema to produce tool-specific output (Cursor, Codex, Claude, Copilot).

identity:
  name: "devola-flow"
  display_name: "DevolaFlow"
  version: "17.5.0"
  description: >
    Orchestrate checklist-round software work using a 3-layer Project → Wave →
    Task hierarchy, evidence-backed completion, bounded reinforcement, and
    context-isolated task delegation. Explicit invocation ONLY: activate when
    the user explicitly types /devola-flow or names devola-flow/DevolaFlow and
    asks for its workflow orchestration. Do NOT auto-activate for generic
    implementation, bug-fix, refactoring, or migration requests that do not
    name this skill.

activation:
  policy: "intent"                        # always | intent | path_match
  trigger_terms:
    - "/devola-flow"
    - "devola-flow"
    - "devolaflow"
    - "use devola"
    - "update devola"

content:

  # ─────────────────────────────────────────────────────────────────
  # Rules: Always-on constraints extracted to .cursor/rules/ or
  # CLAUDE.md "Hard Rules" section. Sourced from design_agent_hierarchy.md §1.
  # ─────────────────────────────────────────────────────────────────
  rules:
    - id: "dispatcher-no-impl"
      severity: "hard"
      principle: "P1"
      text: >
        Dispatcher agents (Project, Wave) MUST NOT perform work directly.
        Only L2 Task Agents execute actual work — writing code, running tests,
        authoring documents, and performing reviews.

    - id: "minimal-context"
      severity: "hard"
      principle: "P2"
      text: >
        Each agent layer receives only the context it needs.
        L0 Project ~5K tokens, L1 Wave ~5K, L2 Task ~8K.

    - id: "structured-messages"
      severity: "hard"
      principle: "P3"
      text: >
        All inter-layer communication uses typed YAML message schemas
        (TaskDispatch, StatusReport, ExceptionEscalation).
        Free-form natural language between layers is prohibited.

    - id: "bounded-retry"
      severity: "hard"
      principle: "P4"
      text: >
        Every loop has a max_iterations ceiling. Every failure triggers a
        classified response (retry / escalate / abort). No infinite loops.
        Escalation always moves upward: Task → Wave → Project → Human.

    - id: "artifacts-as-contracts"
      severity: "hard"
      principle: "P5"
      text: >
        Layers communicate through artifact files, not shared memory or
        conversation history. Each artifact has a defined schema. The producing
        layer writes; the consuming layer reads. No bidirectional shared state.

  # ─────────────────────────────────────────────────────────────────
  # Body: Core instruction sections composing SKILL.md
  # These map to design_delivery_architecture.md §3.4 outline.
  # Total: ~400 lines (within <500 line budget).
  # ─────────────────────────────────────────────────────────────────
  body:
    entry_file: "SKILL.md"
    max_lines: 500
    sections:
      - id: "version-update"
        title: "Version & Update"
        content_source: "SKILL.md#version--update"
        lines: 17

      - id: "workspace-engagement"
        title: "Workspace Engagement"
        content_source: "SKILL.md#workspace-engagement"
        lines: 17

      - id: "quick-action"
        title: "Quick Action Decision"
        content_source: "SKILL.md#quick-action-decision"
        lines: 11

      - id: "mode-awareness"
        title: "Mode Awareness"
        content_source: "SKILL.md#mode-awareness"
        lines: 46

      - id: "quick-start"
        title: "Quick Start — Workflow Selection"
        content_source: "SKILL.md#quick-start--workflow-selection"
        lines: 35

      - id: "hierarchy"
        title: "3-Layer Agent Hierarchy"
        content_source: "SKILL.md#3-layer-agent-hierarchy"
        lines: 14

      - id: "wave-coordination"
        title: "Wave Coordination Modes"
        content_source: "SKILL.md#wave-coordination-modes"
        lines: 14

      - id: "stage-primitives"
        title: "Stage Primitives Index (Seed Provenance)"
        content_source: "SKILL.md#stage-primitives-index-seed-provenance"
        lines: 16

      - id: "gate"
        title: "Gate Mechanism"
        content_source: "SKILL.md#gate-mechanism"
        lines: 25

      - id: "team-index"
        title: "AgentTeam Quick Reference"
        content_source: "SKILL.md#agentteam-quick-reference"
        lines: 12

      - id: "context-isolation"
        title: "Context Isolation"
        content_source: "SKILL.md#context-isolation"
        lines: 11

      - id: "hang-prevention"
        title: "Subagent Hang Prevention"
        content_source: "SKILL.md#subagent-hang-prevention"
        lines: 8

      - id: "dispatch-report"
        title: "Dispatch & Report Protocol"
        content_source: "SKILL.md#dispatch--report-protocol"
        lines: 13

      - id: "lifecycle-hooks"
        title: "Lifecycle Hooks"
        content_source: "SKILL.md#lifecycle-hooks"
        lines: 13

      - id: "repo-modes"
        title: "Repo Mode Detection"
        content_source: "SKILL.md#repo-mode-detection"
        lines: 11

      - id: "reference-nav"
        title: "Reference Navigation Guide"
        content_source: "SKILL.md#reference-navigation-guide"
        lines: 32

      - id: "task-quality-score"
        title: "Task Quality Score (L0 ONLY)"
        content_source: "SKILL.md#task-quality-score-l0-only"
        lines: 6

      - id: "operational-learnings"
        title: "Operational Learnings"
        content_source: "SKILL.md#operational-learnings"
        lines: 5

  # ─────────────────────────────────────────────────────────────────
  # References: Tier 2 domain reference files (~200-500 lines each).
  # Loaded selectively by agent layer when the topic arises.
  # ─────────────────────────────────────────────────────────────────
  references:
    - id: "agent-hierarchy"
      file: "references/agent-hierarchy.md"
      design_source: "design_agent_hierarchy.md"
      load_when: "Setting up the L0 Project → L1 Wave → L2 Task hierarchy or debugging evidence flow"
      tier: 2
      estimated_lines: 400

    - id: "meta-framework"
      file: "references/meta-framework.md"
      design_source: "design_meta_framework.md"
      load_when: "Selecting registry-v3 checklist seeds or the sole change-driven runtime"
      tier: 2
      estimated_lines: 350

    - id: "decomposition-gate"
      file: "references/decomposition-gate.md"
      design_source: "design_decomposition_gate.md"
      load_when: "Partitioning checklist rounds into waves/tasks or evaluating evidence gates"
      tier: 2
      estimated_lines: 400

    - id: "repo-modes"
      file: "references/repo-modes.md"
      design_source: "design_repo_modes.md"
      load_when: "Detecting repository structure, configuring mode-specific behavior"
      tier: 2
      estimated_lines: 300

    - id: "execution-protocol"
      file: "references/execution-protocol.md"
      design_source: "design_execution_protocol.md"
      load_when: "Running preflight, checkpoints, bounded checklist rounds, or exception handling"
      tier: 2
      estimated_lines: 350

    - id: "message-schemas"
      file: "references/message-schemas.md"
      design_source: "design_agent_hierarchy.md §3"
      load_when: "Constructing or parsing dispatch/report/escalation messages"
      tier: 2
      estimated_lines: 300

    - id: "team-roles"
      file: "references/team-roles.md"
      design_source: "design_agent_hierarchy.md §4"
      load_when: "Configuring L2 Task specializations and evidence expectations"
      tier: 2
      estimated_lines: 350

    - id: "context-isolation"
      file: "references/context-isolation.md"
      design_source: "design_agent_hierarchy.md §6"
      load_when: "Setting up context injection templates, debugging context leaks"
      tier: 2
      estimated_lines: 250

  # ─────────────────────────────────────────────────────────────────
  # Examples: Tier 3 on-demand execution traces.
  # Loaded when the agent needs a concrete delegation walkthrough.
  # ─────────────────────────────────────────────────────────────────
  examples:
    - id: "full-pipeline"
      file: "examples/full-pipeline-trace.md"
      design_source: "design_agent_hierarchy.md §7.1"
      description: "Complete delegation chain for a new feature implementation (18 agents, 7 stages)"
      tier: 3

    - id: "hotfix"
      file: "examples/hotfix-trace.md"
      design_source: "design_agent_hierarchy.md §7.2"
      description: "Minimal 4-stage hotfix workflow trace (5 agents) with full-pipeline comparison"
      tier: 3

    - id: "convergence-loop"
      file: "examples/convergence-loop-trace.md"
      design_source: "design_agent_hierarchy.md Appendix C, design_decomposition_gate.md §5"
      description: "2-round convergence loop (78→88) with gate scoring and stagnation detection"
      tier: 3

  # ─────────────────────────────────────────────────────────────────
  # Knowledge: Tier 3 cross-cutting knowledge mapping files.
  # Loaded when integrating with external systems or principles.
  # ─────────────────────────────────────────────────────────────────
  knowledge:
    - id: "code-rules-mapping"
      file: "knowledge/code-rules-mapping.md"
      description: "How code-rules integrate with implement/review stages: loading strategies, quality focus, compliance checking"
      tier: 3

    - id: "principle-mapping"
      file: "knowledge/principle-mapping.md"
      description: "How SOLID, TDD, Clean Architecture, DDD map to gate dimensions and code-rules"
      tier: 3

    - id: "knowledge-index"
      file: "knowledge/index.md"
      description: "Knowledge page catalog with selective loading hints for L2 Task agents"
      tier: 3

  # ─────────────────────────────────────────────────────────────────
  # Templates: registry v3 exposes 26 declarative checklist seeds and one
  # executable runtime. Seeds retain decomposition knowledge but carry no DAG
  # semantics. `change-driven` is both a seed name and the sole runtime name.
  # ─────────────────────────────────────────────────────────────────
  templates:
    registry:
      file: "templates/registry.yaml"
      schema_version: "3.0"
      description: "Seed and runtime discovery registry; 26 seeds + one executable runtime"

    seeds:
      - {id: "hotfix", file: "templates/seeds/hotfix.yaml"}
      - {id: "research-only", file: "templates/seeds/research-only.yaml"}
      - {id: "design-only", file: "templates/seeds/design-only.yaml"}
      - {id: "documentation-only", file: "templates/seeds/documentation-only.yaml"}
      - {id: "spike-poc", file: "templates/seeds/spike-poc.yaml"}
      - {id: "refactoring", file: "templates/seeds/refactoring.yaml"}
      - {id: "feature-enhancement", file: "templates/seeds/feature-enhancement.yaml"}
      - {id: "full-pipeline", file: "templates/seeds/full-pipeline.yaml"}
      - {id: "performance-optimization", file: "templates/seeds/performance-optimization.yaml"}
      - {id: "security-audit", file: "templates/seeds/security-audit.yaml"}
      - {id: "research-design-review-refine", file: "templates/seeds/research-design-review-refine.yaml"}
      - {id: "dependency-setup", file: "templates/seeds/dependency-setup.yaml"}
      - {id: "onboarding", file: "templates/seeds/onboarding.yaml"}
      - {id: "demo-showcase", file: "templates/seeds/demo-showcase.yaml"}
      - {id: "product-verification", file: "templates/seeds/product-verification.yaml"}
      - {id: "entropy-cleanup", file: "templates/seeds/entropy-cleanup.yaml"}
      - {id: "local-archive", file: "templates/seeds/local-archive.yaml"}
      - {id: "harness-construction", file: "templates/seeds/harness-construction.yaml"}
      - {id: "pathfinder", file: "templates/seeds/pathfinder.yaml"}
      - {id: "migration", file: "templates/seeds/migration.yaml"}
      - {id: "skill-optimization", file: "templates/seeds/skill-optimization.yaml"}
      - {id: "self-update", file: "templates/seeds/self-update.yaml"}
      - {id: "nines-assisted", file: "templates/seeds/nines-assisted.yaml"}
      - {id: "repo-init", file: "templates/seeds/repo-init.yaml"}
      - {id: "change-driven", file: "templates/seeds/change-driven.yaml"}
      - {id: "web-design", file: "templates/seeds/web-design.yaml"}

    runtime:
      id: "change-driven"
      file: "templates/builtin/change-driven.yaml"
      description: "Sole executable propose → preflight → checklist-round loop → archive lifecycle"

    artifacts:
