# Context profiles per task type
profiles:

  hotfix:
    description: "Rapid bug fix — deep bug context, minimal architecture"
    goal_hints:
      - "fix bug"
      - "broken"
      - "crash"
      - "hotfix"
      - "SEV1"
      - "SEV2"
      - "production down"
    token_budget: 2400
    model_hints:
      default_tier: balanced
      overrides:
        simple_implementation: budget
        test_execution: budget
    section_priorities:
      frontmatter: skip
      version_update: skip
      quick_action_decision: critical
      mode_detection: supplementary
      plan_mode_template: skip
      agent_mode_protocol: critical
      quick_start_workflows: skip
      hierarchy_table: important
      hierarchy_diagram: skip
      wave_task_constraints: critical
      rationalization_prevention: important
      wave_coordination: skip
      stage_primitives: skip
      gate_mechanism: important
      agent_teams: supplementary
      context_isolation: critical
      dispatch_report: critical
      lifecycle_hooks: important
      repo_mode: supplementary
      reference_navigation: skip
      rules_dispatchers: important
      convergence_loop: skip
      task_quality_score: skip
      template_quick_ref: skip
      nines_advisor: supplementary
    learnings:
      enabled: true
      max_entries: 5
      min_confidence: 0.5
      budget_pct: 10
      budget_max_tokens: 500
    extra_context:
      - "references/message-schemas.md"
      - "schemas/task-dispatch.yaml"
    decomposition:
      enabled: false
    rationale: >
      Hotfix tasks need fast triage→fix→test→release. No architecture overview,
      no research primitives, no template browsing. Focus on dispatch mechanics
      and quality gates to ensure the fix is validated.

  feature:
    description: "Feature development — architectural context, component patterns"
    goal_hints:
      - "implement feature"
      - "add to existing"
      - "extend"
      - "enhance"
      - "build from scratch"
      - "new project"
    token_budget: 5300  # v8.0.0 P-08 bumped +150 to absorb behavioral_guidelines block (was 5150 after v7.2.0+ PR-D +200 advisor)
    model_hints:
      default_tier: balanced
      overrides:
        architecture_decisions: quality
        code_review: quality
        simple_implementation: budget
        test_execution: budget
    section_priorities:
      frontmatter: skip
      version_update: skip
      quick_action_decision: critical
      mode_detection: supplementary
      plan_mode_template: critical
      agent_mode_protocol: critical
      quick_start_workflows: critical
      hierarchy_table: critical
      hierarchy_diagram: skip
      wave_task_constraints: critical
      rationalization_prevention: critical
      wave_coordination: supplementary
      stage_primitives: critical
      gate_mechanism: critical
      agent_teams: critical
      context_isolation: critical
      dispatch_report: important
      lifecycle_hooks: critical
      repo_mode: important
      reference_navigation: important
      rules_dispatchers: important
      convergence_loop: critical
      task_quality_score: supplementary
      template_quick_ref: skip
      nines_advisor: supplementary
    learnings:
      enabled: true
      max_entries: 5
      min_confidence: 0.5
      budget_pct: 10
      budget_max_tokens: 500
    advisor:
      enabled: true
      max_uses: 3
      # v7.2.0 PR-D additive flags (default true; explicit here for opt-out clarity).
      # conciseness_instruction → C-001 (advisor responses ~35-45% shorter).
      # timing_block / reconcile_block → C-003 (BEFORE-substantive-work + reconcile prompt).
      conciseness_instruction: true
      timing_block: true
      reconcile_block: true
      conversation_budget: 6
      trigger_conditions:
        - complexity_high
        - cross_module_architecture
        - stalled_convergence
      cost_ceiling_usd: 0.30
    extra_context:
      - "references/agent-hierarchy.md"
      - "references/meta-framework.md"
    decomposition:
      enabled: true
      max_sub_agents: 4
      max_nesting_depth: 1
      sub_agent_model_hint: budget
      sub_agent_context_budget: 5000  # v7.0.1: bumped from 3000 (resolves K.8, see ADR-002 §4)
      coordinator_retains_advisor: true
      gen_verify_mode: true
      gen_verify_max_rounds: 3
    tool_output_truncation:           # v7.0.1+: opt-in primitive (per ADR-002 §2.4); default disabled
      enabled: true
      keep: 3
      exclude_tool_names: ["Read"]
      head_chars: 500
      tail_chars: 500
    summary:                          # v7.1.0+: extractive summariser default-on per ADR-003 §4.3
      mode: extractive
      max_tokens: 1200
      trigger_pct: 25                 # summarise when pred_tokens > 25 % of total budget
    behavioral_guidelines:            # v8.0.0 P-08: standard tier (impl complexity)
      tier: standard                  # inherits meta.behavioral_guidelines_defaults.standard
      think_first: true               # explicit override; plan-before-code on every impl
      simplicity_check: true          # explicit override; reject over-engineering
      surgical_scope: function        # function-level edit discipline (P2 disjoint ownership)
      goal_loop: false                # single-round impl; goal re-anchor not needed
    ac_generation:                    # v8.0.0 P-10: feature impl benefits from auto-AC
      enabled: true                   # ACGenerator.generate() runs by default
      min_quality_threshold: 60.0     # reject criteria with score_quality < 60 % completeness
      id_prefix: "AC"
    rationale: >
      Feature work needs the full hierarchy, stage primitives for planning,
      gate mechanism for quality control, and team roles for task dispatch.
      Convergence loop matters for implementation stages.

  research:
    description: "Research/investigation — broad references, comparison frameworks"
    goal_hints:
      - "research"
      - "compare"
      - "survey"
      - "investigate"
      - "what"
      - "how"
      - "which"
      - "should we"
    token_budget: 3300
    model_hints:
      default_tier: balanced
      overrides:
        analysis: quality
        comparison: quality
        simple_implementation: budget
    section_priorities:
      frontmatter: skip
      version_update: skip
      quick_action_decision: critical
      mode_detection: supplementary
      plan_mode_template: skip
      agent_mode_protocol: critical
      quick_start_workflows: supplementary
      hierarchy_table: important
      hierarchy_diagram: skip
      wave_task_constraints: supplementary
      rationalization_prevention: supplementary
      wave_coordination: skip
      stage_primitives: supplementary
      gate_mechanism: skip
      agent_teams: important
      context_isolation: important
      dispatch_report: important
      lifecycle_hooks: skip
      repo_mode: skip
      reference_navigation: important
      rules_dispatchers: supplementary
      convergence_loop: skip
      task_quality_score: skip
      template_quick_ref: skip
      nines_advisor: critical
    learnings:
      enabled: true
      max_entries: 3
      min_confidence: 0.5
      budget_pct: 10
      budget_max_tokens: 500
    extra_context:
      - "references/team-roles.md"
    decomposition:
      enabled: false
    inline_review_checklist: false       # v7.2.0+ opt-in alternative to gen_verify subagent (50x faster);
                                         # safe for research stages where defects are structural; default off.
                                         # See references/decomposition-gate.md §8 for safe-stage list.
    rationale: >
      Research tasks are single-stage with minimal ceremony. No convergence
      loops, no gate mechanism, no repo mode. Focus on dispatch/report protocol
      and team roles for structuring research output.

  refactor:
    description: "Refactoring — code structure context, safety nets"
    goal_hints:
      - "refactor"
      - "clean up"
      - "tech debt"
      - "simplify"
    token_budget: 5200  # v8.0.0 P-08 bumped +200 to absorb behavioral_guidelines complex tier (think_first+simplicity_check+goal_loop+module scope) — was 5000 after v7.2.0+ PR-D +200 advisor
    model_hints:
      default_tier: balanced
      overrides:
        architecture_decisions: quality
        code_review: quality
        simple_implementation: budget
        test_execution: budget
    section_priorities:
      frontmatter: skip
      version_update: skip
      quick_action_decision: critical
      mode_detection: supplementary
      plan_mode_template: critical
      agent_mode_protocol: critical
      quick_start_workflows: important
      hierarchy_table: critical
      hierarchy_diagram: skip
      wave_task_constraints: critical
      rationalization_prevention: critical
      wave_coordination: critical
      stage_primitives: important
      gate_mechanism: critical
      agent_teams: important
      context_isolation: critical
      dispatch_report: critical
      lifecycle_hooks: critical
      repo_mode: important
      reference_navigation: supplementary
      rules_dispatchers: important
      convergence_loop: critical
      task_quality_score: supplementary
      template_quick_ref: skip
      nines_advisor: supplementary
    learnings:
