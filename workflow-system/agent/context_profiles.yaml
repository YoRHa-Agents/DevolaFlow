# Task-Adaptive Context Selection Profiles
# Based on: SWE-Pruner goal-hint routing, ATACompressor variable-rate allocation,
#           ContextOS Context-Dependent Gravity, WP-4 Rank 4 candidate
#
# Each profile defines which SKILL.md sections to include and their priority.
# Priority: critical (always include), important (include if budget allows),
#           supplementary (include only with remaining budget), skip (never include).
#
# Token budgets are target ranges; the selector enforces hard caps.

meta:
  version: "2.0.0"
  skill_source: "workflow-system/agent/SKILL.md"
  default_profile: "feature"
  budget_hard_cap_tokens: 8000
  # v7.0.2+ — Hierarchical predecessor summariser trigger threshold (resolves K.1).
  # When a single predecessor artifact exceeds this percentage of the consuming
  # layer's token_budget, dispatchers MUST call
  # `devolaflow.compressor.summarise_predecessor()` instead of embedding the
  # artifact body verbatim under `pred[*].body`. Default 25 % per ADR-003 §2.4
  # (e.g. L3 budget 8000 → summarise above 2000 tokens; L2 budget 4000 →
  # summarise above 1000). Override per-profile by setting `summary_trigger_pct:`
  # under the profile's section_priorities sibling (additive, optional).
  summary_trigger_pct: 25
  # v8.0.0 (P-02) — Layer-2 recency decay factor for multi-round predecessor
  # ranking. The dispatcher applies an exponential weighting w_round =
  # recency_decay_factor ** rounds_since_round (so older rounds shrink in
  # importance). Range (0.0, 1.0]:
  #   * 1.0  → no decay (preserves v7.x byte-stable behaviour; safe default
  #     for non-convergence dispatches that consume only the current round).
  #   * 0.9  → ≈ 10 % per-round decay (DevolaFlow default for P-02; matches
  #     plan §3 P-02 tuning band of 0.5-0.9 with 0.9 chosen to minimise
  #     EvoBench drift on the 36 existing scenarios).
  #   * 0.5  → aggressive decay (favoured when rounds carry heavy noise).
  # Per-profile override is allowed: add `recency_decay_factor:` under the
  # profile's `section_priorities` sibling (additive, optional). Consumed by
  # `_select_sections_by_priority` (compressor.py) and the layered
  # compression pipeline. P6-safe: NESTED under existing meta block, not a
  # new top-level dispatch key — layout_invariant.canonical_order length
  # stays 13 and version stays 2.
  recency_decay_factor: 0.9
  # v7.1.0: tool_output_truncation + summariser default-on for 6 decomposition profiles; opt-out per profile.
  compression_defaults:
    l0_to_l1: standard
    l1_to_l2: standard
    l2_to_l3: minimal
    l3_to_l2: aggressive
    l2_to_l1: aggressive
    l1_to_l0: aggressive
  # v7.2.1+ — Complexity-tier model routing (P-04, eb220 §"Model Interaction").
  # Maps the EvoBench complexity tiers (simple/medium/complex/very_complex)
  # to model_hint tiers drawn from VALID_MODEL_HINTS. Dispatchers that detect
  # task complexity may pass `complexity_tier=<tier>` to `select_context()` /
  # `resolve_model_hint()`; when set, the lookup overrides the per-profile
  # `model_hints.overrides[task_type]` and `model_hints.default_tier`.
  # Default `complexity_tier=None` preserves the v7.1.0 lookup priority
  # (overrides > default_tier > "inherit"). Locks in the EvoBench operational
  # guidance "opus4.7/max for Complex+, sonnet4.6/high for Simple/Medium"
  # (5.6x cost-efficiency win per eb220 §"Recommended Focus").
  complexity_routing:
    simple: budget
    medium: balanced
    complex: quality
    very_complex: quality
  platform_model_mapping:
    cursor:
      quality: inherit
      balanced: inherit
      budget: fast
      inherit: inherit
    codex:
      quality: o3
      balanced: o4-mini
      budget: o4-mini
      inherit: inherit
    claude_code:
      quality: opus
      balanced: sonnet
      budget: haiku
      inherit: inherit

  nines_integration:
    auto_detect: true
    install_hint: "uv pip install git+https://github.com/YoRHa-Agents/NineS.git"
    plugin_registry: "workflow-system/agent/plugins.yaml"
    commands:
      collect: "nines -f json collect --source github --query \"{query}\" --max-results {limit}"
      analyze: "nines -f json analyze --target-path {target} --depth deep --agent-impact --keypoints"
      self_eval: "nines -f json self-eval --project-root {root}"
      iterate: "nines -f json iterate --max-rounds {max_rounds} --threshold {threshold} --project-root {root}"
    triggers:
      - research_collection
      - knowledge_analysis
      - skill_iteration
      - self_evaluation

  ui_integration:
    auto_detect: true
    install_hint: "npm install -g uipro-cli && uipro init --ai cursor"
    plugin_registry: "workflow-system/agent/plugins.yaml"
    commands:
      design_system: "python3 .cursor/skills/ui-ux-pro-max/scripts/search.py \"{query}\" --design-system"
      style_search: "python3 .cursor/skills/ui-ux-pro-max/scripts/search.py \"{query}\" --domain style"
      palette_search: "python3 .cursor/skills/ui-ux-pro-max/scripts/search.py \"{query}\" --domain color"
    triggers:
      - ui_generation
      - design_system
      - landing_page

  # v8.0.0 (P-08) — L3 behavioral guidelines defaults per complexity tier.
  # Profiles that omit their own ``behavioral_guidelines`` block fall back
  # to the matching tier here. Each tier maps to the 4 Karpathy primitives
  # documented in ``workflow-system/agent/references/behavioral-guidelines.md``:
  #   * think_first (BG-001, warn) — plan-before-code discipline
  #   * simplicity_check (BG-002, warn) — over-engineering audit
  #   * surgical_scope (BG-003, blocker) — 'line' | 'function' | 'module'
  #   * goal_loop (BG-004, warn) — round-N goal re-anchor
  # The dispatcher's ``select_context()`` reads these defaults via
  # ``_select_behavioral_sections()`` and injects matching rule sections
  # into the L3 dispatch payload's top-level ``behavioral_guidelines``
  # field (canonical_order position 14, schema version 3 — P6 additive).
  #
  # Per-profile authors set ``behavioral_guidelines: {surgical_scope: ...}``
  # directly on their profile; ``surgical_scope`` defaults to ``function``
  # for backward compatibility when the key is omitted (see
  # ``_compose_behavioral_block`` line ``scope = ... .get("surgical_scope",
  # "function")``).
  #
  # v8.2.0 (PV-04) — surgical_scope='line' completion. Closes the deferred
  # AC #2 from v8.0.0 P-08 (line-tier verification). When the resolved
  # behavioural block sets ``surgical_scope: line``,
  # ``_select_behavioral_sections()`` augments the dispatch context with
  # ``line_level_criteria`` — a verbatim list of LL-001..LL-005 rules
  # extracted from
  # ``references/behavioral-guidelines.md#line-level-behavioral-criteria``.
  # The ``trivial`` tier below already maps to ``surgical_scope: line``
  # so any profile that opts into ``behavioral_guidelines: {tier: trivial}``
  # automatically receives the line-level criteria injection. The
  # ``function`` and ``module`` tier paths produce dispatch output
  # byte-identical to v8.0.0-p08 (R5 backward-compat discipline).
  behavioral_guidelines_defaults:
    trivial:
      think_first: false
      simplicity_check: false
      surgical_scope: line
      goal_loop: false
    simple:
      think_first: true
      simplicity_check: false
      surgical_scope: function
      goal_loop: false
    standard:
      think_first: true
      simplicity_check: true
      surgical_scope: function
      goal_loop: false
    complex:
      think_first: true
      simplicity_check: true
      surgical_scope: module
      goal_loop: true

  # v8.0.0 (P-10) — Automatic acceptance-criteria generation defaults.
  # Profiles that omit their own ``ac_generation`` block fall back to
  # this meta default. Opt-in by design (``enabled: false`` default) —
  # P-10 ships ``ACGenerator`` (``src/devolaflow/ac_generator.py``) and
  # ``evaluate_acceptance_criteria_v2`` (``src/devolaflow/gate/scorer.py``)
  # but does NOT silently rewrite the legacy ``acceptance_criteria:
  # list[str]`` alias (R5 backward compatibility per
  # ``.local/research/v8.0.0_patch_plan.md`` §9). Profiles that benefit
  # from auto-AC (impl / refactor / feature) MAY override
  # ``ac_generation: {enabled: true}`` per profile; trivial / docs-only
  # profiles SHOULD leave it disabled to avoid noisy criteria for
  # one-line edits.
  #
  # Field shape (when overridden per profile):
  #   ac_generation:
  #     enabled: bool                  # default false
  #     min_quality_threshold: float   # 0.0-100.0; gate the criteria
  #                                    # before injecting (skip when
  #                                    # score_quality["completeness"] <
  #                                    # threshold). Default 60.0.
  #     id_prefix: str                 # default "AC"
  ac_generation_defaults:
    enabled: false
    min_quality_threshold: 60.0
    id_prefix: "AC"

