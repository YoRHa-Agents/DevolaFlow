# Task-Adaptive Context Selection Profiles
# Based on: SWE-Pruner goal-hint routing, ATACompressor variable-rate allocation,
#           ContextOS Context-Dependent Gravity, WP-4 Rank 4 candidate
#
# Each profile defines which SKILL.md sections to include and their priority.
# Priority: critical (always include), important (include if budget allows),
#           supplementary (include only with remaining budget), skip (never include).
#
# Token budgets are target ranges; the selector enforces hard caps.

meta:
  version: "2.0.0"
  skill_source: "workflow-system/agent/SKILL.md"
  default_profile: "feature"
  budget_hard_cap_tokens: 8000
  # v7.0.2+ — Hierarchical predecessor summariser trigger threshold (resolves K.1).
  # When a single predecessor artifact exceeds this percentage of the consuming
  # layer's token_budget, dispatchers MUST call
  # `devolaflow.compressor.summarise_predecessor()` instead of embedding the
  # artifact body verbatim under `pred[*].body`. Default 25 % per ADR-003 §2.4
  # (e.g. L3 budget 8000 → summarise above 2000 tokens; L2 budget 4000 →
  # summarise above 1000). Override per-profile by setting `summary_trigger_pct:`
  # under the profile's section_priorities sibling (additive, optional).
  summary_trigger_pct: 25
  # v8.0.0 (P-02) — Layer-2 recency decay factor for multi-round predecessor
  # ranking. The dispatcher applies an exponential weighting w_round =
  # recency_decay_factor ** rounds_since_round (so older rounds shrink in
  # importance). Range (0.0, 1.0]:
  #   * 1.0  → no decay (preserves v7.x byte-stable behaviour; safe default
  #     for non-convergence dispatches that consume only the current round).
  #   * 0.9  → ≈ 10 % per-round decay (DevolaFlow default for P-02; matches
  #     plan §3 P-02 tuning band of 0.5-0.9 with 0.9 chosen to minimise
  #     EvoBench drift on the 36 existing scenarios).
  #   * 0.5  → aggressive decay (favoured when rounds carry heavy noise).
  # Per-profile override is allowed: add `recency_decay_factor:` under the
  # profile's `section_priorities` sibling (additive, optional). Consumed by
  # `_select_sections_by_priority` (compressor.py) and the layered
  # compression pipeline. P6-safe: NESTED under existing meta block, not a
  # new top-level dispatch key — layout_invariant.canonical_order length
  # stays 13 and version stays 2.
  recency_decay_factor: 0.9
  # v7.1.0: tool_output_truncation + summariser default-on for 6 decomposition profiles; opt-out per profile.
  compression_defaults:
    l0_to_l1: standard
    l1_to_l2: standard
    l2_to_l3: minimal
    l3_to_l2: aggressive
    l2_to_l1: aggressive
    l1_to_l0: aggressive
  # v7.2.1+ — Complexity-tier model routing (P-04, eb220 §"Model Interaction").
  # Maps the EvoBench complexity tiers (simple/medium/complex/very_complex)
  # to model_hint tiers drawn from VALID_MODEL_HINTS. Dispatchers that detect
  # task complexity may pass `complexity_tier=<tier>` to `select_context()` /
  # `resolve_model_hint()`; when set, the lookup overrides the per-profile
  # `model_hints.overrides[task_type]` and `model_hints.default_tier`.
  # Default `complexity_tier=None` preserves the v7.1.0 lookup priority
  # (overrides > default_tier > "inherit"). Locks in the EvoBench operational
  # guidance "opus4.7/max for Complex+, sonnet4.6/high for Simple/Medium"
  # (5.6x cost-efficiency win per eb220 §"Recommended Focus").
  complexity_routing:
    simple: budget
    medium: balanced
    complex: quality
    very_complex: quality
  platform_model_mapping:
    cursor:
      quality: inherit
      balanced: inherit
      budget: fast
      inherit: inherit
    codex:
      quality: o3
      balanced: o4-mini
      budget: o4-mini
      inherit: inherit
    claude_code:
      quality: opus
      balanced: sonnet
      budget: haiku
      inherit: inherit

  nines_integration:
    auto_detect: true
    install_hint: "uv pip install git+https://github.com/YoRHa-Agents/NineS.git"
    plugin_registry: "workflow-system/agent/plugins.yaml"
    commands:
      collect: "nines -f json collect --source github --query \"{query}\" --max-results {limit}"
      analyze: "nines -f json analyze --target-path {target} --depth deep --agent-impact --keypoints"
      self_eval: "nines -f json self-eval --project-root {root}"
      iterate: "nines -f json iterate --max-rounds {max_rounds} --threshold {threshold} --project-root {root}"
    triggers:
      - research_collection
      - knowledge_analysis
      - skill_iteration
      - self_evaluation

  ui_integration:
    auto_detect: true
    install_hint: "npm install -g uipro-cli && uipro init --ai cursor"
    plugin_registry: "workflow-system/agent/plugins.yaml"
    commands:
      design_system: "python3 .cursor/skills/ui-ux-pro-max/scripts/search.py \"{query}\" --design-system"
      style_search: "python3 .cursor/skills/ui-ux-pro-max/scripts/search.py \"{query}\" --domain style"
      palette_search: "python3 .cursor/skills/ui-ux-pro-max/scripts/search.py \"{query}\" --domain color"
    triggers:
      - ui_generation
      - design_system
      - landing_page

  # v12.5.0 PV-04 D-1.2 — codegraph integration block.
  # Parallel to nines_integration above; surfaced by L0/L1/L2 dispatchers
  # at workflow-stage entry to inform the agent which codegraph CLI
  # recipes are available for the active workflow + stage. The block is
  # READ-ONLY metadata — the workflow runner does NOT auto-execute these
  # commands. The agent invokes them on demand against the project-local
  # .codegraph/ index (created by repo-init.yaml's scaffold step in ALL
  # modes per the locked operator decision 2026-05-23).
  #
  # Per W-15 / CO-6 (section relevance): the per-profile activation of
  # this block lives in profiles[<name>].sections — analyze-stage
  # workflows mark codegraph_integration: important; unrelated profiles
  # mark it: skip. See profiles.repo-init / onboarding / security-audit /
  # product-verification for the per-profile priority assignments.
  #
  # tokens_est: 200 — consistent with nines_integration above; the block
  # itself adds ~50 bytes per dispatch when active (the 4 stage_mapping
  # recipes nest under config.codegraph_commands per A-2.3 NEST-vs-APPEND).
  #
  # Source: .local/research/v12.5.0_gap_analysis.md §2 D-1.2 +
  # .local/research/v12.5.0_codegraph_benefit_analysis.md §3 surface 5.
  codegraph_integration:
    auto_detect: true
    install_hint: "npm install -g @colbymchenry/codegraph"
    plugin_registry: "workflow-system/agent/plugins.yaml"
    commands:
      repo_init: "codegraph init {project_root}"
      analyze: "codegraph status && codegraph files --format tree"
      research: "codegraph context \"{query}\" --format markdown --max-nodes 20"
      impact: "codegraph impact {symbol} --depth 3 --json"
      affected: "codegraph affected --files {files} --json"
    triggers:
      - smart_context_building
      - full_text_search
      - impact_analysis
      - callers_callees_trace
      - file_structure_lookup
      - test_impact_selection

  # v13.0.0 — impeccable integration block.
  # Parallel to ui_integration + codegraph_integration above; surfaced by
  # L0/L1/L2 dispatchers at web-design refine/verify stage entry to inform
  # the agent which impeccable commands are available. READ-ONLY metadata —
  # the workflow runner does NOT auto-execute these commands; the agent
  # invokes the /impeccable steering commands + `impeccable detect` on
  # demand against the built UI.
  #
  # Per W-15 / CO-6 (section relevance): surfaced for the web-design workflow's
  # refine/verify stages (design refinement + the impeccable detect gate);
  # unrelated task profiles do not load it. Mirrors the ui_integration /
  # codegraph_integration top-level-metadata pattern (READ-ONLY hint block; the
  # workflow runner never auto-executes these recipes).
  #
  # tokens_est: 180 — consistent with ui_integration / codegraph_integration.
  #
  # Source: .local/research/v13.0.0_gap_analysis.md §3 (Phase 2 D-5).
  impeccable_integration:
    auto_detect: true
    install_hint: "npm install -g impeccable && impeccable skills install --yes"
    plugin_registry: "workflow-system/agent/plugins.yaml"
    commands:
      polish: "/impeccable polish {target}"
      critique: "/impeccable critique {target}"
      audit: "/impeccable audit {target}"
      typeset: "/impeccable typeset {target}"
      arrange: "/impeccable arrange {target}"
      animate: "/impeccable animate {target}"
      detect: "impeccable detect --json {path}"
    triggers:
      - design_refinement
      - ux_design_critique
      - technical_quality_audit
      - typography_correction
      - layout_spatial_rhythm
      - purposeful_motion
      - antipattern_detection

  # v8.0.0 (P-08) — L3 behavioral guidelines defaults per complexity tier.
  # Profiles that omit their own ``behavioral_guidelines`` block fall back
  # to the matching tier here. Each tier maps to the 4 Karpathy primitives
  # documented in ``workflow-system/agent/references/behavioral-guidelines.md``:
  #   * think_first (BG-001, warn) — plan-before-code discipline
  #   * simplicity_check (BG-002, warn) — over-engineering audit
  #   * surgical_scope (BG-003, blocker) — 'line' | 'function' | 'module'
  #   * goal_loop (BG-004, warn) — round-N goal re-anchor
  # The dispatcher's ``select_context()`` reads these defaults via
  # ``_select_behavioral_sections()`` and injects matching rule sections
  # into the L3 dispatch payload's top-level ``behavioral_guidelines``
  # field (canonical_order position 14, schema version 3 — P6 additive).
  #
  # Per-profile authors set ``behavioral_guidelines: {surgical_scope: ...}``
  # directly on their profile; ``surgical_scope`` defaults to ``function``
  # for backward compatibility when the key is omitted (see
  # ``_compose_behavioral_block`` line ``scope = ... .get("surgical_scope",
  # "function")``).
  #
  # v8.2.0 (PV-04) — surgical_scope='line' completion. Closes the deferred
  # AC #2 from v8.0.0 P-08 (line-tier verification). When the resolved
  # behavioural block sets ``surgical_scope: line``,
  # ``_select_behavioral_sections()`` augments the dispatch context with
  # ``line_level_criteria`` — a verbatim list of LL-001..LL-005 rules
  # extracted from
  # ``references/behavioral-guidelines.md#line-level-behavioral-criteria``.
  # The ``trivial`` tier below already maps to ``surgical_scope: line``
  # so any profile that opts into ``behavioral_guidelines: {tier: trivial}``
  # automatically receives the line-level criteria injection. The
  # ``function`` and ``module`` tier paths produce dispatch output
  # byte-identical to v8.0.0-p08 (R5 backward-compat discipline).
  #
  # v12.2.0 PV-03 — Mnimiy 3-rule extension. Per
  # `.local/research/v12.2.0_gap_analysis.md` §2 D-2 the Mnimiy May-2026
  # X article surfaces 3 failure modes not covered by the v8.0.0 P-08
  # Karpathy 4-rule baseline:
  #   * no_llm_for_deterministic (BG-005, warn) — deterministic decisions
  #     belong in deterministic code, not in LLM prompts
  #   * surface_conflicts (BG-006, major) — surface codebase pattern
  #     disagreement instead of averaging both patterns
  #   * convention_first (BG-007, major) — match existing pattern even
  #     when a "better" pattern exists in established codebases
  # Tier rollout:
  #   * trivial — all 3 OFF (one-liner edits don't benefit from the audit)
  #   * simple — convention_first ON (1-3 file scope; pattern hygiene matters)
  #   * standard — all 3 ON (3-10 file scope; cross-file consistency matters)
  #   * complex — all 3 ON (10+ files; full audit)
  # NEST-not-APPEND per A-2.3: the 3 new fields land as sub-keys on the
  # existing `behavioral_guidelines` dispatch block — canonical_order
  # length stays at 17 and schema version stays at 6.
  behavioral_guidelines_defaults:
    trivial:
      think_first: false
      simplicity_check: false
      surgical_scope: line
      goal_loop: false
      no_llm_for_deterministic: false
      surface_conflicts: false
      convention_first: false
    simple:
      think_first: true
      simplicity_check: false
      surgical_scope: function
      goal_loop: false
      no_llm_for_deterministic: false
      surface_conflicts: false
      convention_first: true
    standard:
      think_first: true
      simplicity_check: true
      surgical_scope: function
      goal_loop: false
      no_llm_for_deterministic: true
      surface_conflicts: true
      convention_first: true
    complex:
      think_first: true
      simplicity_check: true
      surgical_scope: module
      goal_loop: true
      no_llm_for_deterministic: true
      surface_conflicts: true
      convention_first: true

  # v8.0.0 (P-10) — Automatic acceptance-criteria generation defaults.
  # Profiles that omit their own ``ac_generation`` block fall back to
  # this meta default. Opt-in by design (``enabled: false`` default) —
  # P-10 ships ``ACGenerator`` (``src/devolaflow/ac_generator.py``) and
  # ``evaluate_acceptance_criteria_v2`` (``src/devolaflow/gate/scorer.py``)
  # but does NOT silently rewrite the legacy ``acceptance_criteria:
  # list[str]`` alias (R5 backward compatibility per
  # ``.local/research/v8.0.0_patch_plan.md`` §9). Profiles that benefit
  # from auto-AC (impl / refactor / feature) MAY override
  # ``ac_generation: {enabled: true}`` per profile; trivial / docs-only
  # profiles SHOULD leave it disabled to avoid noisy criteria for
  # one-line edits.
  #
  # Field shape (when overridden per profile):
  #   ac_generation:
  #     enabled: bool                  # default false
  #     min_quality_threshold: float   # 0.0-100.0; gate the criteria
  #                                    # before injecting (skip when
  #                                    # score_quality["completeness"] <
  #                                    # threshold). Default 60.0.
  #     id_prefix: str                 # default "AC"
  ac_generation_defaults:
    enabled: false
    min_quality_threshold: 60.0
    id_prefix: "AC"

  # v9.0.0 PV-06 (v8.5.1) — Theme T5 5-primitive default-on flip.
  # Defaults that downstream orchestrators consult when instantiating
  # gate primitives. STRICT and AUDIT decomposition profiles flip the 5
  # v8.0.0 gate primitives to default-ON; STANDARD and RELAXED keep
  # them opt-in (byte-identical pre-flip behaviour).
  #
  # Source-of-truth for the default values lives in
  # ``src/devolaflow/gate/profiles.py`` (the GateProfile dataclass
  # fields ``budget_breaker_enabled``, ``ladder_enabled``,
  # ``ratchet_enabled``, ``complexity_detector_enabled``,
  # ``ac_generator_enabled``); the block below is the dispatcher-side
  # mirror so L0/L1/L2 agents see the effective per-profile default
  # without importing the gate package. Per-process opt-out goes
  # through the env-flag listed against each row (R5 strict — set
  # EXACTLY ``"0"`` to disable; per env-flags.md §2.6..§2.10).
  #
  # Schema: { primitive_name: { profile_name: bool } }. Adding a new
  # gate-profile name (e.g. "audit-light") requires adding a row here
  # AND updating the corresponding dataclass default in profiles.py.
  gate_primitive_defaults:
    token_budget_breaker:
      env_flag: "DEVOLAFLOW_TOKEN_BUDGET_BREAKER"
      strict: true
      audit: true
      standard: false
      relaxed: false
    verification_ladder:
      env_flag: "DEVOLAFLOW_VERIFICATION_LADDER"
      strict: true
      audit: true
      standard: false
      relaxed: false
    ratchet:
      env_flag: "DEVOLAFLOW_GATE_RATCHET"
      strict: true
      audit: true
      standard: false
      relaxed: false
    complexity_detector:
      env_flag: "DEVOLAFLOW_COMPLEXITY_DETECTOR"
      strict: true
      audit: true
      standard: false
      relaxed: false
    ac_generator:
      env_flag: "DEVOLAFLOW_AC_GEN"
      strict: true
      audit: true
      standard: false
      relaxed: false

  # v9.0.0 PV-07 (v9.0.0) — Per-task-type AGENTS.md slicing.
  # v9.1.5 PV-05 — DEFAULT-ON FLIP (operator-visible behaviour change).
  #
  # Codified per .local/research/adr/v9-ADR-007-rule-rebalancing-and-rollup.md
  # D3 (the OPERATOR-VISIBLE breaking-change facet of v9.0.0 MAJOR semver).
  #
  # When ``enabled: true`` (the v9.1.5+ default), select_agents_md_slice(task_type)
  # (in task_adaptive_selector.py) filters the compiled AGENTS.md content per
  # the per-profile layer-prefix mapping below, hiding rules irrelevant
  # to the task type.
  #
  # OPT-OUT (R5 strict): set ``DEVOLAFLOW_AGENTS_MD_SLICE=0`` to revert to
  # the v9.1.4 byte-identical full-AGENTS.md behaviour. Per W-20, this
  # flag was telegraphed in the v9.0.0 PV-07 ADR-007 D3 design but the
  # runtime read landed in v9.1.5 PV-05 alongside this default flip
  # (existing-but-unwired flag — REUSE, not new). EXACTLY ``"0"`` forces
  # opt-out; EXACTLY ``"1"`` forces opt-in (overriding any future YAML
  # opt-out); any other env value falls through to this YAML default.
  # Pinned by tests/test_pv07_agents_md_slice.py.
  #
  # The slice never reorders or rewrites canonical rules — it only
  # HIDES rules irrelevant to the task type. Top-level layer headings
  # (# Soul Rules, # Architecture Rules, ...) are preserved if any rule
  # in that layer survives; layers with all rules dropped are skipped
  # entirely (header dropped too).
  #
  # Layer values:
  #   "all"           — keep every rule in the layer
  #   ["A-1", "A-2"]  — keep only the listed rule IDs
  #   (key omitted)   — skip the entire layer (drop the layer header too)
  #
  # The 9 canonical task-profile slices are documented verbatim in
  # .local/research/v9.0.0_pv07_rule_audit.md §2.2. Operators with custom
  # profiles add new entries under ``profiles.<profile_name>``.
  #
  # MAJOR semver justification: with v9.1.5 default-ON, the cached prefix
  # that L0 sends to L1/L2/L3 dispatchers shrinks by 15-70% depending on
  # task type. For long-running L0 sessions that cache the AGENTS.md
  # prefix between dispatches, this is an observable change in the input
  # prompt — downstream tools that audit / log prompts will see different
  # content. The opt-out env flag (DEVOLAFLOW_AGENTS_MD_SLICE=0) lets
  # operators retain v9.1.4 byte-stable behaviour during migration.
  agents_md_slice:
    enabled: true
    fallback: full
    profiles:
      hotfix:
        soul: all
        architecture: ["A-1", "A-2"]
        conventions: ["C-1", "C-2", "C-3", "C-8"]
        workflow: ["W-9", "W-11"]
      feature:
        soul: all
        architecture: all
        conventions: all
        workflow: ["W-1", "W-2", "W-3", "W-4", "W-5", "W-6", "W-7", "W-8", "W-9", "W-10", "W-11", "W-12", "W-13", "W-14", "W-15"]
        style: ["ST-1", "ST-3", "ST-4", "ST-7"]
      research:
        soul: all
        architecture: ["A-1"]
        conventions: ["C-1", "C-2", "C-3"]
        workflow: ["W-1", "W-2"]
      refactor:
        soul: all
        architecture: all
        conventions: all
        workflow: ["W-1", "W-2", "W-3", "W-4", "W-5", "W-6", "W-7", "W-8", "W-9", "W-10", "W-11", "W-12", "W-13", "W-14", "W-15", "W-18"]
        style: ["ST-1", "ST-3", "ST-4"]
      review:
        soul: all
        architecture: ["A-1", "A-2"]
        conventions: ["C-1", "C-2", "C-3", "C-8"]
        workflow: ["W-3", "W-9", "W-11"]
      design:
        soul: all
        architecture: all
        conventions: ["C-1", "C-2", "C-3", "C-4", "C-5", "C-7"]
        workflow: ["W-1", "W-2", "W-7"]
        style: ["ST-1", "ST-3", "ST-7"]
      convergence:
        soul: all
        architecture: all
        conventions: all
        workflow: all
        style: all
      rdrr:
        soul: all
        architecture: all
        conventions: all
        workflow: all
        style: all
      documentation:
        soul: ["S-1", "S-2", "S-4", "S-5", "S-7"]
        architecture: ["A-1", "A-3"]
        conventions: ["C-1", "C-2", "C-3", "C-4", "C-5", "C-6", "C-7"]
        workflow: ["W-7"]
        style: all
      default:
        soul: all
        architecture: all
        conventions: all
        workflow: all
        style: all

# v8.2.0 (PV-05) — Section-anchor registry. Symbolic anchor → file path
# mapping consumed by ``devolaflow.section_registry.SectionAnchorRegistry``
# and ``task_adaptive_selector._resolve_section_text``. Establishes the
# canonical decoupling layer for section discovery so SKILL.md edits no
# longer cascade through ``sections:`` line ranges and trigger unrelated
# EvoBench scenario drift (closes gap analysis B1 / R7 per
# ``.local/research/v8.1.0_gap_analysis.md`` §3.2). The ``sections:``
# block below is kept as the deprecated fallback for sections not yet
# migrated; lookups for those sections emit a one-shot
# ``DeprecationWarning`` (S-5 — no silent legacy use).
#
# Two YAML forms are accepted (per ``src/devolaflow/section_registry.py``
# module docstring):
#   * Short:    ``<anchor>: <file_path>`` (heading auto-derived from anchor)
#   * Extended: ``<anchor>: {file: <path>, heading: <markdown_heading>}``
#
# All paths are repo-root-relative per S-2 / SF-5. The
# ``behavioral_guidelines_reference`` anchor is the canonical example
# called out in ``.local/research/v8.2.0_patch_plan.md`` §3 PV-05 AC #1
# — its content drives the v8.0.0-p08 BG-003 surgical_scope='line'
# criteria injection in ``_load_line_level_criteria``.
#
# v8.2.0 (PV-05) intentionally migrates the EXTERNAL reference doc only;
# SKILL.md sections remain on the line-based fallback this cycle so the
# 36+ EvoBench scenarios stay byte-identical (PV-05 invariant per
# ``.local/research/v8.2.0_patch_plan.md`` §1.1 hard constraint #4).
# Future v8.2.x cycles will incrementally migrate SKILL.md sections by
# pairing each migration with a fresh baseline regen + `<5pp drift`
# verification per W-4 / SI-4. The infrastructure (registry, integration,
# fallback) is in place — the migration itself is the bench item.
section_anchors:
  # External reference doc (the architectural decoupling carrier — its
  # content drives the BG-003 surgical_scope='line' criteria injection).
  behavioral_guidelines_reference: "workflow-system/agent/references/behavioral-guidelines.md"

  # v9.0.0 PV-01 (v8.4.1) — R7 carry-forward partial closure. Eliminates
  # the runtime deprecation warnings that fire from
  # ``_resolve_section_text`` for ``frontmatter`` + ``version_update``
  # (the user-visible ones flagged by the v9.0.0 SI-1 gap analysis), and
  # migrates the two SKILL.md sections whose content moved into
  # ``references/plan-mode-enforcement.md`` (PLAN MODE + Reinforcement
  # Rules / Convergence Loop). The rest of the SKILL.md anchors are
  # intentionally left on the legacy line-based fallback path because
  # their heading-based extraction is significantly larger than the
  # historical line slice (e.g. ``mode_detection`` heading-extract
  # returns Mode Awareness + PLAN MODE + AGENT MODE = 670 tokens vs the
  # legacy line slice of 91 tokens), which would push critical sections
  # out of the per-profile section_budget allocator and break
  # ``tests/test_behavioral_guidelines.py::test_behavioral_block_does_not_displace_critical_sections``.
  # Full migration is deferred to a future PV that pairs each anchor
  # bump with a per-profile budget recalibration + EvoBench wholesale
  # baseline regen — out of scope for PV-01 (R7 narrowed to "warning
  # cleanup + content-move-driven anchors only").
  #
  # Per S-5 the legacy fall-through path still emits a DeprecationWarning
  # for any anchor not registered here, so the cleanup signal remains
  # visible for the deferred migration.
  frontmatter:
    file: "workflow-system/agent/SKILL.md"
    heading: "## Version & Update"      # nearest extractable heading; YAML frontmatter has none
  version_update:
    file: "workflow-system/agent/SKILL.md"
    heading: "## Version & Update"
  # plan_mode_template resolves to the compressed SKILL.md PLAN MODE
  # summary that points at references/plan-mode-enforcement.md for the
  # full template. The reference holds the verbatim 45-line plan template
  # extracted from SKILL.md by v9.0.0 PV-01 (closes B-01). Anchoring at
  # the compressed SKILL.md section keeps the section_budget impact
  # predictable (≈ 116 tokens vs legacy 820 tokens) while preserving
  # discoverability of the full template via the cross-link.
  plan_mode_template:
    file: "workflow-system/agent/SKILL.md"
