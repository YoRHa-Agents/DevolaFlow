      max_nesting_depth: 1
      sub_agent_model_hint: budget
      sub_agent_context_budget: 5000  # v7.0.1: bumped from 3000 (resolves K.8, see ADR-002 §4)
      coordinator_retains_advisor: true
      gen_verify_mode: true
      gen_verify_max_rounds: 3
    tool_output_truncation:           # v7.0.1+: opt-in primitive (per ADR-002 §2.4); default disabled
