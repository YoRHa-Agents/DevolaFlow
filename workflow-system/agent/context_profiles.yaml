# v8.0.0 (P-12) — Complex-feature opt-in for the new abstractive
# summariser path (Stage A heuristic in
# ``src/devolaflow/compressor.py::summarise_predecessor`` with
# ``mode='abstractive'``). Density-routed compression (low-density
# sections collapsed to ≤2 lines, high-density preserved up to 5 with
# named entities intact) frees ~30-50 % of the predecessor budget on
# long-context complex-feature artifacts (50k+ token repos), targeting
# the EvoBench ``long_context_repo_qa`` ≥ +3pp lift per P-12 AC #6.
#
# This is a TOP-LEVEL section (sibling to ``meta:``/``sections:``/
# ``profiles:``), NOT a new profile. That keeps the profile count
# stable so the demo/index.html sync test does not need updating, and
# it isolates the abstractive opt-in behind a single named flag that
# v8.2.0 PV-01 (Stage B) can extend without re-shaping the YAML tree.
#
# Stage B (LLM-assisted) opt-in is OUT OF SCOPE for v8.0.0 — see
# ``.local/research/v8.0.0_p12_abstractive_stage_b_design.md``.
complex_feature:
  summary_mode: abstractive
  max_tokens: 1200
  low_density_threshold: 0.30
  low_density_max_lines: 2
  high_density_max_lines: 5
  fallback_mode: extractive
  rationale: >
    Complex feature work routinely consumes long-context predecessor
    artifacts (multi-file design docs, accumulated round-N convergence
    reports, 50k+ token repo digests). The abstractive summariser
    (P-12 Stage A) measures information density per section and
    collapses low-density sections to ≤2 lines while preserving
    high-density sections (named entities intact, ≤5 lines), freeing
    budget for additional predecessor sections. Falls back to
    extractive when Stage A output would be empty.

# v8.2.0 (PV-01) — LLM-assisted Stage B opt-in for abstractive summarisation.
#
# Sibling top-level section to ``complex_feature`` (P-12) — preserves the
# v8.0.0 P-12 surface byte-identical (the ``complex_feature`` section is
# unchanged) while adding a separate, opt-in surface for callers that want
# to flip Stage B on. Wired into
# ``src/devolaflow/compressor.py::summarise_predecessor`` via the new
# ``llm_assist=True`` kwarg + the new ``src/devolaflow/llm_client.py``
# module's :class:`LLMClient`. The default ``llm_assist=False`` preserves
# v8.0.0-p10 byte-identical behaviour (no schema bump, no log-line
# appearance, no extra dict key) — pinned by
# ``tests/test_compressor.py::TestAbstractiveStageBLLM
# ::test_llm_assist_false_byte_identical_to_stage_a``.
#
# Stage B refines Stage A's heuristic output via a bounded LLM call,
# preserving CO-2 verbatim entities and emitting structured logs for
# all 7 canonical failure modes (timeout / network / parse / schema /
# content_filter / rate_limit / fallback_disabled) per S-5. On any
# failure Stage A is returned verbatim with
# ``predecessor[i].abstractive_stage = 'a'`` set on the status report
# (so SI-4 EvoBench attribution can distinguish "Stage B never invoked"
# from "Stage B invoked then fell back" — Stage B design §4 last
# paragraph).
#
# Cost / latency budgets default to conservative ceilings (per Stage B
# design §5/§6): 800 ms per-dispatch P95 wall-clock, $0.05 per-dispatch
# USD ceiling, 30 % min Stage A savings before escalation. Production
# default is ``enabled: true`` here (this is the OPT-IN section — callers
# that select this profile are explicitly opting into Stage B); the
# global kill switch still lives at ``llm_assist=False`` (the
# ``summarise_predecessor`` kwarg default).
#
# P6-safe: NESTED top-level section, NOT a new dispatch field.
# canonical_order length stays 15, schemas/lean-dispatch.yaml version
# stays 4 throughout v8.2.0 PV-01 per
# ``.local/research/v8.2.0_patch_plan.md`` §1.1 invariant 1.
abstractive_llm:
  enabled: true
  provider: mock
  model: null
  max_tokens: 2000
  timeout_s: 30.0
  cost_ceiling_usd: 0.05
  latency_budget_ms: 800
  min_savings_pct: 30
  on_failure: fallback_to_stage_a
  fallback_mode: extractive
  rationale: >
    Opt-in LLM-assisted Stage B refinement of the P-12 Stage A heuristic.
    Caller passes ``llm_assist=True`` to
    ``summarise_predecessor(...)`` and supplies an ``LLMClient`` (or
    accepts the deterministic ``mock`` provider for tests). All seven
    canonical failure modes (timeout, network, parse, schema,
    content_filter, rate_limit, fallback_disabled) trigger an immediate
    fallback to the Stage A heuristic output and emit a structured
    WARNING via the ``devolaflow.compressor.stage_b`` logger per S-5
    (No Silent Failures). Production rollout follows the 4-PR plan in
    ``.local/research/v8.0.0_p12_abstractive_stage_b_design.md`` §9 —
    PV-01 lands PR 1+2+3 (config + mock + opt-in flag). PR 4 (default
    ``llm_assist=true`` for L0/L1 dispatch) is benched to v8.2.x
    pending production telemetry.

# v8.2.0 (PV-02) — Agent legibility scoring opt-in.
#
# Sibling top-level section to ``complex_feature`` (P-12) and
# ``abstractive_llm`` (PV-01) — preserves the v8.1.0-rc.1 byte-stable
# behaviour (the gate scorer is unchanged unless callers explicitly
# pass ``legibility_scorer=...``). Wired into
# :func:`devolaflow.gate.scorer.evaluate_gate` via the new
# ``legibility_scorer`` / ``legibility_files`` kwargs + the new
# :class:`devolaflow.legibility.LegibilityScorer`. The default
# ``legibility_scorer=None`` preserves v8.1.0-rc.1 byte-identical
# behaviour (no schema bump, no log-line appearance, no extra dict key)
# — pinned by ``tests/test_legibility.py`` byte-identicality tests.
#
# When opt-in, the scorer rates each touched file 0-100 across three
# dimensions (naming consistency / comment-to-code ratio / cyclomatic
# flow) and the gate composite is shifted by
# ``profile.legibility_weight * (mean_score - 50)``. STRICT/AUDIT
# default to weight 0.05 (well-legible code lifts the composite by up
# to 2.5 points; illegible code drags by up to 2.5 points);
# STANDARD/RELAXED default to 0.0 (opt-in only).
#
# Three audit modes are pre-canned here so dispatchers can reference
# them by name instead of re-deriving the file-set + weights:
#
#   * ``code_only``   — score touched ``src/**/*.py`` files only.
#   * ``docs_only``   — score touched ``workflow-system/**/*.md`` files
#                       only (useful for README / SKILL drift cycles).
#   * ``mixed``       — score every touched text file (default — most
#                       cycles touch a mix of code + docs).
#
# P6-safe: NESTED top-level section, NOT a new dispatch field.
# canonical_order length stays 15, schemas/lean-dispatch.yaml version
# stays 4 throughout v8.2.0 PV-02 per
# ``.local/research/v8.2.0_patch_plan.md`` §1.1 invariant 1.
legibility_audit:
  enabled: false
  default_mode: mixed
  audit_modes_code_only_globs: ["src/**/*.py", "tests/**/*.py"]
  audit_modes_docs_only_globs: ["workflow-system/**/*.md", "README.md", "CHANGELOG.md"]
  audit_modes_mixed_globs: ["src/**/*.py", "tests/**/*.py", "workflow-system/**/*.md", "schemas/**/*.yaml"]
  weight_naming_consistency: 0.40
  weight_comment_ratio: 0.30
  weight_cyclomatic_flow: 0.30
  threshold_min_score: 75.0
  threshold_fail_below: 60.0
  rationale: >
    Opt-in (default ``enabled: false``) per-file legibility scoring.
    When the dispatcher flips ``enabled: true`` and supplies
    ``legibility_files`` to ``evaluate_gate``, every listed file is
    rated 0-100 on naming consistency / comment-to-code ratio /
    cyclomatic flow. The aggregate ``mean_score`` shifts the gate
    composite via ``profile.legibility_weight * (mean_score - 50)``
    (STRICT/AUDIT default weight 0.05). Three pre-canned audit modes
    (``code_only`` / ``docs_only`` / ``mixed``) let L1/L2 dispatchers
    pick a file set by name. The ``thresholds`` block is advisory —
    consumers may post-process ``verdict.details['legibility']
    ['mean_score']`` and emit a custom ReinforcementRule when the file
    falls below ``min_score``. Default disabled per the v8.0.0 retro
    §4.3 opt-in-by-default rule (every additive runtime primitive
    defaults to OFF / None / False / disabled).

# v8.2.0 (PV-03) — Unified session state model opt-in.
#
# Sibling top-level section to ``complex_feature`` (P-12),
# ``abstractive_llm`` (PV-01), and ``legibility_audit`` (PV-02). PV-03
# closes the v8.0.0 patch_plan §1 row 8 deferral of "Unified session
# state model" / Karpathy 4.8 — :class:`devolaflow.session.SessionState`
# aggregates learnings + lifecycle + legibility into one in-memory view
# plus a JSON snapshot at :data:`devolaflow.session.DEFAULT_SESSION_STATE_PATH`
# (``.local/memory/session_state.json``).
#
# When ``session_state_enabled: false`` (the default for
# STANDARD/RELAXED) the v8.1.0-rc.1 byte-stable behaviour is preserved
# — :mod:`devolaflow.learnings` and :mod:`devolaflow.lifecycle`
# continue to operate via their direct JSONL substrate paths and
# nothing in the gate / dispatcher composition reads the SessionState
# JSON file. STRICT and AUDIT default to ``session_state_enabled:
# true`` so high-rigour profiles get cross-domain replay (learnings +
# lifecycle hooks + legibility verdicts) for free; explicit override
# is honoured per-profile via the ``profile.session_state_enabled``
# sibling key (read by L1/L2 dispatchers when present).
#
# P6-safe: NESTED top-level section, NOT a new dispatch field.
# canonical_order length stays 15, schemas/lean-dispatch.yaml version
# stays 4 throughout v8.2.0 PV-03 per
# ``.local/research/v8.2.0_patch_plan.md`` §1.1 invariant 1.
session_state:
  enabled: false
  default_path: ".local/memory/session_state.json"
  schema_version: 1
  # Flat one-key-per-profile defaults (kept inline to preserve the
  # parent-block naming convention used by ``legibility_audit`` /
  # ``abstractive_llm`` / ``complex_feature`` — every nested key has an
  # inline scalar so static parsers like
  # ``tests/test_doc_consistency.py::test_context_profiles_count`` do not
  # mistake the block for a new entry under ``profiles:``).
  profile_default_standard_enabled: false
  profile_default_relaxed_enabled: false
  profile_default_strict_enabled: true
  profile_default_audit_enabled: true
  rationale: >
    Opt-in (default ``enabled: false``) unified session state model. When
    enabled, the lifecycle ``task_stop`` hook persists a
    :class:`devolaflow.session.SessionState` JSON snapshot to
    ``default_path`` after each clean task_stop, capturing learnings +
    lifecycle hook outcomes + legibility verdicts in one diffable file.
    STRICT/AUDIT default to enabled; STANDARD/RELAXED default to
    disabled per the v8.0.0 retro §4.3 opt-in-by-default rule. The
    JSON is forward-compatible — :class:`devolaflow.session.SessionState.from_dict`
    accepts unknown keys (logged at DEBUG) and tolerates higher
    ``schema_version`` values for forward read. Migration from the
    legacy direct-:func:`devolaflow.learnings.consolidate_session`
    flow is a no-op: both flows write to the same JSONL substrate; the
    SessionState snapshot is additive.
