# DevolaFlow runtime plugin registry — v9.4.0 PV-04 daily-upgrade extension.
#
# Loaded by:   devolaflow.plugins.installer.load_registry()
# Consumed by: devolaflow.plugins.installer.ensure_plugin()
#              devolaflow.plugins.installer.upgrade_plugin()       (v9.4.0 PV-04)
#              devolaflow.plugins.installer.refresh_all()          (v9.4.0 PV-04)
#              devolaflow.cli::plugins_cmd                         (v9.4.0 PV-04)
# Design refs: .local/research/v8.3.0_design.md §6.2 (v1 schema, nines + ui-pro)
#              .local/research/v8.4.0_rtk_nines_analysis.md §5 (v2 schema bump,
#              curl_install_script backend, rtk entry, mandatory rtk gain
#              distinguish-cmd per RTK INSTALL.md collision warning)
#              .local/research/v8.4.0_gap_analysis.md §2.1 R-001 (v2 closure)
#              .local/research/v9.4.0_gap_analysis.md §3.2 D-P-4 + D-P-5
#              (v9.4.0 PV-04 daily-upgrade surface — THIS bump)
# Companion:   workflow-system/agent/plugins.yaml (legacy PluginRegistry catalog,
#              kept intact for backward compatibility with pre-v8.2.1 callers).
#
# Schema (v3 — additive bump from v2; v1+v2 entries pass v3 unchanged):
#   plugins:    list of plugin entries; each carries backend + install + verify
#               metadata. See design.md §6.2 for the v1 field contract; the
#               v8.4.0 RTK analysis for v2 additions; this header for v3.
#               v3 additions (all optional; v2 entries pass v3 unchanged):
#                 - upgrade_cmd: optional shell command run by upgrade_plugin().
#                   When omitted, falls back to install_cmd (which for pip /
#                   npm / curl-script backends is typically idempotent + acts
#                   as the upgrade command on its own per the v8.3.0 PV-01
#                   contract). Authors who need a distinct upgrade path
#                   (e.g. cargo distribution that requires `cargo install
#                   --force`) declare it here.
#               v9.5.0 PV-01 — added si-chip entry (4th plugin) per the
#               cycle plan §3 v9.5.0 row + user requirement (verbatim in
#               .local/research/v9.5.0_gap_analysis.md §1). Reuses the
#               curl_install_script backend (RTK precedent v8.3.1 PV-01).
#               No verify_distinguish_cmd because Si-Chip has no known
#               name collision (RTK's distinguish-cmd only fires because
#               of the rtk-type-kit collision documented in RTK INSTALL.md).
#   defaults:   registry-wide defaults (auto_install, prefer_local_fallback,
#               network_timeout_seconds, install_log_path).
#               v3 additions:
#                 - upgrade_check_frequency_hours: integer N. refresh_all()
#                   considers a plugin "stale" when last_checked > N hours
#                   ago. Defaults to 24 (daily upgrade cadence per the
#                   v9.4.0 user-feedback "auto-upgrade daily" requirement).
#   backends:   enumerates supported install backends. New backends require an
#               installer.py implementation in the same patch (v3 adds no
#               new backends — extends behaviour on existing 3 backends).
#
# Invariants:
#   - All paths relative to repo root (S-2).
#   - External resources referenced by their canonical GitHub URL (S-7).
#   - No local clone paths hardcoded (S-7). RTK reference clone at
#     /home/agent/reference/rtk is a runtime SI-2 NineS analysis path; NOT
#     hardcoded here per S-7.
#   - last_checked is NOT a stored field — it is RECONSTRUCTED at runtime
#     from .local/memory/plugin_install.log (the canonical JSONL audit
#     trail). v9.4.0 PV-04 deliberately avoids adding a second write
#     surface for plugin state per the gap analysis §3.2 D-P-4 fix.

schema_version: 3
last_updated: "2026-05-02"
# v9.4.0 PV-04 baseline last_updated kept (v9.5.0 PV-01 only adds 1 plugin
# row + extends the header comment; no schema-version bump).

plugins:
  - id: nines
    backend: pip
    package: nines
    install_cmd: "pip install --upgrade nines"
    upgrade_cmd: "pip install --upgrade nines"
    version_check_cmd: "nines --version"
    min_version: "3.0.0"
    expected_sha256: null
    canonical_url: "https://github.com/YoRHa-Agents/NineS"
    local_fallback_path: null
    invoked_by_workflows:
      - nines-assisted
      - skill-optimization

  - id: ui-pro
    backend: npm_then_init
    package: uipro-cli
    install_cmd: "npm install -g uipro-cli"
    upgrade_cmd: "npm install -g uipro-cli@latest"
    init_cmd_template: "uipro init --ai {ai_platform} --global"
    init_targets:
      - cursor
      - claude
      - codex
    version_check_cmd: "uipro --version"
    min_version: "2.0.0"
    expected_sha256: null
    canonical_url: "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill"
    local_fallback_path: null
    invoked_by_workflows:
      - product-verification

  - id: rtk
    backend: curl_install_script
    package: rtk
    install_cmd: "curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh"
    upgrade_cmd: "curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh"
    version_check_cmd: "rtk --version"
    verify_distinguish_cmd: "rtk gain"
    min_version: "0.37.2"
    expected_sha256: null
    canonical_url: "https://github.com/rtk-ai/rtk"
    local_fallback_path: null
    invoked_by_workflows:
      - shell-proxy

  # v9.5.0 PV-01 — Si-Chip persistent BasicAbility optimisation factory.
  # Spec source-of-truth: https://github.com/YoRHa-Agents/Si-Chip
  # The installer ships SKILL.md + DESIGN.md + 14 references + 5 scripts
  # (21 files at v0.4.0). DevolaFlow consumes 3 of the 5 scripts via the
  # `devolaflow.si_chip_bridge` Python wrapper (PV-02): profile_static.py,
  # count_tokens.py, aggregate_eval.py. The other 2 (eval_skill_quickstart.md,
  # real_llm_runner_quickstart.md) are operator-facing cheat sheets.
  #
  # version_check_cmd note: Si-Chip's installer has a v0.4.0 packaging defect
  # (post-install check looks at the wrong path; payload lands at
  # ~/.cursor/skills/si-chip/si-chip/ instead of ~/.cursor/skills/si-chip/).
  # The version check probes EITHER path; the bridge module's install_resolver
  # tolerates both (forward-compat for v0.4.1+ when fixed upstream).
  - id: si-chip
    backend: curl_install_script
    package: si-chip
    install_cmd: "curl -fsSL https://yorha-agents.github.io/Si-Chip/install.sh | bash -s -- --target cursor --scope global --yes --force"
    upgrade_cmd: "curl -fsSL https://yorha-agents.github.io/Si-Chip/install.sh | bash -s -- --target cursor --scope global --yes --force"
    version_check_cmd: "test -f $HOME/.cursor/skills/si-chip/SKILL.md || test -f $HOME/.cursor/skills/si-chip/si-chip/SKILL.md && echo si-chip/0.4.0"
    min_version: "0.4.0"
    expected_sha256: null
    canonical_url: "https://github.com/YoRHa-Agents/Si-Chip"
    local_fallback_path: null
    invoked_by_workflows:
      - skill-optimization
      - self-update
      - nines-assisted

defaults:
  auto_install: true
  prefer_local_fallback: true
  network_timeout_seconds: 90
  install_log_path: ".local/memory/plugin_install.log"
  upgrade_check_frequency_hours: 24

backends:
  - id: pip
    description: "Python package manager — single-command install"
  - id: npm_then_init
    description: >
      npm-distributed CLI requiring per-AI-platform init step. Install runs
      install_cmd, then for each entry in init_targets runs init_cmd_template
      with {ai_platform} interpolated. Verifies via version_check_cmd at the
      end. Failure on any init_target raises PluginInstallError per S-5.
  - id: curl_install_script
    description: >
      Single-command curl-fetched POSIX install script. Backend runs install_cmd
      via bash, then verifies via version_check_cmd AND, when declared,
      verify_distinguish_cmd (the second check protects against name-collisions
      such as RTK vs rtk-type-kit per RTK INSTALL.md). Failure on either check
      raises PluginInstallError per S-5 with actionable text identifying which
      probe failed (collision-warning text included for the rtk distinguish
      case).
