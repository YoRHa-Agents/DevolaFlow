# DevolaFlow runtime plugin registry — v8.2.1 auto-install surface.
#
# Loaded by:   devolaflow.plugins.installer.load_registry()
# Consumed by: devolaflow.plugins.installer.ensure_plugin()
# Design ref:  .local/research/v8.3.0_design.md §6.2
# Companion:   workflow-system/agent/plugins.yaml (legacy PluginRegistry catalog,
#              kept intact for backward compatibility with pre-v8.2.1 callers).
#
# Schema (v1):
#   plugins:    list of plugin entries; each carries backend + install + verify
#               metadata. See design.md §6.2 for the field contract.
#   defaults:   registry-wide defaults (auto_install, prefer_local_fallback,
#               network_timeout_seconds, install_log_path).
#   backends:   enumerates supported install backends. New backends require an
#               installer.py implementation in the same patch.
#
# Invariants:
#   - All paths relative to repo root (S-2).
#   - External resources referenced by their canonical GitHub URL (S-7).
#   - No local clone paths hardcoded (S-7).

schema_version: 1
last_updated: "2026-04-22"

plugins:
  - id: nines
    backend: pip
    package: nines
    install_cmd: "pip install --upgrade nines"
    version_check_cmd: "nines --version"
    min_version: "3.0.0"
    expected_sha256: null
    canonical_url: "https://github.com/YoRHa-Agents/NineS"
    local_fallback_path: null
    invoked_by_workflows:
      - nines-assisted
      - skill-optimization

  - id: ui-pro
    backend: npm_then_init
    package: uipro-cli
    install_cmd: "npm install -g uipro-cli"
    init_cmd_template: "uipro init --ai {ai_platform} --global"
    init_targets:
      - cursor
      - claude
      - codex
    version_check_cmd: "uipro --version"
    min_version: "2.0.0"
    expected_sha256: null
    canonical_url: "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill"
    local_fallback_path: null
    invoked_by_workflows:
      - product-verification

defaults:
  auto_install: true
  prefer_local_fallback: true
  network_timeout_seconds: 90
  install_log_path: ".local/memory/plugin_install.log"

backends:
  - id: pip
    description: "Python package manager — single-command install"
  - id: npm_then_init
    description: >
      npm-distributed CLI requiring per-AI-platform init step. Install runs
      install_cmd, then for each entry in init_targets runs init_cmd_template
      with {ai_platform} interpolated. Verifies via version_check_cmd at the
      end. Failure on any init_target raises PluginInstallError per S-5.
