# DevolaFlow runtime plugin registry — v9.4.0 PV-04 daily-upgrade extension.
#
# Loaded by:   devolaflow.plugins.installer.load_registry()
# Consumed by: devolaflow.plugins.installer.ensure_plugin()
#              devolaflow.plugins.installer.upgrade_plugin()       (v9.4.0 PV-04)
#              devolaflow.plugins.installer.refresh_all()          (v9.4.0 PV-04)
#              devolaflow.cli::plugins_cmd                         (v9.4.0 PV-04)
# Design refs: .local/research/v8.4.0_gap_analysis.md §2.1 R-001 (v2 closure)
#              .local/research/v9.4.0_gap_analysis.md §3.2 D-P-4 + D-P-5
#              (v9.4.0 PV-04 daily-upgrade surface — THIS bump)
# Ownership:   THIS file is the single A-5 SSOT owner of plugin
#              REGISTRATION data (membership, canonical IDs, backends,
#              install/upgrade commands, min_version / canonical_url truth,
#              workflow wiring) per v15.0.0 G-021 (unification of the
#              former dual-registry surface; .local/research/
#              v14.2.0_gap_analysis.md §2.4, F-P5-1 / F-P5-6).
# Companion:   workflow-system/agent/plugins.yaml — the DERIVED capability/
#              role/stage_mapping presentation view (pre-v8.2.1
#              PluginRegistry callers). Its plugin keys are pinned to
#              mirror this file's `plugins[*].id` set + order by
#              tests/test_plugins.py::TestV15PluginRegistryUnification;
#              register new plugins HERE first, then mirror the view.
#
# Schema (v3 — additive bump from v2; v1+v2 entries pass v3 unchanged):
#   plugins:    list of plugin entries; each carries backend + install + verify
#               metadata. See design.md §6.2 for the v1 field contract; the
#               v8.4.0 plugin analysis for v2 additions; this header for v3.
#               v3 additions (all optional; v2 entries pass v3 unchanged):
#                 - upgrade_cmd: optional shell command run by upgrade_plugin().
#                   When omitted, falls back to install_cmd (which for pip /
#                   npm / curl-script backends is typically idempotent + acts
#                   as the upgrade command on its own per the v8.3.0 PV-01
#                   contract). Authors who need a distinct upgrade path
#                   (e.g. cargo distribution that requires `cargo install
#                   --force`) declare it here.
#               v4 additions (v15.2.0 B-6, 04 §8 dependency suggestion-ization;
#               all optional — v1..v3 entries pass v4 unchanged):
#                 - tier: require | suggest. Defaults to suggest when absent.
#                   suggest = probe-and-degrade (consuming surfaces MUST NOT
#                   hard-fail on absence; one-time hint per session instead).
#                   require = absence is a hard error at the consuming
#                   surface. All shipped entries are suggest as of v15.2.0 —
#                   the require tier is a kept mechanism with no occupant.
#                 - default_install: bool controlling membership in the default
#                   global plugin bundle. Defaults to true; explicit singleton
#                   plugin profiles remain available when false.
#   defaults:   registry-wide defaults (auto_install, prefer_local_fallback,
#               network_timeout_seconds, install_log_path).
#               v3 additions:
#                 - upgrade_check_frequency_hours: integer N. refresh_all()
#                   considers a plugin "stale" when last_checked > N hours
#                   ago. Defaults to 24 (daily upgrade cadence per the
#                   v9.4.0 user-feedback "auto-upgrade daily" requirement).
#               v4 change (v15.2.0 B-6): auto_install flipped true → false.
#                 The DEFAULT path is now probe + suggest — a bare
#                 ensure_plugin(pid) call never network-installs. Explicit
#                 opt-in surfaces (DEVOLAFLOW_AUTO_INSTALL_PLUGINS=1 hooks,
#                 devola-init --global bundling) pass auto_install=True at
#                 the call site, so their semantics are unchanged.
#   backends:   enumerates supported install backends. New backends require an
#               installer.py implementation in the same patch (v3 adds no
#               new backends — extends behaviour on existing 3 backends).
#
# Invariants:
#   - All paths relative to repo root (S-2).
#   - External resources referenced by their canonical GitHub URL (S-7).
#   - No local clone paths hardcoded (S-7). Runtime SI-2 analysis paths stay
#     outside this registry.
#   - last_checked is NOT a stored field — it is RECONSTRUCTED at runtime
#     from .local/memory/plugin_install.log (the canonical JSONL audit
#     trail). v9.4.0 PV-04 deliberately avoids adding a second write
#     surface for plugin state per the gap analysis §3.2 D-P-4 fix.

schema_version: 4
last_updated: "2026-08-20"
# v10.2.0 PV-01 — D-P-3 closure. schema_version stays at 3 (no new field);
plugins:
  - id: ui-pro
    tier: suggest
    default_install: false
    backend: npm_then_init
    package: uipro-cli
    install_cmd: "npm install -g uipro-cli"
    upgrade_cmd: "npm install -g uipro-cli@latest"
    init_cmd_template: "uipro init --ai {ai_platform} --global"
    init_targets:
      - cursor
      - claude
      - codex
    version_check_cmd: "uipro --version"
    min_version: "2.0.0"
    expected_sha256: null
    canonical_url: "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill"
    local_fallback_path: null
    invoked_by_workflows:
      - product-verification
      # v13.0.0 — ui-pro DESIGNS in the new web-design workflow; impeccable
      # then REFINES + VERIFIES. plugins_for_workflow("web-design") resolves
      # to [ui-pro, impeccable] in registry order (ui-pro precedes impeccable).
      - web-design

  # v12.5.0 PV-03 — Codegraph pre-indexed code knowledge graph.
  # Spec source-of-truth: https://github.com/colbymchenry/codegraph
  # Codegraph is an npm-distributed CLI with an MCP server and local
  # SQLite FTS5 index. The project-local index is created separately by
  # the repo-init scaffold and is never an installer side effect.
  - id: codegraph
    tier: suggest
    default_install: true
    backend: npm_then_init
    package: "@colbymchenry/codegraph"
    install_cmd: "npm install -g @colbymchenry/codegraph@latest"
    upgrade_cmd: "npm install -g @colbymchenry/codegraph@latest"
    init_cmd_template: "codegraph install --target {ai_platform} --yes"
    init_targets:
      - cursor
      - claude
      - codex
    version_check_cmd: "codegraph --version"
    min_version: "0.9.3"
    expected_sha256: null
    canonical_url: "https://github.com/colbymchenry/codegraph"
    local_fallback_path: null
    invoked_by_workflows:
      - repo-init
      - onboarding
      - security-audit
      - product-verification

  # v13.0.0 — Impeccable design-refinement skill + anti-pattern detector.
  # Spec source-of-truth: https://github.com/pbakaus/impeccable
  # 5th plugin; pairs with ui-pro (ui_tooling) on the new `web-design`
  # workflow: ui-pro DESIGNS (style / palette / typography / design-system),
  # impeccable REFINES (/impeccable polish, critique, typeset, arrange,
  # animate) and VERIFIES (the no-LLM `impeccable detect` anti-pattern scan,
  # 27 deterministic rules; exit 0 = clean, exit 2 = anti-patterns found).
  #
  # Backend: npm_then_init reuses the ui-pro precedent — an npm
  # global install followed by a per-harness skill install. UNLIKE ui-pro
  # (`uipro init --ai {ai_platform} --global`), impeccable's
  # `skills install` AUTO-DETECTS the harness (it scans for .cursor /
  # .claude / .agents[codex] / .gemini / ... folders, with an optional
  # `--providers=` narrowing flag). There is NO per-AI `--ai` flag, so the
  # init template carries no `{ai_platform}` placeholder and `init_targets`
  # is a single sentinel `auto` entry — the npm_then_init backend runs the
  # template exactly once and `.format(ai_platform="auto")` is a harmless
  # no-op (the template string contains no placeholder). Verified against
  # impeccable@2.3.2 cli/bin/cli.js + cli/bin/commands/skills.mjs on
  # 2026-06-01.
  #
  # version_check_cmd: `impeccable --version` prints pkg.version (confirmed
  # in cli.js: `if (command === '--version' || command === '-v')
  # console.log(pkg.version)`). min_version 2.0.0 is a conservative floor
  # below the 2.3.2 published latest.
  - id: impeccable
    tier: suggest
    backend: npm_then_init
    package: impeccable
    install_cmd: "npm install -g impeccable"
    upgrade_cmd: "npm install -g impeccable@latest"
    init_cmd_template: "impeccable skills install --yes"
    init_targets:
      - auto
    version_check_cmd: "impeccable --version"
    min_version: "2.0.0"
    expected_sha256: null
    canonical_url: "https://github.com/pbakaus/impeccable"
    local_fallback_path: null
    invoked_by_workflows:
      - web-design

defaults:
  # v15.2.0 B-6 — flipped true → false (default probe + suggest; see the v4
  # change note in the header). Opt-in installs are unchanged: the
  # DEVOLAFLOW_AUTO_INSTALL_PLUGINS=1 hooks and devola-init --global
  # bundling pass auto_install=True explicitly.
  auto_install: false
  prefer_local_fallback: true
  network_timeout_seconds: 90
  install_log_path: ".local/memory/plugin_install.log"
  upgrade_check_frequency_hours: 24

backends:
  - id: pip
    description: "Python package manager — single-command install"
  - id: npm_then_init
    description: >
      npm-distributed CLI requiring per-AI-platform init step. Install runs
      install_cmd, then for each entry in init_targets runs init_cmd_template
      with {ai_platform} interpolated. Verifies via version_check_cmd at the
      end. Failure on any init_target raises PluginInstallError per S-5.
  - id: curl_install_script
    description: >
      Single-command curl-fetched POSIX install script. Backend runs install_cmd
      via bash, then verifies via version_check_cmd. Failure raises
      PluginInstallError per S-5 with actionable error details.
