tracking_policy:
  active_tracking:
    check_frequency: biweekly
    staleness_threshold_days: 30
    on_stale: "review relevance, check for archival, downgrade to periodic if inactive >3 months"
  periodic_monitoring:
    check_frequency: monthly
    staleness_threshold_days: 90
    on_stale: "mark as frozen_reference if repo archived or >6 months inactive"
  review_protocol:
    trigger_conditions:
      - tracked repo releases a new major/minor version
      - Anthropic advisor tool exits beta or changes API shape
      - "new repo with >5K stars and relevance >=4/5 in agent orchestration space"
      - DevolaFlow version bump changes overlap analysis (re-classify gaps)
      - EvoBench regression detected after context profile changes
    review_actions:
      - read changed files/docs from tracked source
      - re-evaluate relevance_score against current DevolaFlow version
      - update gap classification (may move between priority tiers)
      - create integration task if high-priority gap becomes lower-effort
      - log review in knowledge/learnings/external-sources.jsonl (when implemented)
  staleness_indicators:
    already_addressed_for_2_plus_versions: remove from active tracking
    repo_archived_or_6_months_inactive: "downgrade frequency, mark as frozen_reference"
    new_source_supersedes_tracked: replace in tracking list and update synthesis
    devolaflow_implements_gap: "reclassify to already-addressed with version citation"
