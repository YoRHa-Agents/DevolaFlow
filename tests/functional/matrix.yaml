# DevolaFlow Loop v3 PV-0 functional matrix.
#
# Schema:
#   schema_version: integer schema revision
#   mode: offline-only execution mode
#   defaults: timeout and fail-closed policy
#   rows: unique behavioral contracts
# Each row requires an ID, known domain/surface, explicit adapter call,
# repository-relative fixture, fast/slow tier, required policy, expected
# behavior, and one or more repository-relative design source anchors.
schema_version: 1
mode: offline
defaults:
  timeout_seconds: 30
  network: forbidden
  unclassified_outcome: fail
  required_skip: fail
rows:
  - id: pv0.matrix.load_validate
    domain: functional_infrastructure
    surface: matrix_loader
    call: validate_matrix_contract
    fixture: tests/functional/matrix.yaml
    tier: fast
    required: true
    expected: matrix fixture is present after strict schema validation
    expected_status: PASS
    design_source:
      - docs/cycle-archive/v20.0.0/loop3_functional_test_system_gap_analysis.md#7
      - docs/cycle-archive/v20.0.0/loop3_functional_test_system_gap_analysis.md#O-01
  - id: pv0.outcome.serialization
    domain: functional_infrastructure
    surface: typed_outcome
    call: serialize_outcome
    fixture: tests/functional/matrix.yaml
    tier: fast
    required: true
    expected: typed outcome preserves its exact status during JSON serialization
    expected_status: PASS
    design_source:
      - docs/cycle-archive/v20.0.0/loop3_functional_test_system_gap_analysis.md#6
      - docs/cycle-archive/v20.0.0/loop3_functional_test_system_gap_analysis.md#O-01
  - id: pv0.optional.explicit_skip
    domain: functional_infrastructure
    surface: optional_prerequisite
    call: optional_prerequisite_skip
    fixture: tests/functional/matrix.yaml
    tier: fast
    required: false
    prerequisite: PV-0 optional-outcome contract uses a deliberately unavailable local prerequisite
    expected: optional absence is reported as SKIP_OPTIONAL with the declared reason
    expected_status: SKIP_OPTIONAL
    design_source:
      - docs/cycle-archive/v20.0.0/loop3_functional_test_system_gap_analysis.md#6
      - docs/cycle-archive/v20.0.0/loop3_functional_test_system_gap_analysis.md#O-02
