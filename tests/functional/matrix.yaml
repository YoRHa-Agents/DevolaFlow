    domain: functional_infrastructure
    surface: matrix_gate
    call: check_matrix_contract
    fixture: tests/functional/matrix.yaml
    tier: fast
    required: true
    expected: the hard gate accepts this non-empty strict matrix
    expected_status: PASS
    design_source:
      - docs/cycle-archive/v20.0.0/loop3_functional_test_system_gap_analysis.md#7
      - docs/cycle-archive/v20.0.0/loop3_functional_test_system_gap_analysis.md#O-02
