schema_version: 1
id: model_tier_advisory_fold
provenance:
  - legacy-evobench:complexity_tier_routing
  - legacy-evobench:model_routing_feature
  - legacy-evobench:simple_impl_budget
feature_tags:
  - model_hint
  - complexity_routing
  - constraint_tiers
  - advisory_fold
dispatch:
  hdr:
    id: harness-model-tier-fold
    parent: harness-root
    layer: wave
    timeout: 600
    model_hint: quality
  task:
    id: MF-01
    type: code
    title: Fold advisory model guidance
  goal: Fold advisory guidance for a quality-tier model while preserving all guards.
  files:
    - src/devolaflow/task_adaptive_selector.py
    - src/devolaflow/harness/tiers.py
    - tests/harness/test_tiers.py
  rules:
    strategy: standard
    lang: python
    focus:
      - context-budget
      - guard-retention
    constraint_tiers:
      focus: advisory
  shared: Model capability may reduce advice, never invariants or guards.
  accept:
    - Quality model → advisory prose folds to one authorization line.
    - Guard and invariant constraints remain fully injected.
  gate:
    blockers: 0
    retries: 1
    token_budget:
      max_tokens: 5000
      warn_at: 0.75
      break_at: 1.0
  behavioral_guidelines:
    think_first: true
    simplicity_check: true
    surgical_scope: function
    goal_loop: true
    no_llm_for_deterministic: true
    surface_conflicts: true
    convention_first: true
    advisory_folded: true
    constraint_tiers:
      think_first: advisory
      simplicity_check: advisory
      surgical_scope: guard
      goal_loop: advisory
      no_llm_for_deterministic: advisory
      surface_conflicts: advisory
      convention_first: advisory
      advisory_folded: advisory
  acceptance_criteria_v2:
    - id: MF-AC-1
      description: Constraint tier and advisory folding tests pass.
      verification_type: test
      verification_cmd: python -m pytest tests/harness/test_tiers.py -q --no-cov
    - id: MF-AC-2
      description: Quality model → advisory prose folds to one authorization line.
      verification_type: test
      verification_cmd: python -m pytest tests/test_behavioral_guidelines.py::TestSelectContextIntegration::test_explicit_model_hint_controls_fold_without_frontier_inference -q --no-cov
    - id: MF-AC-3
      description: Guard and invariant constraints remain fully injected.
      verification_type: test
      verification_cmd: python -m pytest tests/test_behavioral_guidelines.py::TestComposeBehavioralBlock::test_fold_replaces_only_active_advisories_and_preserves_guards -q --no-cov
expected:
  guard_ids:
    - MF-AC-1
    - MF-AC-2
    - MF-AC-3
  report_required_keys:
    - hdr
    - state
    - artifacts
    - ac_results
    - diff_stats
  report_forbidden_keys:
    - quality_score
  required_literals:
    - quality
    - advisory_folded
    - guard retention
  fold_sensitive: true
