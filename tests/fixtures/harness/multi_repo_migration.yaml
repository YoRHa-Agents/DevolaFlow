schema_version: 1
id: multi_repo_migration
provenance:
  - legacy-evobench:multi_repo_dispatch
feature_tags:
  - repos
  - primary_dependent_coordination
  - cached_prefix
dispatch:
  hdr:
    id: harness-multi-repo
    parent: harness-root
    layer: wave
    timeout: 1200
  task:
    id: MR-01
    type: code
    title: Coordinate cross-repository migration
  goal: Migrate a primary service and its dependent package without changing dispatch prefix order.
  pred:
    - ref: docs/migrations/api-v2.md
      key_facts:
        - Primary service lands before dependent package.
        - Both repositories retain compatible interfaces.
  files:
    - services/api/src/client.py
    - packages/shared/src/protocol.py
    - tests/test_multi_repo_dispatch.py
  rules:
    strategy: full
    lang: python
    focus:
      - compatibility
      - coordinated-commits
  shared: Primary API contract precedes dependent package adoption.
  accept:
    - Exactly one repository is marked primary.
    - Primary and dependent interfaces remain compatible.
  gate:
    blockers: 0
    retries: 2
  repos:
    - name: primary-service
      root_path: .
      primary: true
      branch: feature/api-v2
    - name: shared-package
      root_path: packages/shared
      primary: false
      branch: feature/api-v2-client
  acceptance_criteria_v2:
    - id: MR-AC-1
      description: Multi-repository dispatch contract tests pass.
      verification_type: test
      verification_cmd: python -m pytest tests/test_multi_repo_dispatch.py -q --no-cov
    - id: MR-AC-2
      description: Exactly one repository is marked primary.
      verification_type: test
      verification_cmd: python -m pytest tests/harness/test_fixtures.py::test_dispatch_layout_acceptance_paths_and_report_contract -q --no-cov
    - id: MR-AC-3
      description: Primary and dependent interfaces remain compatible.
      verification_type: test
      verification_cmd: python -m pytest tests/test_compressor.py::TestDefaultDispatchLayoutV730::test_assert_dispatch_layout_accepts_v7_3_0_payload_with_repos -q --no-cov
expected:
  guard_ids:
    - MR-AC-1
    - MR-AC-2
    - MR-AC-3
  report_required_keys:
    - hdr
    - state
    - artifacts
    - ac_results
    - diff_stats
  report_forbidden_keys:
    - quality_score
  required_literals:
    - primary repository
    - dependent repository
    - canonical prefix
  fold_sensitive: false
