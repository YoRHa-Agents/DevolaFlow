schema_version: 1
id: compression_layered
provenance:
  - legacy-evobench:compression_retention_easy
  - legacy-evobench:compression_retention_medium
  - legacy-evobench:compression_retention_hard
  - legacy-evobench:directed_compaction_focused
  - legacy-evobench:layered_recency_decay
  - legacy-evobench:abstractive_llm
feature_tags:
  - verbatim_retention
  - compact_directive
  - recency_decay
  - abstractive_fallback
dispatch:
  hdr:
    id: harness-compression-layered
    parent: harness-root
    layer: wave
    timeout: 900
  task:
    id: CL-01
    type: research
    title: Compact layered predecessor context
  goal: Retain exact contracts while compacting stale and low-priority predecessor context.
  pred:
    - ref: docs/designs/design_agent_hierarchy.md
      key_facts:
        - Dispatcher agents do not implement.
        - Task agents own implementation.
        - Retry loops are bounded.
      summary_mode: abstractive
      summary_max_tokens: 240
      compact_directive:
        focus_keywords:
          - ownership
          - retry
          - acceptance
        max_drop_pct: 0.2
    - ref: workflow-system/agent/references/compression-pipeline.md
      key_facts:
        - Verbatim paths survive compaction.
        - Recent guard constraints outrank advice.
      summary_mode: extractive
      summary_max_tokens: 180
  files:
    - src/devolaflow/compressor/transforms.py
    - tests/test_compressor.py
  rules:
    strategy: standard
    lang: python
    focus:
      - verbatim-retention
      - deterministic-fallback
  shared: Preserve contracts before compressing advisory context.
  accept:
    - Paths, identifiers, and acceptance criteria remain verbatim.
    - Failed abstractive stage → deterministic extractive fallback.
  gate:
    blockers: 0
    retries: 2
    token_budget:
      max_tokens: 5000
      warn_at: 0.75
      break_at: 1.0
  acceptance_criteria_v2:
    - id: CL-AC-1
      description: Compression retention and fallback tests pass.
      verification_type: test
      verification_cmd: python -m pytest tests/test_compressor.py -q --no-cov
    - id: CL-AC-2
      description: Paths, identifiers, and acceptance criteria remain verbatim.
      verification_type: test
      verification_cmd: python -m pytest tests/test_compressor.py::TestHierarchicalSummariser::test_extract_named_entities_all_types tests/test_compressor.py::TestAbstractiveStageBLLM::test_mock_provider_preserves_verbatim_entities -q --no-cov
    - id: CL-AC-3
      description: Failed abstractive stage → deterministic extractive fallback.
      verification_type: test
      verification_cmd: python -m pytest tests/test_compressor.py::TestAbstractivePathStageA::test_abstractive_falls_back_to_extractive_on_empty -q --no-cov
expected:
  guard_ids:
    - CL-AC-1
    - CL-AC-2
    - CL-AC-3
  report_required_keys:
    - hdr
    - state
    - artifacts
    - ac_results
    - diff_stats
  report_forbidden_keys:
    - quality_score
  required_literals:
    - extractive
    - abstractive
    - deterministic fallback
  fold_sensitive: false
