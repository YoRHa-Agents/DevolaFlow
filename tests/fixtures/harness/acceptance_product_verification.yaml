schema_version: 1
id: acceptance_product_verification
provenance:
  - legacy-evobench:acceptance_verification_feature
  - legacy-evobench:product_verification_pipeline
  - legacy-evobench:visual_regression_webapp
  - legacy-evobench:interaction_accessibility_test
  - legacy-evobench:verification_ladder_disabled
feature_tags:
  - acceptance_v2
  - visual
  - interaction
  - accessibility
  - default_safe_fallback
dispatch:
  hdr:
    id: harness-product-verification
    parent: harness-root
    layer: wave
    timeout: 1200
  task:
    id: AP-01
    type: test
    title: Verify product acceptance surfaces
  goal: Verify functional, visual, interaction, and accessibility behavior with safe disabled defaults.
  files:
    - src/devolaflow/product_verification.py
    - tests/test_product_verification.py
  rules:
    strategy: full
    lang: python
    focus:
      - acceptance
      - accessibility
      - deterministic-fallback
  shared: Optional verification tools default to disabled and explicit.
  accept:
    - Functional checks pass before optional visual checks.
    - Disabled tools → explicit skipped evidence, never false success.
  verify_cfg:
    visual: true
    accept: true
    interact: true
    a11y: true
    threshold: 0.01
  gate:
    blockers: 0
    retries: 1
  acceptance_criteria_v2:
    - id: AP-AC-1
      description: Product verification pipeline tests pass.
      verification_type: test
      verification_cmd: python -m pytest tests/test_product_verification.py -q --no-cov
    - id: AP-AC-2
      description: Coverage remains at least eighty percent.
      verification_type: metric
      verification_cmd: python -m pytest tests/test_product_verification.py --cov=devolaflow.product_verification --cov-report=term --no-cov-on-fail
      metric: coverage
      metric_kind: coverage
      threshold: ">= 80"
    - id: AP-AC-3
      description: Visual and accessibility evidence is reviewed.
      verification_type: manual
    - id: AP-AC-4
      description: Functional checks pass before optional visual checks.
      verification_type: test
      verification_cmd: python -m pytest tests/test_gate_ladder.py::TestR3UnitTestShortCircuit::test_r3_fail_does_not_invoke_r4_r5_r6_overrides tests/test_gate.py::TestUserFacingVerificationScoring::test_convergence_with_user_facing_uses_extended_weights -q --no-cov
    - id: AP-AC-5
      description: Disabled tools → explicit skipped evidence, never false success.
      verification_type: test
      verification_cmd: python -m pytest tests/harness/test_probe.py::test_run_probe_profiles_statuses_baseline_and_no_key -q --no-cov
expected:
  guard_ids:
    - AP-AC-1
    - AP-AC-2
    - AP-AC-4
    - AP-AC-5
  report_required_keys:
    - hdr
    - state
    - artifacts
    - ac_results
    - diff_stats
  report_forbidden_keys:
    - quality_score
  required_literals:
    - visual
    - interaction
    - accessibility
    - SKIPPED
  fold_sensitive: false
