schema_version: "1.0"

metadata:
  name: full-pipeline
  version: "1.0.0"
  display_name: "Full Pipeline"
  description: "Complete development lifecycle: design through release with review and test gates."
  category: composite
  applicable_scenarios:
    - "Greenfield feature development"
    - "Major system changes"
    - "New project initialization"
  tags: [full, pipeline, feature, implementation, release, design, test]

stages:
  - id: design
    primitive: design
    team: design
    duration_class: long
    config:
      formality: standard
      diagram_types: [mermaid]

  - id: plan
    primitive: plan
    team: design
    duration_class: medium
    config:
      granularity: standard
      max_parallel_waves: 3
    input_mapping:
      design: "design"

  - id: impl
    primitive: implement
    team: implement
    duration_class: long
    config:
      test_strategy: tdd
      target_coverage: 0.80
    input_mapping:
      tasks: "plan.waves"

  - id: review
    primitive: review
    team: review
    duration_class: medium
    config:
      review_type: code
      pass_threshold: 0.80
      require_zero_blocking: true
    input_mapping:
      artifacts: "impl.artifacts"

  - id: test
    primitive: test
    team: test
    duration_class: medium
    config:
      suites: [unit, integration, e2e]
      coverage_threshold: 0.80
      fail_fast: false
    input_mapping:
      code_refs: "impl.files_changed"

  - id: refine
    primitive: refine
    team: implement
    duration_class: medium
    config:
      scope: targeted
      allow_new_features: false
    input_mapping:
      findings: "review.findings + test.failures"

  - id: testgate
    primitive: gate
    alias: testgate
    team: review
    duration_class: quick
    config:
      criteria:
        - { field: test.pass_rate, operator: ">=", value: 1.0 }
        - { field: test.coverage, operator: ">=", value: 0.80 }
        - { field: review.blocking_count, operator: "==", value: 0 }

  - id: release
    primitive: release
    team: implement
    duration_class: medium
    config:
      version_strategy: semver
      require_human_approval: true

composition:
  compose: sequence
  stages:
    - stage: design
    - compose: gate
      ref: design_gate
    - stage: plan
    - compose: loop
      ref: impl_cycle
    - compose: gate
      ref: release_gate
    - stage: release

loops:
  - name: impl_cycle
    body_stages: [impl, review, test, refine, testgate]
    until: "review.decision == 'pass' and test.pass_rate == 1.0"
    max_iterations: 3
    on_exhaustion: escalate
    escalation_target: plan
    escalation_max: 1

  - name: review_refine
    body_stages: [review, refine]
    until: "review.decision == 'pass'"
    max_iterations: 3
    on_exhaustion: escalate
    escalation_target: plan

  - name: test_fix
    body_stages: [test, refine]
    until: "test.pass_rate == 1.0"
    max_iterations: 5
    on_exhaustion: escalate
    escalation_target: plan

gates:
  - name: design_gate
    position: "after:design"
    criteria:
      - field: design.specification
        operator: "exists"
        value: true
      - field: design.decisions
        operator: "!="
        value: []
    on_pass: "next"
    on_fail:
      action: loop_back
      target: design
    require_human_override: false
    auto_insert: true

  - name: release_gate
    position: "before:release"
    criteria:
      - field: test.pass_rate
        operator: ">="
        value: 1.0
      - field: test.coverage
        operator: ">="
        value: 0.80
      - field: review.blocking_count
        operator: "=="
        value: 0
    on_pass: "next"
    on_fail:
      action: loop_back
      target: refine
    require_human_override: true
    auto_insert: true

environment_modes:
  local:
    skip_stages: [release]
    gate_overrides:
      release_gate:
        criteria:
          - field: test.pass_rate
            operator: ">="
            value: 0.95
  github:
    extra_stages: []
  gitlab:
    extra_stages: []
