schema_version: "1.0"

metadata:
  name: invalid-infinite-loop
  version: "0.1.0"
  display_name: "Invalid — loop without max_iterations"
  category: build

stages:
  - id: impl
    primitive: implement
    team: implement
    duration_class: long
  - id: test
    primitive: test
    team: test
    duration_class: medium

composition:
  compose: sequence
  stages:
    - compose: loop
      ref: bad_loop

loops:
  - name: bad_loop
    body_stages: [impl, test]
    until: "test.pass_rate == 1.0"
    max_iterations: 0
    on_exhaustion: abort
