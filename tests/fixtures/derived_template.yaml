schema_version: "1.0"

metadata:
  name: full-pipeline-local
  version: "1.0.0"
  display_name: "Full Pipeline (Local)"
  description: "Full pipeline adapted for local-only development."

extends: full-pipeline

overrides:
  stages:
    impl:
      config:
        test_strategy: test_after
  gates:
    release_gate:
      criteria:
        - field: test.pass_rate
          operator: ">="
          value: 0.90
  environment_modes:
    local:
      skip_stages: [release, deploy, monitor]
