# Example pre-decision checklist instance (fixture).
version: "1.0"
created_at: "2026-04-04T09:15:00Z"
status: validated

project:
  name: DevolaFlow
  purpose: Composable workflow meta-framework with agent hierarchy and gates.
  scope_keywords: [workflow, agents, yaml, quality-gates]
  existing_codebase: true

tech_stack:
  primary_language: python
  secondary_languages: []
  framework: none
  build_system: pip
  dependency_manifest: pyproject.toml
  runtime_version: "3.11+"
  dependencies:
    pinned: [pyyaml>=6.0, pytest>=8.0]
    banned: []

repository:
  mode: github
  remote_url: https://github.com/example/devolaflow.git
  default_branch: main
  branching_strategy: feature
  features:
    ci_cd: true
    cross_platform_builds: true
    github_actions: true
    github_pages: false
    online_demo: false
    release_publishing: true
    merge_requests: true
    readme: true
    user_guide: false
    changelog: true

localization:
  primary_language: en
  secondary_language: zh
  bilingual_output: true
  doc_language: en
  code_comments_language: en

platforms:
  os: [linux, darwin]
  architectures: [x86_64, aarch64]
  additional_targets: []
  min_os_versions:
    linux: "5.10"
    darwin: "13.0"

quality:
  coverage_target_pct: 80
  quality_score_threshold: 85
  lint_strictness: strict
  gate_profile: standard
  max_convergence_rounds: 3
  min_convergence_rounds: 1
  security_review_required: false
  benchmark_required: false

release:
  versioning: semver
  initial_version: "0.1.0"
  channels: [release]
  publishing_targets: [pypi]
  signing: false
  changelog_format: keepachangelog

workflow:
  type: full_pipeline
  custom_stages: []
  skip_stages: []
  stage_overrides: {}
