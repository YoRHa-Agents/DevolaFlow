# EvoBench Scenario: Self-Update Integration
# Tests that self_update profile provides adequate context for integration-decomposition
# tasks: dispatch protocol, context isolation, and structural sections for merging changes.

name: "self_update_integration"
task_type: "self_update"
description: "Validates context for integration-decomposition tasks within self-update workflow"

expected_sections:
  - agent_mode_protocol
  - dispatch_report
  - lifecycle_hooks
  - reference_navigation
  - context_isolation
  - rules_dispatchers
  - quick_action_decision
  - frontmatter
  - version_update

unwanted_sections:
  - plan_mode_template
  - task_quality_score
  - template_quick_ref
  - convergence_loop
  - stage_primitives
  - mode_detection
  - wave_coordination

quality_thresholds:
  # v12.3.0 PV-04 absorption: SKILL.md §"Version & Update" grew from
  # 6 → 15 lines (109 → 232 tokens) due to the new Session Banner
  # Contract subsection (PV-02 closes feedback_for_v12.1.1.md #1). The
  # self_update profile flags version_update as `critical` AND has a
  # tight 3100-token budget, so the 123-token bump squeezes out
  # `important`-priority sections (matched_count=6 of 9 expected,
  # composite ≈ 75.69 vs prior 81.55 baseline). Per the v12.2.0 PV-01
  # precedent (which lowered convergence_noise_filter +
  # feedback_regression min_composite 89 → 80 + min_relevance 0.85 →
  # 0.75 with similar rationale), the v12.3.0 PV-04 absorption lowers
  # min_composite 80 → 73 + min_relevance 0.8 → 0.65. v13.0.0 should
  # either tighten version_update tokens_est or relax the self_update
  # critical-vs-important balance.
  min_composite: 73.0
  max_noise_ratio: 0.1
  min_relevance: 0.65
