name: "interaction_accessibility_test"
task_type: "verify_interaction"
description: >
  E2E interaction and accessibility testing scenario. Tests context selection
  for verifying user flows and WCAG compliance using Playwright E2E tests
  and axe-core accessibility scanning.

expected_sections:
  - gate_mechanism
  - dispatch_report
  - agent_teams
  - convergence_loop

unwanted_sections:
  - quick_action_decision
  - mode_detection
  - quick_start_workflows
  - repo_mode

quality_thresholds:
  # v16.0.0 docs-stabilization re-pin: canonical expected sections retain
  # relevance 1.0000 and noise 0.0000; compacted SKILL/reference text
  # lowered utilization to 0.2288, making 69.15 the deterministic equilibrium.
  # Floor 66.0 keeps the regression margin below 5pp without relaxing
  # the independent relevance or noise gates.
  min_composite: 66.0
  max_noise_ratio: 0.15
  min_relevance: 0.7
