# EvoBench Scenario: Model Routing — Complete Feature Profile with Budget Override
# Tests that simple_implementation routes to feature profile with budget model_hint
# and validates ALL 14 selected sections. Unwanted list captures sections that must
# remain skipped by the feature profile.

name: "model_routing_feature"
task_type: "simple_implementation"
description: "Simple implementation routed to feature profile — validates complete feature-profile section selection with budget model override"

expected_sections:
  - quick_action_decision
  - plan_mode_template
  - agent_mode_protocol
  - quick_start_workflows
  - hierarchy_table
  - wave_task_constraints
  - rationalization_prevention
  - stage_primitives
  - gate_mechanism
  - agent_teams
  - context_isolation
  - lifecycle_hooks
  - convergence_loop
  - dispatch_report

unwanted_sections:
  - frontmatter
  - version_update
  - hierarchy_diagram
  - template_quick_ref

quality_thresholds:
  # v16.0.0 docs-stabilization re-pin: canonical expected sections retain
  # relevance 1.0000 and noise 0.0000; compacted SKILL/reference text
  # lowered utilization to 0.6170, making 84.68 the deterministic equilibrium.
  # Floor 81.0 keeps the regression margin below 5pp without relaxing
  # the independent relevance or noise gates.
  min_composite: 81.0
  min_relevance: 0.90
  max_noise_ratio: 0.15
