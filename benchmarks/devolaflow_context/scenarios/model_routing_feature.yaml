# EvoBench Scenario: Model Routing — Complete Feature Profile with Budget Override
# Tests that simple_implementation routes to feature profile with budget model_hint
# and validates ALL 14 selected sections. Unwanted list captures sections that must
# remain skipped by the feature profile.

name: "model_routing_feature"
task_type: "simple_implementation"
description: "Simple implementation routed to feature profile — validates complete feature-profile section selection with budget model override"

expected_sections:
  - quick_action_decision
  - plan_mode_template
  - agent_mode_protocol
  - quick_start_workflows
  - hierarchy_table
  - wave_task_constraints
  - rationalization_prevention
  - stage_primitives
  - gate_mechanism
  - agent_teams
  - context_isolation
  - lifecycle_hooks
  - convergence_loop
  - dispatch_report

unwanted_sections:
  - frontmatter
  - version_update
  - hierarchy_diagram
  - template_quick_ref

quality_thresholds:
  min_composite: 90
  min_relevance: 0.90
  max_noise_ratio: 0.15
