# EvoBench Scenario: Convergence-Loop Noise Filter — Feedback Profile (v7.2.2+ P-01)
#
# Validates that the new ``GateProfile.noise_tolerance_pct`` field +
# ``compute_smoothed_trend()`` helper preserve the feedback-profile section
# selection while documenting the noise-tolerant convergence behavior the
# patch is built around. The 4 stagnation branches the patch hinges on —
# ``default zero = byte-stable``, ``within-tolerance single round = not
# stagnant``, ``within-tolerance two rounds = stagnant``, ``clear regression
# = stagnant`` — are verified at the unit level in
# ``tests/test_gate.py::TestNoiseTolerance`` and the smoothed-trend
# classifier branches in ``tests/test_gate.py::TestSmoothedTrend``.
#
# Source feedback: ``.local/feedbacks/from_evobench/eb220_for_devola_v7.1.1.md``
#                  §"Recommended Focus" §🔴 Tier 1 #2 — 9 tasks at 21% pass;
#                  worst-affected: ``feedback_loop_convergence_under_noise``
#                  (q=0.4375, σ=0.0793), ``v2_X_13_optimize_measure_revert_loop``
#                  (q=0.4198, regressed -0.0481 from v7.1.0),
#                  ``competitive_hypothesis_debate`` (q=0.4138 — worst overall),
#                  ``adversarial_requirement_mutation`` (q=0.4603).
# Plan:            ``.local/research/v7.3.0_patch_plan.md`` §P-01.

name: "convergence_noise_filter"
task_type: "feedback"
description: "Convergence-loop noise filter — validates feedback-profile section selection is unaffected by the additive GateProfile.noise_tolerance_pct field (default 0.0 byte-stable) and documents the 4 stagnation branches verified in tests/test_gate.py::TestNoiseTolerance + 6 smoothed-trend branches in TestSmoothedTrend per EvoBench v2.2.0 feedback (eb220 Tier 1 #2)."

expected_sections:
  - agent_mode_protocol
  - gate_mechanism
  - dispatch_report
  - task_quality_score
  - quick_action_decision
  - context_isolation
  - lifecycle_hooks
  - hierarchy_table
  - wave_task_constraints
  - rationalization_prevention

unwanted_sections:
  - frontmatter
  - version_update
  - plan_mode_template
  - stage_primitives
  - template_quick_ref
  - mode_detection
  - quick_start_workflows

quality_thresholds:
  min_composite: 90
  min_relevance: 0.95
  max_noise_ratio: 0.10

# Documentation only (not consumed by the runner). Records the synthesized
# noise-injected score history that the convergence-loop noise filter
# absorbs, plus the expected gate-loop terminations under both default
# (byte-stable v7.1.x) and tolerance-on (v7.2.2 P-01) configurations. The
# four stagnation branches are unit-verified in tests/test_gate.py.
noise_filter_fixture:
  description: >
    A ``feedback`` profile convergence loop with 30% synthesized noise on
    the composite score (eb220 §"feedback_loop_convergence_under_noise"
    σ=0.0793 ≈ 7.9pp variance pattern reproduced at higher amplitude to
    stress the filter). Score history per round: round_1=70.0,
    round_2=72.0 (+2pp lift), round_3=70.0 (-2pp jitter, within ±5pp
    tolerance band — single occurrence, NOT yet stagnant). Without the
    filter this round_3 jitter triggers ``detect_stagnation()`` and
    ESCALATEs because pairwise ``compute_trend`` returns "stagnant" and
    ``round_num > 2``.
  history:
    - {round: 1, composite: 70.0, note: "baseline"}
    - {round: 2, composite: 72.0, note: "+2pp real lift"}
    - {round: 3, composite: 70.0, note: "-2pp noise (within ±5pp band)"}
  profile:
    name: "feedback"
    noise_tolerance_pct: 0.05  # +/-5pp band
    max_rounds: 5  # explicit; feedback profile uses convergence at runtime
  expected_terminations:
    - tolerance: 0.0
      verdict: "ESCALATE"
      rationale: "Score stagnant for 2 rounds (trend=stagnant). Composite ... vs threshold ..."
      reference: "tests/test_gate.py::TestNoiseTolerance::test_evaluate_convergence_with_tolerance_avoids_round3_escalation (baseline branch)"
    - tolerance: 0.05
      verdict: "FAIL"  # retry into round 4
      rationale: "Composite ... below threshold ... (round 3/5). Retry."
      reference: "tests/test_gate.py::TestNoiseTolerance::test_evaluate_convergence_with_tolerance_avoids_round3_escalation (tolerant branch)"
  unit_test_branches:
    - branch: "default zero preserves baseline behavior"
      reference: "TestNoiseTolerance::test_default_zero_preserves_baseline_behavior"
    - branch: "within-tolerance single round = not stagnant"
      reference: "TestNoiseTolerance::test_noise_within_tolerance_not_stagnant_single_round"
    - branch: "within-tolerance two rounds = stagnant"
      reference: "TestNoiseTolerance::test_noise_within_tolerance_stagnant_two_rounds"
    - branch: "clear regression below -tolerance band = stagnant"
      reference: "TestNoiseTolerance::test_clear_regression_below_tolerance_band_still_stagnant"
    - branch: "real improvement above +tolerance band = not stagnant"
      reference: "TestNoiseTolerance::test_real_improvement_above_tolerance_keeps_converging"
    - branch: "GateProfile.noise_tolerance_pct default = 0.0 (additive default-safe)"
      reference: "TestNoiseTolerance::test_gate_profile_noise_tolerance_default"
  smoothed_trend_branches:
    - branch: "window-3 MA classifies strictly increasing as improving"
      reference: "TestSmoothedTrend::test_window_3_moving_average_classifies_improving"
    - branch: "window-3 MA classifies strictly decreasing as degrading"
      reference: "TestSmoothedTrend::test_window_3_moving_average_classifies_degrading"
    - branch: "window-3 MA absorbs alternating ±2pp noise around upward trend"
      reference: "TestSmoothedTrend::test_window_3_moving_average_handles_noise"
    - branch: "len < window falls back to pairwise compute_trend"
      reference: "TestSmoothedTrend::test_window_3_with_lt_3_history_falls_back_to_pairwise"
