# EvoBench Scenario: Compression — Hierarchical Predecessor Retention (Easy)
# v7.0.2 / ADR-003 §6 #7 (H.1 retention probe — easy tier).
#
# Exercises the `research` profile (token_budget 3300) against the v7.0.2
# hierarchical summariser. The "easy" tier synthesises a ~5 K-token
# predecessor artifact carrying 5 verbatim probe facts (file paths,
# version strings, task IDs). After `summarise_predecessor(max_tokens=500,
# schema_hint="research")` the unit-test side asserts ≥ 95 % retention of
# the probe facts via `extract_named_entities` (per ADR-003 §6 #7).
#
# This scenario file probes the *profile-selection* side: it confirms the
# research profile keeps the 10 sections needed to author summarisation-
# heavy research dispatches. Composite floor is 85 (gate `standard`).

name: "compression_retention_easy"
task_type: "research"
description: >
  Hierarchical-summary retention probe — easy tier. Validates the research
  profile (3300-token budget) selects the sections needed to consume a
  ~5 K-token predecessor artifact under `summarise_predecessor(max_tokens=500,
  schema_hint="research")`. Unit-test side asserts ≥ 95 % retention of
  5 probe facts (file paths, version strings, task IDs) per ADR-003 §6 #7.

expected_sections:
  - quick_action_decision
  - agent_mode_protocol
  - hierarchy_table
  - agent_teams
  - context_isolation
  - dispatch_report
  - reference_navigation
  - mode_detection
  - quick_start_workflows
  - wave_task_constraints

unwanted_sections:
  - frontmatter
  - version_update
  - plan_mode_template
  - convergence_loop
  - task_quality_score
  - template_quick_ref

quality_thresholds:
  min_composite: 85.0
  min_relevance: 0.9
  max_noise_ratio: 0.15

# Advisory metadata for the H.1 retention probe (consumed by unit tests, not
# by the EvoBench section-selection scorer).
retention_probe:
  artifact_size_tokens: 5000
  max_summary_tokens: 500
  schema_hint: "research"
  retention_target: 0.95
  probe_facts:
    - "src/devolaflow/compressor.py"
    - "src/devolaflow/task_adaptive_selector.py"
    - "T07-summarise-predecessor"
    - "version 7.0.2"
    - "commit ef3a2d5"
