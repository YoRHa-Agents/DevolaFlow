# EvoBench Scenario: Long-Context Repo QA — research Profile (v7.2.5+ P-05)
#
# Validates that the new retrieval-prioritised summariser path
# (``summarise_predecessor`` with ``retrieval_query`` kwarg + the private
# helpers ``_score_section_against_query`` / ``_tokenize_for_retrieval`` /
# ``_select_sections_by_query``) does not regress the ``research`` profile
# section selection. The ``research`` profile is the canonical home for
# long-context Q&A workloads — its ``section_priorities`` already mark
# ``quick_action_decision``, ``agent_mode_protocol``, ``hierarchy_table``,
# and ``context_isolation`` as ``critical`` (per
# workflow-system/agent/context_profiles.yaml lines 372-432). The retrieval
# path itself is tested at the unit level in
# ``tests/test_compressor.py::TestRetrievalScoring`` (14 cases, including
# the latency microbenchmark < 10 ms reject trigger) and at the e2e level
# on a synthesized 50k-token repo in
# ``tests/test_e2e_compression.py::test_long_context_retrieval_query_lifts_target_module_carry_through``.
#
# Source feedback: ``.local/feedbacks/from_evobench/eb220_for_devola_v7.1.1.md``
#                  §"Recommended Focus" §🟠 Tier 2 #5 — long-context QA
#                  tasks at 44% aggregate pass; primary task:
#                  ``v2_X_05_long_context_repo_qa`` (q=0.4734) — explicitly
#                  "50k+ tokens" per eb220. Secondary:
#                  ``cross_session_knowledge_persistence`` (also tagged
#                  ``long_context``, but primarily addressed by P-03).
# Plan:            ``.local/research/v7.3.0_patch_plan.md`` §P-05.
# Builds on:       v7.0.2 hierarchical summariser
#                  (``_select_sections_by_priority`` at line 831 of
#                  src/devolaflow/compressor.py); the new
#                  ``_select_sections_by_query`` helper sits next to it and
#                  mirrors its API surface so the existing covered/dropped
#                  bookkeeping in ``summarise_predecessor`` is unchanged.

name: "long_context_repo_qa"
task_type: "research"
description: "Long-context repo Q&A — validates research-profile section selection is unaffected by the additive retrieval_query kwarg on summarise_predecessor() that ranks sections by 0.6 * jaccard query overlap + 0.4 * normalised schema priority. Documents the synthesized 50k-token 10-module repo fixture (auth.py + 9 distractors) plus the retrieval_query 'JWT middleware authentication' that lifts auth.py body-marker carry-through from 50% baseline to 100% query-mode (50 pp lift) per EvoBench v2.2.0 feedback (eb220 Tier 2 #5)."

expected_sections:
  - quick_action_decision
  - agent_mode_protocol
  - hierarchy_table
  - agent_teams
  - context_isolation
  - dispatch_report
  - reference_navigation
  - mode_detection
  - quick_start_workflows
  - wave_task_constraints

unwanted_sections:
  - frontmatter
  - version_update
  - hierarchy_diagram
  - template_quick_ref

quality_thresholds:
  # v16.0.0 docs-stabilization re-pin: canonical expected sections retain
  # relevance 1.0000 and noise 0.0000; compacted SKILL/reference text
  # lowered utilization to 0.6379, making 85.52 the deterministic equilibrium.
  # Floor 81.0 keeps the regression margin below 5pp without relaxing
  # the independent relevance or noise gates.
  min_composite: 81.0
  min_relevance: 0.85
  max_noise_ratio: 0.10
  min_format_compliance: 0.85

# Documentation only (not consumed by the runner). Records the synthesized
# 50k-token "repo" payload that ``summarise_predecessor`` would summarise
# under retrieval mode, plus the expected carry-through deltas. The unit
# tests in ``tests/test_compressor.py::TestRetrievalScoring`` cover all 14
# branches of the new retrieval path; the e2e test in
# ``tests/test_e2e_compression.py::test_long_context_retrieval_query_lifts_target_module_carry_through``
# verifies the >= 30 pp lift reject trigger end-to-end.
long_context_qa_fixture:
  description: >
    A synthesized 50k-token (~200_000 byte) markdown "repo" with 10 modules
    × ~5k tokens each. ``auth.py`` (positioned at module 5) carries 10
    auth-flavour body markers (``JWT``, ``validate_jwt``, ``decode_token``,
    ``authentication``, ``authorize``, ``bearer_token``, ``claims_set``,
    ``signing_key``, ``token_expiry``, ``hmac_signature``); the 9 distractor
    modules use orthogonal vocabularies (e.g., ``payments.py`` →
    Stripe/charge_intent/refund_flow/webhook_event/transaction_id;
    ``templates.py`` → jinja/render/template/layout/partial). ``routes.py``
    at module 2 carries 5 of the 10 auth markers as incidental references
    so the baseline (no-query) probe scores ~50% auth retention; the other
    5 markers are auth.py-only and dropped under baseline.
  modules:
    primary_target: "auth.py"
    distractor_witness: "payments.py"
    layout_in_doc_order:
      - "payments.py"
      - "routes.py"
      - "db.py"
      - "cache.py"
      - "auth.py"
      - "middleware.py"
      - "templates.py"
      - "notifications.py"
      - "users.py"
      - "admin.py"
    body_tokens_per_module: 5000
    total_artifact_tokens: 50000
  retrieval_query: "JWT middleware authentication"
  retrieval_query_tokens_after_stopword_strip:
    - "jwt"
    - "middleware"
    - "authentication"
  summariser_max_tokens: 9000
  expected_carry_through:
    baseline_auth_retention: 0.50
    baseline_auth_tolerance: "0.40 <= baseline_auth <= 0.60"
    query_auth_retention: 1.00
    query_auth_minimum: 0.85
    retention_lift_pp: 50.0
    retention_lift_minimum_pp: 30.0
    baseline_distractor_retention: 1.00
    query_distractor_retention: 0.00
    query_distractor_maximum: 0.40
  scoring_formula:
    formula: "combined = 0.6 * query_overlap + 0.4 * schema_priority_norm"
    query_overlap_weight: 0.6
    schema_priority_weight: 0.4
    overlap_metric: "jaccard (intersection / union over post-stopword tokens)"
    schema_priority_norm: "(N - rank) / N where N = len(SCHEMA_HINT_PRIORITIES[schema_hint]); 0 when no schema_hint or no priority match"
    tie_breaker: "document order (stable sort)"
  latency_budget:
    reject_threshold_ms: 10.0
    measured_penalty_ms: "< 10 (microbenchmarked in test_summarise_query_latency_under_10ms with 20-run warm-up)"
  unit_test_branches:
    - branch: "_score_section_against_query returns 1.0 on identical token sets"
      reference: "TestRetrievalScoring::test_score_returns_one_on_identical_token_sets"
    - branch: "returns 0.0 on disjoint token sets"
      reference: "TestRetrievalScoring::test_score_returns_zero_on_disjoint_token_sets"
    - branch: "returns 0.5 on half-overlap (jaccard 2/4)"
      reference: "TestRetrievalScoring::test_score_returns_half_on_half_overlap"
    - branch: "empty section text returns 0.0"
      reference: "TestRetrievalScoring::test_score_empty_section_text_returns_zero"
    - branch: "empty query tokens returns 0.0"
      reference: "TestRetrievalScoring::test_score_empty_query_tokens_returns_zero"
    - branch: "stopword-only query collapses to empty token set"
      reference: "TestRetrievalScoring::test_score_stopword_only_query_collapses_to_empty"
    - branch: "case-insensitive match (uppercase JWT == lowercase jwt)"
      reference: "TestRetrievalScoring::test_score_is_case_insensitive"
    - branch: "punctuation stripped from both sides"
      reference: "TestRetrievalScoring::test_score_strips_punctuation"
    - branch: "retrieval_query=None bytewise-identical to no-kwarg form"
      reference: "TestRetrievalScoring::test_summarise_with_none_query_byte_identical_to_no_kwarg"
    - branch: "retrieval_query='' and stopwords-only collapse to None path"
      reference: "TestRetrievalScoring::test_summarise_with_empty_query_byte_identical_to_none"
    - branch: "query overlap can override schema-hint priority slot 0"
      reference: "TestRetrievalScoring::test_summarise_query_lifts_relevant_section_above_schema_hint"
    - branch: "private helpers NOT exported via __all__"
      reference: "TestRetrievalScoring::test_score_section_helper_not_in_module_all"
    - branch: "_QUERY_STOPWORDS is a frozen lowercase set"
      reference: "TestRetrievalScoring::test_query_stopwords_set_is_frozen_and_lowercase"
    - branch: "retrieval-mode latency penalty < 10 ms (P-05 reject trigger)"
      reference: "TestRetrievalScoring::test_summarise_query_latency_under_10ms"
    - branch: "e2e: 50k-token repo lifts auth retention >= 30 pp"
      reference: "test_long_context_retrieval_query_lifts_target_module_carry_through"
