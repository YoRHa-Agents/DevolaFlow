# EvoBench Scenario: Documentation
# Tests that documentation profile loads survey-author-review sections with minimal ceremony.

name: "documentation_guide"
task_type: "write docs"
description: "Write comprehensive API documentation with usage examples and quickstart guide"

expected_sections:
  - quick_action_decision
  - hierarchy_table
  - agent_teams
  - context_isolation
  - dispatch_report
  - task_quality_score

