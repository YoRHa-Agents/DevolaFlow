# EvoBench Scenario: Multi-Repo Dispatch Assembly — migration Profile (v7.2.6+ P-06)
#
# Validates that the new additive ``repos:`` field (appended at canonical
# position 13 of ``schemas/lean-dispatch.yaml#layout_invariant.canonical_order``
# and mirrored in ``src/devolaflow/compressor.py::DEFAULT_DISPATCH_LAYOUT``) does
# not regress the ``migration`` profile section selection. The ``migration``
# profile (per workflow-system/agent/context_profiles.yaml lines 707-790) is the
# canonical home for cross-repo coordination work — its ``section_priorities``
# already mark ``quick_action_decision``, ``plan_mode_template``,
# ``agent_mode_protocol``, ``hierarchy_table``, ``wave_task_constraints``,
# ``rationalization_prevention``, ``gate_mechanism``, ``context_isolation``,
# ``dispatch_report``, ``lifecycle_hooks``, and ``convergence_loop`` as
# ``critical``, AND ``repo_mode`` as ``important`` — exactly the L2/L3 sections
# that must survive when a multi-repo dispatch payload threads through the
# L0 → L1 → L2 → L3 chain.
#
# The P6-additive layout invariant change (``layout_invariant.version: 1 → 2``,
# ``canonical_order`` grew 12 → 13 by APPENDING ``repos`` AT THE END after
# ``gate``) is verified at the unit level in
# ``tests/test_compressor.py::TestDefaultDispatchLayoutV730`` (7 cases covering
# length=13, last-entry=repos, first-12=v7.0.0-verbatim, accepts-v7.3.0-payload,
# accepts-v7.0.0-payload-without-repos additivity proof, gate-vs-repos position
# ordering, and reordering-raises-DispatchLayoutError) and at the dual-baseline
# byte-comparison level in
# ``tests/test_benchmarks.py::TestLayoutInvariantBaseline`` (3 cases: the v7.0.0
# golden byte-comparison STILL PASSES — the additivity proof; the new v7.3.0
# golden byte-comparison; LCP between v7.0.0 and v7.3.0 baselines >= 0.95 on
# the first 12 keys — the P6 cache prefix preservation proof).
#
# Source feedback: ``.local/feedbacks/from_evobench/eb220_for_devola_v7.1.1.md``
#                  §"Recommended Focus" §🟠 Tier 2 #4 — multi-repo coordination
#                  tasks at 33% aggregate pass; worst-affected:
#                  ``v2_X_02_multi_repo_breaking_change`` (q=0.4248),
#                  ``v2_X_08_circular_dep_cross_repo`` (q=0.4577), and
#                  partial-overlap with multi-module tasks. eb220 explicit:
#                  "Likely needs explicit cross-repo state model."
# Plan:            ``.local/research/v7.3.0_patch_plan.md`` §P-06.
# Cache invariant: ``.local/research/adr/v7-ADR-001-cache-layout-invariant.md``
#                  §2 "additive rule for new keys" — the design contract that
#                  permits this schema bump without a successor ADR.

name: "multi_repo_dispatch"
task_type: "migration"
description: "Multi-repo dispatch assembly — validates migration-profile section selection is unaffected by the additive repos: field appended at canonical position 13 of lean-dispatch.yaml#layout_invariant.canonical_order (and mirrored in compressor.py::DEFAULT_DISPATCH_LAYOUT). Documents the synthesized 3-repo dispatch payload (1 primary + 2 dependents) plus the v7.0.0-vs-v7.3.0 dual-baseline byte-comparison proof of P6 additivity per EvoBench v2.2.0 feedback (eb220 Tier 2 #4)."

expected_sections:
  - quick_action_decision
  - plan_mode_template
  - agent_mode_protocol
  - hierarchy_table
  - wave_task_constraints
  - rationalization_prevention
  - gate_mechanism
  - context_isolation
  - dispatch_report
  - lifecycle_hooks
  - convergence_loop
  - repo_mode

unwanted_sections:
  - frontmatter
  - version_update
  - hierarchy_diagram
  - template_quick_ref

quality_thresholds:
  min_composite: 90
  min_relevance: 0.95
  max_noise_ratio: 0.05
  min_format_compliance: 0.95

# Documentation only (not consumed by the runner). Records the synthesized
# 3-repo dispatch payload that the post-P-06 ``DEFAULT_DISPATCH_LAYOUT``
# permits at canonical position 13, plus the exact byte-comparison and LCP
# assertions that prove additivity. The 7 unit-level branches of
# ``DEFAULT_DISPATCH_LAYOUT`` are verified in
# ``tests/test_compressor.py::TestDefaultDispatchLayoutV730`` and the 3
# dual-baseline branches in
# ``tests/test_benchmarks.py::TestLayoutInvariantBaseline``.
multi_repo_fixture:
  description: >
    A synthesized 3-repo dispatch payload with one primary repo
    (``auth-service``) plus two dependents (``web-frontend``,
    ``api-gateway``). The primary repo's branch (``main``) gates the
    dependents' merges so a multi-repo coordination task can express its
    cross-repo state via the new ``repos:`` field at canonical position 13
    instead of stuffing repo metadata into the flat ``files:`` list at
    canonical position 6.
  schema_layout_invariant:
    canonical_order_version_before: 1
    canonical_order_version_after: 2
    canonical_order_length_before: 12
    canonical_order_length_after: 13
    appended_field_name: "repos"
    appended_field_position: 13
    additive_per_adr: ".local/research/adr/v7-ADR-001-cache-layout-invariant.md §2"
    p6_invariant_rule: ".cursor/rules/devola-flow-rules.mdc Rule 6 — Preserve Cached Prefix"
  repos:
    primary:
      name: "auth-service"
      root_path: "repos/auth-service"
      primary: true
      branch: "main"
      role: "Owns the canonical dispatch task; gates dependents' merges."
    dependents:
      - name: "web-frontend"
        root_path: "repos/web-frontend"
        primary: false
        branch: "develop"
        role: "Consumes the auth-service JWT contract; builds against the primary's main branch."
      - name: "api-gateway"
        root_path: "repos/api-gateway"
        primary: false
        branch: "main"
        role: "Routes traffic to auth-service; updates routing tables when primary's API surface changes."
  field_shape:
    schema: "[{name: str, root_path: str, primary: bool, branch: str}]"
    primary_constraint: "exactly one entry MUST have primary: true"
    optional: "single-repo dispatches MAY omit the repos field entirely"
    additivity_guarantee: >
      assert_dispatch_layout treats absence of repos as canonical, so v7.0.0-
      shape dispatches (no repos field) continue to validate cleanly against
      the post-P-06 DEFAULT_DISPATCH_LAYOUT — verified by
      tests/test_compressor.py::TestDefaultDispatchLayoutV730::test_assert_dispatch_layout_accepts_v7_0_0_payload_without_repos.
  dual_baseline:
    v7_0_0_golden: "benchmarks/devolaflow_context/baselines/layout_invariant_v7.0.0.yaml"
    v7_3_0_golden: "benchmarks/devolaflow_context/baselines/layout_invariant_v7.3.0.yaml"
    diff_is_purely_additive: true
    diff_summary: >
      diff yields exactly +13 lines appended at the end (the ``repos:`` block
      with 3 entries × 4 fields = 12 fields + 1 list header). ZERO existing
      lines modified; the v7.0.0 golden byte-comparison
      (test_layout_invariant_baseline) STILL PASSES after the schema bump,
      proving additivity.
    lcp_threshold:
      schemas_lean_dispatch_yaml_round_1_to_2: 0.80
      schemas_lean_dispatch_yaml_round_1_to_3: 0.70
      p_06_test_assertion: 0.95
      measured: 1.0
      note: >
        v7.0.0 render is a perfect prefix of the v7.3.0 render because the
        first 12 keys are byte-identical and the appended ``repos:`` block
        only extends the trailing bytes. compute_dispatch_lcp_pct(v7.0.0,
        v7.3.0) returns 1.0.
  acceptance_criteria_for_p_06:
    - "tests/test_benchmarks.py::TestLayoutInvariantBaseline::test_layout_invariant_baseline (v7.0.0 byte-comparison) STILL PASSES after the schema bump."
    - "tests/test_benchmarks.py::TestLayoutInvariantBaseline::test_layout_invariant_baseline_v7_3_0 (v7.3.0 byte-comparison) PASSES."
    - "tests/test_benchmarks.py::TestLayoutInvariantBaseline::test_layout_invariant_v7_0_0_prefix_lcp_v7_3_0 (LCP >= 0.95) PASSES."
    - "tests/test_compressor.py::TestDispatchLayoutInvariant::test_dispatch_prefix_is_stable_across_rounds STILL PASSES (LCP r1->r2 >= 80%, r1->r3 >= 70%)."
    - "DEFAULT_DISPATCH_LAYOUT length 12 -> 13; first 12 entries byte-identical to v7.0.0 sequence; last entry == 'repos'."
    - "assert_dispatch_layout(v7_0_0_shape_payload_no_repos) passes — the additivity proof for legacy single-repo dispatchers."
    - "assert_dispatch_layout(v7_3_0_shape_payload_with_repos) passes — the new field at position 13 validates cleanly."
    - "schemas/lean-dispatch.yaml#layout_invariant.version 1 -> 2 (schema generation marker; no production consumer of this field exists per pre-edit grep)."
  unit_test_branches:
    - branch: "DEFAULT_DISPATCH_LAYOUT length is 13"
      reference: "TestDefaultDispatchLayoutV730::test_default_dispatch_layout_length_is_13"
    - branch: "last entry is 'repos'"
      reference: "TestDefaultDispatchLayoutV730::test_default_dispatch_layout_last_entry_is_repos"
    - branch: "first 12 match v7.0.0 sequence verbatim"
      reference: "TestDefaultDispatchLayoutV730::test_default_dispatch_layout_first_12_match_v7_0_0_sequence"
    - branch: "v7.3.0-shape payload validates"
      reference: "TestDefaultDispatchLayoutV730::test_assert_dispatch_layout_accepts_v7_3_0_payload_with_repos"
    - branch: "v7.0.0-shape payload (no repos) STILL validates (additivity)"
      reference: "TestDefaultDispatchLayoutV730::test_assert_dispatch_layout_accepts_v7_0_0_payload_without_repos"
    - branch: "repos appears after gate in canonical order"
      reference: "TestDefaultDispatchLayoutV730::test_repos_appears_after_gate_in_canonical_order"
    - branch: "swapping repos before gate raises DispatchLayoutError"
      reference: "TestDefaultDispatchLayoutV730::test_repos_before_gate_raises_dispatch_layout_error"
    - branch: "v7.0.0 golden byte-comparison STILL passes (additivity)"
      reference: "TestLayoutInvariantBaseline::test_layout_invariant_baseline"
    - branch: "v7.3.0 golden byte-comparison passes"
      reference: "TestLayoutInvariantBaseline::test_layout_invariant_baseline_v7_3_0"
    - branch: "LCP(v7.0.0, v7.3.0) on first 12 keys >= 0.95 (P6 cache prefix preservation)"
      reference: "TestLayoutInvariantBaseline::test_layout_invariant_v7_0_0_prefix_lcp_v7_3_0"
