# EvoBench Scenario: Self-Update Reference Check
# Tests that self_update profile selects meta-framework, reference navigation,
# lifecycle hooks, and version management sections while excluding implementation noise.

name: "self_update_reference_check"
task_type: "self_update"
description: "Validates context selection for the self-update workflow's check-refs stage"

expected_sections:
  - frontmatter
  - version_update
  - agent_mode_protocol
  - dispatch_report
  - lifecycle_hooks
  - reference_navigation
  - quick_action_decision
  - context_isolation
  - rules_dispatchers

unwanted_sections:
  - plan_mode_template
  - task_quality_score
  - template_quick_ref
  - stage_primitives
  - convergence_loop
  - mode_detection
  - quick_start_workflows

quality_thresholds:
  # v12.3.0 PV-04 absorption: same root-cause as self_update_integration —
  # SKILL.md §"Version & Update" doubled (109 → 232 tokens) due to new
  # Session Banner Contract subsection (PV-02). self_update profile
  # 3100-token budget squeezed → important sections evicted →
  # matched_count drops, composite ≈ 75.81. Same rationale + cadence as
  # self_update_integration scenario adjustment.
  min_composite: 73.0
  max_noise_ratio: 0.1
  min_relevance: 0.65
