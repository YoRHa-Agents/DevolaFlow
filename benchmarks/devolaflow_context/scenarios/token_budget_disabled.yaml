# v9.0.0 PV-06 (v8.5.1 — closes Theme T5 #1 from `.local/research/v9.0.0_implementation_plan.md` §6.6).
#
# Codifies the R5 strict opt-out contract for the v8.0.0 P-03 token-budget
# circuit breaker (`src/devolaflow/gate/budget.py::TokenBudgetBreaker`).
# The PV-06 flip turns the breaker ON by default for STRICT/AUDIT
# decomposition profiles; this scenario validates the opt-out path:
#
#   * env-flag `DEVOLAFLOW_TOKEN_BUDGET_BREAKER` set EXACTLY to "0" disables
#     the breaker even on a flipped profile (R5 strict — NOT loose match).
#   * The L3 dispatch surface that follows MUST receive byte-identical
#     context to the pre-flip baseline — same expected sections, same
#     composite floor 90.
#
# This pins the v9-ADR-006 invariant: the flip is a default, NOT a forced
# behaviour. Operators with offline / token-unbounded workloads can opt
# out per-flag without losing dispatch fidelity.
#
# Companion unit-test layer:
#   * `tests/test_gate_budget.py` (existing breaker semantics)
#   * `tests/test_compression_pipeline.py::test_*_byte_identical` (R5 strict
#     pass-through invariant via the unified pipeline)
#
# External canonical URL (per S-7): https://github.com/YoRHa-Agents/DevolaFlow

