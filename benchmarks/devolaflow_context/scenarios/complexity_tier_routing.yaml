# EvoBench Scenario: Complexity-Tier Routing — Feature Profile (v7.2.1+ P-04)
#
# Validates that the new `meta.complexity_routing:` block + `complexity_tier`
# kwarg on `resolve_model_hint()` / `select_context()` preserve the feature
# profile section selection when `complexity_tier=None` (the default branch
# the runner exercises). The 3 routing branches the patch is built around —
# `simple → budget`, `complex → quality`, `None → profile_default` — are
# verified at the unit level in
# `tests/test_task_adaptive_selector.py::TestComplexityTierRouting`
# (parametrised across all 4 tiers + None + invalid-tier fall-through +
# immutability via deepcopy).
#
# Source: .local/feedbacks/from_evobench/eb220_for_devola_v7.1.1.md
#         §"Model Interaction" + §"Recommended Focus" — locks in the
#         operational guidance "route by tier — opus4.7/max for Complex+,
#         sonnet4.6/high for Simple/Medium" (5.6× cost-efficiency win).
# Plan:   .local/research/v7.3.0_patch_plan.md §P-04.

name: "complexity_tier_routing"
task_type: "feature"
description: "Complexity-tier-aware model routing via meta.complexity_routing — validates feature-profile section selection is unaffected when complexity_tier=None (default branch). The 3 routing branches (simple→budget, complex→quality, None→profile_default) are unit-tested in tests/test_task_adaptive_selector.py::TestComplexityTierRouting per EvoBench v2.2.0 feedback (eb220 §Model Interaction)."

expected_sections:
  - quick_action_decision
  - plan_mode_template
  - agent_mode_protocol
  - quick_start_workflows
  - hierarchy_table
  - wave_task_constraints
  - rationalization_prevention
  - stage_primitives
  - gate_mechanism
  - agent_teams
  - context_isolation
  - lifecycle_hooks
  - convergence_loop
  - dispatch_report

unwanted_sections:
  - frontmatter
  - version_update
  - hierarchy_diagram
  - template_quick_ref

quality_thresholds:
  # v16.0.0 docs-stabilization re-pin: canonical expected sections retain
  # relevance 1.0000 and noise 0.0000; compacted SKILL/reference text
  # lowered utilization to 0.6170, making 84.68 the deterministic equilibrium.
  # Floor 81.0 keeps the regression margin below 5pp without relaxing
  # the independent relevance or noise gates.
  min_composite: 81.0
  min_relevance: 0.90
  max_noise_ratio: 0.15
  # min_format_compliance is documentation-only — not enforced by the current
  # tests/test_benchmarks.py::TestRunner::test_quality_thresholds runner
  # (which only asserts on min_composite / min_relevance / max_noise_ratio).
  # Recorded here per the v7.3.0 P-04 patch plan §P-04 Accept criteria.
  min_format_compliance: 0.95

# Documentation only (not consumed by the runner). Records the 3 routing
# branches verified in tests/test_task_adaptive_selector.py::TestComplexityTierRouting
# so future EvoBench cycles can correlate this scenario to its unit-test peers.
complexity_tier_branches:
  - tier: simple
    expected_model_hint: budget
  - tier: medium
    expected_model_hint: balanced
  - tier: complex
    expected_model_hint: quality
  - tier: very_complex
    expected_model_hint: quality
  - tier: null
    expected_model_hint: balanced  # feature profile model_hints.default_tier
