# EvoBench Scenario: Simple Implementation — Feature Profile with Budget Model
# Tests that simple_implementation task type routes to the feature profile
# with budget model_hint and selects all 17 operational feature-profile sections.
# Validates cost-optimized model selection does not affect section coverage.

name: "simple_impl_budget"
task_type: "simple_implementation"
description: "Simple implementation with budget model hint — validates feature-profile routing with cost-optimized model selection"

expected_sections:
  - quick_action_decision
  - mode_detection
  - plan_mode_template
  - agent_mode_protocol
  - quick_start_workflows
  - hierarchy_table
  - wave_task_constraints
  - rationalization_prevention
  - wave_coordination
  - stage_primitives
  - gate_mechanism
  - agent_teams
  - context_isolation
  - lifecycle_hooks
  - repo_mode
  - convergence_loop
  - dispatch_report

unwanted_sections: []

quality_thresholds:
  # v16.0.0 docs-stabilization re-pin: canonical expected sections retain
  # relevance 1.0000 and noise 0.1053; compacted SKILL/reference text
  # lowered utilization to 0.6170, making 82.57 the deterministic equilibrium.
  # Floor 78.0 keeps the regression margin below 5pp without relaxing
  # the independent relevance or noise gates.
  min_composite: 78.0
  min_relevance: 0.90
  max_noise_ratio: 0.20    # v9.0.0 PV-01: bumped 0.15 → 0.20 — SKILL.md compression freed budget room so the feature profile now also picks up `mode_detection` / `repo_mode` / `reference_navigation` (all `supplementary`); 17 selected vs 14 expected = 0.1765 noise. W-16 wholesale rebase precedent.
