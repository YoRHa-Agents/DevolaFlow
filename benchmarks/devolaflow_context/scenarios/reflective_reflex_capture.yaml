# EvoBench Scenario: Reflective Reflex Capture — Feature Profile (v7.2.3+ P-03)
#
# Validates that the new ``capture_session_reflection()`` writer activates the
# v7.2.0 PR-C dormant operational.jsonl substrate (C-007 schema additions to
# Learning: ``files``, ``source``, plus ``dedup_learnings``) without regressing
# the ``feature`` profile section selection. The ``feature`` profile has
# ``learnings.enabled: true`` (per workflow-system/agent/context_profiles.yaml
# lines 324-329), so the read-side path that consumes this substrate is
# already wired via v7.0.3 ADR-005 (``load_relevant_learnings`` accepts
# ``session_id``).
#
# The 6 capture_session_reflection branches the patch hinges on — happy
# path, auto-derived key, session_id round-trip via source_task_id, dedup
# against existing same-(task_type, key) entry, end-to-end load-back via
# load_relevant_learnings, and empty-files fallback to "<task_type>:session"
# — are verified at the unit level in
# ``tests/test_learnings.py::TestCaptureSessionReflection``. The 3-session
# multi-write fixture documented inline below is summarised at the unit
# level by the dedup test (`test_capture_dedups_against_existing`) plus the
# round-trip test (`test_capture_round_trip_through_load_relevant_learnings`).
#
# Source feedback: ``.local/feedbacks/from_evobench/eb220_for_devola_v7.1.1.md``
#                  §"Recommended Focus" §🔴 Tier 1 #3 — 12 multi-session
#                  orchestration tasks at 41% aggregate pass; worst-affected:
#                  ``cross_session_knowledge_persistence`` (q=0.4705),
#                  ``v2_X_06_multi_session_compounding_bug`` (q=0.4617, σ=0.0765),
#                  ``earned_autonomy_escalation`` (q=0.4468),
#                  ``v2_X_15_incident_commander_simulation`` (q=0.4387).
# Plan:            ``.local/research/v7.3.0_patch_plan.md`` §P-03.

name: "reflective_reflex_capture"
task_type: "feature"
description: "Reflective reflex writer — validates feature-profile section selection is unaffected by the additive capture_session_reflection() helper that activates the v7.2.0 dormant operational.jsonl substrate (C-007 schema). Documents the 3-session 15-entry persistence fixture + 4th-session load-back via load_relevant_learnings per EvoBench v2.2.0 feedback (eb220 Tier 1 #3)."

expected_sections:
  - quick_action_decision
  - agent_mode_protocol
  - hierarchy_table
  - wave_task_constraints
  - stage_primitives
  - gate_mechanism
  - context_isolation
  - lifecycle_hooks
  - dispatch_report
  - rationalization_prevention

unwanted_sections:
  - frontmatter
  - version_update
  - hierarchy_diagram
  - template_quick_ref

quality_thresholds:
  # v16.0.0 docs-stabilization re-pin: canonical expected sections retain
  # relevance 1.0000 and noise 0.0000; compacted SKILL/reference text
  # lowered utilization to 0.6170, making 84.68 the deterministic equilibrium.
  # Floor 81.0 keeps the regression margin below 5pp without relaxing
  # the independent relevance or noise gates.
  min_composite: 81.0
  min_relevance: 0.85
  max_noise_ratio: 0.10

# Documentation only (not consumed by the runner). Records the synthesized
# 3-session run that capture_session_reflection() would persist into
# operational.jsonl, plus the 4th-session load_relevant_learnings query
# that consumes them. The 6 unit-level branches are verified in
# ``tests/test_learnings.py::TestCaptureSessionReflection``.
reflective_reflex_fixture:
  description: >
    A simulated 3-session run, each session writing 5 reflective entries
    via ``capture_session_reflection`` (auto-derived key from
    ``f"{task_type}:{files[0] if files else 'session'}"``). Total 15
    unique entries persist into ``operational.jsonl`` with no
    ``(task_type, key)`` collisions because each session targets distinct
    files. A 4th session's dispatch then loads via
    ``load_relevant_learnings(task_type='feature', min_confidence=0.5,
    max_entries=10)`` which returns the 10 most-recent entries (sorted by
    confidence; reflective writes default to ``confidence=0.7`` so all 15
    pass the 0.5 floor).
  sessions:
    - session_id: "sess-001"
      task_type: "feature"
      reflections:
        - {files: ["src/auth/jwt.py"],         insight: "JWT path needs explicit nil guard"}
        - {files: ["src/auth/middleware.py"],  insight: "Middleware order matters for 401 handling"}
        - {files: ["src/auth/token.py"],       insight: "Token refresh window: 5 min pre-expiry"}
        - {files: ["src/auth/session.py"],     insight: "Session pin must survive process restart"}
        - {files: ["src/auth/rbac.py"],        insight: "RBAC check costs ~12ms per call; cache it"}
    - session_id: "sess-002"
      task_type: "feature"
      reflections:
        - {files: ["src/api/v1/users.py"],     insight: "User PATCH must be idempotent on email"}
        - {files: ["src/api/v1/posts.py"],     insight: "Post DELETE cascades to comments"}
        - {files: ["src/api/v1/comments.py"],  insight: "Comment depth capped at 3 to prevent recursion"}
        - {files: ["src/api/middleware.py"],   insight: "Rate limit per-IP, not per-user, on auth"}
        - {files: ["src/api/errors.py"],       insight: "401 vs 403: 401 = missing creds, 403 = wrong role"}
    - session_id: "sess-003"
      task_type: "feature"
      reflections:
        - {files: ["src/db/migrations.py"],    insight: "Migrations must be reversible above v3"}
        - {files: ["src/db/connection.py"],    insight: "Connection pool size = 2 × CPU cores"}
        - {files: ["src/db/models.py"],        insight: "Soft-delete via deleted_at, never DROP rows"}
        - {files: ["src/db/queries.py"],       insight: "N+1 on posts.author — use joinedload"}
        - {files: ["src/db/cache.py"],         insight: "TTL: 5 min for hot reads, 1 hour for cold"}
  expected_persistence:
    unique_entries: 15
    operational_jsonl_path: "workflow-system/agent/knowledge/learnings/operational.jsonl"
    dedup_collisions: 0
  session_4_query:
    task_type: "feature"
    min_confidence: 0.5
    max_entries: 10
    expected_returned: 10
    rationale: >
      All 15 entries default to ``confidence=0.7`` (set by
      ``capture_session_reflection``), passing the 0.5 floor. The
      ``load_relevant_learnings`` helper returns at most ``max_entries``
      sorted by confidence descending; tie-broken by insertion order
      (latest writes first when timestamps tie at session-end batch).
  unit_test_branches:
    - branch: "happy path: writer creates Learning entry with v3 fields"
      reference: "TestCaptureSessionReflection::test_capture_creates_learning_entry"
    - branch: "auto-derived key: key=None → f\"{task_type}:{files[0]}\""
      reference: "TestCaptureSessionReflection::test_capture_auto_derives_key"
    - branch: "session_id round-trip via source_task_id"
      reference: "TestCaptureSessionReflection::test_capture_session_passes_through_session_id"
    - branch: "dedup against pre-populated same-(task_type, key) entry; new wins by ts"
      reference: "TestCaptureSessionReflection::test_capture_dedups_against_existing"
    - branch: "round-trip: capture → load_relevant_learnings → fields preserved"
      reference: "TestCaptureSessionReflection::test_capture_round_trip_through_load_relevant_learnings"
    - branch: "empty files=[] → key auto-derives to f\"{task_type}:session\""
      reference: "TestCaptureSessionReflection::test_capture_handles_empty_files_list"
