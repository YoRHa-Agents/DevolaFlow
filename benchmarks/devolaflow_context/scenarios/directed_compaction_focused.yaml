# EvoBench Scenario: Directed Compaction — Focused Refactor (v8.0.0 P-02)
#
# Validates that the `refactor` profile (5000-token budget) keeps the
# convergence-loop, gate, and dispatch sections that a directed-compaction
# dispatcher needs to thread `pred[*].compact_directive` through to the
# L3 task agent. Pairs with `tests/test_compressor.py::TestDirectedCompact`
# to exercise the full Layer-3 (`directed_compact`) pipeline:
#
#   1. Dispatcher parses `pred[*].compact_directive` (NESTED, P6-safe).
#   2. Dispatcher calls `summarise_predecessor(..., directive=...)` so the
#      section ranker promotes focus-keyword matches.
#   3. Dispatcher (or downstream consumer) optionally calls
#      `directed_compact(text, focus_keywords, max_drop_pct=0.20)` on the
#      key_facts block before rendering the lean dispatch payload.
#
# This scenario exercises step (1) — the *profile* must keep the sections
# needed to author and verify a directed-compaction-using dispatch.
# Composite floor 81 after the v16 compact-context re-pin; see the threshold rationale below.

name: "directed_compaction_focused"
task_type: "refactor"
description: >
  Directed-compaction harness probe — exercises the v8.0.0 P-02 layered
  compression pipeline by dispatching a refactor task whose pred[*] entries
  carry compact_directive {focus_keywords: [auth, jwt], max_drop_pct: 0.20}.
  Validates the refactor profile selects the convergence-loop, gate
  mechanism, dispatch protocol, and context-isolation sections needed to
  thread the directive end-to-end. Composite floor 81 after docs stabilization.

expected_sections:
  - quick_action_decision
  - plan_mode_template
  - agent_mode_protocol
  - hierarchy_table
  - wave_task_constraints
  - rationalization_prevention
  - wave_coordination
  - gate_mechanism
  - context_isolation
  - dispatch_report
  - lifecycle_hooks
  - convergence_loop

unwanted_sections:
  - frontmatter
  - version_update
  - template_quick_ref

quality_thresholds:
  # v16.0.0 docs-stabilization re-pin: canonical expected sections retain
  # relevance 1.0000 and noise 0.0000; compacted SKILL/reference text
  # lowered utilization to 0.6323, making 85.29 the deterministic equilibrium.
  # Floor 81.0 keeps the regression margin below 5pp without relaxing
  # the independent relevance or noise gates.
  min_composite: 81.0
  min_relevance: 0.85
  max_noise_ratio: 0.15

# Advisory metadata for the directed-compaction probe (consumed by
# tests/test_compressor.py::TestDirectedCompact, NOT by the EvoBench
# section-selection scorer — these fields document the directive shape
# the scenario simulates at the dispatcher layer).
directive_probe:
  focus_keywords: ["auth", "jwt"]
  max_drop_pct: 0.20
  expected_focus_retention: 1.00
  expected_max_drop_chars_pct: 0.20
