# EvoBench Scenario: Command Mapping Density — RTK-Pattern Local Recipe Layer
# v8.3.4 PV-04 (closes M-002 from `.local/research/v8.4.0_gap_analysis.md` §2.1).
#
# Codifies the post-recipe dispatch surface for L3 task agents whose
# parent layer (L0/L1) hit a fast-path memory recipe AND whose Shell-tool
# calls go through the v8.3.2 PV-02 shell-proxy WITH local
# `.local/memory/commands/<repo>/<cmd>.yaml` recipes layered on top.
#
# The token-saving claim from the gap analysis is an OUTPUT-LAYER claim:
# "RTK-pattern command-output mappings extending RTK with repo-specific
# compression recipes (e.g., DevolaFlow-specific `pytest tests/test_benchmarks.py`
# filter that knows the EvoBench scenario JSON shape)" (gap analysis §2.1
# M-002 row, verbatim). The local recipe layer applies AFTER `rtk rewrite`
# has run — incremental savings come from filters that RTK's built-in
# 100+ command filters don't ship (DeprecationWarning blocks specific to
# the v8.3.3 PV-03 test output, `[*] N fixable` ruff lines, version-bump
# pattern diffs, etc.).
#
# This scenario validates the COMPLEMENTARY invariant: when the recipe
# layer is enabled, the L3 dispatch surface that follows MUST still
# receive a canonical-feature-profile section set so the L3 agent does
# not lose critical context. Composite floor 90 — proves the recipe
# layer's lifecycle integration does NOT degrade dispatch quality (R5
# strict: when no recipes match, behavior is byte-identical to v8.3.3;
# when recipes do match, the recipe layer operates on captured Shell
# output, not on the dispatch envelope).
#
# The actual incremental-saving claim (≥10pp beyond RTK baseline per
# the cycle plan §3 PV-04 row) is measured at the unit-test layer:
# `tests/test_shell_proxy_commands.py::TestApplyLocalRecipe` exercises
# the 4 default DevolaFlow recipes (pytest, ruff, git-diff) against
# synthetic samples and asserts substantive line drops. The EvoBench
# scenario codifies the COMPLEMENTARY invariant (post-recipe L3 dispatch
# is canonical-quality); the savings claim itself is verified at the
# recipe layer.
#
# Pairs with `tests/test_shell_proxy_commands.py` (~25 unit tests
# covering env-flag activation, recipe loading, schema validation,
# precedence chain, R5 strict zero-IO when off, ShellProxy integration)
# plus the seed recipes under `.local/memory/commands/devolaflow/`
# (pytest.yaml, ruff.yaml, git-diff.yaml).
#
# External canonical URL (per S-7): https://github.com/rtk-ai/rtk
# DevolaFlow canonical URL (per S-7): https://github.com/YoRHa-Agents/DevolaFlow

