# EvoBench Scenario: Feedback — Tight Budget Profile Regression
# Tests that the feedback profile (one of the smallest, budget ~2375) selects
# all expected sections without noise. Validates budget-constrained selection
# correctly prioritizes gate evaluation and learnings-related sections.

name: "feedback_regression"
task_type: "feedback"
description: "Feedback analysis task — validates tight budget profile selects all expected sections"

expected_sections:
  - agent_mode_protocol
  - gate_mechanism
  - dispatch_report
  - task_quality_score
  - quick_action_decision
  - context_isolation
  - lifecycle_hooks
  - hierarchy_table
  - wave_task_constraints
  - rationalization_prevention

unwanted_sections: []

quality_thresholds:
  # v12.1.0 W-16 wholesale-regen floor recalibration (sister scenario to
  # convergence_noise_filter; same feedback profile + same 10-section
  # expected list — same SKILL.md additive-content displacement).
  # Pre-edit composite 92.81 → post-edit 85.19. Floor lowered 89 → 80
  # to match the new feedback-profile equilibrium under the v12.1.0
  # SKILL.md token-grew sections (task_quality_score + dispatch_report).
  # Sister floor adjustment in convergence_noise_filter.yaml.
  min_composite: 80
  min_relevance: 0.75
  max_noise_ratio: 0.07
