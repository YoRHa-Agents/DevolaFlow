# EvoBench Scenario: Compression — Hierarchical Predecessor Retention (Medium)
# v7.0.2 / ADR-003 §6 #8 (H.1 retention probe — medium tier).
#
# Exercises the `design` profile (token_budget 4450) against a ~10 K-token
# synthesised predecessor artifact carrying 10 verbatim probe facts (file
# paths, task IDs, commit hashes, version strings, error messages, plus
# acceptance-criterion bullets). After `summarise_predecessor(max_tokens=500,
# schema_hint="design")` the unit-test side asserts ≥ 95 % retention.
#
# Section-selection side: confirms the design profile keeps the 12 sections
# needed to consume design-doc predecessors. Composite floor 85.

name: "compression_retention_medium"
task_type: "design"
description: >
  Hierarchical-summary retention probe — medium tier. Validates the design
  profile (4450-token budget) selects the sections needed to consume a
  ~10 K-token predecessor under `summarise_predecessor(max_tokens=500,
  schema_hint="design")`. Unit-test side asserts ≥ 95 % retention of 10
  probe facts per ADR-003 §6 #8 (H.1 medium tier).

expected_sections:
  - quick_action_decision
  - plan_mode_template
  - agent_mode_protocol
  - hierarchy_table
  - stage_primitives
  - agent_teams
  - quick_start_workflows
  - wave_task_constraints
  - rationalization_prevention
  - gate_mechanism
  - context_isolation
  - dispatch_report

unwanted_sections:
  - frontmatter
  - version_update
  - convergence_loop
  - lifecycle_hooks
  - template_quick_ref
  - hierarchy_diagram

quality_thresholds:
  min_composite: 85.0
  min_relevance: 0.9
  max_noise_ratio: 0.15

retention_probe:
  artifact_size_tokens: 10000
  max_summary_tokens: 500
  schema_hint: "design"
  retention_target: 0.95
  probe_facts:
    - "src/devolaflow/compressor.py"
    - "src/devolaflow/learnings.py"
    - "schemas/lean-dispatch.yaml"
    - "T07-summarise-predecessor"
    - "T08-extract-named-entities"
    - "commit ef3a2d5b9"
    - "version 7.0.2"
    - "Error: artifact not found"
    - "MUST validate inputs before send"
    - "SHOULD coverage 92%"
