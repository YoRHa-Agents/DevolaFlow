# EvoBench Scenario: Agent Workspace — Active Change Folder Context Density
# v8.3.0 PV-09 (closes H-008 in `.local/research/v8.3.0_gap_analysis.md`).
#
# Simulates an L3 Task Agent dispatched into a `change-driven` workflow with
# an active change folder under `.local/.agent/active/<change-id>/`. The agent
# must receive the SKILL.md sections that wire it into the change-driven
# lifecycle: workflow selection (so it picks the change-driven row), hierarchy
# + wave constraints (so it respects S-8 file ownership), context isolation
# (so it consumes handoff envelopes correctly), and lifecycle hooks (so the
# `check_file_ownership` hook fires when a write strays outside owned_files).
#
# Pairs with the new `references/agent-workspace.md` (10th SF-4 reference,
# v8.3.0 PV-09) which carries the full per-artifact schema + handoff protocol
# + source-of-truth ADR — loaded on-demand by L3 when the change-driven
# stage primitives need detail beyond SKILL.md's compact rows.
#
# Composite floor 81 after the v16 compact-context re-pin; the scenario validates that the feature
# profile's section_priorities still cover an L3 working in change-driven
# mode without the new SKILL row additions stealing budget from critical
# sections (P6 Preserve Cached Prefix, regression-guard for v8.2.9 SKILL +3
# row additions in Workflow Selection / Reference Navigation / Quick-Reference
# tables).

name: "agent_workspace_active"
task_type: "feature"
description: >
  L3 Task Agent operating inside an active `.local/.agent/active/<change-id>/`
  folder under the `change-driven` workflow template (v8.2.6). Must receive
  SKILL.md sections that cover (a) change-driven workflow selection, (b) the
  4-layer hierarchy + wave/task constraints that drive `owned_files.txt`
  shape, (c) context isolation for handoff envelope consumption, and (d) the
  lifecycle hook that enforces Rule S-8 (no writes outside owned_files).
  Composite floor 81 — confirms the v8.2.9 SKILL row additions did not
  displace any feature-profile critical section under the 5300-token budget.

expected_sections:
  - quick_action_decision
  - plan_mode_template
  - agent_mode_protocol
  - quick_start_workflows
  - hierarchy_table
  - wave_task_constraints
  - rationalization_prevention
  - stage_primitives
  - gate_mechanism
  - agent_teams
  - context_isolation
  - lifecycle_hooks
  - convergence_loop

unwanted_sections:
  - frontmatter
  - version_update

quality_thresholds:
  # v16.0.0 docs-stabilization re-pin: canonical expected sections retain
  # relevance 1.0000 and noise 0.0000; compacted SKILL/reference text
  # lowered utilization to 0.6170, making 84.68 the deterministic equilibrium.
  # Floor 81.0 keeps the regression margin below 5pp without relaxing
  # the independent relevance or noise gates.
  min_composite: 81.0
  min_relevance: 0.85
  max_noise_ratio: 0.10
