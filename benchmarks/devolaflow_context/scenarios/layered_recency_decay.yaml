# EvoBench Scenario: Layered Compression — Recency Decay (v8.0.0 P-02)
#
# Validates that the `feature` profile (5150-token budget) keeps the
# convergence-loop, gate, and stage primitives that a layered-compaction
# dispatcher needs to consume the new `meta.recency_decay_factor: 0.9`
# overlay added in v8.0.0 P-02. Pairs with
# `tests/test_compressor.py::TestRecencyDecayConfig` to exercise the
# full Layer-2 pipeline:
#
#   1. Dispatcher loads `meta.recency_decay_factor` from context_profiles.
#   2. Dispatcher applies w_round = recency_decay_factor ** rounds_since
#      to multi-round predecessor section weights so older-round noise
#      decays naturally without a hard cutoff.
#   3. Section ranker (`compressor._select_sections_by_priority`) honours
#      the resulting per-section weights; convergence rounds receive a
#      cleaner key_facts block per round.
#
# Composite floor 88 (above the 85 standard floor) per P-02 §3 plan AC #4.

name: "layered_recency_decay"
task_type: "feature"
description: >
  Layered-compression recency decay probe — exercises the v8.0.0 P-02
  recency_decay_factor=0.9 overlay against a feature-development task
  spanning 3 convergence rounds. Validates the feature profile selects
  the stage primitives, gate mechanism, agent teams, and convergence-loop
  sections needed to thread per-round decay weights through to the L3
  task agent. Composite floor 88 (P-02 AC #4).

expected_sections:
  - quick_action_decision
  - plan_mode_template
  - agent_mode_protocol
  - quick_start_workflows
  - hierarchy_table
  - wave_task_constraints
  - rationalization_prevention
  - stage_primitives
  - gate_mechanism
  - agent_teams
  - context_isolation
  - lifecycle_hooks
  - convergence_loop

unwanted_sections:
  - frontmatter
  - version_update
  - template_quick_ref

quality_thresholds:
  min_composite: 88.0
  min_relevance: 0.85
  max_noise_ratio: 0.15

# Advisory metadata for the recency-decay probe (consumed by
# tests/test_compressor.py::TestRecencyDecayConfig, NOT by the EvoBench
# section-selection scorer — these fields document the decay schedule the
# scenario simulates at the dispatcher layer).
recency_probe:
  recency_decay_factor: 0.9
  expected_round_weights:
    round_1_current: 1.0
    round_2_one_back: 0.9
    round_3_two_back: 0.81
  rounds_simulated: 3
