# EvoBench Scenario: Abstractive Stage B LLM-assisted Long-Context (v8.2.0 PV-01)
#
# Validates that the new ``llm_assist=True`` opt-in path on
# ``src/devolaflow/compressor.py::summarise_predecessor`` does not regress
# the ``feature`` profile section selection. The ``feature`` profile is the
# canonical home for long-context complex implementation work — its
# ``section_priorities`` mark ``stage_primitives``, ``gate_mechanism``,
# ``agent_teams``, ``context_isolation``, ``lifecycle_hooks`` and
# ``convergence_loop`` as ``critical`` (per
# workflow-system/agent/context_profiles.yaml ``feature.section_priorities``)
# — all sections needed to author and verify a Stage B-using dispatch.
#
# Pairs with v8.0.0 P-12's heuristic-only ``long_context_repo_qa.yaml`` for
# a delta measurement: Stage A alone landed +0.59pp on the
# ``long_context_repo_qa`` baseline; Stage B target +5pp on top per
# ``.local/research/v8.2.0_patch_plan.md`` §3 PV-01 quantitative metrics.
# The new top-level ``abstractive_llm`` opt-in section in
# ``workflow-system/agent/context_profiles.yaml`` is the wiring; this
# scenario validates the regression-firewall ("opt-in surface change does
# not drift the underlying profile section selection").
#
# Source feedback: v8.0.0 P-12 micro-retrospective +0.59pp Stage A delta
#                  + Stage B design §6 ROI analysis (~24% additional token
#                  savings on top of Stage A's ~12%).
# Plan:            ``.local/research/v8.2.0_patch_plan.md`` §3 PV-01 row 5
#                  + Stage B design §8 test 7.
# Pinned by:       ``tests/test_compressor.py::TestAbstractiveStageBLLM`` +
#                  ``tests/test_llm_client.py``.

name: "abstractive_llm"
task_type: "feature"
description: >
  LLM-assisted abstractive Stage B long-context regression-firewall —
  validates that the v8.2.0 PV-01 ``llm_assist=True`` opt-in path on
  ``summarise_predecessor`` does not drift the ``feature`` profile
  section selection. The new top-level ``abstractive_llm`` opt-in
  section in context_profiles.yaml is a sibling to v8.0.0 P-12's
  ``complex_feature`` (Stage A) — both opt into the abstractive
  summariser, but Stage B refines via a bounded LLM call with
  CO-2 verbatim entity preservation and 7-mode S-5 fallback chain
  (timeout / network / parse / schema / content_filter / rate_limit /
  fallback_disabled). Composite floor 81 after the v16 compact-context
  re-pin; the threshold rationale below preserves the original quality gates.

expected_sections:
  - quick_action_decision
  - plan_mode_template
  - agent_mode_protocol
  - quick_start_workflows
  - hierarchy_table
  - wave_task_constraints
  - rationalization_prevention
  - stage_primitives
  - gate_mechanism
  - agent_teams
  - context_isolation
  - lifecycle_hooks
  - convergence_loop

unwanted_sections:
  - frontmatter
  - version_update
  - hierarchy_diagram
  - template_quick_ref

quality_thresholds:
  # v16.0.0 docs-stabilization re-pin: canonical expected sections retain
  # relevance 1.0000 and noise 0.0000; compacted SKILL/reference text
  # lowered utilization to 0.6170, making 84.68 the deterministic equilibrium.
  # Floor 81.0 keeps the regression margin below 5pp without relaxing
  # the independent relevance or noise gates.
  min_composite: 81.0
  min_relevance: 0.85
  max_noise_ratio: 0.10
  min_format_compliance: 0.85

# Documentation only (not consumed by the runner). Records the v8.2.0
# PV-01 contract surface so future cycle reviewers can verify the
# regression-firewall did its job.
abstractive_llm_contract:
  description: >
    The v8.2.0 PV-01 contract surface added by ``feat/v8.2.0-pv01-llm-stage-b``.
    Stage A is ALWAYS computed first (it's both the fallback baseline AND the
    LLM's hint per Stage B design §7); Stage B is invoked only when
    ``llm_assist=True`` is passed to ``summarise_predecessor``.
  new_kwargs:
    llm_assist: "bool=False — opt-in flag for Stage B refinement"
    llm_client: "LLMClient | None — defaults to LLMClient(provider='mock') when None"
  new_module: "src/devolaflow/llm_client.py — bounded LLM client wrapper"
  new_top_level_section: "abstractive_llm in context_profiles.yaml — opt-in surface"
  preserved_invariants:
    - "schemas/lean-dispatch.yaml canonical_order length = 15 (P6 invariant)"
    - "schemas/lean-dispatch.yaml version = 4 (P6 invariant)"
    - "summarise_predecessor llm_assist=False returns the v8.0.0 P-12 7-key dict byte-identically"
    - "v8.0.0 complex_feature section in context_profiles.yaml is byte-identical (no field added/removed)"
  failure_modes:
    canonical_count: 7
    spec: ["timeout", "network", "parse", "schema", "content_filter", "rate_limit", "fallback_disabled"]
    log_target: "devolaflow.compressor.stage_b"
    log_format: "stage_b.fallback mode=<mode> reason=<detail>"
  cost_budget:
    per_dispatch_usd_ceiling: 0.05
    per_dispatch_latency_ms_ceiling: 800
    typical_50k_dispatch_savings_tokens: 12000
    typical_50k_dispatch_cost_usd: 0.03
  deltas_target:
    long_context_repo_qa_lift_pp_target: 5.0
    long_context_repo_qa_lift_pp_v8_0_0_baseline: 0.59
    long_context_repo_qa_lift_pp_minimum: 1.0
