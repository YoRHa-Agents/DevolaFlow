# EvoBench Scenario: Feedback Analysis
# Tests that feedback profile selects gate evaluation, quality scoring, and
# learnings-related sections while excluding workflow ceremony noise.

name: "feedback_analysis"
task_type: "feedback"
description: "Validates context selection for feedback loop gate evaluation and learnings integration"

expected_sections:
  - agent_mode_protocol
  - gate_mechanism
  - dispatch_report
  - task_quality_score
  - quick_action_decision
  - context_isolation
  - lifecycle_hooks

unwanted_sections:
  - frontmatter
  - version_update
  - plan_mode_template
  - stage_primitives
  - template_quick_ref
  - mode_detection
  - quick_start_workflows

quality_thresholds:
  min_composite: 80.0
  max_noise_ratio: 0.1
  min_relevance: 0.8
