# EvoBench Scenario: Compression — Hierarchical Predecessor Retention (Hard)
# v7.0.2 / ADR-003 §6 #9 (H.1 retention probe — hard tier; the stretch goal).
#
# Exercises the tightest profile (`hotfix`, token_budget 2400) against a
# ~15 K-token synthesised predecessor artifact carrying 15 verbatim probe
# facts spanning all 8 NER entity types. After
# `summarise_predecessor(max_tokens=500, schema_hint="adr")` the unit-test
# side asserts ≥ 90 % retention (vs ≥ 95 % for easy/medium — hard tier
# accepts more signal loss given the 15 K → 500 token compaction).
#
# Section-selection side: confirms the hotfix profile keeps the 10 sections
# needed even when the dispatcher has to summarise a long ADR or design
# doc predecessor before triage. Composite floor 85.

name: "compression_retention_hard"
task_type: "hotfix"
description: >
  Hierarchical-summary retention probe — hard tier (stretch goal per
  ADR-003 §6 #9). Validates the hotfix profile (2400-token budget — the
  tightest) selects the sections needed to consume a ~15 K-token ADR-class
  predecessor under `summarise_predecessor(max_tokens=500, schema_hint="adr")`.
  Unit-test side asserts ≥ 90 % retention of 15 probe facts spanning all
  8 NER types (paths, IDs, hashes, versions, metrics, errors, acceptance
  bullets, interface signatures).

expected_sections:
  - quick_action_decision
  - agent_mode_protocol
  - wave_task_constraints
  - context_isolation
  - dispatch_report
  - hierarchy_table
  - rationalization_prevention
  - gate_mechanism
  - lifecycle_hooks
  - mode_detection

unwanted_sections:
  - frontmatter
  - version_update
  - plan_mode_template
  - quick_start_workflows
  - stage_primitives
  - wave_coordination

quality_thresholds:
  min_composite: 85.0
  min_relevance: 0.9
  max_noise_ratio: 0.15

retention_probe:
  artifact_size_tokens: 15000
  max_summary_tokens: 500
  schema_hint: "adr"
  retention_target: 0.90
  probe_facts:
    - "src/devolaflow/compressor.py"
    - "src/devolaflow/gate/scorer.py"
    - "src/devolaflow/learnings.py"
    - "schemas/lean-dispatch.yaml"
    - "tests/test_compressor.py"
    - "T07-summarise-predecessor"
    - "T08-extract-named-entities"
    - "S02-W03-T06-release"
    - "commit ef3a2d5b9c1d2e3"
    - "commit abc1234def5"
    - "version 7.0.2"
    - "coverage 93%"
    - "Error: artifact not found"
    - "MUST validate inputs before send"
    - "def summarise_predecessor(path: str) -> dict"
