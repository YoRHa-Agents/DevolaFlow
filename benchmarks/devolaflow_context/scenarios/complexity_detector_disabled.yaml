# EvoBench Scenario: Complexity Detector Disabled — R5 Strict Byte-Identical Baseline
# v9.0.0 PV-06 (v8.5.1 — closes Theme T5 #4 from `.local/research/v9.0.0_implementation_plan.md` §6.6).
#
# Codifies the R5 strict opt-out contract for the v8.0.0 P-09
# overcomplexity detector (`src/devolaflow/gate/complexity_detector.py::ComplexityDetector`).
# The PV-06 flip turns the detector ON by default for STRICT/AUDIT
# decomposition profiles via `complexity_weight=0.10`; this scenario
# validates the opt-out path:
#
#   * env-flag `DEVOLAFLOW_COMPLEXITY_DETECTOR` set EXACTLY to "0"
#     disables the detector even on a flipped profile (R5 strict — NOT
#     loose match).
#   * The optional `complexity_detector=None` kwarg on `evaluate_gate`
#     defaults to `None`, preserving v7.x byte-identical behaviour when
#     the detector is opted out.
#   * The L3 dispatch surface that follows MUST receive byte-identical
#     context to the pre-flip baseline.
#
# Composite floor 90 — confirms the opt-out path does not regress the
# simple_implementation feature-profile section coverage. The detector's
# nines-analyze subprocess + MOCK fallback semantics are validated
# separately by `tests/test_complexity_detector.py` at the unit-test layer.
#
# External canonical URL (per S-7): https://github.com/YoRHa-Agents/DevolaFlow

