# EvoBench Scenario: Code Review
# Tests that review profile loads quality scoring and gate evaluation sections.

name: "review_code_quality"
task_type: "review"
description: "Review authentication module for SOLID principles and security best practices"

expected_sections:
  - quick_action_decision
  - gate_mechanism
  - agent_teams
  - dispatch_report
  - hierarchy_table
  - context_isolation
  - task_quality_score

unwanted_sections:
  - frontmatter
  - version_update
  - purpose_scope
  - template_quick_ref

quality_thresholds:
  min_composite: 80.0
  max_noise_ratio: 0.1
  min_relevance: 0.8
