# EvoBench Scenario: Code Review
# Tests that review profile loads gate evaluation and review evidence sections.

name: "review_code_quality"
task_type: "review"
description: "Review authentication module for SOLID principles and security best practices"

# v16.0.0: task_quality_score is L0-only; review L2 context must not expect it.
expected_sections:
  - quick_action_decision
  - gate_mechanism
  - agent_teams
  - dispatch_report
  - hierarchy_table
  - context_isolation

unwanted_sections:
  - frontmatter
  - version_update
  - purpose_scope
  - template_quick_ref

quality_thresholds:
  min_composite: 80.0
  max_noise_ratio: 0.1
  min_relevance: 0.8
