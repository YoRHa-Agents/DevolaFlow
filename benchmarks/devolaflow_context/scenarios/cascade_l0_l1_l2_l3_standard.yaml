# EvoBench Scenario: Cascade — STANDARD-tier L0→L1→L2→L3 dispatch overhead
#
# v11.1.0 PV-05 (closes G-BENCH-1 in `.local/research/v11.1.0_gap_analysis.md`).
# Pairs with `cascade_l0_l1_l2_l3_complex.yaml` (COMPLEX-tier sibling) and the
# `collapse_l0_l3_simple.yaml` / `collapse_l0_l3_trivial.yaml` collapse-path
# contrasts. Together the 4 scenarios quantify the cascade-restoration cost
# the v11.1.0 cycle is built around (per `.local/research/v11.1.0_cycle_plan.md`
# §3 PV-05 row L2 W02 T01).
#
# Cascade-vs-collapse purpose: this scenario simulates a STANDARD-tier task
# (≈ 6 files, 200 LOC, the canonical "feature dispatched through full
# 4-layer chain" case) consuming the feature-profile context (5300-token
# budget). It is the cascade side of the cascade-vs-collapse pair —
# `collapse_l0_l3_simple.yaml` is the collapsed L0→L3 contrast for the
# same complexity tier. The two scenarios together let W-4 / SI-4
# regression guards detect when cascade ceremony cost exceeds the 5pp
# composite-drop budget vs the collapsed path.
#
# Reference data point: `workflow-system/agent/examples/multi-stage-trace.md`
# §"Counting the work" (lines 160-177) quotes verbatim:
#   > Total dispatch overhead: ~33K tokens across L0/L1/L2 layers.
#   > Versus a single-L3 collapse that would need to load the entire stack
#   > into one ~8K context — a 4x token-budget violation per layer.
# This scenario quantifies that argument at the section-selection level
# (per-layer feature-profile selection density), complementing the
# qualitative trace in the example doc.
#
# W-4 / SI-4 expected delta: cascade composite ≥ collapsed composite − 5%
# per `.local/research/v11.1.0_cycle_plan.md` §3 PV-05 W-4/SI-4 envelope —
# the cascade chain must NOT regress > 5pp below the collapsed L0→L3
# baseline (the regression-guard envelope locked in by W-4 SI-4 "composite
# score must not drop >5% below baseline per scenario"). Composite floor
# 80.0 is set as the cascade bound (relaxed from the standard 85 because
# the cascade simulation pays a modest ceremony cost — full 4-layer
# dispatch overhead — that the W-4 5pp band absorbs).
#
# Sources:
#   - `.local/research/v11.1.0_cycle_plan.md` §3 PV-05 row L2 W02 T01
#     (lines 331-343) — owned-files manifest + AC.
#   - `.local/research/v11.1.0_gap_analysis.md` §G-BENCH-1 (lines 363-422)
#     — design rationale + expected delta envelope.

name: "cascade_l0_l1_l2_l3_standard"
task_type: "feature"
description: >
  STANDARD-tier task (≈6 files, 200 LOC) dispatched via the full
  L0→L1→L2→L3 cascade. Feature profile (5300-token budget) loads the
  13 critical sections plus dispatch_report and supplementary repo /
  reference navigation. Pair-tested against `collapse_l0_l3_simple.yaml`
  to quantify cascade-vs-collapse delta per W-4 / SI-4 — composite floor
  80 (5pp below the 85 collapse floor) per `.local/research/v11.1.0_cycle_plan.md`
  §3 PV-05 W-4/SI-4 envelope.

expected_sections:
  - quick_action_decision
  - plan_mode_template
  - agent_mode_protocol
  - quick_start_workflows
  - hierarchy_table
  - wave_task_constraints
  - rationalization_prevention
  - stage_primitives
  - gate_mechanism
  - agent_teams
  - context_isolation
  - lifecycle_hooks
  - convergence_loop
  - dispatch_report

unwanted_sections:
  - frontmatter
  - version_update
  - hierarchy_diagram
  - template_quick_ref

quality_thresholds:
  # Cascade floor 80.0 per L1 PV-05 dispatch + cycle-plan §3 PV-05 envelope.
  # The cascade simulation pays a modest ceremony cost vs the collapsed
  # L0→L3 path; W-4 / SI-4 5pp band absorbs the delta. Empirically the
  # feature profile achieves composite ≈ 99-100 against the 14-section
  # expected list with relevance 1.0 (matched=14, expected=14) and
  # noise=0 via the unwanted_sections set, so 80.0 is a comfortable
  # regression floor.
  min_composite: 80.0
  # Relaxed by 5pp from the standard 0.85 to absorb cascade-restoration
  # ceremony cost (per compression_hotfix.yaml comment block — same
  # +109 chars of `quick_action_decision` from the v11.1.0 PV-02 SKILL.md
  # cascade Quick Action Decision sub-table edit).
  min_relevance: 0.80
  max_noise_ratio: 0.15
