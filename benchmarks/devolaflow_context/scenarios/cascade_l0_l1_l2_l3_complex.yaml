# EvoBench Scenario: Cascade — COMPLEX-tier L0→L1→L2→L3 dispatch overhead
#
# v11.1.0 PV-05 (closes G-BENCH-1 in `.local/research/v11.1.0_gap_analysis.md`).
# COMPLEX-tier sibling of `cascade_l0_l1_l2_l3_standard.yaml`.
#
# Cascade-vs-collapse purpose: this scenario simulates a COMPLEX-tier task
# (≈ 15 files, 600 LOC, multi-subsystem refactor or new-feature stack) that
# requires the FULL feature-profile section set including the supplementary
# `repo_mode` + `reference_navigation` rows for cross-repo / multi-team
# dispatch coordination. It is the cascade side of the COMPLEX-tier pair —
# the collapse contrast at COMPLEX tier is intentionally NOT modelled (a
# COMPLEX task at L0→L3 collapse would violate the 8K L3 budget per
# `examples/multi-stage-trace.md` §"Counting the work" lines 160-177:
# "a single-L3 collapse ... a 4x token-budget violation per layer"). This
# scenario therefore PAIR-tests against the collapse_l0_l3_simple +
# collapse_l0_l3_trivial scenarios at the cycle-plan level — the
# composite delta documents WHY collapse fails for COMPLEX work.
#
# COMPLEX vs STANDARD distinction: the expected_sections list expands
# from STANDARD's 14 to all 16 sections that the feature profile actually
# selects (adding `repo_mode` + `reference_navigation`). This pins the
# scoring expectation that COMPLEX-tier tasks SHOULD consume the full
# context surface — any drift where the feature profile drops repo_mode
# or reference_navigation under COMPLEX dispatch fails this scenario.
#
# W-4 / SI-4 expected delta: cascade composite ≥ collapsed composite − 5%
# per `.local/research/v11.1.0_cycle_plan.md` §3 PV-05 W-4/SI-4 envelope.
# Composite floor 78.0 is slightly relaxed below STANDARD's 80.0 floor to
# absorb the larger context surface's ceremony cost (per L1 PV-05 dispatch).
# Empirically the feature profile achieves composite ≈ 99-100 against the
# 16-section expected list with relevance 1.0 and noise = 0, so 78.0 is a
# comfortable regression floor.
#
# Sources:
#   - `.local/research/v11.1.0_cycle_plan.md` §3 PV-05 row L2 W02 T01
#     (lines 331-343).
#   - `.local/research/v11.1.0_gap_analysis.md` §G-BENCH-1 (lines 363-422).
#   - `workflow-system/agent/examples/multi-stage-trace.md` §"Counting the
#     work" (lines 160-177) — qualitative cascade-vs-collapse argument.

name: "cascade_l0_l1_l2_l3_complex"
task_type: "feature"
description: >
  COMPLEX-tier task (≈15 files, 600 LOC, multi-subsystem) dispatched via
  the full L0→L1→L2→L3 cascade. Feature profile loads all 16 sections of
  the feature dispatch surface — 13 critical + dispatch_report + repo_mode
  + reference_navigation. Pair-tested against `cascade_l0_l1_l2_l3_standard`
  (relevance scaling) and the collapse_l0_l3 scenarios (per W-4 / SI-4
  cascade-vs-collapse envelope per `.local/research/v11.1.0_cycle_plan.md`
  §3 PV-05).

expected_sections:
  - quick_action_decision
  - plan_mode_template
  - agent_mode_protocol
  - quick_start_workflows
  - hierarchy_table
  - wave_task_constraints
  - rationalization_prevention
  - stage_primitives
  - gate_mechanism
  - agent_teams
  - context_isolation
  - lifecycle_hooks
  - convergence_loop
  - dispatch_report
  - repo_mode
  - reference_navigation

unwanted_sections:
  - frontmatter
  - version_update
  - hierarchy_diagram
  - template_quick_ref

quality_thresholds:
  # COMPLEX cascade floor 78.0 — slightly relaxed below the STANDARD
  # cascade's 80.0 floor (per L1 PV-05 dispatch, "slightly relaxed for
  # complex tier"). Larger expected_sections surface (16 vs 14) absorbs
  # ceremony cost via W-4 / SI-4 5pp band.
  min_composite: 78.0
  # Relaxed 5pp from 0.85 standard for the same reason as
  # cascade_l0_l1_l2_l3_standard.yaml — cascade-restoration ceremony cost.
  min_relevance: 0.80
  max_noise_ratio: 0.15
