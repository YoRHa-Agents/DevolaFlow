name: "product_verification_pipeline"
task_type: "product_verification"
description: >
  Full product verification pipeline scenario. Tests context selection for
  orchestrating multi-level quality validation including developer-side tests,
  visual regression, acceptance verification, and accessibility compliance.

expected_sections:
  - stage_primitives
  - gate_mechanism
  - agent_teams
  - convergence_loop
  - dispatch_report

unwanted_sections:
  - mode_detection
  - repo_mode

quality_thresholds:
  # v16.0.0 docs-stabilization re-pin: canonical expected sections retain
  # relevance 1.0000 and noise 0.0000; compacted SKILL/reference text
  # lowered utilization to 0.3022, making 72.09 the deterministic equilibrium.
  # Floor 68.0 keeps the regression margin below 5pp without relaxing
  # the independent relevance or noise gates.
  min_composite: 68.0
  max_noise_ratio: 0.15
  min_relevance: 0.7
