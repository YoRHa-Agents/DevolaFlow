# EvoBench Scenario: Full Pipeline — Auth System
# Tests that a full-pipeline (build from scratch) task receives
# comprehensive context spanning all critical sections.

name: "full_pipeline_auth"
task_type: "build from scratch"
description: "Design and implement a complete JWT authentication system with refresh tokens"

expected_sections:
  - quick_action_decision
  - quick_start_workflows
  - hierarchy_table
  - wave_task_constraints
  - stage_primitives
  - gate_mechanism
  - agent_teams
  - context_isolation
  - dispatch_report
  - convergence_loop

unwanted_sections:
  - frontmatter
  - version_update
  - purpose_scope

quality_thresholds:
  min_composite: 80.0
  max_noise_ratio: 0.1
  min_relevance: 0.8
