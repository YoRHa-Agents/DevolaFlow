# EvoBench Scenario: Handoff Envelope — Cross-Agent Dispatch Context Density
# v8.3.0 PV-09 (closes H-008 in `.local/research/v8.3.0_gap_analysis.md`).
#
# Simulates a parent layer (L1 Stage or L2 Wave) authoring a TaskDispatch
# handoff envelope to a child layer (L2 Wave or L3 Task) under the
# change-driven workflow. The dispatching agent must receive the SKILL.md
# sections that cover (a) hierarchy_table — to address the right child layer,
# (b) wave_task_constraints — to respect <=5 tasks/wave + disjoint owned_files,
# (c) agent_teams — to assign the right team role to the dispatched task,
# (d) context_isolation — to construct the envelope's predecessor_artifact_refs
# with verbatim 3-5 sentence summaries (per CO-2), (e) gate_mechanism +
# convergence_loop — to know when an EscalationEvent envelope is required,
# and (f) lifecycle_hooks — for `check_envelope_append_only` (Rule S-9).
#
# Pairs with `references/agent-workspace.md` §6 (Handoff Protocol) which
# carries the full envelope schema, append-only seq semantics, and the
# inbox/outbox file naming convention `<from>__<to>__<change-id>__<seq>.yaml`.
#
# Composite floor 85 (gate `standard`); scenario validates that the feature
# profile's selection still produces a dispatch-grade context after the v8.2.9
# SKILL row additions (Workflow Selection / Reference Navigation / Quick-
# Reference each +1 row).

name: "handoff_envelope_density"
task_type: "feature"
description: >
  Parent dispatcher (L1/L2) authoring a TaskDispatch / StatusReport /
  EscalationEvent handoff envelope file at
  `.local/.agent/handoff/<from>__<to>__<change-id>__<seq>.yaml`. Must receive
  the SKILL.md sections that wire dispatch construction (hierarchy_table,
  wave_task_constraints, agent_teams, context_isolation), gate-driven
  escalation triggers (gate_mechanism, convergence_loop), and the append-only
  envelope hook (lifecycle_hooks for `check_envelope_append_only`, Rule S-9).
  Composite floor 85 — confirms density holds for envelope authoring under
  the new 14-file SKILL surface (10 references + 3 examples + SKILL.md).

expected_sections:
  - quick_action_decision
  - agent_mode_protocol
  - hierarchy_table
  - wave_task_constraints
  - rationalization_prevention
  - stage_primitives
  - gate_mechanism
  - agent_teams
  - context_isolation
  - lifecycle_hooks
  - convergence_loop

unwanted_sections:
  - frontmatter
  - version_update
  - purpose_scope

quality_thresholds:
  min_composite: 85.0
  min_relevance: 0.85
  max_noise_ratio: 0.10
