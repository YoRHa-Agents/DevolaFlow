version: "1.0"
source_dir: ".rules"
layers:
  - name: soul
    file: soul.mdc
    priority: 0
    always_include: true
  - name: architecture
    file: architecture.mdc
    priority: 1
    always_include: true
  - name: conventions
    file: conventions.mdc
    priority: 2
    always_include: false
  - name: workflow
    file: workflow.mdc
    priority: 3
    always_include: false
  - name: style
    file: style.mdc
    priority: 4
    always_include: false

targets:
  cursor:
    # v9.0.0 PV-07 (v9.0.0) — token_budget bumped 8000 → 12000 (parity with
    # agents_md target below) so the W-21 Soul-set freeze governance rule
    # (~+30 LOC source content) fits without truncating any existing layer.
    # Pre-PV-07 utilization on the cursor target was ~9210/8000 (over budget,
    # which silently dropped the workflow layer from the compiled output).
    # The 12000 bump gives ~30% headroom for v9.x sustaining additions while
    # preserving the canonical 5-layer corpus. Documented in
    # docs/cycle-archive/adr/v9-ADR-007-rule-rebalancing-and-rollup.md D5.
    #
    # v11.4.0 (this PV) — bumped 12000 → 14000 to absorb the W-24 Subagent
    # Pattern Selection rule (~+60 LOC source). Pre-bump utilization was
    # ~11979/12000 (saturated; 21-token headroom) BEFORE the W-24 stanza
    # was appended; adding W-24 pushed the rendered total to ~12750, which
    # silently dropped the Style Rules layer from the compiled cursor
    # output (per the W2.T3 stage report). The 14000 bump preserves the
    # canonical 5-layer corpus and gives ~9% headroom for v11.4.x +
    # v12.0.0 sustaining additions. Same pattern as PV-05 + PV-07. The
    # `compiler.py::CompileResult.layers_included` accounting bug noted by
    # the W2.T3 stage report (post-truncation list reported as
    # pre-truncation) is tracked separately as a v11.4.x cleanup candidate.
    #
    # v15.0.x rules-dedup — `alwaysApply` flipped true → false. Modern
    # Cursor auto-loads AGENTS.md as an always-applied workspace rule, so
    # `alwaysApply: true` here double-injected the S/A/C/W corpus verbatim
    # (~49 KB ≈ 12K tokens duplicated per agent context; measured
    # 2026-08-20, full-chain benefit analysis). This target stays the
    # full-corpus on-demand view — the only compiled surface carrying the
    # P4 Style layer inline — and the description below is the Cursor
    # agent-requested trigger. Corpus/budget/layers unchanged; drift-hash
    # coverage unchanged.
    output: ".cursor/rules/repo-governance.mdc"
    format: mdc
    token_budget: 14000
    include_layers: [soul, architecture, conventions, workflow, style]
    frontmatter:
      description: >-
        Full governance rule corpus incl. P4 Style layer (ST-1..ST-13);
        compiled from .rules/, do not hand-edit. Cursor sessions already
        auto-load the same S/A/C/W corpus via AGENTS.md — request this file
        only when editing human-facing docs, the web demo, or bilingual
        content (Style rules), or when AGENTS.md is unavailable.
      alwaysApply: false
  agents_md:
    # v9.0.0 PV-05 (v8.5.0) — token_budget bumped 6000 → 8000 (parity with
    # cursor target above) so W-16..W-20 rule additions fit without
    # truncating any existing layer. Pre-PV-05 utilization was 5857/6000
    # (97.6%); the bump leaves headroom for PV-06..PV-N additions and
    # mirrors the cursor-target ceiling so AGENTS.md-aware tools (Codex,
    # KimiCode, Cline, Roo) get the same rule corpus as Cursor users.
    # Historical ADR-005 D5 documents the ceiling bump.
    #
    # v9.0.0 PV-07 (v9.0.0) — bumped 8000 → 12000 to absorb the W-21 Soul-set
    # freeze governance rule (~+30 LOC source). Pre-PV-07 utilization was
    # ~8180/8000 (over budget, dropped workflow layer). Bump preserves the
    # full shared rule corpus and gives ~46% headroom for v9.x sustaining
    # additions per ADR-007 D5.
    #
    # v11.4.0 (this PV) — bumped 12000 → 14000 in lockstep with the cursor
    # target to absorb W-24. Pre-bump utilization was 11708/12000 (97.6%);
    # the bump leaves headroom for v11.4.x + v12.0.0 sustaining additions
    # while keeping AGENTS.md and cursor target byte-symmetric on the
    # 4 shared layers (soul, architecture, conventions, workflow).
    output: "AGENTS.md"
    format: markdown
    token_budget: 14000
    include_layers: [soul, architecture, conventions, workflow]
    # v15.0.x clean_repo C2-1 (decision D2) — one-line pointer emitted
    # verbatim after the compiled body so AGENTS.md-aware tools (Claude
    # Code, Codex, KimiCode, Cline, Roo) can discover the P4 Style corpus
    # (docs/STYLE-RULES.md) without loading its ~2K tokens into every
    # session (A-1 P2 / A-3 minimal context).
    postscript: "Style (P4) rules: see `docs/STYLE-RULES.md`"
  style_md:
    # v15.0.x clean_repo C2-1 (decision D2) — third compile target: the
    # P4 Style layer (ST-1..ST-13, absorbing DS-1..5 + WX-1..8) rendered
    # as a tool-agnostic on-demand view. Replaces the two hand-maintained
    # Cursor-only on-demand copies (.cursor/rules/documentation-sync-rules.mdc
    # + web-experience-rules.mdc, retired in the same PR — they carried
    # no hash/drift protection). token_budget 4000 leaves ~50% headroom
    # over the ~2K-token Style layer; drift-hash coverage is automatic
    # (check_rules_drift / save_hashes enumerate the targets map).
    output: "docs/STYLE-RULES.md"
    format: markdown
    token_budget: 4000
    include_layers: [style]

drift_detection:
  enabled: true
  hash_file: ".rules/.compile-hashes.json"
