[project]
name = "devolaflow"
description = "DevolaFlow — composable workflow meta-framework for multi-agent orchestration"

[eval]
default_scorer = "composite"
sandbox = true
# v8.5.0 PV-05 (T8 NineS Hygiene A1 closure) — bumped from 60s to 180s so
# the upstream `nines self-eval` cov collector has 3.3× the previous budget
# and stops timing out at the v8.4.x carry-forward `code_coverage: 0.0`
# artifact (see .local/research/v8.4.4_nines.md §"code_coverage: 0.0 —
# known infrastructure timeout"). If the upstream binary still ignores
# the bump (R-6 fallback per .local/research/v9.0.0_pv05_design.md §6),
# A1 stays open as an upstream NineS issue, NOT a DevolaFlow regression.
timeout = 180
seed = 42

[eval.scorers.composite]
weights = { exact = 0.4, fuzzy = 0.3, rubric = 0.3 }

[self_eval]
max_iterations = 10
convergence_threshold = 0.001

[self_eval.weights]
v1 = 0.30
v2 = 0.25
v3 = 0.25
system = 0.20

[self_eval.paths]
golden_dir = "data/golden_test_set"
samples_dir = "data/golden_test_set"
src_dir = "src/devolaflow"
test_dir = "tests"
project_root = "."

[collect]
store = "./data/collections"
incremental = true

[collect.github]
per_page = 30
rate_limit = 30

[hygiene]
# v8.5.0 PV-05 (T8 NineS Hygiene A1 closure) — explicit cov_timeout for
# the internal `pytest --cov` invocation. NineS v3.3.0 reads `[eval]
# timeout` for its global budget; this `[hygiene] cov_timeout` is a
# forward-declared key for the v3.4+ release that surfaces a dedicated
# cov-collection budget. Until upstream supports it the value is
# documentation-only and `[eval] timeout` (180s above) is the effective
# ceiling; the redundant declaration here ensures the bump propagates
# the moment NineS upstream wires the dedicated key.
cov_timeout = 180

# v8.5.0 PV-05 (T8 NineS Hygiene A3 closure) — index_recall budget bump.
# The NineS researcher index rebuild (`make nines-index-rebuild` per
# Makefile target) runs its own indexing pass; the v8.4.x baseline of
# `index_recall: 0.8` is a freshness artifact of running indexing
# under the 60s budget. With the 180s ceiling above, the indexer can
# now traverse the full reference set without skipping references/
# files; expected post-PV-05 `index_recall ≥ 0.85` once the upstream
# binary picks up the bumped budget.
index_recall_target = 0.85
